<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_pa91v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_pa91v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_pa91v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_pa91v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.25"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- ==================== PANEL 1 ==================== -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe surrounded by floating app icons -->
  <g filter="url(#shadow_pa91v)">
    <!-- Body -->
    <ellipse cx="200" cy="225" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="175" rx="20" ry="23" fill="url(#hum_skin_pa91v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 160 Q 200 152 220 160 Q 218 165 214 167 Q 200 163 186 167 Q 182 165 180 160" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Excited eyes -->
    <ellipse cx="192" cy="175" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="193" cy="175" r="2.5" fill="#1a1a1a"/>
    <circle cx="194" cy="174" r="0.8" fill="#fff"/>
    <ellipse cx="208" cy="175" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="209" cy="175" r="2.5" fill="#1a1a1a"/>
    <circle cx="210" cy="174" r="0.8" fill="#fff"/>
    <!-- Excited smile -->
    <path d="M 193 188 Q 200 194 207 188" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Arms up excited -->
    <ellipse cx="170" cy="208" rx="8" ry="18" fill="url(#hum_skin_pa91v)" stroke="#c8a882" stroke-width="1" transform="rotate(-30 170 208)"/>
    <ellipse cx="230" cy="208" rx="8" ry="18" fill="url(#hum_skin_pa91v)" stroke="#c8a882" stroke-width="1" transform="rotate(30 230 208)"/>
  </g>

  <!-- Floating app icons around Abe -->
  <rect x="135" y="230" width="18" height="18" rx="4" fill="#E63946" stroke="#b82d38" stroke-width="1"/>
  <text x="144" y="243" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">✓</text>
  <rect x="245" y="220" width="18" height="18" rx="4" fill="#6a4c93" stroke="#4a2c73" stroke-width="1"/>
  <text x="254" y="233" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">⏱</text>
  <rect x="158" y="260" width="18" height="18" rx="4" fill="#48bfe3" stroke="#28a0c3" stroke-width="1"/>
  <text x="167" y="273" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">📋</text>
  <rect x="222" y="255" width="18" height="18" rx="4" fill="#f77f00" stroke="#d76000" stroke-width="1"/>
  <text x="231" y="268" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">⚡</text>
  <rect x="190" y="280" width="18" height="18" rx="4" fill="#06d6a0" stroke="#04b680" stroke-width="1"/>
  <text x="199" y="293" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">∞</text>

  <!-- Speech bubble panel 1 -->
  <rect x="55" y="22" width="290" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,140 200,157 210,140" fill="#fff"/>
  <line x1="190" y1="142" x2="200" y2="159" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="159" x2="210" y2="142" stroke="#333" stroke-width="2"/>

  <text x="200" y="50" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I downloaded</text>
  <text x="200" y="78" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">seven apps to</text>
  <text x="200" y="106" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">organize my</text>
  <text x="200" y="134" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">other apps.</text>

  <!-- ==================== PANEL 2 ==================== -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a ledge, half-lidded -->
  <g filter="url(#shadow_pa91v)">
    <!-- Ledge -->
    <rect x="100" y="565" width="100" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
    <!-- Body -->
    <ellipse cx="160" cy="540" rx="18" ry="22" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="160" cy="515" rx="14" ry="13" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="148,505 152,480 156,505" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="150,503 152,485 154,503" fill="#cd853f"/>
    <polygon points="164,505 168,480 172,505" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="166,503 168,485 170,503" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="154" cy="516" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="154" cy="517" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="166" cy="516" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="166" cy="517" r="1.8" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="160" cy="521" rx="1.8" ry="1.3" fill="#1a1a1a"/>
    <!-- Simple flat mouth -->
    <path d="M 155 525 L 165 525" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 142 545 Q 125 535 118 520 Q 112 505 118 495 Q 125 488 132 495 Q 128 510 135 528 Q 138 538 142 545" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_pa91v)">
    <!-- Body -->
    <ellipse cx="230" cy="550" rx="18" ry="22" fill="url(#lem_fur_pa91v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="230" cy="525" rx="15" ry="14" fill="url(#lem_fur_pa91v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized round ears -->
    <ellipse cx="212" cy="520" rx="11" ry="13" fill="url(#lem_fur_pa91v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="248" cy="520" rx="11" ry="13" fill="url(#lem_fur_pa91v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="212" cy="520" rx="7" ry="8" fill="#f5b5c5"/>
    <ellipse cx="248" cy="520" rx="7" ry="8" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="222" cy="525" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="222" cy="526" r="7" fill="#1a1a1a"/>
    <circle cx="220" cy="524" r="2" fill="#fff"/>
    <ellipse cx="238" cy="525" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="238" cy="526" r="7" fill="#1a1a1a"/>
    <circle cx="236" cy="524" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="230" cy="533" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 225 537 Q 230 538 235 537" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 245 555 Q 255 570 260 585 Q 265 600 260 615 Q 255 625 248 620 Q 250 605 248 590 Q 246 575 243 560" fill="url(#lem_fur_pa91v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="253" y="582" width="12" height="6" fill="#1a1a1a"/>
    <rect x="253" y="594" width="12" height="6" fill="#1a1a1a"/>
    <rect x="251" y="606" width="12" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Sifaka speech bubble -->
  <rect x="55" y="335" width="290" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="220,473 230,493 240,473" fill="#fff"/>
  <line x1="220" y1="475" x2="230" y2="495" stroke="#333" stroke-width="2"/>
  <line x1="230" y1="495" x2="240" y2="475" stroke="#333" stroke-width="2"/>

  <text x="200" y="365" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Did the apps</text>
  <text x="200" y="393" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">help you do</text>
  <text x="200" y="421" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the thing you</text>
  <text x="200" y="449" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">were avoiding?</text>

  <!-- ==================== PANEL 3 ==================== -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe sitting in empty room, phone dead on floor, staring at wall -->
  <g filter="url(#shadow_pa91v)">
    <!-- Body sitting -->
    <ellipse cx="220" cy="870" rx="28" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="220" cy="820" rx="20" ry="23" fill="url(#hum_skin_pa91v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 200 805 Q 220 797 240 805 Q 238 810 234 812 Q 220 808 206 812 Q 202 810 200 805" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Thousand-yard stare eyes -->
    <ellipse cx="212" cy="820" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="212" cy="820" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="228" cy="820" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="228" cy="820" r="1.5" fill="#1a1a1a"/>
    <!-- Flat neutral mouth -->
    <path d="M 214 834 L 226 834" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Arms limp at sides -->
    <ellipse cx="192" cy="865" rx="8" ry="18" fill="url(#hum_skin_pa91v)" stroke="#c8a882" stroke-width="1"/>
    <ellipse cx="248" cy="865" rx="8" ry="18" fill="url(#hum_skin_pa91v)" stroke="#c8a882" stroke-width="1"/>
  </g>

  <!-- Dead phone on floor -->
  <rect x="265" y="910" width="22" height="14" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="267" y="912" width="18" height="10" fill="#2a2a2a"/>

  <!-- Small notification badges floating up like departing souls -->
  <circle cx="280" cy="895" r="4" fill="#E63946" opacity="0.7"/>
  <text x="280" y="898" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#fff">3</text>
  <circle cx="290" cy="878" r="3.5" fill="#E63946" opacity="0.5"/>
  <text x="290" y="881" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">7</text>
  <circle cx="282" cy="860" r="3" fill="#E63946" opacity="0.3"/>
  <text x="282" y="863" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">∞</text>

  <!-- Cache sitting on panel border, looking down -->
  <g filter="url(#shadow_pa91v)">
    <!-- Body perched -->
    <ellipse cx="100" cy="900" rx="14" ry="16" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <!-- Head -->
    <ellipse cx="100" cy="882" rx="11" ry="10" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <!-- Triangle ears -->
    <polygon points="91,875 94,858 97,875" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1"/>
    <polygon points="92,874 94,862 96,874" fill="#cd853f"/>
    <polygon points="103,875 106,858 109,875" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1"/>
    <polygon points="104,874 106,862 108,874" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="95" cy="883" rx="3" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.7"/>
    <circle cx="95" cy="884" r="1.4" fill="#1a1a1a"/>
    <ellipse cx="105" cy="883" rx="3" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.7"/>
    <circle cx="105" cy="884" r="1.4" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="100" cy="887" rx="1.3" ry="1" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 96 890 L 104 890" fill="none" stroke="#5d4a2f" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Tail curled -->
    <path d="M 88 900 Q 75 895 70 885 Q 68 878 72 875 Q 78 872 80 880 Q 82 888 86 895" fill="url(#sq_fur_pa91v)" stroke="#5d4a2f" stroke-width="1.2"/>
  </g>

  <!-- Cache speech bubble -->
  <rect x="45" y="645" width="310" height="170" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="95,813 102,833 110,813" fill="#fff"/>
  <line x1="95" y1="815" x2="102" y2="835" stroke="#333" stroke-width="2"/>
  <line x1="102" y1="835" x2="110" y2="815" stroke="#333" stroke-width="2"/>

  <text x="200" y="675" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">The task was</text>
  <text x="200" y="703" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">never the task.</text>
  <text x="200" y="739" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">The task was</text>
  <text x="200" y="767" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">avoiding the</text>
  <text x="200" y="795" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#E63946">silence.</text>

</svg>