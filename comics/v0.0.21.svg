<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_stoke19" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_stoke19" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_stoke19" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_stoke19">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka holding phone -->
  <g filter="url(#shadow_stoke19)">
    <!-- Body -->
    <ellipse cx="150" cy="245" rx="22" ry="28" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="215" rx="18" ry="16" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="125" cy="210" rx="14" ry="16" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="210" rx="14" ry="16" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="125" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="175" cy="210" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="138" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="138" cy="217" r="8" fill="#1a1a1a"/>
    <circle cx="136" cy="215" r="2" fill="#fff"/>

    <ellipse cx="162" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="162" cy="217" r="8" fill="#1a1a1a"/>
    <circle cx="160" cy="215" r="2" fill="#fff"/>

    <ellipse cx="150" cy="223" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 143 227 Q 150 228 157 227" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Arm holding phone -->
    <ellipse cx="170" cy="240" rx="8" ry="6" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1" transform="rotate(20 170 240)"/>

    <!-- Phone -->
    <rect x="175" y="230" width="18" height="28" rx="3" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="177" y="234" width="14" height="20" fill="#4a86c7"/>
    <!-- TikTok-ish icon -->
    <circle cx="184" cy="244" r="4" fill="none" stroke="#E63946" stroke-width="1.5"/>
    <path d="M 184 240 L 184 248" stroke="#fff" stroke-width="1"/>

    <!-- Ring tail with stripes -->
    <path d="M 130 250 Q 120 260 115 280 Q 110 300 115 315 Q 120 325 130 328 Q 140 330 148 322 Q 143 302 143 282 Q 143 262 138 250" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="115" y="280" width="28" height="7" fill="#1a1a1a"/>
    <rect x="115" y="294" width="28" height="7" fill="#1a1a1a"/>
    <rect x="115" y="308" width="28" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="30" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,148 150,168 160,148" fill="#fff"/>
  <line x1="140" y1="150" x2="150" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="170" x2="160" y2="150" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Police in</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Stoke-on-Trent</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">warned people</text>
  <text x="150" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">about a TikTok trend.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache, no cigarette, half-lidded -->
  <g filter="url(#shadow_stoke19)">
    <!-- Body -->
    <ellipse cx="450" cy="245" rx="18" ry="20" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="223" rx="14" ry="13" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="217" rx="6" ry="11" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 443 217)"/>
    <ellipse cx="457" cy="217" rx="6" ry="11" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 457 217)"/>
    <ellipse cx="443" cy="220" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 443 220)"/>
    <ellipse cx="457" cy="220" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 457 220)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="444" cy="225" rx="3.5" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="226" r="2" fill="#1a1a1a"/>
    <line x1="440" y1="223" x2="448" y2="224" stroke="#5d4a2f" stroke-width="1.5"/>

    <ellipse cx="456" cy="225" rx="3.5" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="226" r="2" fill="#1a1a1a"/>
    <line x1="452" y1="224" x2="460" y2="223" stroke="#5d4a2f" stroke-width="1.5"/>

    <ellipse cx="450" cy="230" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 446 234 L 454 234" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 465 240 Q 480 225 485 210 Q 490 195 483 185 Q 476 180 470 188 Q 468 200 470 215 Q 472 230 468 242" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="335" y="30" width="230" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,173 450,193 460,173" fill="#fff"/>
  <line x1="440" y1="175" x2="450" y2="195" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="195" x2="460" y2="175" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So the police</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">issued a warning</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">about people</text>
  <text x="450" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">copying behavior</text>
  <text x="450" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">they saw online.</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring, Cache deadpan -->
  <g filter="url(#shadow_stoke19)">
    <!-- Sifaka small in corner -->
    <ellipse cx="680" cy="275" rx="16" ry="20" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="680" cy="255" rx="13" ry="12" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1"/>
    <!-- Ears -->
    <ellipse cx="662" cy="251" rx="10" ry="12" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="698" cy="251" rx="10" ry="12" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="662" cy="251" rx="6" ry="7" fill="#f5b5c5"/>
    <ellipse cx="698" cy="251" rx="6" ry="7" fill="#f5b5c5"/>
    <!-- Big eyes -->
    <ellipse cx="672" cy="255" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="672" cy="256" r="6" fill="#1a1a1a"/>
    <circle cx="670" cy="254" r="1.5" fill="#fff"/>
    <ellipse cx="688" cy="255" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="688" cy="256" r="6" fill="#1a1a1a"/>
    <circle cx="686" cy="254" r="1.5" fill="#fff"/>
    <ellipse cx="680" cy="262" rx="1.5" ry="1" fill="#1a1a1a"/>
    <!-- Tail -->
    <path d="M 665 278 Q 655 290 652 305 Q 650 318 655 325 Q 660 330 668 325 Q 665 310 665 295 Q 665 285 664 278" fill="url(#lem_fur_stoke19)" stroke="#5a5a5a" stroke-width="1"/>
    <rect x="652" y="305" width="16" height="5" fill="#1a1a1a"/>
    <rect x="652" y="315" width="16" height="5" fill="#1a1a1a"/>
  </g>

  <!-- Cache in panel 3 -->
  <g filter="url(#shadow_stoke19)">
    <ellipse cx="770" cy="275" rx="16" ry="18" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1"/>
    <ellipse cx="770" cy="258" rx="12" ry="11" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1"/>
    <!-- Ears -->
    <ellipse cx="764" cy="253" rx="5" ry="9" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1" transform="rotate(-15 764 253)"/>
    <ellipse cx="776" cy="253" rx="5" ry="9" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1" transform="rotate(15 776 253)"/>
    <ellipse cx="764" cy="255" rx="2.5" ry="5.5" fill="#cd853f" transform="rotate(-15 764 255)"/>
    <ellipse cx="776" cy="255" rx="2.5" ry="5.5" fill="#cd853f" transform="rotate(15 776 255)"/>
    <!-- Half-lidded -->
    <ellipse cx="765" cy="260" rx="3" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="765" cy="261" r="1.5" fill="#1a1a1a"/>
    <line x1="762" y1="258" x2="768" y2="259" stroke="#5d4a2f" stroke-width="1.2"/>
    <ellipse cx="775" cy="260" rx="3" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="775" cy="261" r="1.5" fill="#1a1a1a"/>
    <line x1="772" y1="259" x2="778" y2="258" stroke="#5d4a2f" stroke-width="1.2"/>
    <ellipse cx="770" cy="264" rx="1.2" ry="1" fill="#1a1a1a"/>
    <path d="M 767 267 L 773 267" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M 783 270 Q 795 258 798 245 Q 800 235 795 230 Q 790 228 786 235 Q 785 248 787 260 Q 788 268 785 273" fill="url(#sq_fur_stoke19)" stroke="#5d4a2f" stroke-width="1"/>
  </g>

  <!-- Speech bubble panel 3 - Cache's punchline -->
  <rect x="635" y="30" width="230" height="170" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="760,198 770,218 780,198" fill="#fff"/>
  <line x1="760" y1="200" x2="770" y2="220" stroke="#333" stroke-width="2"/>
  <line x1="770" y1="220" x2="780" y2="200" stroke="#333" stroke-width="2"/>

  <text x="750" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">That's literally</text>
  <text x="750" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">all of</text>
  <text x="750" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">civilization.</text>
  <text x="750" y="138" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Someone does a</text>
  <text x="750" y="162" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">thing, others</text>
  <text x="750" y="186" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">copy it.</text>

</svg>