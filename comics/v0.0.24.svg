<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_scroll39" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_scroll39" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_scroll39">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache holding phone, scrolling -->
  <g filter="url(#shadow_scroll39)">
    <!-- Body -->
    <ellipse cx="150" cy="230" rx="18" ry="22" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="195" rx="14" ry="13" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="138,180 142,155 146,182" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="154,182 158,155 162,180" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="140,180 142,161 144,181" fill="#cd853f"/>
    <polygon points="156,181 158,161 160,180" fill="#cd853f"/>

    <!-- Eyes glazed, looking at phone -->
    <ellipse cx="144" cy="197" rx="4" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="144" cy="198" r="2" fill="#1a1a1a"/>
    <ellipse cx="156" cy="197" rx="4" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="156" cy="198" r="2" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <ellipse cx="150" cy="202" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 146 205 Q 150 206 154 205" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Phone in hands -->
    <rect x="140" cy="220" y="218" width="20" height="32" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="142" y="221" width="16" height="26" fill="#3a6a8a"/>
    <!-- Tiny scroll lines on phone -->
    <line x1="144" y1="225" x2="156" y2="225" stroke="#8ac" stroke-width="1"/>
    <line x1="144" y1="229" x2="156" y2="229" stroke="#8ac" stroke-width="1"/>
    <line x1="144" y1="233" x2="156" y2="233" stroke="#8ac" stroke-width="1"/>
    <line x1="144" y1="237" x2="156" y2="237" stroke="#8ac" stroke-width="1"/>
    <line x1="144" y1="241" x2="156" y2="241" stroke="#8ac" stroke-width="1"/>

    <!-- Fluffy tail -->
    <path d="M 132 230 Q 118 235 113 250 Q 108 265 118 275 Q 128 282 136 272 Q 130 258 130 244 Q 130 236 132 230" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="40" y="35" width="220" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,138 150,158 160,138" fill="#fff"/>
  <line x1="140" y1="140" x2="150" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="160" x2="160" y2="140" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I've been</text>
  <text x="150" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">scrolling for</text>
  <text x="150" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">three hours.</text>
  <text x="150" y="132" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I feel nothing.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting, staring with enormous eyes -->
  <g filter="url(#shadow_scroll39)">
    <!-- Body -->
    <ellipse cx="450" cy="240" rx="22" ry="28" fill="url(#lem_fur_scroll39)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="205" rx="18" ry="16" fill="url(#lem_fur_scroll39)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="427" cy="200" rx="13" ry="15" fill="url(#lem_fur_scroll39)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="473" cy="200" rx="13" ry="15" fill="url(#lem_fur_scroll39)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="427" cy="200" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="473" cy="200" rx="7" ry="9" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="439" cy="205" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="439" cy="206" r="8" fill="#1a1a1a"/>
    <circle cx="437" cy="204" r="2" fill="#fff"/>

    <ellipse cx="461" cy="205" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="461" cy="206" r="8" fill="#1a1a1a"/>
    <circle cx="459" cy="204" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="214" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 444 218 Q 450 219 456 218" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 430 245 Q 420 260 418 280 Q 416 300 425 315 Q 435 325 445 318 Q 440 298 438 278 Q 436 258 434 248" fill="url(#lem_fur_scroll39)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="418" y="278" width="22" height="7" fill="#1a1a1a"/>
    <rect x="418" y="293" width="22" height="7" fill="#1a1a1a"/>
    <rect x="418" y="308" width="22" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="345" y="35" width="210" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,143 450,163 460,143" fill="#fff"/>
  <line x1="440" y1="145" x2="450" y2="165" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="165" x2="460" y2="145" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">What were</text>
  <text x="450" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you looking</text>
  <text x="450" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">for when</text>
  <text x="450" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you started?</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache, phone down, staring into middle distance -->
  <g filter="url(#shadow_scroll39)">
    <!-- Body -->
    <ellipse cx="750" cy="235" rx="18" ry="22" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="200" rx="14" ry="13" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="738,185 742,160 746,187" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="754,187 758,160 762,185" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="740,185 742,166 744,186" fill="#cd853f"/>
    <polygon points="756,186 758,166 760,185" fill="#cd853f"/>

    <!-- Eyes wide, thousand-yard stare -->
    <ellipse cx="744" cy="202" rx="4" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="744" cy="202" r="2.5" fill="#1a1a1a"/>
    <circle cx="743" cy="201" r="0.8" fill="#fff"/>
    <ellipse cx="756" cy="202" rx="4" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="756" cy="202" r="2.5" fill="#1a1a1a"/>
    <circle cx="755" cy="201" r="0.8" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="207" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth — flat line -->
    <line x1="746" y1="210" x2="754" y2="210" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Phone face-down on ground -->
    <rect x="765" y="270" width="25" height="15" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>

    <!-- Fluffy tail -->
    <path d="M 732 235 Q 718 240 713 255 Q 708 270 718 278 Q 728 285 736 276 Q 730 262 730 248 Q 730 240 732 235" fill="url(#sq_fur_scroll39)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="645" y="35" width="210" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,143 750,163 760,143" fill="#fff"/>
  <line x1="740" y1="145" x2="750" y2="165" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="165" x2="760" y2="145" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I think the</text>
  <text x="750" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">scroll is what</text>
  <text x="750" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I was looking</text>
  <text x="750" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">for.</text>

  <!-- Signature -->
  <text x="880" y="345" font-family="DejaVu Sans" font-size="10" text-anchor="end" fill="#999">process.ink</text>
</svg>