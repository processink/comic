<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_pa91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_pa91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_pa91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_pa91">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.25"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- ==================== PANEL 1 ==================== -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe surrounded by floating app icons -->
  <g filter="url(#shadow_pa91)">
    <!-- Body -->
    <ellipse cx="150" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="185" rx="20" ry="23" fill="url(#hum_skin_pa91)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 170 Q 150 162 170 170 Q 168 175 164 177 Q 150 173 136 177 Q 132 175 130 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Excited eyes -->
    <ellipse cx="142" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="143" cy="185" r="2.5" fill="#1a1a1a"/>
    <circle cx="144" cy="184" r="0.8" fill="#fff"/>
    <ellipse cx="158" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="159" cy="185" r="2.5" fill="#1a1a1a"/>
    <circle cx="160" cy="184" r="0.8" fill="#fff"/>
    <!-- Excited smile -->
    <path d="M 143 198 Q 150 204 157 198" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Arms up excited -->
    <ellipse cx="120" cy="218" rx="8" ry="18" fill="url(#hum_skin_pa91)" stroke="#c8a882" stroke-width="1" transform="rotate(-30 120 218)"/>
    <ellipse cx="180" cy="218" rx="8" ry="18" fill="url(#hum_skin_pa91)" stroke="#c8a882" stroke-width="1" transform="rotate(30 180 218)"/>
  </g>

  <!-- Floating app icons around Abe -->
  <rect x="85" y="240" width="18" height="18" rx="4" fill="#E63946" stroke="#b82d38" stroke-width="1"/>
  <text x="94" y="253" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">✓</text>
  <rect x="195" y="230" width="18" height="18" rx="4" fill="#6a4c93" stroke="#4a2c73" stroke-width="1"/>
  <text x="204" y="243" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">⏱</text>
  <rect x="108" y="270" width="18" height="18" rx="4" fill="#48bfe3" stroke="#28a0c3" stroke-width="1"/>
  <text x="117" y="283" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">📋</text>
  <rect x="172" y="265" width="18" height="18" rx="4" fill="#f77f00" stroke="#d76000" stroke-width="1"/>
  <text x="181" y="278" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">⚡</text>
  <rect x="140" y="290" width="18" height="18" rx="4" fill="#06d6a0" stroke="#04b680" stroke-width="1"/>
  <text x="149" y="303" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#fff">∞</text>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="30" width="230" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,138 155,155 165,138" fill="#fff"/>
  <line x1="145" y1="140" x2="155" y2="157" stroke="#333" stroke-width="2"/>
  <line x1="155" y1="157" x2="165" y2="140" stroke="#333" stroke-width="2"/>

  <text x="150" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I downloaded</text>
  <text x="150" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">seven apps to</text>
  <text x="150" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">organize my</text>
  <text x="150" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">other apps.</text>

  <!-- ==================== PANEL 2 ==================== -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a ledge, half-lidded -->
  <g filter="url(#shadow_pa91)">
    <!-- Ledge -->
    <rect x="370" y="255" width="100" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
    <!-- Body -->
    <ellipse cx="430" cy="230" rx="18" ry="22" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="430" cy="205" rx="14" ry="13" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="418,195 422,170 426,195" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="420,193 422,175 424,193" fill="#cd853f"/>
    <polygon points="434,195 438,170 442,195" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="436,193 438,175 440,193" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="424" cy="206" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="424" cy="207" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="436" cy="206" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="436" cy="207" r="1.8" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="430" cy="211" rx="1.8" ry="1.3" fill="#1a1a1a"/>
    <!-- Simple flat mouth -->
    <path d="M 425 215 L 435 215" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 412 235 Q 395 225 388 210 Q 382 195 388 185 Q 395 178 402 185 Q 398 200 405 218 Q 408 228 412 235" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_pa91)">
    <!-- Body -->
    <ellipse cx="490" cy="240" rx="18" ry="22" fill="url(#lem_fur_pa91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="490" cy="215" rx="15" ry="14" fill="url(#lem_fur_pa91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized round ears -->
    <ellipse cx="472" cy="210" rx="11" ry="13" fill="url(#lem_fur_pa91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="508" cy="210" rx="11" ry="13" fill="url(#lem_fur_pa91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="472" cy="210" rx="7" ry="8" fill="#f5b5c5"/>
    <ellipse cx="508" cy="210" rx="7" ry="8" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="482" cy="215" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="482" cy="216" r="7" fill="#1a1a1a"/>
    <circle cx="480" cy="214" r="2" fill="#fff"/>
    <ellipse cx="498" cy="215" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="498" cy="216" r="7" fill="#1a1a1a"/>
    <circle cx="496" cy="214" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="490" cy="223" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 485 227 Q 490 228 495 227" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 505 245 Q 515 260 520 275 Q 525 290 520 305 Q 515 315 508 310 Q 510 295 508 280 Q 506 265 503 250" fill="url(#lem_fur_pa91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="513" y="272" width="12" height="6" fill="#1a1a1a"/>
    <rect x="513" y="284" width="12" height="6" fill="#1a1a1a"/>
    <rect x="511" y="296" width="12" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Sifaka speech bubble -->
  <rect x="340" y="30" width="220" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="475,158 485,178 495,158" fill="#fff"/>
  <line x1="475" y1="160" x2="485" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="485" y1="180" x2="495" y2="160" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Did the apps</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">help you do</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the thing you</text>
  <text x="450" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">were avoiding?</text>

  <!-- ==================== PANEL 3 ==================== -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe sitting in empty room, phone dead on floor, staring at wall -->
  <g filter="url(#shadow_pa91)">
    <!-- Body sitting -->
    <ellipse cx="710" cy="260" rx="28" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="710" cy="210" rx="20" ry="23" fill="url(#hum_skin_pa91)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 690 195 Q 710 187 730 195 Q 728 200 724 202 Q 710 198 696 202 Q 692 200 690 195" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Thousand-yard stare eyes -->
    <ellipse cx="702" cy="210" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="702" cy="210" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="718" cy="210" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="718" cy="210" r="1.5" fill="#1a1a1a"/>
    <!-- Flat neutral mouth -->
    <path d="M 704 224 L 716 224" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Arms limp at sides -->
    <ellipse cx="682" cy="255" rx="8" ry="18" fill="url(#hum_skin_pa91)" stroke="#c8a882" stroke-width="1"/>
    <ellipse cx="738" cy="255" rx="8" ry="18" fill="url(#hum_skin_pa91)" stroke="#c8a882" stroke-width="1"/>
  </g>

  <!-- Dead phone on floor -->
  <rect x="755" y="300" width="22" height="14" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
  <rect x="757" y="302" width="18" height="10" fill="#2a2a2a"/>

  <!-- Small notification badges floating up like departing souls -->
  <circle cx="770" cy="285" r="4" fill="#E63946" opacity="0.7"/>
  <text x="770" y="288" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#fff">3</text>
  <circle cx="780" cy="268" r="3.5" fill="#E63946" opacity="0.5"/>
  <text x="780" y="271" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">7</text>
  <circle cx="772" cy="250" r="3" fill="#E63946" opacity="0.3"/>
  <text x="772" y="253" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">∞</text>

  <!-- Cache sitting on panel border, looking down -->
  <g filter="url(#shadow_pa91)">
    <!-- Body perched on top right -->
    <ellipse cx="650" cy="290" rx="14" ry="16" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1.2"/>
    <!-- Head -->
    <ellipse cx="650" cy="272" rx="11" ry="10" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1.2"/>
    <!-- Triangle ears -->
    <polygon points="641,265 644,248 647,265" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1"/>
    <polygon points="642,264 644,252 646,264" fill="#cd853f"/>
    <polygon points="653,265 656,248 659,265" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1"/>
    <polygon points="654,264 656,252 658,264" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="645" cy="273" rx="3" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.7"/>
    <circle cx="645" cy="274" r="1.4" fill="#1a1a1a"/>
    <ellipse cx="655" cy="273" rx="3" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.7"/>
    <circle cx="655" cy="274" r="1.4" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="650" cy="277" rx="1.3" ry="1" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 646 280 L 654 280" fill="none" stroke="#5d4a2f" stroke-width="0.8" stroke-linecap="round"/>
    <!-- Tail curled -->
    <path d="M 638 290 Q 625 285 620 275 Q 618 268 622 265 Q 628 262 630 270 Q 632 278 636 285" fill="url(#sq_fur_pa91)" stroke="#5d4a2f" stroke-width="1.2"/>
  </g>

  <!-- Cache speech bubble -->
  <rect x="635" y="30" width="230" height="152" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="645,180 652,200 660,180" fill="#fff"/>
  <line x1="645" y1="182" x2="652" y2="202" stroke="#333" stroke-width="2"/>
  <line x1="652" y1="202" x2="660" y2="182" stroke="#333" stroke-width="2"/>

  <text x="750" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The task was</text>
  <text x="750" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">never the task.</text>
  <text x="750" y="114" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The task was</text>
  <text x="750" y="138" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">avoiding the</text>
  <text x="750" y="162" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">silence.</text>

</svg>