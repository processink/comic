<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_nc82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_nc82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_nc82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_nc82">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe sitting, holding phone, eyes wide -->
  <g filter="url(#shadow_nc82)">
    <!-- Body -->
    <ellipse cx="150" cy="245" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="195" rx="20" ry="23" fill="url(#hum_skin_nc82)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 180 Q 150 172 170 180 Q 168 185 164 187 Q 150 183 136 187 Q 132 185 130 180" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Wide panicked eyes -->
    <ellipse cx="142" cy="195" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="196" r="2.5" fill="#2a2a2a"/>
    <ellipse cx="158" cy="195" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="196" r="2.5" fill="#2a2a2a"/>
    <!-- Nose -->
    <path d="M 150 200 L 150 203" stroke="#a8896d" stroke-width="1"/>
    <!-- Mouth open -->
    <ellipse cx="150" cy="209" rx="5" ry="3" fill="#4a2a1a" stroke="#8a6d51" stroke-width="0.8"/>
    <!-- Neck -->
    <rect x="143" y="216" width="14" height="10" fill="url(#hum_skin_nc82)"/>
    <!-- Phone in hand -->
    <rect x="170" y="230" width="16" height="26" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="172" y="232" width="12" height="20" fill="#E63946"/>
    <text x="178" y="243" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">ALERT</text>
    <text x="178" y="249" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">ALERT</text>
    <!-- Arm -->
    <ellipse cx="170" cy="240" rx="10" ry="6" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1" transform="rotate(30 170 240)"/>
  </g>

  <!-- Ground -->
  <line x1="25" y1="295" x2="275" y2="295" stroke="#8b7355" stroke-width="1.5"/>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="30" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,148 150,168 160,148" fill="#fff"/>
  <path d="M 140 150 L 150 170 L 160 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I've read the</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">same headline</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">forty times</text>
  <text x="150" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">today.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a pile of newspapers, half-lidded -->
  <g filter="url(#shadow_nc82)">
    <!-- Newspaper pile -->
    <rect x="380" y="260" width="80" height="10" fill="#f0ead6" stroke="#8b7355" stroke-width="0.8" transform="rotate(-5 420 265)"/>
    <rect x="375" y="250" width="85" height="10" fill="#ede5d0" stroke="#8b7355" stroke-width="0.8" transform="rotate(3 417 255)"/>
    <rect x="382" y="240" width="78" height="10" fill="#f5f0e0" stroke="#8b7355" stroke-width="0.8" transform="rotate(-2 421 245)"/>
    <rect x="378" y="230" width="82" height="10" fill="#f0ead6" stroke="#8b7355" stroke-width="0.8" transform="rotate(4 419 235)"/>

    <!-- Cache body -->
    <ellipse cx="425" cy="220" rx="18" ry="20" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="425" cy="198" rx="14" ry="13" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="418" cy="192" rx="6" ry="11" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 418 192)"/>
    <ellipse cx="432" cy="192" rx="6" ry="11" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 432 192)"/>
    <ellipse cx="418" cy="195" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 418 195)"/>
    <ellipse cx="432" cy="195" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 432 195)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="419" cy="200" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="419" cy="200" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="431" cy="200" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="431" cy="200" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="425" cy="205" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth - simple unimpressed line -->
    <path d="M 421 209 L 429 209" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail curving up -->
    <path d="M 405 225 Q 390 230 385 245 Q 380 260 390 270 Q 400 280 410 270 Q 405 255 405 240 Q 405 232 405 225" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Ground -->
  <line x1="325" y1="295" x2="575" y2="295" stroke="#8b7355" stroke-width="1.5"/>

  <!-- Speech bubble panel 2 -->
  <rect x="340" y="30" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="415,148 425,168 435,148" fill="#fff"/>
  <path d="M 415 150 L 425 170 L 435 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="455" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Was it forty</text>
  <text x="455" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">headlines or</text>
  <text x="455" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">one headline</text>
  <text x="455" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">forty times?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring into middle distance, holding a newspaper that's blank -->
  <g filter="url(#shadow_nc82)">
    <!-- Body -->
    <ellipse cx="750" cy="235" rx="22" ry="28" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="205" rx="18" ry="16" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="200" rx="14" ry="16" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="200" rx="14" ry="16" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="200" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="200" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes - vacant stare -->
    <ellipse cx="738" cy="205" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="205" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="203" r="2" fill="#fff"/>

    <ellipse cx="762" cy="205" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="205" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="203" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="213" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny open mouth -->
    <ellipse cx="750" cy="218" rx="3" ry="2" fill="#5a3a2a" stroke="#8a8a8a" stroke-width="0.8"/>

    <!-- Arms holding blank newspaper -->
    <ellipse cx="730" cy="240" rx="8" ry="6" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1" transform="rotate(-20 730 240)"/>
    <ellipse cx="770" cy="240" rx="8" ry="6" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1" transform="rotate(20 770 240)"/>

    <!-- Blank newspaper -->
    <rect x="720" y="248" width="60" height="42" fill="#f5f0e0" stroke="#8b7355" stroke-width="0.8"/>
    <!-- No text on it - completely blank -->

    <!-- Ring tail with stripes -->
    <path d="M 730 240 Q 720 250 715 270 Q 710 290 715 305 Q 720 315 730 318 Q 740 320 748 312 Q 743 292 743 272 Q 743 252 738 242" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="715" y="270" width="28" height="7" fill="#1a1a1a"/>
    <rect x="715" y="284" width="28" height="7" fill="#1a1a1a"/>
    <rect x="715" y="298" width="28" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Ground -->
  <line x1="625" y1="295" x2="875" y2="295" stroke="#8b7355" stroke-width="1.5"/>

  <!-- Speech bubble panel 3 -->
  <rect x="630" y="30" width="245" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,148 750,168 760,148" fill="#fff"/>
  <path d="M 740 150 L 750 170 L 760 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="55" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Does it matter?</text>
  <text x="752" y="79" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Tomorrow's news</text>
  <text x="752" y="103" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">already happened.</text>
  <text x="752" y="127" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">We just wait.</text>

  <!-- Accent: small red notification badges floating around Abe's panel -->
  <circle cx="100" cy="270" r="5" fill="#E63946"/>
  <text x="100" y="273" font-family="DejaVu Sans" font-size="7" text-anchor="middle" fill="#fff">3</text>
  <circle cx="120" cy="285" r="4" fill="#E63946"/>
  <text x="120" y="288" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#fff">7</text>
  <circle cx="195" cy="275" r="4.5" fill="#E63946"/>
  <text x="195" y="278" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#fff">99</text>
</svg>