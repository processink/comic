<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_gm71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_gm71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_gm71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_gm71">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe standing, smiling, arms slightly out -->
  <g filter="url(#shadow_gm71)">
    <!-- Body -->
    <ellipse cx="150" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="180" rx="20" ry="23" fill="url(#hum_skin_gm71)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 165 Q 150 158 170 165 Q 168 170 164 172 Q 150 168 136 172 Q 132 170 130 165" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Happy eyes -->
    <path d="M 138 178 Q 142 174 146 178" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <path d="M 154 178 Q 158 174 162 178" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <!-- Big smile -->
    <path d="M 141 190 Q 150 197 159 190" fill="none" stroke="#8a6d51" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arms out happily -->
    <path d="M 122 230 Q 105 220 95 215" stroke="#4a6d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 178 230 Q 195 220 205 215" stroke="#4a6d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="93" cy="214" r="6" fill="url(#hum_skin_gm71)" stroke="#c8a882" stroke-width="1"/>
    <circle cx="207" cy="214" r="6" fill="url(#hum_skin_gm71)" stroke="#c8a882" stroke-width="1"/>
    <!-- Legs -->
    <rect x="137" y="265" width="12" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <rect x="153" y="265" width="12" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <!-- Shoes -->
    <ellipse cx="143" cy="298" rx="10" ry="5" fill="#3a2a1a"/>
    <ellipse cx="159" cy="298" rx="10" ry="5" fill="#3a2a1a"/>
  </g>

  <!-- Sun through window -->
  <rect x="30" y="30" width="50" height="50" fill="none" stroke="#b8a89a" stroke-width="2"/>
  <line x1="55" y1="30" x2="55" y2="80" stroke="#b8a89a" stroke-width="1.5"/>
  <line x1="30" y1="55" x2="80" y2="55" stroke="#b8a89a" stroke-width="1.5"/>
  <circle cx="55" cy="52" r="10" fill="#f0d060" opacity="0.7"/>

  <!-- Speech bubble -->
  <rect x="120" y="70" width="160" height="82" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="147,150 155,168 163,150" fill="#fff"/>
  <path d="M 147 152 L 155 170 L 163 152" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="95" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Having a</text>
  <text x="200" y="120" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">good Monday</text>
  <text x="200" y="145" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">today!</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking deeply suspicious -->
  <g filter="url(#shadow_gm71)">
    <!-- Body -->
    <ellipse cx="420" cy="230" rx="18" ry="22" fill="url(#sq_fur_gm71)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="420" cy="205" rx="15" ry="14" fill="url(#sq_fur_gm71)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="408,195 404,172 414,192" fill="url(#sq_fur_gm71)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="432,195 436,172 426,192" fill="url(#sq_fur_gm71)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="409,193 406,178 413,191" fill="#cd853f"/>
    <polygon points="431,193 434,178 427,191" fill="#cd853f"/>
    <!-- Half-lidded suspicious eyes -->
    <ellipse cx="414" cy="206" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="414" cy="207" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="426" cy="206" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="426" cy="207" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="420" cy="211" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 416 215 L 424 215" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 400 235 Q 385 225 380 210 Q 378 195 385 185 Q 390 195 392 210 Q 395 222 400 230" fill="url(#sq_fur_gm71)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Whiskers -->
    <line x1="408" y1="210" x2="395" y2="208" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="408" y1="213" x2="396" y2="215" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="432" y1="210" x2="445" y2="208" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="432" y1="213" x2="444" y2="215" stroke="#5d4a2f" stroke-width="0.8"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_gm71)">
    <!-- Body -->
    <ellipse cx="490" cy="235" rx="18" ry="24" fill="url(#lem_fur_gm71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="490" cy="208" rx="15" ry="14" fill="url(#lem_fur_gm71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Round ears -->
    <ellipse cx="473" cy="202" rx="10" ry="12" fill="url(#lem_fur_gm71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="507" cy="202" rx="10" ry="12" fill="url(#lem_fur_gm71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="473" cy="202" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="507" cy="202" rx="6" ry="8" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="482" cy="208" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="482" cy="209" r="7" fill="#1a1a1a"/>
    <circle cx="480" cy="207" r="2" fill="#fff"/>
    <ellipse cx="498" cy="208" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="498" cy="209" r="7" fill="#1a1a1a"/>
    <circle cx="496" cy="207" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="490" cy="217" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Little o mouth -->
    <ellipse cx="490" cy="222" rx="2.5" ry="2" fill="none" stroke="#8a8a8a" stroke-width="1"/>
    <!-- Ring tail with stripes -->
    <path d="M 508 240 Q 520 250 525 265 Q 528 280 522 295 Q 518 305 512 308" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
    <path d="M 508 240 Q 520 250 525 265 Q 528 280 522 295 Q 518 305 512 308" fill="none" stroke="#f5f5f5" stroke-width="7" stroke-linecap="round" stroke-dasharray="7,7"/>
  </g>

  <!-- Cache speech bubble -->
  <rect x="335" y="55" width="160" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="415,158 423,176 431,158" fill="#fff"/>
  <path d="M 415 160 L 423 178 L 431 160" fill="none" stroke="#333" stroke-width="2"/>

  <text x="415" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Which one</text>
  <text x="415" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">of his organs</text>
  <text x="415" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is failing?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka alone, center, staring at viewer -->
  <g filter="url(#shadow_gm71)">
    <!-- Body -->
    <ellipse cx="750" cy="225" rx="22" ry="28" fill="url(#lem_fur_gm71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="193" rx="18" ry="16" fill="url(#lem_fur_gm71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Round ears -->
    <ellipse cx="729" cy="186" rx="12" ry="14" fill="url(#lem_fur_gm71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="771" cy="186" rx="12" ry="14" fill="url(#lem_fur_gm71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="729" cy="186" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="771" cy="186" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes - even wider -->
    <ellipse cx="740" cy="193" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="740" cy="194" r="9" fill="#1a1a1a"/>
    <circle cx="738" cy="191" r="2.5" fill="#fff"/>
    <ellipse cx="760" cy="193" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="760" cy="194" r="9" fill="#1a1a1a"/>
    <circle cx="758" cy="191" r="2.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="750" cy="203" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny concerned mouth -->
    <path d="M 746 208 Q 750 206 754 208" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail - visible and striped -->
    <path d="M 730 230 Q 715 245 710 265 Q 708 285 715 300 Q 720 310 728 315" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 730 230 Q 715 245 710 265 Q 708 285 715 300 Q 720 310 728 315" fill="none" stroke="#f5f5f5" stroke-width="8" stroke-linecap="round" stroke-dasharray="8,8"/>
  </g>

  <!-- Sifaka speech bubble -->
  <rect x="640" y="40" width="225" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="745,153 753,172 761,153" fill="#fff"/>
  <path d="M 745 155 L 753 174 L 761 155" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="68" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Can a Monday</text>
  <text x="752" y="93" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">be good, or</text>
  <text x="752" y="118" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">did Abe just</text>
  <text x="752" y="143" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">stop wanting?</text>

  <!-- Accent color stripe at bottom -->
  <rect x="0" y="345" width="900" height="5" fill="#E63946"/>
</svg>