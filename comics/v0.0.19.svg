<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_turn41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_turn41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_turn41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e8e0"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Turnstile in panel 1 -->
  <rect x="145" y="200" width="8" height="100" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="149" y1="220" x2="120" y2="200" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <line x1="149" y1="220" x2="178" y2="200" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <line x1="149" y1="220" x2="149" y2="190" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>

  <!-- No fence — just open ground on both sides -->
  <line x1="15" y1="300" x2="280" y2="300" stroke="#8b7355" stroke-width="2"/>

  <!-- Cache standing next to turnstile, arms crossed -->
  <g filter="url(#shadow_turn41)">
    <!-- Body -->
    <ellipse cx="80" cy="260" rx="18" ry="20" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="80" cy="238" rx="14" ry="13" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="73" cy="232" rx="6" ry="11" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 73 232)"/>
    <ellipse cx="87" cy="232" rx="6" ry="11" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 87 232)"/>
    <ellipse cx="73" cy="235" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 73 235)"/>
    <ellipse cx="87" cy="235" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 87 235)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="74" cy="240" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="75" cy="241" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="86" cy="240" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="87" cy="241" r="1.8" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <ellipse cx="80" cy="245" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 76 248 Q 80 247 84 248" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 60 265 Q 45 270 40 285 Q 35 300 45 308 Q 55 316 65 308 Q 60 293 60 278 Q 60 272 60 265" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="30" width="230" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="80,138 90,158 100,138" fill="#fff"/>
  <line x1="80" y1="140" x2="90" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="90" y1="160" x2="100" y2="140" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">They installed</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">a turnstile at</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the entrance.</text>
  <text x="150" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">No fence.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka walking casually AROUND the turnstile -->
  <line x1="315" y1="300" x2="580" y2="300" stroke="#8b7355" stroke-width="2"/>

  <!-- Turnstile in panel 2 -->
  <rect x="445" y="200" width="8" height="100" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="449" y1="220" x2="420" y2="200" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <line x1="449" y1="220" x2="478" y2="200" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <line x1="449" y1="220" x2="449" y2="190" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>

  <!-- Sifaka walking around the turnstile -->
  <g filter="url(#shadow_turn41)">
    <!-- Body -->
    <ellipse cx="380" cy="255" rx="22" ry="28" fill="url(#lem_fur_turn41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="380" cy="225" rx="18" ry="16" fill="url(#lem_fur_turn41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="355" cy="220" rx="14" ry="16" fill="url(#lem_fur_turn41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="405" cy="220" rx="14" ry="16" fill="url(#lem_fur_turn41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="355" cy="220" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="405" cy="220" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="368" cy="225" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="368" cy="225" r="8" fill="#1a1a1a"/>
    <circle cx="366" cy="223" r="2" fill="#fff"/>

    <ellipse cx="392" cy="225" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="392" cy="225" r="8" fill="#1a1a1a"/>
    <circle cx="390" cy="223" r="2" fill="#fff"/>

    <ellipse cx="380" cy="233" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 373 237 Q 380 239 387 237" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 360 260 Q 350 270 345 290 Q 340 305 348 315 Q 356 322 365 315 Q 360 300 360 280 Q 360 270 360 260" fill="url(#lem_fur_turn41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="343" y="290" width="20" height="6" fill="#1a1a1a"/>
    <rect x="343" y="302" width="20" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Dotted path showing Sifaka walked around -->
  <path d="M 500 280 Q 505 260 500 240 Q 490 225 470 230 Q 460 245 460 260" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Speech bubble Panel 2 -->
  <rect x="335" y="30" width="230" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="380,138 390,158 400,138" fill="#fff"/>
  <line x1="380" y1="140" x2="390" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="390" y1="160" x2="400" y2="140" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Why did no</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">one just walk</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">around it?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Ground -->
  <line x1="615" y1="300" x2="880" y2="300" stroke="#8b7355" stroke-width="2"/>

  <!-- Cache in panel 3, looking straight at reader -->
  <g filter="url(#shadow_turn41)">
    <!-- Body -->
    <ellipse cx="750" cy="260" rx="18" ry="20" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="238" rx="14" ry="13" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="743" cy="232" rx="6" ry="11" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 743 232)"/>
    <ellipse cx="757" cy="232" rx="6" ry="11" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 757 232)"/>
    <ellipse cx="743" cy="235" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 743 235)"/>
    <ellipse cx="757" cy="235" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 757 235)"/>

    <!-- Half-lidded eyes, looking at reader -->
    <ellipse cx="744" cy="240" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="744" cy="240" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="756" cy="240" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="756" cy="240" r="1.5" fill="#1a1a1a"/>

    <!-- Nose and flat mouth -->
    <ellipse cx="750" cy="245" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <line x1="746" y1="249" x2="754" y2="249" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 730 265 Q 715 270 710 285 Q 705 300 715 308 Q 725 316 735 308 Q 730 293 730 278 Q 730 272 730 265" fill="url(#sq_fur_turn41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="635" y="30" width="240" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="745,163" fill="#fff"/>
  <polygon points="740,163 750,183 760,163" fill="#fff"/>
  <line x1="740" y1="165" x2="750" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="185" x2="760" y2="165" stroke="#333" stroke-width="2"/>

  <text x="755" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">They don't</text>
  <text x="755" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">need a fence.</text>
  <text x="755" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Most people</text>
  <text x="755" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">obey the idea</text>
  <text x="755" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">of a barrier.</text>

  <!-- Accent mark — small red E63946 detail on turnstile light -->
  <circle cx="449" cy="195" r="4" fill="#E63946"/>
  <circle cx="149" cy="195" r="4" fill="#E63946"/>
</svg>