<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_relic29" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_relic29" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_relic29" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_relic29">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka holding newspaper -->
  <g filter="url(#shadow_relic29)">
    <!-- Body -->
    <ellipse cx="150" cy="245" rx="22" ry="28" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="215" rx="18" ry="16" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="125" cy="210" rx="14" ry="16" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="210" rx="14" ry="16" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="125" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="175" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="140" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="140" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="138" cy="213" r="2" fill="#fff"/>
    <ellipse cx="162" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="162" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="160" cy="213" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="151" cy="224" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 145 228 Q 151 230 157 228" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Newspaper -->
    <rect x="115" y="250" width="70" height="50" fill="#f5f0e0" stroke="#8b7355" stroke-width="1"/>
    <text x="150" y="264" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#333">AUCTION NEWS</text>
    <line x1="120" y1="268" x2="180" y2="268" stroke="#aaa" stroke-width="0.5"/>
    <line x1="120" y1="273" x2="180" y2="273" stroke="#aaa" stroke-width="0.5"/>
    <line x1="120" y1="278" x2="180" y2="278" stroke="#aaa" stroke-width="0.5"/>
    <!-- Ring tail with stripes -->
    <path d="M 130 250 Q 115 260 108 280 Q 103 300 110 315 Q 118 325 130 320 Q 125 300 125 280 Q 125 265 128 255" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="103" y="280" width="25" height="7" fill="#1a1a1a"/>
    <rect x="103" y="294" width="25" height="7" fill="#1a1a1a"/>
    <rect x="105" y="308" width="22" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="30" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,158 155,175 165,158" fill="#fff"/>
  <path d="M 145 160 L 155 178 L 165 160" fill="none" stroke="#333" stroke-width="2"/>
  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">They're selling</text>
  <text x="150" y="83" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Washington's</text>
  <text x="150" y="108" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">mystery relic</text>
  <text x="150" y="133" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">and a diamond!</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache half-lidded on a branch -->
  <g filter="url(#shadow_relic29)">
    <!-- Branch -->
    <rect x="350" y="270" width="200" height="8" fill="#8b7355" stroke="#5d4a2f" stroke-width="1"/>
    <!-- Body -->
    <ellipse cx="450" cy="245" rx="20" ry="22" fill="url(#sq_fur_relic29)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="220" rx="16" ry="15" fill="url(#sq_fur_relic29)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="441" cy="211" rx="6" ry="12" fill="url(#sq_fur_relic29)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 441 211)"/>
    <ellipse cx="459" cy="211" rx="6" ry="12" fill="url(#sq_fur_relic29)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 459 211)"/>
    <ellipse cx="441" cy="214" rx="3" ry="7" fill="#cd853f" transform="rotate(-15 441 214)"/>
    <ellipse cx="459" cy="214" rx="3" ry="7" fill="#cd853f" transform="rotate(15 459 214)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="444" cy="222" rx="3.5" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="222" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="456" cy="222" rx="3.5" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="222" r="1.8" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="450" cy="227" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat unimpressed mouth -->
    <path d="M 445 231 L 455 231" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Fluffy tail curved upward -->
    <path d="M 465 240 Q 485 230 495 210 Q 500 195 495 185 Q 490 195 483 210 Q 475 228 465 237 Z" fill="url(#sq_fur_relic29)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="330" y="30" width="240" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,158 450,175 460,158" fill="#fff"/>
  <path d="M 440 160 L 450 178 L 460 160" fill="none" stroke="#333" stroke-width="2"/>
  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">A dead guy's</text>
  <text x="450" y="83" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">stuff is worth</text>
  <text x="450" y="108" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">millions and I</text>
  <text x="450" y="133" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">can't sell a nut.</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache still on branch, Sifaka next to him looking up -->
  <g filter="url(#shadow_relic29)">
    <!-- Sifaka smaller -->
    <ellipse cx="690" cy="255" rx="18" ry="22" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="690" cy="230" rx="15" ry="13" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="670" cy="226" rx="11" ry="13" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="710" cy="226" rx="11" ry="13" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="670" cy="226" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="710" cy="226" rx="6" ry="8" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes looking up -->
    <ellipse cx="681" cy="229" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="681" cy="228" r="6.5" fill="#1a1a1a"/>
    <circle cx="679" cy="226" r="1.8" fill="#fff"/>
    <ellipse cx="700" cy="229" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="700" cy="228" r="6.5" fill="#1a1a1a"/>
    <circle cx="698" cy="226" r="1.8" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="690" cy="237" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 685 240 Q 690 241 695 240" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail -->
    <path d="M 672 258 Q 660 268 656 285 Q 653 300 658 312 Q 663 320 672 316 Q 668 298 668 282 Q 668 268 670 260" fill="url(#lem_fur_relic29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="653" y="285" width="20" height="6" fill="#1a1a1a"/>
    <rect x="654" y="297" width="18" height="6" fill="#1a1a1a"/>
    <rect x="656" y="309" width="16" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Cache acorn on ground with tiny price tag -->
  <ellipse cx="780" cy="305" rx="8" ry="10" fill="#8b6842" stroke="#5d4a2f" stroke-width="1"/>
  <ellipse cx="780" cy="297" rx="9" ry="5" fill="#5d4a2f" stroke="#3a2a1a" stroke-width="1"/>
  <!-- Tiny price tag -->
  <rect x="790" y="295" width="30" height="15" fill="#f5f0e0" stroke="#8b7355" stroke-width="0.8"/>
  <text x="805" y="306" font-family="DejaVu Sans" font-size="7" text-anchor="middle" fill="#E63946">$0.00</text>

  <!-- Speech bubble Panel 3 — Sifaka -->
  <rect x="630" y="30" width="245" height="155" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="680,183 690,200 700,183" fill="#fff"/>
  <path d="M 680 185 L 690 203 L 700 185" fill="none" stroke="#333" stroke-width="2"/>
  <text x="752" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Maybe value</text>
  <text x="752" y="83" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">isn't in the</text>
  <text x="752" y="108" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">object. It's in</text>
  <text x="752" y="133" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">how long you've</text>
  <text x="752" y="158" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">been dead.</text>
</svg>