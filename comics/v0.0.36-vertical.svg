<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_vc42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_vc42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_vc42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_vc42">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe at desk, exhausted -->
  <g filter="url(#shadow_vc42)">
    <!-- Body -->
    <ellipse cx="200" cy="225" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="173" rx="20" ry="23" fill="url(#hum_skin_vc42)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 180 158 Q 200 151 220 158 Q 218 163 214 165 Q 200 161 186 165 Q 182 163 180 158" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Tired eyes -->
    <ellipse cx="192" cy="173" rx="3" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="192" cy="174" r="1.5" fill="#2a2a2a"/>
    <ellipse cx="208" cy="173" rx="3" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="208" cy="174" r="1.5" fill="#2a2a2a"/>

    <!-- Eye bags -->
    <path d="M 189 177 Q 192 179 195 177" fill="none" stroke="#c8a882" stroke-width="0.8"/>
    <path d="M 205 177 Q 208 179 211 177" fill="none" stroke="#c8a882" stroke-width="0.8"/>

    <!-- Nose and mouth -->
    <path d="M 200 178 L 200 181" stroke="#a8896d" stroke-width="1"/>
    <path d="M 195 186 L 205 186" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Coffee cup -->
    <rect x="220" y="245" width="16" height="18" rx="2" fill="#8b6842" stroke="#5d4a2f" stroke-width="1"/>
    <path d="M 236 250 Q 242 253 236 259" fill="none" stroke="#5d4a2f" stroke-width="1"/>
    <path d="M 224 243 Q 226 238 228 243" fill="none" stroke="#aaa" stroke-width="1" opacity="0.6"/>
    <path d="M 229 241 Q 231 235 233 241" fill="none" stroke="#aaa" stroke-width="1" opacity="0.6"/>

    <!-- Laptop -->
    <rect x="155" y="250" width="60" height="38" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="158" y="253" width="54" height="28" fill="#1a3a5a"/>
    <rect x="150" y="288" width="70" height="4" fill="#5a5a5a" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Screen text -->
    <text x="185" y="265" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#4a90c2">4:47 AM</text>
    <text x="185" y="275" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#aaa">SIDE HUSTLE #3</text>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="45" y="25" width="310" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="185,133 200,150 215,133" fill="#fff"/>
  <path d="M 185,135 L 200,152 L 215,135" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="55" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I wake up at</text>
  <text x="200" y="83" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">4 AM every day.</text>
  <text x="200" y="111" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I'm optimized.</text>

  <!-- Ground line Panel 1 -->
  <line x1="20" y1="298" x2="380" y2="298" stroke="#ccc" stroke-width="1"/>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring -->
  <g filter="url(#shadow_vc42)">
    <!-- Body -->
    <ellipse cx="200" cy="540" rx="22" ry="28" fill="url(#lem_fur_vc42)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="508" rx="18" ry="16" fill="url(#lem_fur_vc42)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="175" cy="503" rx="14" ry="16" fill="url(#lem_fur_vc42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="503" rx="14" ry="16" fill="url(#lem_fur_vc42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="503" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="503" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="188" cy="508" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="509" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="507" r="2" fill="#fff"/>

    <ellipse cx="212" cy="508" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="509" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="507" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="200" cy="517" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 193 521 Q 200 522 207 521" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 180 545 Q 170 555 165 575 Q 160 595 165 610 Q 170 622 180 620 Q 185 605 183 585 Q 182 565 180 550" fill="url(#lem_fur_vc42)" stroke="#5a5a5a" stroke-width="1.3"/>
    <path d="M 167 580 Q 175 578 182 582" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 166 590 Q 174 588 181 592" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 166 600 Q 173 598 179 602" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 168 610 Q 174 608 178 612" fill="none" stroke="#1a1a1a" stroke-width="3"/>

    <!-- Arms -->
    <ellipse cx="182" cy="545" rx="7" ry="5" fill="url(#lem_fur_vc42)" stroke="#5a5a5a" stroke-width="1" transform="rotate(-15 182 545)"/>
    <ellipse cx="218" cy="545" rx="7" ry="5" fill="url(#lem_fur_vc42)" stroke="#5a5a5a" stroke-width="1" transform="rotate(15 218 545)"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="45" y="335" width="310" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,463 200,480 210,463" fill="#fff"/>
  <path d="M 190,465 L 200,482 L 210,465" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="365" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Optimized</text>
  <text x="200" y="393" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">for what?</text>
  <text x="200" y="425" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Who told you</text>
  <text x="200" y="453" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">you were slow?</text>

  <!-- Ground line Panel 2 -->
  <line x1="20" y1="608" x2="380" y2="608" stroke="#ccc" stroke-width="1"/>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting, smoking with sunglasses -->
  <g filter="url(#shadow_vc42)">
    <!-- Body -->
    <ellipse cx="200" cy="855" rx="18" ry="22" fill="url(#sq_fur_vc42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="828" rx="14" ry="13" fill="url(#sq_fur_vc42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="189,820 185,798 195,815" fill="url(#sq_fur_vc42)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="211,820 215,798 205,815" fill="url(#sq_fur_vc42)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="190,819 187,803 194,816" fill="#cd853f"/>
    <polygon points="210,819 213,803 206,816" fill="#cd853f"/>

    <!-- Sunglasses -->
    <rect x="188" y="824" width="10" height="7" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <rect x="202" y="824" width="10" height="7" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <line x1="198" y1="827" x2="202" y2="827" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="188" y1="827" x2="183" y2="825" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="212" y1="827" x2="217" y2="825" stroke="#0a0a0a" stroke-width="1"/>

    <!-- Nose and mouth -->
    <ellipse cx="200" cy="834" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 196 837 L 204 837" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Cigarette -->
    <rect x="204" y="835" width="18" height="3" fill="#f5f0e0" stroke="#ccc" stroke-width="0.5"/>
    <rect x="220" y="835" width="4" height="3" fill="#E63946"/>
    <!-- Smoke wisps -->
    <path d="M 224 835 Q 228 828 225 822" fill="none" stroke="#bbb" stroke-width="0.8" opacity="0.5"/>
    <path d="M 226 833 Q 231 825 228 818" fill="none" stroke="#bbb" stroke-width="0.8" opacity="0.4"/>

    <!-- Fluffy tail -->
    <path d="M 180 860 Q 168 868 164 885 Q 160 902 168 912 Q 176 920 185 910 Q 180 895 180 880 Q 180 868 180 860" fill="url(#sq_fur_vc42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Arms crossed -->
    <path d="M 185 850 Q 190 858 205 855 Q 210 852 215 850" fill="none" stroke="#5d4a2f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="35" y="645" width="330" height="150" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,793 200,810 210,793" fill="#fff"/>
  <path d="M 190,795 L 200,812 L 210,795" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="675" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">A hamster wheel</text>
  <text x="200" y="703" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">doesn't become</text>
  <text x="200" y="731" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">a career path</text>
  <text x="200" y="759" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">just because</text>
  <text x="200" y="787" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#333">you run it faster.</text>

  <!-- Ground line Panel 3 -->
  <line x1="20" y1="930" x2="380" y2="930" stroke="#ccc" stroke-width="1"/>
</svg>