<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_stm71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_stm71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_stm71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_stm71">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e4dc"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe on couch with remote, looking exhausted -->
  <g filter="url(#shadow_stm71)">
    <!-- Couch -->
    <rect x="60" y="250" width="180" height="50" rx="8" fill="#8b7355" stroke="#6b5335" stroke-width="1.5"/>
    <rect x="55" y="240" width="190" height="15" rx="4" fill="#9d8060" stroke="#6b5335" stroke-width="1"/>

    <!-- Abe body -->
    <rect x="120" y="190" width="50" height="55" rx="4" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.2"/>

    <!-- Head -->
    <circle cx="145" cy="165" r="22" fill="url(#hum_skin_stm71)" stroke="#2a2a2a" stroke-width="1.2"/>

    <!-- Hair -->
    <path d="M 123 152 Q 135 140 145 138 Q 155 140 167 152" fill="#4a3728" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Tired eyes - half lidded -->
    <ellipse cx="136" cy="164" rx="4.5" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="136" cy="165" r="2" fill="#1a1a1a"/>
    <ellipse cx="154" cy="164" rx="4.5" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="154" cy="165" r="2" fill="#1a1a1a"/>

    <!-- Bags under eyes -->
    <path d="M 132 168 Q 136 170 140 168" fill="none" stroke="#c4a882" stroke-width="0.8"/>
    <path d="M 150 168 Q 154 170 158 168" fill="none" stroke="#c4a882" stroke-width="0.8"/>

    <!-- Flat mouth -->
    <line x1="139" y1="177" x2="151" y2="177" stroke="#a67c52" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Arm with remote -->
    <rect x="160" y="210" width="30" height="10" rx="5" fill="url(#hum_skin_stm71)" stroke="#c4a882" stroke-width="1"/>
    <rect x="183" y="205" width="12" height="25" rx="2" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="189" cy="212" r="1.5" fill="#E63946"/>
    <circle cx="189" cy="218" r="1.5" fill="#4a8a4a"/>
    <circle cx="189" cy="224" r="1.5" fill="#4a6aa8"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="25" width="230" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="135,128 145,143 155,128" fill="#fff"/>
  <polygon points="137,130 145,143 153,130" fill="#fff" stroke="#fff" stroke-width="1"/>
  <path d="M 135,130 L 145,145 L 155,130" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="50" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I have eight</text>
  <text x="150" y="75" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">streaming apps.</text>
  <text x="150" y="100" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Nothing's on.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting next to Abe, enormous eyes on the TV -->
  <g filter="url(#shadow_stm71)">
    <!-- Sifaka body -->
    <ellipse cx="420" cy="230" rx="22" ry="28" fill="url(#lem_fur_stm71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="420" cy="198" rx="18" ry="16" fill="url(#lem_fur_stm71)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized round ears -->
    <ellipse cx="396" cy="192" rx="14" ry="16" fill="url(#lem_fur_stm71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="444" cy="192" rx="14" ry="16" fill="url(#lem_fur_stm71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="396" cy="192" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="444" cy="192" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="408" cy="198" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="408" cy="199" r="8" fill="#1a1a1a"/>
    <circle cx="406" cy="197" r="2" fill="#fff"/>

    <ellipse cx="432" cy="198" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="432" cy="199" r="8" fill="#1a1a1a"/>
    <circle cx="430" cy="197" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="420" cy="210" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 414 214 Q 420 216 426 214" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes - curving up behind -->
    <path d="M 400 235 Q 385 250 380 270 Q 377 285 385 295 Q 393 305 405 298 Q 398 278 398 260 Q 398 245 400 235" fill="url(#lem_fur_stm71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Black stripes -->
    <path d="M 383 265 Q 390 262 398 264" fill="none" stroke="#1a1a1a" stroke-width="6"/>
    <path d="M 384 280 Q 392 277 400 280" fill="none" stroke="#1a1a1a" stroke-width="6"/>
    <path d="M 388 295 Q 396 292 404 295" fill="none" stroke="#1a1a1a" stroke-width="6"/>
  </g>

  <!-- TV showing "Browse" screen -->
  <g filter="url(#shadow_stm71)">
    <rect x="480" y="175" width="70" height="50" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="483" y="178" width="64" height="40" fill="#1a1a1a"/>
    <!-- Grid of tiny thumbnails -->
    <rect x="485" y="180" width="12" height="8" fill="#E63946" opacity="0.7"/>
    <rect x="499" y="180" width="12" height="8" fill="#4a6aa8" opacity="0.7"/>
    <rect x="513" y="180" width="12" height="8" fill="#6b8a4a" opacity="0.7"/>
    <rect x="529" y="180" width="12" height="8" fill="#8a6b4a" opacity="0.7"/>
    <rect x="485" y="190" width="12" height="8" fill="#7a5aa8" opacity="0.7"/>
    <rect x="499" y="190" width="12" height="8" fill="#a85a6a" opacity="0.7"/>
    <rect x="513" y="190" width="12" height="8" fill="#4a8a8a" opacity="0.7"/>
    <rect x="529" y="190" width="12" height="8" fill="#8a8a4a" opacity="0.7"/>
    <rect x="485" y="200" width="12" height="8" fill="#5a7a4a" opacity="0.7"/>
    <rect x="499" y="200" width="12" height="8" fill="#a8784a" opacity="0.7"/>
    <rect x="513" y="200" width="12" height="8" fill="#4a5a8a" opacity="0.7"/>
    <rect x="529" y="200" width="12" height="8" fill="#8a4a5a" opacity="0.7"/>
    <!-- TV stand -->
    <rect x="510" y="225" width="10" height="15" fill="#3a3a3a"/>
    <rect x="500" y="240" width="30" height="4" fill="#4a4a4a"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="330" y="30" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="410,148 420,163 430,148" fill="#fff"/>
  <polygon points="412,150 420,163 428,150" fill="#fff" stroke="#fff" stroke-width="1"/>
  <path d="M 410,150 L 420,165 L 430,150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="445" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Didn't people</text>
  <text x="445" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">invent these to</text>
  <text x="445" y="107" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">replace the one</text>
  <text x="445" y="132" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">that had everything?</text>

  <!-- Panel 3 -->
  <rect x="600" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on couch arm, half-lidded, no cigarette -->
  <g filter="url(#shadow_stm71)">
    <!-- Couch arm -->
    <rect x="690" y="240" width="80" height="50" rx="6" fill="#8b7355" stroke="#6b5335" stroke-width="1.5"/>
    <rect x="685" y="232" width="90" height="12" rx="4" fill="#9d8060" stroke="#6b5335" stroke-width="1"/>

    <!-- Cache body -->
    <ellipse cx="735" cy="215" rx="18" ry="20" fill="url(#sq_fur_stm71)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="735" cy="193" rx="14" ry="13" fill="url(#sq_fur_stm71)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="728" cy="187" rx="6" ry="11" fill="url(#sq_fur_stm71)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 728 187)"/>
    <ellipse cx="742" cy="187" rx="6" ry="11" fill="url(#sq_fur_stm71)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 742 187)"/>
    <ellipse cx="728" cy="190" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 728 190)"/>
    <ellipse cx="742" cy="190" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 742 190)"/>

    <!-- Ear tufts -->
    <path d="M 726 182 Q 723 176 725 174" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 744 182 Q 747 176 745 174" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="729" cy="195" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="729" cy="196" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="741" cy="195" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="741" cy="196" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="735" cy="200" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Flat unimpressed mouth -->
    <line x1="731" y1="204" x2="739" y2="204" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="723" y1="198" x2="712" y2="197" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="723" y1="201" x2="714" y2="202" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="747" y1="198" x2="758" y2="197" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="747" y1="201" x2="756" y2="202" stroke="#1a1a1a" stroke-width="0.7"/>

    <!-- Fluffy tail curving up -->
    <path d="M 753 218 Q 770 215 778 200 Q 784 185 778 175 Q 772 168 765 175 Q 772 185 770 200 Q 768 212 755 216" fill="url(#sq_fur_stm71)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="625" y="25" width="250" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="725,153 735,168 745,153" fill="#fff"/>
  <polygon points="727,155 735,168 743,155" fill="#fff" stroke="#fff" stroke-width="1"/>
  <path d="M 725,155 L 735,170 L 745,155" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="52" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Infinite choice</text>
  <text x="750" y="77" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is just scarcity</text>
  <text x="750" y="102" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">wearing a</text>
  <text x="750" y="127" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">different hat.</text>

  <!-- Signature -->
  <text x="860" y="340" font-family="DejaVu Sans" font-size="10" text-anchor="end" fill="#999">process.ink</text>
</svg>