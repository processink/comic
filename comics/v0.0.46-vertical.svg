  <g filter="url(#shadow_kn42v)">
    <ellipse cx="200" cy="225" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <ellipse cx="200" cy="170" rx="20" ry="23" fill="url(#hum_skin_kn42v)" stroke="#c8a882" stroke-width="1.3"/>
    <path d="M 180 155 Q 200 148 220 155 Q 218 160 214 162 Q 200 158 186 162 Q 182 160 180 155" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <ellipse cx="192" cy="170" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="192" cy="172" r="2" fill="#2a2a2a"/>
    <ellipse cx="208" cy="170" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="208" cy="172" r="2" fill="#2a2a2a"/>
    <path d="M 200 176 L 200 179" stroke="#a8896d" stroke-width="1"/>
    <path d="M 195 184 Q 200 186 205 184" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>
    <ellipse cx="182" cy="218" rx="8" ry="6" fill="url(#hum_skin_kn42v)" stroke="#c8a882" stroke-width="1" transform="rotate(-30 182 218)"/>
    <ellipse cx="218" cy="218" rx="8" ry="6" fill="url(#hum_skin_kn42v)" stroke="#c8a882" stroke-width="1" transform="rotate(30 218 218)"/>
    <rect x="190" y="215" width="20" height="32" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="192" y="217" width="16" height="26" fill="#4a86c7"/>
    <circle cx="200" cy="226" r="5" fill="#f0c040"/>
    <circle cx="198" cy="224" r="1" fill="#1a1a1a"/>
    <circle cx="202" cy="224" r="1" fill="#1a1a1a"/>
    <path d="M 197 229 Q 200 227 203 229" fill="none" stroke="#1a1a1a" stroke-width="0.8"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="40" y="25" width="320" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,133 200,153 210,133" fill="#fff"/>
  <path d="M 190,135 L 200,155 L 210,135" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="52" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">My phone just</text>
  <text x="200" y="80" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">suggested a</text>
  <text x="200" y="108" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">therapist before</text>
  <text x="200" y="130" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I told anyone.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes -->
  <g filter="url(#shadow_kn42v)">
    <ellipse cx="200" cy="560" rx="22" ry="28" fill="url(#lem_fur_kn42v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="200" cy="525" rx="18" ry="16" fill="url(#lem_fur_kn42v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="175" cy="520" rx="14" ry="16" fill="url(#lem_fur_kn42v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="520" rx="14" ry="16" fill="url(#lem_fur_kn42v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="520" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="520" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="188" cy="525" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="525" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="523" r="2" fill="#fff"/>
    <ellipse cx="212" cy="525" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="525" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="523" r="2" fill="#fff"/>
    <ellipse cx="200" cy="533" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 193 537 Q 200 538 207 537" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <path d="M 180 565 Q 168 580 165 600 Q 163 615 170 625 Q 178 630 185 620 Q 180 605 180 585 Q 180 572 180 565" fill="url(#lem_fur_kn42v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <path d="M 169 588 Q 175 586 181 588" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 167 598 Q 174 596 180 598" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 167 608 Q 174 606 180 608" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 169 618 Q 176 616 182 618" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="40" y="340" width="320" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,468 200,488 210,468" fill="#fff"/>
  <path d="M 190,470 L 200,490 L 210,470" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="370" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Did the phone</text>
  <text x="200" y="398" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">know you were</text>
  <text x="200" y="426" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">sad, or did</text>
  <text x="200" y="454" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">you know?</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe staring at phone, frozen -->
  <g filter="url(#shadow_kn42v)">
    <ellipse cx="200" cy="865" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <ellipse cx="200" cy="810" rx="20" ry="23" fill="url(#hum_skin_kn42v)" stroke="#c8a882" stroke-width="1.3"/>
    <path d="M 180 795 Q 200 788 220 795 Q 218 800 214 802 Q 200 798 186 802 Q 182 800 180 795" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <ellipse cx="192" cy="810" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="192" cy="811" r="2.5" fill="#2a2a2a"/>
    <ellipse cx="208" cy="810" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="208" cy="811" r="2.5" fill="#2a2a2a"/>
    <path d="M 200 816 L 200 819" stroke="#a8896d" stroke-width="1"/>
    <path d="M 194 825 L 206 825" fill="none" stroke="#8a6d51" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="182" cy="858" rx="8" ry="6" fill="url(#hum_skin_kn42v)" stroke="#c8a882" stroke-width="1" transform="rotate(-30 182 858)"/>
    <ellipse cx="218" cy="858" rx="8" ry="6" fill="url(#hum_skin_kn42v)" stroke="#c8a882" stroke-width="1" transform="rotate(30 218 858)"/>
    <rect x="190" y="860" width="20" height="32" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="192" y="862" width="16" height="26" fill="#4a86c7"/>
    <text x="200" y="875" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#fff">You okay?</text>
  </g>

  <!-- Accent color subtle detail - red notification dot -->
  <circle cx="207" cy="862" r="3" fill="#E63946"/>

  <!-- Speech bubble panel 3 -->
  <rect x="40" y="650" width="320" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,763 200,783 210,763" fill="#fff"/>
  <path d="M 190,765 L 200,785 L 210,765" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="682" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">It knew before</text>
  <text x="200" y="712" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I did. That's</text>
  <text x="200" y="742" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the worst part.</text>
</svg>