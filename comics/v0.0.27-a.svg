<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_pp71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_pp71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_pp71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_pp71">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe excited at MacBook -->
  <g filter="url(#shadow_pp71)">
    <!-- Body -->
    <ellipse cx="150" cy="230" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="180" rx="20" ry="23" fill="url(#hum_skin_pp71)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 165 Q 150 158 170 165 Q 168 170 164 172 Q 150 168 136 172 Q 132 170 130 165" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Wide excited eyes -->
    <ellipse cx="142" cy="180" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="180" r="3" fill="#2a2a2a"/>
    <circle cx="141" cy="179" r="1" fill="#fff"/>
    <ellipse cx="158" cy="180" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="180" r="3" fill="#2a2a2a"/>
    <circle cx="157" cy="179" r="1" fill="#fff"/>
    <!-- Nose and excited smile -->
    <path d="M 150 185 L 150 188" stroke="#a8896d" stroke-width="1"/>
    <path d="M 143 193 Q 150 198 157 193" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>

    <!-- MacBook -->
    <rect x="105" y="252" width="90" height="55" fill="#c0c0c0" stroke="#8a8a8a" stroke-width="1"/>
    <rect x="108" y="255" width="84" height="45" fill="#1a1a1a"/>
    <!-- Screen content: waveforms -->
    <path d="M 115 275 Q 120 265 125 275 Q 130 285 135 275 Q 140 265 145 275 Q 150 285 155 275 Q 160 265 165 275 Q 170 285 175 275 Q 180 265 185 275" fill="none" stroke="#76b900" stroke-width="1.5"/>
    <text x="150" y="268" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#76b900">PersonaPlex 7B</text>
    <text x="150" y="293" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#888">FULL DUPLEX ACTIVE</text>
    <!-- Apple logo hint -->
    <ellipse cx="150" cy="303" rx="4" ry="3" fill="#aaa"/>

    <!-- Sound waves emanating from laptop -->
    <path d="M 200 270 Q 210 265 210 275" fill="none" stroke="#76b900" stroke-width="1" opacity="0.6"/>
    <path d="M 205 260 Q 220 265 220 280 Q 220 290 205 295" fill="none" stroke="#76b900" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Speech bubble -->
  <rect x="30" y="30" width="240" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,143 150,163 160,143" fill="#fff"/>
  <line x1="140" y1="145" x2="150" y2="165" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="165" x2="160" y2="145" stroke="#333" stroke-width="2"/>

  <text x="150" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">PersonaPlex</text>
  <text x="150" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">on my MacBook.</text>
  <text x="150" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Full duplex.</text>
  <text x="150" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">It talks AND</text>
  <text x="150" y="140" font-family="DejaVu Sans" font-size="18" text-anchor="middle" fill="#222">listens at once.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache half-lidded on desk -->
  <g filter="url(#shadow_pp71)">
    <!-- Body -->
    <ellipse cx="450" cy="240" rx="18" ry="20" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="218" rx="14" ry="13" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="438,210 442,192 446,210" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="454,210 458,192 462,210" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="440,209 442,196 444,209" fill="#cd853f"/>
    <polygon points="456,209 458,196 460,209" fill="#cd853f"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="444" cy="220" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="220" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="220" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="220" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="450" cy="225" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 446 228 L 454 228" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 430 245 Q 415 250 410 265 Q 405 280 415 290 Q 425 300 435 290 Q 430 275 430 260 Q 430 252 430 245" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_pp71)">
    <!-- Body -->
    <ellipse cx="520" cy="245" rx="18" ry="24" fill="url(#lem_fur_pp71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="520" cy="218" rx="15" ry="14" fill="url(#lem_fur_pp71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized ears -->
    <ellipse cx="502" cy="212" rx="11" ry="13" fill="url(#lem_fur_pp71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="538" cy="212" rx="11" ry="13" fill="url(#lem_fur_pp71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="502" cy="212" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="538" cy="212" rx="6" ry="8" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="512" cy="218" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="512" cy="218" r="6.5" fill="#1a1a1a"/>
    <circle cx="510" cy="216" r="1.8" fill="#fff"/>
    <ellipse cx="528" cy="218" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="528" cy="218" r="6.5" fill="#1a1a1a"/>
    <circle cx="526" cy="216" r="1.8" fill="#fff"/>
    <!-- Nose and mouth -->
    <ellipse cx="520" cy="226" rx="1.8" ry="1.3" fill="#1a1a1a"/>
    <path d="M 515 230 Q 520 231 525 230" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 540 250 Q 550 260 555 275 Q 560 290 555 305 Q 550 315 540 310 Q 545 295 545 280 Q 545 265 540 250" fill="url(#lem_fur_pp71)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="545" y="275" width="12" height="6" fill="#1a1a1a"/>
    <rect x="545" y="287" width="12" height="6" fill="#1a1a1a"/>
    <rect x="545" y="299" width="12" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Sifaka speech bubble -->
  <rect x="330" y="30" width="240" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="510,143 520,163 530,143" fill="#fff"/>
  <line x1="510" y1="145" x2="520" y2="165" stroke="#333" stroke-width="2"/>
  <line x1="520" y1="165" x2="530" y2="145" stroke="#333" stroke-width="2"/>

  <text x="450" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So it can</text>
  <text x="450" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">interrupt you</text>
  <text x="450" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">while you're</text>
  <text x="450" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">still talking?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache, same pose, delivering punchline -->
  <g filter="url(#shadow_pp71)">
    <!-- Body -->
    <ellipse cx="750" cy="240" rx="18" ry="20" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="218" rx="14" ry="13" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="738,210 742,192 746,210" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="754,210 758,192 762,210" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="740,209 742,196 744,209" fill="#cd853f"/>
    <polygon points="756,209 758,196 760,209" fill="#cd853f"/>

    <!-- Half-lidded eyes looking at viewer -->
    <ellipse cx="744" cy="220" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="744" cy="220" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="756" cy="220" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="756" cy="220" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="750" cy="225" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat deadpan mouth -->
    <path d="M 746 228 L 754 228" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 730 245 Q 715 250 710 265 Q 705 280 715 290 Q 725 300 735 290 Q 730 275 730 260 Q 730 252 730 245" fill="url(#sq_fur_pp71)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Cache speech bubble -->
  <rect x="630" y="30" width="245" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,168 750,188 760,168" fill="#fff"/>
  <line x1="740" y1="170" x2="750" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="190" x2="760" y2="170" stroke="#333" stroke-width="2"/>

  <text x="752" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">They finally</text>
  <text x="752" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">automated the</text>
  <text x="752" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">one thing no</text>
  <text x="752" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">one asked a</text>
  <text x="752" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">friend to stop.</text>

  <!-- Tiny "process.ink" watermark -->
  <text x="880" y="340" font-family="DejaVu Sans" font-size="8" text-anchor="end" fill="#bbb">process.ink</text>
</svg>