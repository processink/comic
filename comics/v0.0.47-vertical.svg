<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_bn73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_bn73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_bn73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_bn73">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe reading newspaper -->
  <g filter="url(#shadow_bn73)">
    <ellipse cx="200" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <ellipse cx="200" cy="180" rx="20" ry="23" fill="url(#hum_skin_bn73)" stroke="#c8a882" stroke-width="1.3"/>
    <path d="M 180 165 Q 200 158 220 165 Q 218 170 214 172 Q 200 168 186 172 Q 182 170 180 165" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <ellipse cx="192" cy="180" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="192" cy="181" r="2" fill="#2a2a2a"/>
    <ellipse cx="208" cy="180" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="208" cy="181" r="2" fill="#2a2a2a"/>
    <path d="M 200 186 L 200 189" stroke="#a8896d" stroke-width="1"/>
    <path d="M 195 194 Q 200 196 205 194" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>
    <rect x="165" y="220" width="70" height="50" fill="#f5f0e0" stroke="#b8a888" stroke-width="1"/>
    <text x="200" y="235" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#555">SOCIAL MEDIA</text>
    <text x="200" y="243" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#555">BAN PROPOSED</text>
    <line x1="172" y1="248" x2="228" y2="248" stroke="#ccc" stroke-width="0.5"/>
    <line x1="172" y1="252" x2="228" y2="252" stroke="#ccc" stroke-width="0.5"/>
    <line x1="172" y1="256" x2="228" y2="256" stroke="#ccc" stroke-width="0.5"/>
    <line x1="172" y1="260" x2="215" y2="260" stroke="#ccc" stroke-width="0.5"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="55" y="25" width="290" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,143 200,163 210,143" fill="#fff"/>
  <line x1="190" y1="145" x2="200" y2="165" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="165" x2="210" y2="145" stroke="#333" stroke-width="2"/>

  <text x="200" y="52" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">India wants</text>
  <text x="200" y="78" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">to ban social</text>
  <text x="200" y="104" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">media for</text>
  <text x="200" y="130" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">kids under 16.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache half-lidded, arms crossed -->
  <g filter="url(#shadow_bn73)">
    <ellipse cx="200" cy="555" rx="18" ry="20" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="200" cy="523" rx="14" ry="13" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <polygon points="187,515 190,493 195,515" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="205,515 210,493 213,515" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="189,513 191,498 194,513" fill="#cd853f"/>
    <polygon points="207,513 209,498 212,513" fill="#cd853f"/>
    <ellipse cx="194" cy="525" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="525" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="206" cy="525" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="525" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="200" cy="530" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 195 534 L 205 534" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <path d="M 185 553 Q 170 545 165 530 Q 160 515 168 505 Q 175 515 172 530 Q 175 543 185 550" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="190" cy="557" rx="8" ry="5" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1" transform="rotate(20 190 557)"/>
    <ellipse cx="210" cy="557" rx="8" ry="5" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1" transform="rotate(-20 210 557)"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="45" y="335" width="310" height="148" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,481 200,501 210,481" fill="#fff"/>
  <line x1="190" y1="483" x2="200" y2="503" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="503" x2="210" y2="483" stroke="#333" stroke-width="2"/>

  <text x="200" y="366" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Banning the</text>
  <text x="200" y="392" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">river doesn't</text>
  <text x="200" y="418" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">fix the flood.</text>
  <text x="200" y="444" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">You build</text>
  <text x="200" y="470" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">better boats.</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes staring -->
  <g filter="url(#shadow_bn73)">
    <ellipse cx="200" cy="865" rx="22" ry="28" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="200" cy="830" rx="18" ry="16" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="200" cy="833" rx="13" ry="11" fill="#f0f0f0"/>
    <ellipse cx="175" cy="825" rx="14" ry="16" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="825" rx="14" ry="16" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="825" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="825" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="188" cy="830" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="831" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="829" r="2" fill="#fff"/>
    <ellipse cx="212" cy="830" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="831" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="829" r="2" fill="#fff"/>
    <ellipse cx="200" cy="839" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 194 843 Q 200 846 206 843" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <path d="M 180 870 Q 170 880 165 895 Q 160 910 165 925 Q 170 935 180 933 Q 188 930 190 915 Q 188 895 185 875" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="163" y="895" width="25" height="7" fill="#1a1a1a"/>
    <rect x="163" y="909" width="25" height="7" fill="#1a1a1a"/>
    <rect x="164" y="923" width="22" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="45" y="645" width="310" height="148" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,791 200,811 210,791" fill="#fff"/>
  <line x1="190" y1="793" x2="200" y2="813" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="813" x2="210" y2="793" stroke="#333" stroke-width="2"/>

  <text x="200" y="676" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">But the boats</text>
  <text x="200" y="702" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">are also made</text>
  <text x="200" y="728" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">by the people</text>
  <text x="200" y="754" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">who own</text>
  <text x="200" y="780" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the river.</text>

  <!-- Accent line bottom -->
  <line x1="10" y1="955" x2="390" y2="955" stroke="#E63946" stroke-width="2"/>
</svg>