    <ellipse cx="175" cy="505" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="505" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="188" cy="510" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="510" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="508" r="2" fill="#fff"/>
    <ellipse cx="212" cy="510" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="510" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="508" r="2" fill="#fff"/>
    <ellipse cx="200" cy="520" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 193 524 Q 200 525 207 524" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <path d="M 180 550 Q 170 560 165 580 Q 162 595 168 610 Q 175 620 185 615 Q 180 595 180 575 Q 180 560 180 550" fill="url(#lem_fur_v29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="165" y="575" width="18" height="6" fill="#1a1a1a"/>
    <rect x="164" y="587" width="18" height="6" fill="#1a1a1a"/>
    <rect x="166" y="599" width="16" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble P2 -->
  <rect x="45" y="340" width="310" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,473 200,493 210,473" fill="#fff"/>
  <line x1="190" y1="475" x2="200" y2="495" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="495" x2="210" y2="475" stroke="#333" stroke-width="2"/>

  <text x="200" y="368" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">So the shape</text>
  <text x="200" y="395" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">was always</text>
  <text x="200" y="422" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">strong? It just</text>
  <text x="200" y="449" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">needed someone</text>
  <text x="200" y="471" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">to fold it?</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking down -->
  <g>
    <ellipse cx="200" cy="860" rx="18" ry="22" fill="url(#sq_fur_v29)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="200" cy="836" rx="14" ry="14" fill="url(#sq_fur_v29)" stroke="#5d4a2f" stroke-width="1.3"/>
    <polygon points="190,822 187,802 195,820" fill="url(#sq_fur_v29)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="210,822 213,802 205,820" fill="url(#sq_fur_v29)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="191,821 189,806 194,820" fill="#cd853f"/>
    <polygon points="209,821 211,806 206,820" fill="#cd853f"/>
    <ellipse cx="194" cy="838" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="839" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="206" cy="838" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="839" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="200" cy="843" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 196 846 L 204 846" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <path d="M 182 865 Q 168 870 162 888 Q 158 905 168 915 Q 178 922 185 912 Q 180 898 180 882 Q 180 873 182 865" fill="url(#sq_fur_v29)" stroke="#5d4a2f" stroke-width="1.3"/>
    <polygon points="210,885 218,880 222,888 215,892 208,890" fill="#f5f5f0" stroke="#aaa" stroke-width="0.8"/>
    <line x1="212" y1="884" x2="216" y2="889" stroke="#ccc" stroke-width="0.5"/>
  </g>

  <!-- Speech bubble P3 -->
  <rect x="45" y="650" width="310" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,783 200,803 210,783" fill="#fff"/>
  <line x1="190" y1="785" x2="200" y2="805" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="805" x2="210" y2="785" stroke="#333" stroke-width="2"/>

  <text x="200" y="678" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Most of us</text>
  <text x="200" y="705" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">are just flat</text>
  <text x="200" y="732" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">paper waiting</text>
  <text x="200" y="759" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">for the right</text>
  <text x="200" y="781" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">crease.</text>

</svg>