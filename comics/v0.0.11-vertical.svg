    <path d="M 182 235 Q 168 240 162 258 Q 158 275 168 285 Q 178 292 185 282 Q 180 268 180 252 Q 180 243 182 235" fill="url(#sq_fur_v29)" stroke="#5d4a2f" stroke-width="1.3"/>
    <rect x="208" y="222" width="14" height="22" rx="2" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="210" y="224" width="10" height="16" fill="#4a86c7"/>
  </g>

  <!-- Speech bubble P1 -->
  <rect x="40" y="30" width="320" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,163 200,183 210,163" fill="#fff"/>
  <line x1="190" y1="165" x2="200" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="185" x2="210" y2="165" stroke="#333" stroke-width="2"/>

  <text x="200" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">A 14-year-old</text>
  <text x="200" y="85" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">folded paper</text>
  <text x="200" y="112" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">that holds ten</text>
  <text x="200" y="139" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">thousand times</text>
  <text x="200" y="161" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">its own weight.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting -->
  <g>
    <ellipse cx="200" cy="540" rx="22" ry="28" fill="url(#lem_fur_v29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="200" cy="510" rx="18" ry="16" fill="url(#lem_fur_v29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="175" cy="505" rx="14" ry="16" fill="url(#lem_fur_v29)" stroke="#5a5a5a" stroke-width="1.2"/>
