<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_ap91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ap91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_ap91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_ap91">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe standing in front of a blank white canvas on an easel -->
  <g filter="url(#shadow_ap91)">
    <!-- Easel -->
    <line x1="170" y1="150" x2="150" y2="310" stroke="#8b7355" stroke-width="3"/>
    <line x1="210" y1="150" x2="230" y2="310" stroke="#8b7355" stroke-width="3"/>
    <line x1="190" y1="150" x2="190" y2="320" stroke="#8b7355" stroke-width="3"/>
    <line x1="155" y1="240" x2="225" y2="240" stroke="#8b7355" stroke-width="2"/>

    <!-- Blank canvas -->
    <rect x="160" y="150" width="60" height="80" fill="#fff" stroke="#333" stroke-width="1.5"/>

    <!-- Abe body -->
    <rect x="70" y="225" width="55" height="50" rx="4" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.2"/>

    <!-- Abe neck -->
    <rect x="88" y="215" width="18" height="12" fill="url(#hum_skin_ap91)"/>

    <!-- Abe head -->
    <circle cx="97" cy="195" r="22" fill="url(#hum_skin_ap91)" stroke="#c8a882" stroke-width="1.2"/>

    <!-- Hair -->
    <path d="M 75 183 Q 87 170 100 170 Q 113 170 119 183 Q 117 187 113 189 Q 100 181 85 181 Q 79 183 75 187 Z" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes - staring at blank canvas -->
    <ellipse cx="89" cy="194" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="91" cy="195" r="2.2" fill="#1a1a1a"/>
    <ellipse cx="105" cy="194" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="107" cy="195" r="2.2" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <path d="M 97 200 L 97 204" stroke="#a8896d" stroke-width="1"/>
    <path d="M 92 209 Q 97 207 102 209" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms -->
    <line x1="75" y1="235" x2="60" y2="265" stroke="#5d8aa8" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="235" x2="135" y2="265" stroke="#5d8aa8" stroke-width="6" stroke-linecap="round"/>

    <!-- Ground -->
    <line x1="35" y1="280" x2="265" y2="280" stroke="#999" stroke-width="1.5"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="25" width="220" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="90,138 100,153 110,138" fill="#fff"/>
  <path d="M 90,140 L 100,155 L 110,140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="145" y="50" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Art Paris says</text>
  <text x="145" y="74" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the big idea</text>
  <text x="145" y="98" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">this year is</text>
  <text x="145" y="122" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">"slowness."</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on the floor next to a tiny acorn labeled ART -->
  <g filter="url(#shadow_ap91)">
    <!-- Ground -->
    <line x1="335" y1="280" x2="565" y2="280" stroke="#999" stroke-width="1.5"/>

    <!-- Cache body -->
    <ellipse cx="420" cy="260" rx="18" ry="20" fill="url(#sq_fur_ap91)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Cache head -->
    <ellipse cx="420" cy="238" rx="14" ry="13" fill="url(#sq_fur_ap91)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="413" cy="232" rx="6" ry="11" fill="url(#sq_fur_ap91)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 413 232)"/>
    <ellipse cx="427" cy="232" rx="6" ry="11" fill="url(#sq_fur_ap91)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 427 232)"/>
    <ellipse cx="413" cy="235" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 413 235)"/>
    <ellipse cx="427" cy="235" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 427 235)"/>

    <!-- Ear tufts -->
    <path d="M 411 227 Q 408 221 410 219" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 429 227 Q 432 221 430 219" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="414" cy="240" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="415" cy="240" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="426" cy="240" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="427" cy="240" r="1.8" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="420" cy="244" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Mouth - simple unimpressed line -->
    <path d="M 416 247 L 424 247" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="408" y1="242" x2="395" y2="241" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="408" y1="245" x2="396" y2="247" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="432" y1="242" x2="445" y2="241" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="432" y1="245" x2="444" y2="247" stroke="#1a1a1a" stroke-width="0.7"/>

    <!-- Fluffy tail -->
    <path d="M 436 258 Q 455 250 468 235 Q 475 225 472 218 Q 467 225 458 235 Q 445 250 436 256 Z" fill="url(#sq_fur_ap91)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Acorn on the ground labeled ART -->
    <ellipse cx="500" cy="275" rx="8" ry="6" fill="#8b6842" stroke="#5d4a2f" stroke-width="1"/>
    <path d="M 492 272 Q 500 268 508 272" fill="#5d4a2f" stroke="#4a3728" stroke-width="0.8"/>
    <line x1="500" y1="268" x2="500" y2="262" stroke="#5d4a2f" stroke-width="1"/>
    <text x="500" y="290" font-family="DejaVu Sans" font-size="9" text-anchor="middle" fill="#666">ART</text>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="340" y="25" width="220" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="410,163 420,178 430,163" fill="#fff"/>
  <path d="M 410,165 L 420,180 L 430,165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="52" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So they took</text>
  <text x="450" y="76" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">four hundred</text>
  <text x="450" y="100" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">years of art</text>
  <text x="450" y="124" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">and rebranded</text>
  <text x="450" y="148" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">procrastination.</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting perfectly still, staring at viewer -->
  <g filter="url(#shadow_ap91)">
    <!-- Ground -->
    <line x1="635" y1="280" x2="865" y2="280" stroke="#999" stroke-width="1.5"/>

    <!-- Sifaka body -->
    <ellipse cx="750" cy="255" rx="22" ry="28" fill="url(#lem_fur_ap91)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Sifaka head -->
    <ellipse cx="750" cy="222" rx="18" ry="16" fill="url(#lem_fur_ap91)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="217" rx="14" ry="16" fill="url(#lem_fur_ap91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="217" rx="14" ry="16" fill="url(#lem_fur_ap91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="217" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="217" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="738" cy="222" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="222" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="220" r="2" fill="#fff"/>

    <ellipse cx="762" cy="222" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="222" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="220" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="230" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Mouth -->
    <path d="M 743 234 Q 750 235 757 234" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 730 260 Q 720 270 715 290 Q 710 305 718 315 Q 726 322 736 315 Q 730 295 730 275 Q 730 268 730 260" fill="url(#lem_fur_ap91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="714" y="290" width="20" height="6" fill="#1a1a1a"/>
    <rect x="714" y="302" width="20" height="6" fill="#1a1a1a"/>
    <rect x="716" y="312" width="18" height="5" fill="#1a1a1a"/>

    <!-- Small placard in front of Sifaka -->
    <rect x="735" y="285" width="50" height="25" fill="#f5f0e8" stroke="#333" stroke-width="1"/>
    <text x="760" y="296" font-family="DejaVu Sans" font-size="7" text-anchor="middle" fill="#333">UNTITLED</text>
    <text x="760" y="305" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#666">mixed media, 2025</text>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="640" y="25" width="220" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,178 760,163" fill="#fff"/>
  <path d="M 740,165 L 750,180 L 760,165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="52" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I've been</text>
  <text x="750" y="76" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">sitting here</text>
  <text x="750" y="100" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">for six hours.</text>
  <text x="750" y="124" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Am I art</text>
  <text x="750" y="148" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">or furniture?</text>
</svg>