<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_bn73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_bn73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_bn73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_bn73">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe reading newspaper -->
  <g filter="url(#shadow_bn73)">
    <!-- Body -->
    <ellipse cx="150" cy="265" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="210" rx="20" ry="23" fill="url(#hum_skin_bn73)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 195 Q 150 188 170 195 Q 168 200 164 202 Q 150 198 136 202 Q 132 200 130 195" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes -->
    <ellipse cx="142" cy="210" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="211" r="2" fill="#2a2a2a"/>
    <ellipse cx="158" cy="210" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="211" r="2" fill="#2a2a2a"/>
    <!-- Nose and mouth -->
    <path d="M 150 216 L 150 219" stroke="#a8896d" stroke-width="1"/>
    <path d="M 145 224 Q 150 226 155 224" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>
    <!-- Newspaper -->
    <rect x="115" y="250" width="70" height="50" fill="#f5f0e0" stroke="#b8a888" stroke-width="1"/>
    <text x="150" y="265" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#555">SOCIAL MEDIA</text>
    <text x="150" y="273" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#555">BAN PROPOSED</text>
    <line x1="122" y1="278" x2="178" y2="278" stroke="#ccc" stroke-width="0.5"/>
    <line x1="122" y1="282" x2="178" y2="282" stroke="#ccc" stroke-width="0.5"/>
    <line x1="122" y1="286" x2="178" y2="286" stroke="#ccc" stroke-width="0.5"/>
    <line x1="122" y1="290" x2="165" y2="290" stroke="#ccc" stroke-width="0.5"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="30" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,158 150,178 160,158" fill="#fff"/>
  <line x1="140" y1="160" x2="150" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="180" x2="160" y2="160" stroke="#333" stroke-width="2"/>

  <text x="150" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">India wants</text>
  <text x="150" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">to ban social</text>
  <text x="150" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">media for</text>
  <text x="150" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">kids under 16.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache half-lidded, arms crossed -->
  <g filter="url(#shadow_bn73)">
    <!-- Body -->
    <ellipse cx="450" cy="250" rx="18" ry="20" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="218" rx="14" ry="13" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="437,210 440,188 445,210" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="455,210 460,188 463,210" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="439,208 441,193 444,208" fill="#cd853f"/>
    <polygon points="457,208 459,193 462,208" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="444" cy="220" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="220" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="220" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="220" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="450" cy="225" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth - flat unimpressed line -->
    <path d="M 445 229 L 455 229" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 435 248 Q 420 240 415 225 Q 410 210 418 200 Q 425 210 422 225 Q 425 238 435 245" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Crossed arms -->
    <ellipse cx="440" cy="252" rx="8" ry="5" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1" transform="rotate(20 440 252)"/>
    <ellipse cx="460" cy="252" rx="8" ry="5" fill="url(#sq_fur_bn73)" stroke="#5d4a2f" stroke-width="1" transform="rotate(-20 460 252)"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="335" y="30" width="230" height="148" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,176 450,196 460,176" fill="#fff"/>
  <line x1="440" y1="178" x2="450" y2="198" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="198" x2="460" y2="178" stroke="#333" stroke-width="2"/>

  <text x="450" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Banning the</text>
  <text x="450" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">river doesn't</text>
  <text x="450" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">fix the flood.</text>
  <text x="450" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">You build</text>
  <text x="450" y="152" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">better boats.</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes staring -->
  <g filter="url(#shadow_bn73)">
    <!-- Body -->
    <ellipse cx="750" cy="250" rx="22" ry="28" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="215" rx="18" ry="16" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- White face patch -->
    <ellipse cx="750" cy="218" rx="13" ry="11" fill="#f0f0f0"/>
    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="210" rx="14" ry="16" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="210" rx="14" ry="16" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="738" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="216" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="214" r="2" fill="#fff"/>
    <ellipse cx="762" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="216" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="214" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="750" cy="224" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Small open mouth -->
    <path d="M 744 228 Q 750 231 756 228" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 730 255 Q 720 265 715 280 Q 710 295 715 310 Q 720 320 730 318 Q 738 315 740 300 Q 738 280 735 260" fill="url(#lem_fur_bn73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="713" y="280" width="25" height="7" fill="#1a1a1a"/>
    <rect x="713" y="294" width="25" height="7" fill="#1a1a1a"/>
    <rect x="714" y="308" width="22" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="635" y="30" width="230" height="148" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,176 750,196 760,176" fill="#fff"/>
  <line x1="740" y1="178" x2="750" y2="198" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="198" x2="760" y2="178" stroke="#333" stroke-width="2"/>

  <text x="750" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">But the boats</text>
  <text x="750" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">are also made</text>
  <text x="750" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">by the people</text>
  <text x="750" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">who own</text>
  <text x="750" y="152" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the river.</text>

  <!-- Accent line bottom -->
  <line x1="10" y1="345" x2="890" y2="345" stroke="#E63946" stroke-width="2"/>
</svg>