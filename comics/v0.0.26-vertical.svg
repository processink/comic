<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_v47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_v47">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Speech bubble -->
  <rect x="30" y="25" width="260" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="150,138 160,158 170,138" fill="#fff"/>
  <path d="M 150 140 L 160 160 L 170 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="160" y="52" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Smalltalk's</text>
  <text x="160" y="80" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">class browser</text>
  <text x="160" y="108" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">is from 1980.</text>
  <text x="160" y="134" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Still unmatched.</text>

  <!-- Abe at computer -->
  <g filter="url(#shadow_v47)">
    <!-- Body -->
    <ellipse cx="160" cy="225" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="160" cy="175" rx="20" ry="23" fill="url(#hum_skin_v47)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 140 160 Q 160 153 180 160 Q 178 165 174 167 Q 160 163 146 167 Q 142 165 140 160" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes -->
    <ellipse cx="152" cy="175" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="152" cy="175" r="3" fill="#2a2a2a"/>
    <circle cx="151" cy="174" r="1" fill="#fff"/>
    <ellipse cx="168" cy="175" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="168" cy="175" r="3" fill="#2a2a2a"/>
    <circle cx="167" cy="174" r="1" fill="#fff"/>
    <!-- Nose and mouth -->
    <path d="M 160 180 L 160 183" stroke="#a8896d" stroke-width="1"/>
    <path d="M 155 188 Q 160 191 165 188" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Computer monitor -->
    <rect x="110" y="245" width="100" height="55" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="113" y="248" width="94" height="48" fill="#f0ece4"/>
    <!-- Smalltalk browser panes -->
    <rect x="115" y="250" width="22" height="18" fill="#d9d3c7" stroke="#8a8a7a" stroke-width="0.5"/>
    <rect x="139" y="250" width="22" height="18" fill="#d9d3c7" stroke="#8a8a7a" stroke-width="0.5"/>
    <rect x="163" y="250" width="22" height="18" fill="#d9d3c7" stroke="#8a8a7a" stroke-width="0.5"/>
    <rect x="187" y="250" width="18" height="18" fill="#d9d3c7" stroke="#8a8a7a" stroke-width="0.5"/>
    <!-- Code area -->
    <rect x="115" y="270" width="90" height="23" fill="#fffef8" stroke="#8a8a7a" stroke-width="0.5"/>
    <text x="120" y="280" font-family="DejaVu Sans" font-size="5" fill="#333">yourself</text>
    <text x="120" y="288" font-family="DejaVu Sans" font-size="5" fill="#333">  ^ self</text>
    <!-- Monitor stand -->
    <rect x="150" y="300" width="20" height="6" fill="#5a5a5a" stroke="#2a2a2a" stroke-width="1"/>
  </g>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Speech bubble -->
  <rect x="40" y="335" width="300" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="180,473 190,493 200,473" fill="#fff"/>
  <path d="M 180 475 L 190 495 L 200 475" fill="none" stroke="#333" stroke-width="2"/>

  <text x="190" y="365" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">So the best</text>
  <text x="190" y="393" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">dev tool ever</text>
  <text x="190" y="421" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">made couldn't</text>
  <text x="190" y="449" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">save Smalltalk.</text>
  <text x="190" y="470" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Interesting.</text>

  <!-- Cache on desk -->
  <g filter="url(#shadow_v47)">
    <!-- Body -->
    <ellipse cx="200" cy="555" rx="18" ry="20" fill="url(#sq_fur_v47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="533" rx="14" ry="13" fill="url(#sq_fur_v47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="188,525 192,507 196,525" fill="url(#sq_fur_v47)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="204,525 208,507 212,525" fill="url(#sq_fur_v47)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="190,524 192,511 194,524" fill="#cd853f"/>
    <polygon points="206,524 208,511 210,524" fill="#cd853f"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="194" cy="535" rx="3" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="536" r="2" fill="#1a1a1a"/>
    <line x1="190" y1="533" x2="198" y2="533" stroke="#5d4a2f" stroke-width="1.5"/>
    <ellipse cx="206" cy="535" rx="3" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="536" r="2" fill="#1a1a1a"/>
    <line x1="202" y1="533" x2="210" y2="533" stroke="#5d4a2f" stroke-width="1.5"/>

    <!-- Nose -->
    <ellipse cx="200" cy="540" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <line x1="196" y1="544" x2="204" y2="544" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 180 560 Q 165 565 160 580 Q 155 595 165 605 Q 175 613 185 605 Q 180 590 180 575 Q 180 567 180 560" fill="url(#sq_fur_v47)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Speech bubble -->
  <rect x="40" y="645" width="300" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,783 200,803 210,783" fill="#fff"/>
  <path d="M 190 785 L 200 805 L 210 785" fill="none" stroke="#333" stroke-width="2"/>

  <text x="190" y="675" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Being right</text>
  <text x="190" y="703" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">and being</text>
  <text x="190" y="731" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">chosen are</text>
  <text x="190" y="759" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">different</text>
  <text x="190" y="781" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#E63946">industries.</text>

  <!-- Sifaka -->
  <g filter="url(#shadow_v47)">
    <!-- Body -->
    <ellipse cx="200" cy="870" rx="22" ry="28" fill="url(#lem_fur_v47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="840" rx="18" ry="16" fill="url(#lem_fur_v47)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="178" cy="835" rx="14" ry="16" fill="url(#lem_fur_v47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="222" cy="835" rx="14" ry="16" fill="url(#lem_fur_v47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="178" cy="835" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="222" cy="835" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="188" cy="840" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="840" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="838" r="2" fill="#fff"/>
    <ellipse cx="212" cy="840" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="840" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="838" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="200" cy="850" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny mouth -->
    <path d="M 196 854 Q 200 855 204 854" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 180 880 Q 168 890 162 910 Q 158 930 168 942 Q 178 950 182 940 Q 176 925 176 905 Q 176 890 180 880" fill="url(#lem_fur_v47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Tail stripes -->
    <path d="M 168 910 Q 172 908 176 910" stroke="#1a1a1a" stroke-width="3" fill="none"/>
    <path d="M 166 918 Q 170 916 174 918" stroke="#1a1a1a" stroke-width="3" fill="none"/>
    <path d="M 166 926 Q 170 924 174 926" stroke="#1a1a1a" stroke-width="3" fill="none"/>
    <path d="M 168 934 Q 172 932 176 934" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  </g>
</svg>