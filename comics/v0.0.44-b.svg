<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_mind82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_mind82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_mind82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_mind82">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting cross-legged meditating -->
  <g filter="url(#shadow_mind82)">
    <!-- Body -->
    <ellipse cx="150" cy="250" rx="26" ry="30" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="150" cy="210" rx="18" ry="16" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="125" cy="205" rx="14" ry="16" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="205" rx="14" ry="16" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="125" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="175" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes - closed in meditation -->
    <ellipse cx="138" cy="212" rx="10" ry="11" fill="url(#lem_fur_mind82)" stroke="#2a2a2a" stroke-width="1"/>
    <path d="M 130 212 Q 138 208 146 212" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
    <ellipse cx="162" cy="212" rx="10" ry="11" fill="url(#lem_fur_mind82)" stroke="#2a2a2a" stroke-width="1"/>
    <path d="M 154 212 Q 162 208 170 212" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose and mouth -->
    <ellipse cx="150" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 145 224 Q 150 226 155 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Crossed legs -->
    <ellipse cx="135" cy="275" rx="14" ry="8" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="165" cy="275" rx="14" ry="8" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1"/>

    <!-- Ring tail with stripes curled around -->
    <path d="M 175 245 Q 190 250 200 265 Q 210 285 200 300 Q 190 310 178 305 Q 185 290 185 275 Q 185 260 180 248" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="190" y="268" width="18" height="6" fill="#1a1a1a" rx="2"/>
    <rect x="188" y="280" width="18" height="6" fill="#1a1a1a" rx="2"/>
    <rect x="184" y="292" width="16" height="6" fill="#1a1a1a" rx="2"/>

    <!-- Zen circle floating above head -->
    <circle cx="150" cy="185" r="12" fill="none" stroke="#E63946" stroke-width="2" stroke-dasharray="60 15" opacity="0.7"/>
  </g>

  <!-- Speech bubble - thought bubble style -->
  <rect x="30" y="35" width="240" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,138 150,158 160,138" fill="#fff"/>
  <path d="M 140 140 L 150 160 L 160 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I am fully</text>
  <text x="150" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">present in</text>
  <text x="150" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">this moment.</text>
  <text x="150" y="133" font-family="DejaVu Sans" font-size="16" text-anchor="middle" fill="#888" font-style="italic">Day 1 of 365</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache standing, arms crossed, skeptical -->
  <g filter="url(#shadow_mind82)">
    <!-- Body -->
    <ellipse cx="450" cy="245" rx="18" ry="22" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="450" cy="210" rx="14" ry="13" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="202" rx="6" ry="11" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 443 202)"/>
    <ellipse cx="457" cy="202" rx="6" ry="11" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 457 202)"/>
    <ellipse cx="443" cy="205" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 443 205)"/>
    <ellipse cx="457" cy="205" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 457 205)"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="444" cy="212" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="212" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="212" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="212" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="450" cy="216" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Flat mouth -->
    <path d="M 446 220 L 454 220" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Crossed arms -->
    <ellipse cx="440" cy="240" rx="9" ry="6" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1" transform="rotate(15 440 240)"/>
    <ellipse cx="460" cy="240" rx="9" ry="6" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1" transform="rotate(-15 460 240)"/>

    <!-- Fluffy tail -->
    <path d="M 430 250 Q 415 255 410 270 Q 405 285 415 295 Q 425 305 435 295 Q 430 280 430 265 Q 430 257 430 250" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Feet -->
    <ellipse cx="443" cy="268" rx="8" ry="4" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1"/>
    <ellipse cx="457" cy="268" rx="8" ry="4" fill="url(#sq_fur_mind82)" stroke="#5d4a2f" stroke-width="1"/>
  </g>

  <!-- Speech bubble -->
  <rect x="330" y="35" width="245" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,153 450,173 460,153" fill="#fff"/>
  <path d="M 440 155 L 450 175 L 460 155" fill="none" stroke="#333" stroke-width="2"/>

  <text x="452" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">If you're</text>
  <text x="452" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">aware you're</text>
  <text x="452" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">present, who's</text>
  <text x="452" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">watching?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka eyes now WIDE OPEN in existential horror -->
  <g filter="url(#shadow_mind82)">
    <!-- Body -->
    <ellipse cx="750" cy="250" rx="26" ry="30" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="750" cy="210" rx="18" ry="16" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="725" cy="205" rx="14" ry="16" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="205" rx="14" ry="16" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes - wide open terrified -->
    <ellipse cx="738" cy="210" rx="11" ry="13" fill="#fff" stroke="#2a2a2a" stroke-width="1.2"/>
    <circle cx="738" cy="210" r="6" fill="#1a1a1a"/>
    <circle cx="736" cy="208" r="2" fill="#fff"/>
    <circle cx="740" cy="212" r="1" fill="#fff"/>

    <ellipse cx="762" cy="210" rx="11" ry="13" fill="#fff" stroke="#2a2a2a" stroke-width="1.2"/>
    <circle cx="762" cy="210" r="6" fill="#1a1a1a"/>
    <circle cx="760" cy="208" r="2" fill="#fff"/>
    <circle cx="764" cy="212" r="1" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="222" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Tiny horrified O mouth -->
    <ellipse cx="750" cy="228" rx="3" ry="4" fill="#1a1a1a"/>

    <!-- Crossed legs still but trembling lines -->
    <ellipse cx="735" cy="275" rx="14" ry="8" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="765" cy="275" rx="14" ry="8" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1"/>

    <!-- Ring tail - stiff with fear -->
    <path d="M 775 245 Q 790 240 800 230 Q 810 218 815 210 Q 818 205 820 195" fill="url(#lem_fur_mind82)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="798" y="225" width="14" height="6" fill="#1a1a1a" rx="2"/>
    <rect x="805" y="213" width="12" height="6" fill="#1a1a1a" rx="2"/>
    <rect x="810" y="201" width="10" height="6" fill="#1a1a1a" rx="2"/>

    <!-- Tremble lines around head -->
    <path d="M 720 195 L 716 192" stroke="#E63946" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 718 200 L 714 200" stroke="#E63946" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 780 195 L 784 192" stroke="#E63946" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 782 200 L 786 200" stroke="#E63946" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble -->
  <rect x="635" y="35" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,153 750,173 760,153" fill="#fff"/>
  <path d="M 740 155 L 750 175 L 760 155" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I am now</text>
  <text x="750" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">fully present</text>
  <text x="750" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">in the WRONG</text>
  <text x="750" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">moment.</text>

  <!-- Tiny "Process" signature -->
  <text x="880" y="345" font-family="DejaVu Sans" font-size="10" text-anchor="end" fill="#999">process.ink</text>
</svg>