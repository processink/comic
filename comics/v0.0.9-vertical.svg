  <text x="195" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">US ambassador</text>
  <text x="195" y="86" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">visits Indian</text>
  <text x="195" y="114" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">army. Gets</text>
  <text x="195" y="142" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">"briefed."</text>
  <text x="195" y="170" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">On Op Sindoor.</text>

