  <text x="195" y="706" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">is a fiction</text>
  <text x="195" y="734" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">two countries</text>
  <text x="195" y="762" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">agree to call</text>
  <text x="195" y="790" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">a fact.</text>

