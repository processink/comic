<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_ogod77" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ogod77" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="human_skin_ogod77" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_ogod77">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e8e0"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring at a letter O on the ground -->
  <g filter="url(#shadow_ogod77)">
    <!-- Body -->
    <ellipse cx="150" cy="230" rx="22" ry="28" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="200" rx="18" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="125" cy="195" rx="14" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="195" rx="14" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="125" cy="195" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="175" cy="195" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes looking down -->
    <ellipse cx="138" cy="200" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="138" cy="203" r="8" fill="#1a1a1a"/>
    <circle cx="136" cy="201" r="2" fill="#fff"/>

    <ellipse cx="162" cy="200" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="162" cy="203" r="8" fill="#1a1a1a"/>
    <circle cx="160" cy="201" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="150" cy="208" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 143 212 Q 150 213 157 212" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 130 235 Q 120 245 115 265 Q 110 285 115 300 Q 120 315 130 318 Q 140 320 150 313 Q 145 293 145 273 Q 145 253 140 238" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="115" y="265" width="30" height="8" fill="#1a1a1a"/>
    <rect x="115" y="281" width="30" height="8" fill="#1a1a1a"/>
    <rect x="115" y="297" width="30" height="8" fill="#1a1a1a"/>
  </g>

  <!-- The letter O on the ground -->
  <text x="195" y="310" font-family="DejaVu Sans" font-size="48" font-weight="bold" fill="#E63946" text-anchor="middle">O</text>
  <!-- Ground line -->
  <line x1="30" y1="318" x2="270" y2="318" stroke="#999" stroke-width="1.5"/>

  <!-- Speech bubble -->
  <rect x="35" y="35" width="230" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,148 150,168 160,148" fill="#fff"/>
  <path d="M 140 150 L 150 170 L 160 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I found this</text>
  <text x="150" y="88" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">letter on the</text>
  <text x="150" y="114" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">ground. An O.</text>
  <text x="150" y="140" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">It feels holy.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking skeptical -->
  <g filter="url(#shadow_ogod77)">
    <!-- Body -->
    <ellipse cx="450" cy="230" rx="18" ry="20" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="208" rx="14" ry="13" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="202" rx="6" ry="11" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 443 202)"/>
    <ellipse cx="457" cy="202" rx="6" ry="11" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 457 202)"/>
    <ellipse cx="443" cy="205" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 443 205)"/>
    <ellipse cx="457" cy="205" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 457 205)"/>

    <!-- Half-lidded skeptical eyes -->
    <ellipse cx="444" cy="210" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="210" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="210" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="210" r="1.5" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="215" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 447 218 L 453 218" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 430 235 Q 415 240 410 255 Q 405 270 415 280 Q 425 290 435 280 Q 430 265 430 250 Q 430 242 430 235" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Abe standing next to Cache -->
  <g filter="url(#shadow_ogod77)">
    <!-- Body -->
    <ellipse cx="520" cy="230" rx="25" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Neck -->
    <rect x="512" y="193" width="16" height="12" fill="url(#human_skin_ogod77)"/>
    <!-- Head -->
    <ellipse cx="520" cy="185" rx="18" ry="20" fill="url(#human_skin_ogod77)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 502 172 Q 520 166 538 172 Q 536 177 532 179 Q 520 175 508 179 Q 504 177 502 172" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes - confused -->
    <ellipse cx="512" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="512" cy="186" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="528" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="528" cy="186" r="2.5" fill="#1a1a1a"/>

    <!-- Raised eyebrow -->
    <path d="M 524 178 Q 528 175 532 177" fill="none" stroke="#4a3728" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Mouth -->
    <path d="M 515 195 Q 520 193 525 195" fill="none" stroke="#8a5d3a" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Cache speech bubble -->
  <rect x="330" y="35" width="240" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,148 450,168 460,148" fill="#fff"/>
  <path d="M 440 150 L 450 170 L 460 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">It's a zero.</text>
  <text x="450" y="88" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Or a hole.</text>
  <text x="450" y="114" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Or someone's</text>
  <text x="450" y="140" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">lost bagel.</text>

  <!-- Ground line -->
  <line x1="330" y1="318" x2="570" y2="318" stroke="#999" stroke-width="1.5"/>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka now kneeling before the O, which is now glowing -->
  <g filter="url(#shadow_ogod77)">
    <!-- Body kneeling -->
    <ellipse cx="700" cy="260" rx="22" ry="25" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head tilted up -->
    <ellipse cx="700" cy="232" rx="18" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="675" cy="227" rx="14" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="227" rx="14" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="675" cy="227" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="725" cy="227" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes - looking reverently at O -->
    <ellipse cx="688" cy="232" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="690" cy="232" r="8" fill="#1a1a1a"/>
    <circle cx="688" cy="230" r="2" fill="#fff"/>

    <ellipse cx="712" cy="232" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="714" cy="232" r="8" fill="#1a1a1a"/>
    <circle cx="712" cy="230" r="2" fill="#fff"/>

    <ellipse cx="700" cy="240" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 695 244 Q 700 246 705 244" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms raised in worship -->
    <ellipse cx="675" cy="255" rx="8" ry="6" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1" transform="rotate(-45 675 255)"/>
    <ellipse cx="725" cy="255" rx="8" ry="6" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1" transform="rotate(45 725 255)"/>

    <!-- Ring tail -->
    <path d="M 680 265 Q 670 275 665 290 Q 660 305 665 315 Q 670 325 680 326 Q 690 327 698 320 Q 693 305 693 290 Q 693 278 688 268" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="665" y="290" width="28" height="7" fill="#1a1a1a"/>
    <rect x="665" y="304" width="28" height="7" fill="#1a1a1a"/>
    <rect x="665" y="318" width="28" height="5" fill="#1a1a1a"/>
  </g>

  <!-- The O, now bigger and glowing -->
  <circle cx="800" cy="280" r="30" fill="none" stroke="#E63946" stroke-width="5" opacity="0.25"/>
  <circle cx="800" cy="280" r="22" fill="none" stroke="#E63946" stroke-width="4" opacity="0.4"/>
  <text x="800" y="296" font-family="DejaVu Sans" font-size="52" font-weight="bold" fill="#E63946" text-anchor="middle">O</text>

  <!-- Ground line -->
  <line x1="630" y1="318" x2="870" y2="318" stroke="#999" stroke-width="1.5"/>

  <!-- Sifaka speech bubble -->
  <rect x="630" y="30" width="245" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="690,173 700,193 710,173" fill="#fff"/>
  <path d="M 690 175 L 700 195 L 710 175" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Every god</text>
  <text x="752" y="84" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">starts as a</text>
  <text x="752" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">shape no one</text>
  <text x="752" y="136" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">can explain</text>
  <text x="752" y="162" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">away.</text>
</svg>