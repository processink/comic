<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_sa42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_sa42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_sa42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_sa42">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe at desk reading newspaper -->
  <g filter="url(#shadow_sa42)">
    <!-- Desk -->
    <rect x="60" y="255" width="180" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
    <rect x="70" y="263" width="8" height="50" fill="#8b7355"/>
    <rect x="222" y="263" width="8" height="50" fill="#8b7355"/>

    <!-- Abe body -->
    <rect x="122" y="200" width="56" height="55" rx="3" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.3"/>

    <!-- Neck -->
    <rect x="141" y="190" width="18" height="14" fill="url(#hum_skin_sa42)"/>

    <!-- Head -->
    <circle cx="150" cy="170" r="22" fill="url(#hum_skin_sa42)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 128 160 Q 140 148 150 146 Q 160 148 172 160 Q 170 155 165 152 Q 150 145 135 152 Q 130 155 128 160" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes - skeptical -->
    <ellipse cx="141" cy="170" rx="3.5" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="171" r="2" fill="#2a2a2a"/>
    <ellipse cx="159" cy="170" rx="3.5" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="160" cy="171" r="2" fill="#2a2a2a"/>

    <!-- Raised eyebrow -->
    <path d="M 155 163 Q 159 160 163 163" fill="none" stroke="#4a3728" stroke-width="1.5"/>
    <path d="M 137 165 Q 141 163 145 165" fill="none" stroke="#4a3728" stroke-width="1.3"/>

    <!-- Nose -->
    <path d="M 150 174 L 150 178" stroke="#a8896d" stroke-width="1"/>

    <!-- Mouth - flat -->
    <path d="M 144 183 L 156 183" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Newspaper -->
    <rect x="108" y="225" width="84" height="30" fill="#f5f0e0" stroke="#999" stroke-width="1"/>
    <text x="150" y="237" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#333" font-weight="bold">DAILY HERALD</text>
    <text x="150" y="245" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#555">AI NOW DRAWS</text>
    <text x="150" y="251" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#555">COMIC STRIPS</text>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="35" width="230" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,138 150,155 160,138" fill="#fff"/>
  <line x1="140" y1="140" x2="150" y2="157" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="157" x2="160" y2="140" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">They trained</text>
  <text x="150" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">an AI to draw</text>
  <text x="150" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">comic strips.</text>
  <text x="150" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Like Dilbert.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on desk next to Abe -->
  <g filter="url(#shadow_sa42)">
    <!-- Cache body -->
    <ellipse cx="450" cy="225" rx="18" ry="20" fill="url(#sq_fur_sa42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Cache head -->
    <ellipse cx="450" cy="203" rx="14" ry="13" fill="url(#sq_fur_sa42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="197" rx="6" ry="11" fill="url(#sq_fur_sa42)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 443 197)"/>
    <ellipse cx="457" cy="197" rx="6" ry="11" fill="url(#sq_fur_sa42)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 457 197)"/>
    <ellipse cx="443" cy="200" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 443 200)"/>
    <ellipse cx="457" cy="200" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 457 200)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="444" cy="205" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="205" r="2" fill="#1a1a1a"/>
    <ellipse cx="456" cy="205" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="205" r="2" fill="#1a1a1a"/>

    <!-- Eyelid lines for unimpressed look -->
    <line x1="440" y1="203" x2="448" y2="203" stroke="#5d4a2f" stroke-width="1"/>
    <line x1="452" y1="203" x2="460" y2="203" stroke="#5d4a2f" stroke-width="1"/>

    <!-- Nose -->
    <ellipse cx="450" cy="210" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Mouth - deadpan -->
    <path d="M 446 213 L 454 213" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 430 230 Q 415 235 410 250 Q 405 265 415 275 Q 425 285 435 275 Q 430 260 430 245 Q 430 237 430 230" fill="url(#sq_fur_sa42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Desk surface -->
    <rect x="360" y="245" width="180" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
  </g>

  <!-- Sifaka peeking from bottom right -->
  <g filter="url(#shadow_sa42)">
    <ellipse cx="530" cy="290" rx="18" ry="16" fill="url(#lem_fur_sa42)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="515" cy="280" rx="10" ry="12" fill="url(#lem_fur_sa42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="545" cy="280" rx="10" ry="12" fill="url(#lem_fur_sa42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="515" cy="280" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="545" cy="280" rx="6" ry="8" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="522" cy="288" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="522" cy="289" r="7" fill="#1a1a1a"/>
    <circle cx="520" cy="287" r="2" fill="#fff"/>

    <ellipse cx="538" cy="288" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="538" cy="289" r="7" fill="#1a1a1a"/>
    <circle cx="536" cy="287" r="2" fill="#fff"/>

    <ellipse cx="530" cy="296" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Ring tail visible -->
    <path d="M 548 292 Q 558 300 565 315 Q 568 325 572 335" fill="none" stroke="url(#lem_fur_sa42)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 548 292 Q 558 300 565 315 Q 568 325 572 335" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-dasharray="8,8"/>
  </g>

  <!-- Speech bubble Panel 2 - Cache -->
  <rect x="335" y="35" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,163 450,180 460,163" fill="#fff"/>
  <line x1="440" y1="165" x2="450" y2="182" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="182" x2="460" y2="165" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So they</text>
  <text x="450" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">replaced the</text>
  <text x="450" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">guy who got</text>
  <text x="450" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">replaced by</text>
  <text x="450" y="158" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">his opinions.</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe staring at reader, coffee mug -->
  <g filter="url(#shadow_sa42)">
    <!-- Coffee mug on desk -->
    <rect x="680" y="248" width="20" height="18" rx="2" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="700" y="252" width="8" height="10" rx="4" fill="none" stroke="#999" stroke-width="1.2"/>
    <ellipse cx="690" cy="252" rx="8" ry="3" fill="#6b3a1f"/>

    <!-- Desk -->
    <rect x="660" y="265" width="180" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>

    <!-- Abe body -->
    <rect x="722" y="210" width="56" height="55" rx="3" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.3"/>

    <!-- Neck -->
    <rect x="741" y="200" width="18" height="14" fill="url(#hum_skin_sa42)"/>

    <!-- Head -->
    <circle cx="750" cy="180" r="22" fill="url(#hum_skin_sa42)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 728 170 Q 740 158 750 156 Q 760 158 772 170 Q 770 165 765 162 Q 750 155 735 162 Q 730 165 728 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes - thousand yard stare -->
    <ellipse cx="741" cy="180" rx="4" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="741" cy="180" r="2" fill="#2a2a2a"/>
    <ellipse cx="759" cy="180" rx="4" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="759" cy="180" r="2" fill="#2a2a2a"/>

    <!-- Eyebrows flat -->
    <line x1="737" y1="173" x2="745" y2="174" stroke="#4a3728" stroke-width="1.5"/>
    <line x1="755" y1="174" x2="763" y2="173" stroke="#4a3728" stroke-width="1.5"/>

    <!-- Nose -->
    <path d="M 750 184 L 750 188" stroke="#a8896d" stroke-width="1"/>

    <!-- Mouth - slight frown -->
    <path d="M 744 194 Q 750 192 756 194" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="635" y="35" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,153 750,170 760,153" fill="#fff"/>
  <line x1="740" y1="155" x2="750" y2="172" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="172" x2="760" y2="155" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The AI draws</text>
  <text x="750" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">better but it</text>
  <text x="750" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">doesn't know</text>
  <text x="750" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">it's in a cubicle.</text>

  <!-- Tiny "process.ink" watermark -->
  <text x="860" y="338" font-family="DejaVu Sans" font-size="8" text-anchor="end" fill="#bbb">process.ink</text>
</svg>