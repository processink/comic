<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_ent72" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ent72" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_ent72" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e8e0"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe scrolling phone -->
  <g>
    <ellipse cx="150" cy="230" rx="30" ry="38" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <ellipse cx="150" cy="182" rx="22" ry="25" fill="url(#hum_skin_ent72)" stroke="#c8a882" stroke-width="1.3"/>
    <path d="M 128 167 Q 150 158 172 167 Q 170 172 166 174 Q 150 168 134 174 Q 130 172 128 167" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <ellipse cx="141" cy="183" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="184" r="2.2" fill="#2a2a2a"/>
    <ellipse cx="159" cy="183" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="160" cy="184" r="2.2" fill="#2a2a2a"/>
    <path d="M 150 190 L 150 194" stroke="#a8896d" stroke-width="1"/>
    <path d="M 144 199 Q 150 201 156 199" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Phone -->
    <rect x="165" y="225" width="30" height="50" rx="3" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="167" y="228" width="26" height="42" fill="#4a86c7"/>
    <text x="180" y="245" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#fff">TRENDING</text>
    <text x="180" y="255" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">Movie #1</text>
    <text x="180" y="263" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">Song #2</text>
  </g>

  <!-- Speech bubble P1 -->
  <rect x="30" y="35" width="240" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,138 150,158 160,138" fill="#fff"/>
  <line x1="140" y1="140" x2="150" y2="160" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="160" x2="160" y2="140" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I only watch</text>
  <text x="150" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">what's trending.</text>
  <text x="150" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Saves time.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a ledge -->
  <g>
    <ellipse cx="450" cy="230" rx="18" ry="22" fill="url(#sq_fur_ent72)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="450" cy="206" rx="14" ry="14" fill="url(#sq_fur_ent72)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="440,192 437,174 445,190" fill="url(#sq_fur_ent72)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="460,192 463,174 455,190" fill="url(#sq_fur_ent72)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="441,191 439,178 444,190" fill="#cd853f"/>
    <polygon points="459,191 461,178 456,190" fill="#cd853f"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="444" cy="207" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="208" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="456" cy="207" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="208" r="1.8" fill="#1a1a1a"/>

    <ellipse cx="450" cy="212" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 446 215 Q 450 214 454 215" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 432 235 Q 418 240 412 258 Q 408 275 418 285 Q 428 292 435 282 Q 430 268 430 252 Q 430 243 432 235" fill="url(#sq_fur_ent72)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble P2 -->
  <rect x="335" y="35" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,163 450,183 460,163" fill="#fff"/>
  <line x1="440" y1="165" x2="450" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="185" x2="460" y2="165" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So you skip</text>
  <text x="450" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">discovering</text>
  <text x="450" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">what you like</text>
  <text x="450" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">to save time?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes, staring -->
  <g>
    <ellipse cx="750" cy="235" rx="22" ry="28" fill="url(#lem_fur_ent72)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="750" cy="205" rx="18" ry="16" fill="url(#lem_fur_ent72)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Round ears -->
    <ellipse cx="726" cy="200" rx="13" ry="15" fill="url(#lem_fur_ent72)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="774" cy="200" rx="13" ry="15" fill="url(#lem_fur_ent72)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="726" cy="200" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="774" cy="200" rx="7" ry="9" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="739" cy="205" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="739" cy="206" r="9" fill="#1a1a1a"/>
    <circle cx="737" cy="203" r="2.5" fill="#fff"/>
    <ellipse cx="761" cy="205" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="761" cy="206" r="9" fill="#1a1a1a"/>
    <circle cx="759" cy="203" r="2.5" fill="#fff"/>

    <ellipse cx="750" cy="215" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 744 219 Q 750 220 756 219" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 730 240 Q 720 255 715 275 Q 712 290 718 305 Q 725 315 735 310 Q 730 295 730 275 Q 730 258 730 240" fill="url(#lem_fur_ent72)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="715" y="260" width="18" height="7" fill="#1a1a1a"/>
    <rect x="715" y="275" width="18" height="7" fill="#1a1a1a"/>
    <rect x="716" y="290" width="17" height="7" fill="#1a1a1a"/>
    <rect x="718" y="303" width="14" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble P3 -->
  <rect x="635" y="35" width="245" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,183 760,163" fill="#fff"/>
  <line x1="740" y1="165" x2="750" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="185" x2="760" y2="165" stroke="#333" stroke-width="2"/>

  <text x="757" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Time for what,</text>
  <text x="757" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">though? Watching</text>
  <text x="757" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">what everyone</text>
  <text x="757" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">else picked?</text>

  <!-- Tiny credit -->
  <text x="880" y="348" font-family="DejaVu Sans" font-size="8" text-anchor="end" fill="#999">process.ink</text>
</svg>