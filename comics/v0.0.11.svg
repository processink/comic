<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_orig29" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_orig29" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e8e0"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting -->
  <g>
    <!-- Body -->
    <ellipse cx="150" cy="240" rx="18" ry="22" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="216" rx="14" ry="14" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="140,202 137,182 145,200" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="160,202 163,182 155,200" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="141,201 139,186 144,200" fill="#cd853f"/>
    <polygon points="159,201 161,186 156,200" fill="#cd853f"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="144" cy="217" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="144" cy="218" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="156" cy="217" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="156" cy="218" r="1.8" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <ellipse cx="150" cy="222" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 146 225 Q 150 224 154 225" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 132 245 Q 118 250 112 268 Q 108 285 118 295 Q 128 302 135 292 Q 130 278 130 262 Q 130 253 132 245" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Phone in paw -->
    <rect x="158" cy="235" y="232" width="14" height="22" rx="2" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="160" y="234" width="10" height="16" fill="#4a86c7"/>
  </g>

  <!-- Speech bubble P1 -->
  <rect x="30" y="35" width="240" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,163 150,183 160,163" fill="#fff"/>
  <line x1="140" y1="165" x2="150" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="185" x2="160" y2="165" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">A 14-year-old</text>
  <text x="150" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">folded paper</text>
  <text x="150" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">that holds ten</text>
  <text x="150" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">thousand times</text>
  <text x="150" y="157" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">its own weight.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting, enormous eyes wide -->
  <g>
    <!-- Body -->
    <ellipse cx="450" cy="240" rx="22" ry="28" fill="url(#lem_fur_orig29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="210" rx="18" ry="16" fill="url(#lem_fur_orig29)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized round ears -->
    <ellipse cx="425" cy="205" rx="14" ry="16" fill="url(#lem_fur_orig29)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="205" rx="14" ry="16" fill="url(#lem_fur_orig29)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="438" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="438" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="436" cy="208" r="2" fill="#fff"/>

    <ellipse cx="462" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="462" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="460" cy="208" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 443 224 Q 450 225 457 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 430 250 Q 420 260 415 280 Q 412 295 418 310 Q 425 320 435 315 Q 430 295 430 275 Q 430 260 430 250" fill="url(#lem_fur_orig29)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="415" y="275" width="18" height="6" fill="#1a1a1a"/>
    <rect x="414" y="287" width="18" height="6" fill="#1a1a1a"/>
    <rect x="416" y="299" width="16" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble P2 -->
  <rect x="335" y="35" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,163 450,183 460,163" fill="#fff"/>
  <line x1="440" y1="165" x2="450" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="185" x2="460" y2="165" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So the shape</text>
  <text x="450" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">was always</text>
  <text x="450" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">strong? It just</text>
  <text x="450" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">needed someone</text>
  <text x="450" y="157" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">to fold it?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking down at own paws, quiet moment -->
  <g>
    <!-- Body -->
    <ellipse cx="750" cy="250" rx="18" ry="22" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head tilted slightly down -->
    <ellipse cx="750" cy="226" rx="14" ry="14" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="740,212 737,192 745,210" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="760,212 763,192 755,210" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="741,211 739,196 744,210" fill="#cd853f"/>
    <polygon points="759,211 761,196 756,210" fill="#cd853f"/>

    <!-- Eyes looking down, contemplative -->
    <ellipse cx="744" cy="228" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="744" cy="229" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="756" cy="228" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="756" cy="229" r="1.5" fill="#1a1a1a"/>

    <!-- Nose and flat mouth -->
    <ellipse cx="750" cy="233" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 746 236 L 754 236" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail drooped slightly -->
    <path d="M 732 255 Q 718 260 712 278 Q 708 295 718 305 Q 728 312 735 302 Q 730 288 730 272 Q 730 263 732 255" fill="url(#sq_fur_orig29)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Small crumpled paper near feet -->
    <polygon points="760,275 768,270 772,278 765,282 758,280" fill="#f5f5f0" stroke="#aaa" stroke-width="0.8"/>
    <line x1="762" y1="274" x2="766" y2="279" stroke="#ccc" stroke-width="0.5"/>
  </g>

  <!-- Speech bubble P3 -->
  <rect x="640" y="35" width="225" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,183 760,163" fill="#fff"/>
  <line x1="740" y1="165" x2="750" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="185" x2="760" y2="165" stroke="#333" stroke-width="2"/>

  <text x="752" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Most of us</text>
  <text x="752" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">are just flat</text>
  <text x="752" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">paper waiting</text>
  <text x="752" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">for the right</text>
  <text x="752" y="157" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">crease.</text>

</svg>