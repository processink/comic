<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_clm47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_clm47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_clm47">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache burying acorns frantically -->
  <g filter="url(#shadow_clm47)">
    <!-- Body -->
    <ellipse cx="155" cy="235" rx="18" ry="20" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="155" cy="213" rx="14" ry="13" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="148" cy="207" rx="6" ry="11" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 148 207)"/>
    <ellipse cx="162" cy="207" rx="6" ry="11" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 162 207)"/>
    <ellipse cx="148" cy="210" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 148 210)"/>
    <ellipse cx="162" cy="210" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 162 210)"/>

    <!-- Wide stressed eyes -->
    <ellipse cx="149" cy="215" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="149" cy="216" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="161" cy="215" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="161" cy="216" r="2.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="155" cy="221" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth - simple tense line -->
    <path d="M 151 225 L 159 225" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms digging -->
    <ellipse cx="138" cy="238" rx="8" ry="6" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1" transform="rotate(-50 138 238)"/>
    <ellipse cx="172" cy="238" rx="8" ry="6" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1" transform="rotate(50 172 238)"/>

    <!-- Fluffy tail -->
    <path d="M 135 240 Q 120 245 115 260 Q 110 275 120 285 Q 130 295 140 285 Q 135 270 135 255 Q 135 248 135 240" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Dirt mound -->
  <ellipse cx="155" cy="270" rx="35" ry="12" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
  <!-- Dirt flying -->
  <circle cx="130" cy="255" r="3" fill="#8b7355"/>
  <circle cx="175" cy="250" r="2.5" fill="#8b7355"/>
  <circle cx="125" cy="248" r="2" fill="#8b7355"/>
  <circle cx="180" cy="258" r="2" fill="#8b7355"/>

  <!-- Tiny acorns scattered -->
  <ellipse cx="100" cy="275" rx="4" ry="5" fill="#8b6f47" stroke="#5d4a2f" stroke-width="0.8"/>
  <ellipse cx="200" cy="280" rx="4" ry="5" fill="#8b6f47" stroke="#5d4a2f" stroke-width="0.8"/>
  <ellipse cx="170" cy="285" rx="4" ry="5" fill="#8b6f47" stroke="#5d4a2f" stroke-width="0.8"/>

  <!-- Ground line -->
  <line x1="25" y1="290" x2="275" y2="290" stroke="#6b5335" stroke-width="1.5"/>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="35" width="225" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,163 155,183 165,163" fill="#fff"/>
  <path d="M 145 165 L 155 185 L 165 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="147" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Read that the</text>
  <text x="147" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">jet stream is</text>
  <text x="147" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">destabilizing.</text>
  <text x="147" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Burying faster.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka watching from a small dead tree -->
  <g filter="url(#shadow_clm47)">
    <!-- Dead tree stump -->
    <rect x="435" y="230" width="18" height="65" fill="#7a6b55" stroke="#5a4b35" stroke-width="1.2"/>
    <path d="M 430 230 Q 444 220 458 230" fill="#6a5b45" stroke="#5a4b35" stroke-width="1"/>
    <!-- Dead branch -->
    <path d="M 453 250 Q 470 240 480 235" fill="none" stroke="#7a6b55" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Sifaka body sitting on stump -->
    <ellipse cx="444" cy="215" rx="22" ry="26" fill="url(#lem_fur_clm47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="444" cy="185" rx="18" ry="16" fill="url(#lem_fur_clm47)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized round ears -->
    <ellipse cx="420" cy="180" rx="14" ry="16" fill="url(#lem_fur_clm47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="468" cy="180" rx="14" ry="16" fill="url(#lem_fur_clm47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="420" cy="180" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="468" cy="180" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="432" cy="185" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="432" cy="186" r="8" fill="#1a1a1a"/>
    <circle cx="430" cy="184" r="2" fill="#fff"/>

    <ellipse cx="456" cy="185" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="456" cy="186" r="8" fill="#1a1a1a"/>
    <circle cx="454" cy="184" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="444" cy="194" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 438 198 Q 444 200 450 198" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes hanging down -->
    <path d="M 425 220 Q 415 235 410 255 Q 405 275 410 290 Q 415 300 425 295 Q 420 280 420 265 Q 420 245 425 230" fill="url(#lem_fur_clm47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Tail stripes -->
    <rect x="408" y="255" width="16" height="6" fill="#1a1a1a" transform="rotate(-5 416 258)"/>
    <rect x="408" y="268" width="16" height="6" fill="#1a1a1a" transform="rotate(-3 416 271)"/>
    <rect x="410" y="281" width="16" height="6" fill="#1a1a1a" transform="rotate(2 418 284)"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="330" y="35" width="240" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="435,138 445,158 455,138" fill="#fff"/>
  <path d="M 435 140 L 445 160 L 455 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Isn't burying</text>
  <text x="450" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">things what you</text>
  <text x="450" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">do anyway?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache stopped, standing still, staring -->
  <g filter="url(#shadow_clm47)">
    <!-- Body -->
    <ellipse cx="750" cy="235" rx="18" ry="20" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="213" rx="14" ry="13" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="743" cy="207" rx="6" ry="11" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 743 207)"/>
    <ellipse cx="757" cy="207" rx="6" ry="11" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 757 207)"/>
    <ellipse cx="743" cy="210" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 743 210)"/>
    <ellipse cx="757" cy="210" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 757 210)"/>

    <!-- Half-lidded existential eyes -->
    <ellipse cx="744" cy="215" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="744" cy="215" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="756" cy="215" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="756" cy="215" r="1.8" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="750" cy="221" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth - flat -->
    <path d="M 746 225 L 754 225" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms limp at sides -->
    <ellipse cx="735" cy="240" rx="7" ry="5" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1"/>
    <ellipse cx="765" cy="240" rx="7" ry="5" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1"/>

    <!-- Fluffy tail drooped -->
    <path d="M 730 240 Q 720 250 718 265 Q 716 280 722 290 Q 728 298 735 290 Q 730 275 730 260 Q 730 250 730 240" fill="url(#sq_fur_clm47)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Single acorn held loosely -->
    <ellipse cx="765" cy="248" rx="4" ry="5" fill="#8b6f47" stroke="#5d4a2f" stroke-width="0.8"/>
  </g>

  <!-- Ground line -->
  <line x1="625" y1="270" x2="875" y2="270" stroke="#6b5335" stroke-width="1.5"/>

  <!-- Speech bubble panel 3 -->
  <rect x="630" y="35" width="240" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,183 760,163" fill="#fff"/>
  <path d="M 740 165 L 750 185 L 760 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Yeah. Turns out</text>
  <text x="750" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">anxiety and</text>
  <text x="750" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">instinct feel</text>
  <text x="750" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">exactly the same.</text>

  <!-- Tiny accent: red thermometer icon in panel 3 corner -->
  <rect x="860" y="300" width="4" height="20" fill="#E63946" stroke="#333" stroke-width="0.5"/>
  <circle cx="862" cy="325" r="5" fill="#E63946" stroke="#333" stroke-width="0.5"/>
</svg>