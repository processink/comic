<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_auth83" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_auth83" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_auth83" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_auth83">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding a sign that says "BE REAL" -->
  <g filter="url(#shadow_auth83)">
    <!-- Body -->
    <ellipse cx="150" cy="240" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="190" rx="20" ry="23" fill="url(#hum_skin_auth83)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 175 Q 150 168 170 175 Q 168 180 164 182 Q 150 178 136 182 Q 132 180 130 175" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes earnest -->
    <ellipse cx="142" cy="190" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="190" r="2" fill="#2a2a2a"/>
    <ellipse cx="158" cy="190" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="190" r="2" fill="#2a2a2a"/>
    <!-- Nose and sincere smile -->
    <path d="M 150 195 L 150 198" stroke="#a8896d" stroke-width="1"/>
    <path d="M 144 203 Q 150 207 156 203" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Sign held up -->
    <rect x="100" y="258" width="100" height="50" fill="#f5f0e8" stroke="#8b7355" stroke-width="2"/>
    <text x="150" y="280" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#E63946">BE REAL</text>
    <text x="150" y="298" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#8b7355">™ authentic living</text>
    <!-- Stick -->
    <rect x="148" y="308" width="4" height="30" fill="#8b7355"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="35" width="230" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,148 150,168 160,148" fill="#fff"/>
  <line x1="140" y1="150" x2="150" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="170" x2="160" y2="150" stroke="#333" stroke-width="2"/>

  <text x="150" y="60" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I've decided</text>
  <text x="150" y="84" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">to just be my</text>
  <text x="150" y="108" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">authentic</text>
  <text x="150" y="132" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">self now.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache and Sifaka watching -->
  <!-- Cache -->
  <g filter="url(#shadow_auth83)">
    <ellipse cx="400" cy="240" rx="18" ry="22" fill="url(#sq_fur_auth83)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="400" cy="208" rx="14" ry="13" fill="url(#sq_fur_auth83)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="388,195 392,170 396,197" fill="url(#sq_fur_auth83)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="404,197 408,170 412,195" fill="url(#sq_fur_auth83)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="390,195 392,176 394,196" fill="#cd853f"/>
    <polygon points="406,196 408,176 410,195" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="394" cy="210" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="395" cy="210" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="406" cy="210" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="407" cy="210" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="400" cy="215" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 396 218 Q 400 217 404 218" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 382 240 Q 368 245 363 260 Q 358 275 368 285 Q 378 292 386 282 Q 380 268 380 254 Q 380 246 382 240" fill="url(#sq_fur_auth83)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka -->
  <g filter="url(#shadow_auth83)">
    <ellipse cx="500" cy="240" rx="22" ry="28" fill="url(#lem_fur_auth83)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="500" cy="210" rx="18" ry="16" fill="url(#lem_fur_auth83)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized ears -->
    <ellipse cx="477" cy="205" rx="13" ry="15" fill="url(#lem_fur_auth83)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="523" cy="205" rx="13" ry="15" fill="url(#lem_fur_auth83)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="477" cy="205" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="523" cy="205" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="489" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="489" cy="211" r="8" fill="#1a1a1a"/>
    <circle cx="487" cy="209" r="2" fill="#fff"/>
    <ellipse cx="511" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="511" cy="211" r="8" fill="#1a1a1a"/>
    <circle cx="509" cy="209" r="2" fill="#fff"/>
    <ellipse cx="500" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 494 224 Q 500 225 506 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 520 245 Q 530 255 535 275 Q 538 290 533 305 Q 528 315 520 310 Q 515 300 518 285 Q 520 270 522 255 Q 522 248 520 245" fill="url(#lem_fur_auth83)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="525" y="270" width="14" height="6" fill="#1a1a1a"/>
    <rect x="525" y="282" width="14" height="6" fill="#1a1a1a"/>
    <rect x="523" y="294" width="12" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Sifaka speech bubble -->
  <rect x="430" y="35" width="140" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="490,163 500,183 510,163" fill="#fff"/>
  <line x1="490" y1="165" x2="500" y2="185" stroke="#333" stroke-width="2"/>
  <line x1="500" y1="185" x2="510" y2="165" stroke="#333" stroke-width="2"/>

  <text x="500" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Which</text>
  <text x="500" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">self is</text>
  <text x="500" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">that, the</text>
  <text x="500" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">third one?</text>

  <!-- Cache speech bubble -->
  <rect x="335" y="105" width="100" height="70" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="390,173 400,193 410,173" fill="#fff"/>
  <line x1="390" y1="175" x2="400" y2="195" stroke="#333" stroke-width="2"/>
  <line x1="400" y1="195" x2="410" y2="175" stroke="#333" stroke-width="2"/>

  <text x="385" y="132" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Fourth.</text>
  <text x="385" y="156" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">At least.</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe now wearing a different outfit, holding a DIFFERENT sign that says "BE REAL" in different font, with a ring light behind him -->
  <g filter="url(#shadow_auth83)">
    <!-- Ring light circle -->
    <circle cx="750" cy="200" r="55" fill="none" stroke="#f0e6d6" stroke-width="8" opacity="0.5"/>
    <circle cx="750" cy="200" r="55" fill="none" stroke="#fff" stroke-width="3" opacity="0.8"/>

    <!-- Abe now in a beanie and flannel -->
    <!-- Body - flannel pattern -->
    <ellipse cx="750" cy="250" rx="28" ry="35" fill="#8b4513" stroke="#6b3410" stroke-width="1.3"/>
    <!-- Flannel lines -->
    <line x1="728" y1="230" x2="728" y2="280" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>
    <line x1="740" y1="225" x2="740" y2="285" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>
    <line x1="752" y1="225" x2="752" y2="285" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>
    <line x1="764" y1="225" x2="764" y2="285" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>

    <!-- Head -->
    <ellipse cx="750" cy="195" rx="20" ry="23" fill="url(#hum_skin_auth83)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Beanie -->
    <path d="M 728 185 Q 730 170 750 165 Q 770 170 772 185 L 728 185 Z" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1.2"/>
    <rect x="728" y="183" width="44" height="6" fill="#4a4a4a" stroke="#3a3a3a" stroke-width="0.8"/>

    <!-- Eyes looking at phone (taking selfie) -->
    <ellipse cx="742" cy="195" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="743" cy="195" r="2" fill="#2a2a2a"/>
    <ellipse cx="758" cy="195" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="759" cy="195" r="2" fill="#2a2a2a"/>
    <!-- Duck lips -->
    <ellipse cx="750" cy="206" rx="5" ry="3" fill="#d4a08a" stroke="#a8896d" stroke-width="0.8"/>

    <!-- Phone held up taking selfie -->
    <rect x="710" y="225" width="20" height="32" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="712" y="228" width="16" height="26" fill="#4a86c7"/>
    <!-- Tiny face on phone screen -->
    <circle cx="720" cy="238" r="4" fill="#f5d3b8"/>

    <!-- New sign leaning against him -->
    <rect x="765" y="268" width="80" height="40" fill="#f5f0e8" stroke="#8b7355" stroke-width="1.5" transform="rotate(12 805 288)"/>
    <text x="805" y="286" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle" fill="#E63946" transform="rotate(12 805 286)">NO FILTER</text>
    <text x="805" y="298" font-family="DejaVu Sans" font-size="8" text-anchor="middle" fill="#8b7355" transform="rotate(12 805 298)">#vulnerable</text>
  </g>

  <!-- Abe speech bubble -->
  <rect x="635" y="35" width="230" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,148 750,168 760,148" fill="#fff"/>
  <line x1="740" y1="150" x2="750" y2="170" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="170" x2="760" y2="150" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Okay but</text>
  <text x="750" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">first let me</text>
  <text x="750" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">photograph my</text>
  <text x="750" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">authenticity.</text>
</svg>