<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_bene73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_bene73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_bene73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <radialGradient id="egg_grad_bene73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#fff8e7"/>
      <stop offset="100%" style="stop-color:#f5e6c8"/>
    </radialGradient>
    <filter id="shadow_bene73">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe at brunch table -->
  <g filter="url(#shadow_bene73)">
    <!-- Table -->
    <rect x="120" y="240" width="180" height="6" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
    <rect x="140" y="246" width="8" height="55" fill="#7a6345"/>
    <rect x="272" y="246" width="8" height="55" fill="#7a6345"/>

    <!-- Plate -->
    <ellipse cx="210" cy="235" rx="45" ry="12" fill="#f0ece8" stroke="#c8c0b8" stroke-width="1.5"/>

    <!-- English muffin bottom -->
    <ellipse cx="210" cy="230" rx="25" ry="8" fill="#c8a060" stroke="#a08040" stroke-width="1"/>

    <!-- Ham/bacon -->
    <ellipse cx="210" cy="227" rx="20" ry="6" fill="#c87070" stroke="#a05050" stroke-width="0.8"/>

    <!-- Poached egg -->
    <ellipse cx="210" cy="223" rx="18" ry="9" fill="url(#egg_grad_bene73)" stroke="#e0d0b0" stroke-width="0.8"/>
    <ellipse cx="210" cy="222" rx="8" ry="5" fill="#f5c840" opacity="0.7"/>

    <!-- Hollandaise drip -->
    <path d="M 195 223 Q 192 228 194 232" fill="none" stroke="#e8c840" stroke-width="2" stroke-linecap="round"/>
    <path d="M 225 224 Q 228 229 226 233" fill="none" stroke="#e8c840" stroke-width="2" stroke-linecap="round"/>

    <!-- Abe body -->
    <ellipse cx="210" cy="200" rx="28" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Abe head -->
    <ellipse cx="210" cy="155" rx="20" ry="23" fill="url(#hum_skin_bene73)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 190 142 Q 210 135 230 142 Q 228 147 224 149 Q 210 145 196 149 Q 192 147 190 142" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes looking at plate -->
    <ellipse cx="202" cy="156" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="202" cy="158" r="2" fill="#2a2a2a"/>
    <ellipse cx="218" cy="156" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="218" cy="158" r="2" fill="#2a2a2a"/>

    <!-- Slight smile -->
    <path d="M 205 168 Q 210 171 215 168" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="30" y="25" width="200" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="100,123 110,143 120,123" fill="#fff"/>
  <line x1="100" y1="125" x2="110" y2="145" stroke="#333" stroke-width="2"/>
  <line x1="110" y1="145" x2="120" y2="125" stroke="#333" stroke-width="2"/>

  <text x="130" y="52" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Eggs benedict.</text>
  <text x="130" y="80" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">The perfect</text>
  <text x="130" y="108" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">brunch.</text>

  <!-- Panel 2 -->
  <rect x="10" y="330" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring at the plate -->
  <g filter="url(#shadow_bene73)">
    <!-- Body -->
    <ellipse cx="200" cy="560" rx="22" ry="28" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="530" rx="18" ry="16" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="175" cy="525" rx="14" ry="16" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="525" rx="14" ry="16" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="525" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="525" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="188" cy="530" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="530" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="528" r="2" fill="#fff"/>

    <ellipse cx="212" cy="530" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="530" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="528" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="200" cy="538" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 193 542 Q 200 543 207 542" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 180 565 Q 170 580 165 600 Q 162 620 170 635 Q 178 645 190 638 Q 185 620 185 600 Q 185 580 182 568" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="165" y="598" width="22" height="7" fill="#1a1a1a"/>
    <rect x="165" y="612" width="22" height="7" fill="#1a1a1a"/>
    <rect x="166" y="626" width="20" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="60" y="348" width="280" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,476 200,496 210,476" fill="#fff"/>
  <line x1="190" y1="478" x2="200" y2="498" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="498" x2="210" y2="478" stroke="#333" stroke-width="2"/>

  <text x="200" y="377" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Doesn't benedict</text>
  <text x="200" y="405" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">mean "blessed"?</text>
  <text x="200" y="437" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Who blessed it?</text>
  <text x="200" y="465" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Was it the egg?</text>

  <!-- Panel 3 -->
  <rect x="10" y="650" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache, no cigarette, half-lidded -->
  <g filter="url(#shadow_bene73)">
    <!-- Body -->
    <ellipse cx="200" cy="880" rx="18" ry="20" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="858" rx="14" ry="13" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="188,852 182,832 194,848" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="212,852 218,832 206,848" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="188,851 184,837 193,849" fill="#cd853f"/>
    <polygon points="212,851 216,837 207,849" fill="#cd853f"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="194" cy="860" rx="4" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="861" r="2" fill="#1a1a1a"/>
    <line x1="190" y1="858" x2="198" y2="858" stroke="#5d4a2f" stroke-width="2"/>

    <ellipse cx="206" cy="860" rx="4" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="861" r="2" fill="#1a1a1a"/>
    <line x1="202" y1="858" x2="210" y2="858" stroke="#5d4a2f" stroke-width="2"/>

    <!-- Nose -->
    <ellipse cx="200" cy="865" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Flat mouth -->
    <line x1="195" y1="869" x2="205" y2="869" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 180 885 Q 165 890 160 905 Q 155 920 165 930 Q 175 938 185 930 Q 180 915 180 900 Q 180 892 180 885" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="55" y="665" width="290" height="155" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,818 200,838 210,818" fill="#fff"/>
  <line x1="190" y1="820" x2="200" y2="840" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="840" x2="210" y2="820" stroke="#333" stroke-width="2"/>

  <text x="200" y="695" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">It also means</text>
  <text x="200" y="723" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">"traitor."</text>
  <text x="200" y="755" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Every blessing</text>
  <text x="200" y="783" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">is one yolk away</text>
  <text x="200" y="811" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">from betrayal.</text>
</svg>