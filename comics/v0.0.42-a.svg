<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_clim83" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_clim83" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_clim83" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_clim83">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e4dc"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe standing, looking at phone -->
  <g filter="url(#shadow_clim83)">
    <!-- Body -->
    <rect x="128" y="210" width="44" height="55" rx="4" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.2"/>
    <!-- Neck -->
    <rect x="142" y="198" width="16" height="14" fill="url(#hum_skin_clim83)"/>
    <!-- Head -->
    <ellipse cx="150" cy="180" rx="22" ry="24" fill="url(#hum_skin_clim83)" stroke="#c8a882" stroke-width="1.2"/>
    <!-- Hair -->
    <path d="M 128 168 Q 138 152 150 150 Q 162 152 172 168 Q 170 172 166 174 Q 150 168 134 174 Q 130 172 128 168" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes looking down at phone -->
    <ellipse cx="141" cy="180" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="141" cy="183" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="159" cy="180" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="159" cy="183" r="2.5" fill="#1a1a1a"/>
    <!-- Worried mouth -->
    <path d="M 143 194 Q 150 190 157 194" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Eyebrows worried -->
    <path d="M 136 173 Q 141 170 146 173" fill="none" stroke="#4a3728" stroke-width="1.2"/>
    <path d="M 154 173 Q 159 170 164 173" fill="none" stroke="#4a3728" stroke-width="1.2"/>
    <!-- Arms holding phone -->
    <rect x="118" y="225" width="22" height="10" rx="5" fill="url(#hum_skin_clim83)" stroke="#c8a882" stroke-width="1" transform="rotate(-25 129 230)"/>
    <rect x="160" y="225" width="22" height="10" rx="5" fill="url(#hum_skin_clim83)" stroke="#c8a882" stroke-width="1" transform="rotate(25 171 230)"/>
    <!-- Phone -->
    <rect x="134" y="232" width="32" height="48" rx="3" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="137" y="236" width="26" height="38" fill="#fff"/>
    <!-- Red headline on phone -->
    <rect x="139" y="238" width="22" height="4" fill="#E63946"/>
    <rect x="139" y="244" width="18" height="3" fill="#666"/>
    <rect x="139" y="249" width="20" height="3" fill="#666"/>
    <rect x="139" y="254" width="16" height="3" fill="#666"/>
    <!-- Red temp graph -->
    <path d="M 141 268 L 147 265 L 153 260 L 159 252" fill="none" stroke="#E63946" stroke-width="1.5"/>
    <!-- Legs -->
    <rect x="134" y="265" width="14" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <rect x="152" y="265" width="14" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <!-- Shoes -->
    <rect x="131" y="293" width="18" height="8" rx="3" fill="#3a2a1a"/>
    <rect x="150" y="293" width="18" height="8" rx="3" fill="#3a2a1a"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="30" y="30" width="240" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,133 150,148 160,133" fill="#fff"/>
  <path d="M 140 135 L 150 150 L 160 135" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I read every</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">climate report.</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Every single one.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting, enormous eyes staring -->
  <g filter="url(#shadow_clim83)">
    <!-- Body -->
    <ellipse cx="450" cy="245" rx="22" ry="28" fill="url(#lem_fur_clim83)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="210" rx="18" ry="17" fill="url(#lem_fur_clim83)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Face patch -->
    <ellipse cx="450" cy="213" rx="13" ry="12" fill="#f0f0f0"/>
    <!-- Ears -->
    <ellipse cx="426" cy="203" rx="13" ry="15" fill="url(#lem_fur_clim83)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="474" cy="203" rx="13" ry="15" fill="url(#lem_fur_clim83)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="426" cy="203" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="474" cy="203" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="440" cy="210" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="440" cy="211" r="9" fill="#1a1a1a"/>
    <circle cx="438" cy="208" r="2.5" fill="#fff"/>
    <ellipse cx="460" cy="210" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="460" cy="211" r="9" fill="#1a1a1a"/>
    <circle cx="458" cy="208" r="2.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="450" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 444 224 Q 450 225 456 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 430 250 Q 418 260 412 280 Q 408 300 415 315 Q 422 325 430 320 Q 425 300 425 280 Q 425 265 430 255" fill="url(#lem_fur_clim83)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="410" y="280" width="18" height="7" fill="#1a1a1a"/>
    <rect x="410" y="293" width="18" height="7" fill="#1a1a1a"/>
    <rect x="412" y="306" width="16" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="340" y="35" width="225" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,153 450,168 460,153" fill="#fff"/>
  <path d="M 440 155 L 450 170 L 460 155" fill="none" stroke="#333" stroke-width="2"/>

  <text x="452" y="64" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Does knowing</text>
  <text x="452" y="88" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the name of</text>
  <text x="452" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the flood make</text>
  <text x="452" y="136" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you swim?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache, half-lidded, sitting on something, no cigarette -->
  <g filter="url(#shadow_clim83)">
    <!-- Body -->
    <ellipse cx="750" cy="240" rx="18" ry="20" fill="url(#sq_fur_clim83)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="218" rx="14" ry="13" fill="url(#sq_fur_clim83)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="743" cy="211" rx="6" ry="11" fill="url(#sq_fur_clim83)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 743 211)"/>
    <ellipse cx="757" cy="211" rx="6" ry="11" fill="url(#sq_fur_clim83)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 757 211)"/>
    <ellipse cx="743" cy="214" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 743 214)"/>
    <ellipse cx="757" cy="214" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 757 214)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="744" cy="219" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="744" cy="219" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="756" cy="219" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="756" cy="219" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="750" cy="224" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth line -->
    <path d="M 746 228 L 754 228" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 730 245 Q 715 250 710 265 Q 705 280 715 290 Q 725 298 735 290 Q 730 275 730 260 Q 730 252 730 245" fill="url(#sq_fur_clim83)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Small pile of acorns beneath Cache -->
    <ellipse cx="748" cy="268" rx="5" ry="4" fill="#8b6f47" stroke="#5d4a2f" stroke-width="0.8"/>
    <ellipse cx="758" cy="270" rx="5" ry="4" fill="#8b6f47" stroke="#5d4a2f" stroke-width="0.8"/>
    <ellipse cx="753" cy="264" rx="5" ry="4" fill="#8b6f47" stroke="#5d4a2f" stroke-width="0.8"/>
    <!-- Tiny acorn caps -->
    <rect x="746" y="264" width="5" height="2" rx="1" fill="#5d4a2f"/>
    <rect x="756" y="266" width="5" height="2" rx="1" fill="#5d4a2f"/>
    <rect x="751" y="260" width="5" height="2" rx="1" fill="#5d4a2f"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="630" y="40" width="245" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,158 750,173 760,158" fill="#fff"/>
  <path d="M 740 160 L 750 175 L 760 160" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="68" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Awareness is</text>
  <text x="752" y="92" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">just anxiety</text>
  <text x="752" y="116" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">with a</text>
  <text x="752" y="140" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">newsletter.</text>

  <!-- Ground line across all panels -->
  <line x1="15" y1="302" x2="285" y2="302" stroke="#b8a88a" stroke-width="1.5"/>
  <line x1="315" y1="302" x2="585" y2="302" stroke="#b8a88a" stroke-width="1.5"/>
  <line x1="615" y1="302" x2="885" y2="302" stroke="#b8a88a" stroke-width="1.5"/>
</svg>