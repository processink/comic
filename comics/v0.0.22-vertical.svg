<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_ht41v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ht41v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_ht41v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_ht41v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.25"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- ==================== PANEL 1 ==================== -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe looking at phone, scrolling -->
  <g filter="url(#shadow_ht41v)">
    <!-- Body -->
    <ellipse cx="200" cy="225" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="175" rx="20" ry="23" fill="url(#hum_skin_ht41v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 160 Q 200 152 220 160 Q 218 165 214 167 Q 200 163 186 167 Q 182 165 180 160" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes looking at phone -->
    <ellipse cx="192" cy="175" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="193" cy="177" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="208" cy="175" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="209" cy="177" r="2.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <path d="M 200 181 L 200 184" stroke="#a8896d" stroke-width="1"/>
    <!-- Frown -->
    <path d="M 194 190 Q 200 187 206 190" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Arms -->
    <ellipse cx="176" cy="220" rx="8" ry="18" fill="url(#hum_skin_ht41v)" stroke="#c8a882" stroke-width="1" transform="rotate(-15 176 220)"/>
    <ellipse cx="224" cy="220" rx="8" ry="18" fill="url(#hum_skin_ht41v)" stroke="#c8a882" stroke-width="1" transform="rotate(15 224 220)"/>
    <!-- Phone -->
    <rect x="190" y="230" width="24" height="40" rx="3" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1.2"/>
    <rect x="192" y="234" width="20" height="32" fill="#4a86c7"/>
    <!-- Tiny angry faces on phone screen -->
    <circle cx="198" cy="242" r="2" fill="#e63946"/>
    <circle cx="206" cy="242" r="2" fill="#e63946"/>
    <circle cx="198" cy="250" r="2" fill="#e63946"/>
    <circle cx="206" cy="250" r="2" fill="#e63946"/>
    <circle cx="198" cy="258" r="2" fill="#e63946"/>
    <circle cx="206" cy="258" r="2" fill="#e63946"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="60" y="30" width="280" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,128 200,148 210,128" fill="#fff"/>
  <path d="M 190 130 L 200 150 L 210 130" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Everyone</text>
  <text x="200" y="86" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">online has the</text>
  <text x="200" y="114" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">worst opinions.</text>

  <!-- ==================== PANEL 2 ==================== -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a ledge, half-lidded -->
  <g filter="url(#shadow_ht41v)">
    <!-- Small ledge/surface -->
    <rect x="160" y="555" width="100" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>

    <!-- Body -->
    <ellipse cx="220" cy="530" rx="18" ry="22" fill="url(#sq_fur_ht41v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="220" cy="505" rx="14" ry="13" fill="url(#sq_fur_ht41v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="208,495 212,470 216,495" fill="url(#sq_fur_ht41v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="210,493 212,475 214,493" fill="#cd853f"/>
    <polygon points="224,495 228,470 232,495" fill="url(#sq_fur_ht41v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="226,493 228,475 230,493" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="214" cy="506" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="214" cy="507" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="226" cy="506" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="226" cy="507" r="1.8" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="220" cy="511" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Simple flat mouth -->
    <path d="M 216 515 L 224 515" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 202 525 Q 185 520 178 535 Q 172 555 182 565 Q 192 572 200 562 Q 195 548 198 535 Q 200 528 202 525" fill="url(#sq_fur_ht41v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="60" y="340" width="280" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="210,468 220,488 230,468" fill="#fff"/>
  <path d="M 210 470 L 220 490 L 230 470" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="370" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Interesting.</text>
  <text x="200" y="398" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">What's yours</text>
  <text x="200" y="426" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">about then?</text>
  <text x="200" y="454" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Theirs.</text>

  <!-- ==================== PANEL 3 ==================== -->
  <rect x="10" y="630" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting, enormous eyes staring at viewer -->
  <g filter="url(#shadow_ht41v)">
    <!-- Body -->
    <ellipse cx="260" cy="860" rx="22" ry="28" fill="url(#lem_fur_ht41v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="260" cy="825" rx="18" ry="16" fill="url(#lem_fur_ht41v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- White face patch -->
    <ellipse cx="260" cy="828" rx="13" ry="11" fill="#f0f0f0"/>
    <!-- Moderately-sized round ears -->
    <ellipse cx="236" cy="820" rx="13" ry="15" fill="url(#lem_fur_ht41v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="284" cy="820" rx="13" ry="15" fill="url(#lem_fur_ht41v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="236" cy="820" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="284" cy="820" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="250" cy="826" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="250" cy="827" r="8" fill="#1a1a1a"/>
    <circle cx="248" cy="825" r="2.2" fill="#fff"/>
    <ellipse cx="270" cy="826" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="270" cy="827" r="8" fill="#1a1a1a"/>
    <circle cx="268" cy="825" r="2.2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="260" cy="835" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny mouth -->
    <path d="M 255 839 Q 260 840 265 839" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 238 862 Q 225 875 220 895 Q 217 915 222 930 Q 228 940 238 935 Q 243 925 242 905 Q 241 885 240 870" fill="url(#lem_fur_ht41v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Black stripes on tail -->
    <path d="M 222 895 Q 230 893 240 897" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 223 911 Q 231 909 241 913" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 225 927 Q 232 925 238 928" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Abe in panel 3, smaller, arms crossed, defensive -->
  <g filter="url(#shadow_ht41v)">
    <!-- Body -->
    <ellipse cx="140" cy="880" rx="22" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.2"/>
    <!-- Head -->
    <ellipse cx="140" cy="835" rx="16" ry="19" fill="url(#hum_skin_ht41v)" stroke="#c8a882" stroke-width="1.2"/>
    <!-- Hair -->
    <path d="M 124 823 Q 140 816 156 823 Q 154 827 151 829 Q 140 825 129 829 Q 126 827 124 823" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Squinting eyes -->
    <path d="M 132 834 Q 135 832 138 834" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <path d="M 142 834 Q 145 832 148 834" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <!-- Nose -->
    <path d="M 140 839 L 140 841" stroke="#a8896d" stroke-width="1"/>
    <!-- Pursed mouth -->
    <path d="M 136 846 Q 140 844 144 846" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Crossed arms -->
    <path d="M 120 870 Q 135 860 155 870" fill="none" stroke="url(#hum_skin_ht41v)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 120 870 Q 135 860 155 870" fill="none" stroke="#c8a882" stroke-width="1"/>
  </g>

  <!-- Speech bubble panel 3 - Sifaka -->
  <rect x="100" y="650" width="260" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="255,783 260,803 265,783" fill="#fff"/>
  <path d="M 255 785 L 260 805 L 265 785" fill="none" stroke="#333" stroke-width="2"/>

  <text x="230" y="680" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Is a hot</text>
  <text x="230" y="708" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">take just a</text>
  <text x="230" y="736" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">cold take</text>
  <text x="230" y="764" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">with anger?</text>

  <!-- Tiny accent line under panels -->
  <rect x="10" y="940" width="380" height="3" fill="#E63946" opacity="0.6"/>
</svg>