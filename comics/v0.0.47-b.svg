<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_ban73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ban73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_ban73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_ban73">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding a giant "BANNED" stamp -->
  <g filter="url(#shadow_ban73)">
    <!-- Body -->
    <ellipse cx="150" cy="260" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="205" rx="20" ry="23" fill="url(#hum_skin_ban73)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 190 Q 150 183 170 190 Q 168 195 164 197 Q 150 193 136 197 Q 132 195 130 190" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes determined -->
    <ellipse cx="142" cy="205" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="205" r="2" fill="#2a2a2a"/>
    <ellipse cx="158" cy="205" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="205" r="2" fill="#2a2a2a"/>
    <!-- Nose and mouth -->
    <path d="M 150 211 L 150 214" stroke="#a8896d" stroke-width="1"/>
    <path d="M 145 219 Q 150 217 155 219" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>
    <!-- Arms holding stamp -->
    <rect x="175" y="235" width="55" height="25" rx="3" fill="#8b4513" stroke="#5a2d0c" stroke-width="1.5"/>
    <rect x="190" y="260" width="25" height="8" rx="1" fill="#6b3410" stroke="#4a2209" stroke-width="1"/>
    <text x="202" y="252" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#E63946" font-weight="bold">BANNED</text>
    <!-- Hand on stamp -->
    <ellipse cx="178" cy="248" rx="8" ry="6" fill="url(#hum_skin_ban73)" stroke="#c8a882" stroke-width="1"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="30" y="30" width="240" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,158 155,178 165,158" fill="#fff"/>
  <line x1="145" y1="160" x2="155" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="155" y1="180" x2="165" y2="160" stroke="#333" stroke-width="2"/>

  <text x="150" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">If we ban</text>
  <text x="150" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">every app,</text>
  <text x="150" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">people can't</text>
  <text x="150" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">be distracted.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka holding phone upside down -->
  <g filter="url(#shadow_ban73)">
    <!-- Body -->
    <ellipse cx="450" cy="250" rx="22" ry="28" fill="url(#lem_fur_ban73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="215" rx="18" ry="16" fill="url(#lem_fur_ban73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="425" cy="210" rx="14" ry="16" fill="url(#lem_fur_ban73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="210" rx="14" ry="16" fill="url(#lem_fur_ban73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="438" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="438" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="436" cy="213" r="2" fill="#fff"/>
    <ellipse cx="462" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="462" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="460" cy="213" r="2" fill="#fff"/>
    <!-- Nose and mouth -->
    <ellipse cx="450" cy="223" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 443 227 Q 450 228 457 227" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Arms holding upside-down phone -->
    <ellipse cx="435" cy="248" rx="7" ry="5" fill="url(#lem_fur_ban73)" stroke="#5a5a5a" stroke-width="1" transform="rotate(-20 435 248)"/>
    <ellipse cx="465" cy="248" rx="7" ry="5" fill="url(#lem_fur_ban73)" stroke="#5a5a5a" stroke-width="1" transform="rotate(20 465 248)"/>
    <!-- Phone upside down -->
    <rect x="440" y="248" width="20" height="32" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="442" y="250" width="16" height="26" fill="#4a86c7"/>
    <text x="450" y="268" font-family="DejaVu Sans" font-size="7" text-anchor="middle" fill="#fff" transform="rotate(180 450 264)">VPN OK</text>
    <!-- Ring tail with stripes - MUST BE VISIBLE -->
    <path d="M 430 255 Q 420 265 415 285 Q 410 300 415 315 Q 420 325 430 328 Q 440 330 448 322 Q 443 305 443 285 Q 443 268 438 258" fill="url(#lem_fur_ban73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="413" y="285" width="30" height="7" fill="#1a1a1a"/>
    <rect x="413" y="299" width="30" height="7" fill="#1a1a1a"/>
    <rect x="413" y="313" width="30" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="340" y="30" width="220" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="445,168 455,188 465,168" fill="#fff"/>
  <line x1="445" y1="170" x2="455" y2="190" stroke="#333" stroke-width="2"/>
  <line x1="455" y1="190" x2="465" y2="170" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I downloaded</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">a VPN through</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the app you</text>
  <text x="450" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">banned to ban</text>
  <text x="450" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the other app.</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache smoking with sunglasses, sitting on a pile of banned phones -->
  <g filter="url(#shadow_ban73)">
    <!-- Pile of phones -->
    <rect x="670" y="280" width="18" height="28" rx="2" fill="#3a3a3a" transform="rotate(-15 679 294)"/>
    <rect x="695" y="275" width="18" height="28" rx="2" fill="#4a4a4a" transform="rotate(10 704 289)"/>
    <rect x="715" y="282" width="18" height="28" rx="2" fill="#2a2a2a" transform="rotate(-5 724 296)"/>
    <rect x="682" y="270" width="18" height="28" rx="2" fill="#5a5a5a" transform="rotate(25 691 284)"/>
    <rect x="700" y="268" width="18" height="28" rx="2" fill="#3a3a3a" transform="rotate(-20 709 282)"/>
    <!-- Red X on each -->
    <text x="686" y="295" font-family="DejaVu Sans" font-size="14" fill="#E63946" font-weight="bold" transform="rotate(-15 686 295)">✕</text>
    <text x="708" y="292" font-family="DejaVu Sans" font-size="14" fill="#E63946" font-weight="bold" transform="rotate(10 708 292)">✕</text>
    <text x="728" y="298" font-family="DejaVu Sans" font-size="14" fill="#E63946" font-weight="bold">✕</text>

    <!-- Cache sitting on pile -->
    <!-- Body -->
    <ellipse cx="700" cy="245" rx="18" ry="20" fill="url(#sq_fur_ban73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="700" cy="223" rx="14" ry="13" fill="url(#sq_fur_ban73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="688,215 693,195 698,215" fill="url(#sq_fur_ban73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="690,215 693,200 696,215" fill="#cd853f"/>
    <polygon points="702,215 707,195 712,215" fill="url(#sq_fur_ban73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="704,215 707,200 710,215" fill="#cd853f"/>
    <!-- Sunglasses (smoking) -->
    <rect x="688" y="220" width="10" height="7" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <rect x="702" y="220" width="10" height="7" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <line x1="698" y1="223" x2="702" y2="223" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="688" y1="223" x2="685" y2="221" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="712" y1="223" x2="715" y2="221" stroke="#0a0a0a" stroke-width="1"/>
    <!-- Nose -->
    <ellipse cx="700" cy="230" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Simple mouth with cigarette -->
    <path d="M 696 233 Q 700 234 704 233" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Cigarette -->
    <rect x="704" y="232" width="18" height="3" fill="#f5f0e0" stroke="#c8c0b0" stroke-width="0.5"/>
    <rect x="704" y="232" width="4" height="3" fill="#e8a050"/>
    <!-- Smoke wisps -->
    <path d="M 722 230 Q 726 225 724 218 Q 728 212 726 205" fill="none" stroke="#b8b8b8" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <path d="M 724 232 Q 730 226 728 220" fill="none" stroke="#c8c8c8" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
    <!-- Fluffy tail -->
    <path d="M 716 240 Q 735 235 742 220 Q 748 210 744 200 Q 738 205 735 215 Q 730 228 718 238 Z" fill="url(#sq_fur_ban73)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="635" y="30" width="230" height="150" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="690,178 700,198 710,178" fill="#fff"/>
  <line x1="690" y1="180" x2="700" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="700" y1="200" x2="710" y2="180" stroke="#333" stroke-width="2"/>

  <text x="750" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">You can't ban</text>
  <text x="750" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">curiosity.</text>
  <text x="750" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">You can only</text>
  <text x="750" y="136" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">teach it where</text>
  <text x="750" y="160" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">to look.</text>

  <!-- Signature -->
  <text x="880" y="345" font-family="DejaVu Sans" font-size="9" text-anchor="end" fill="#999">process.ink</text>
</svg>