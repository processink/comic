<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_bene73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_bene73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_bene73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <radialGradient id="egg_grad_bene73" cx="40%" cy="30%">
      <stop offset="0%" style="stop-color:#fff8e7"/>
      <stop offset="100%" style="stop-color:#f5e6c8"/>
    </radialGradient>
    <filter id="shadow_bene73">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e8e0"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding a plate with eggs benedict -->
  <g filter="url(#shadow_bene73)">
    <!-- Body -->
    <ellipse cx="150" cy="248" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="150" cy="195" rx="20" ry="23" fill="url(#hum_skin_bene73)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 130 180 Q 150 173 170 180 Q 168 185 164 187 Q 150 183 136 187 Q 132 185 130 180" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes looking down at plate -->
    <ellipse cx="142" cy="196" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="198" r="2" fill="#2a2a2a"/>
    <ellipse cx="158" cy="196" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="198" r="2" fill="#2a2a2a"/>

    <!-- Nose and smile -->
    <path d="M 150 201 L 150 204" stroke="#a8896d" stroke-width="1"/>
    <path d="M 145 209 Q 150 212 155 209" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms holding plate -->
    <ellipse cx="125" cy="245" rx="10" ry="7" fill="url(#hum_skin_bene73)" stroke="#c8a882" stroke-width="1" transform="rotate(-20 125 245)"/>
    <ellipse cx="175" cy="245" rx="10" ry="7" fill="url(#hum_skin_bene73)" stroke="#c8a882" stroke-width="1" transform="rotate(20 175 245)"/>

    <!-- Plate -->
    <ellipse cx="150" cy="270" rx="40" ry="12" fill="#f0f0f0" stroke="#ccc" stroke-width="1.5"/>

    <!-- English muffin -->
    <ellipse cx="150" cy="265" rx="18" ry="6" fill="#c8943f" stroke="#a07030" stroke-width="1"/>

    <!-- Ham -->
    <ellipse cx="150" cy="262" rx="16" ry="5" fill="#E63946" stroke="#c42e3a" stroke-width="0.8"/>

    <!-- Poached egg -->
    <ellipse cx="150" cy="258" rx="14" ry="7" fill="url(#egg_grad_bene73)" stroke="#d4c8a0" stroke-width="0.8"/>

    <!-- Hollandaise drizzle -->
    <ellipse cx="150" cy="257" rx="12" ry="5" fill="#f0d060" opacity="0.7"/>
  </g>

  <!-- Speech bubble -->
  <rect x="35" y="35" width="230" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,133 150,153 160,133" fill="#fff"/>
  <path d="M 140,135 L 150,155 L 160,135" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I named</text>
  <text x="150" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">my eggs</text>
  <text x="150" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Benedict.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring at the eggs -->
  <g filter="url(#shadow_bene73)">
    <ellipse cx="450" cy="248" rx="22" ry="28" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="450" cy="218" rx="18" ry="16" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="425" cy="213" rx="14" ry="16" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="213" rx="14" ry="16" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="213" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="213" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="438" cy="218" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="438" cy="218" r="8" fill="#1a1a1a"/>
    <circle cx="436" cy="216" r="2" fill="#fff"/>

    <ellipse cx="462" cy="218" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="462" cy="218" r="8" fill="#1a1a1a"/>
    <circle cx="460" cy="216" r="2" fill="#fff"/>

    <ellipse cx="450" cy="226" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 443 230 Q 450 231 457 230" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 430 253 Q 420 263 415 283 Q 410 303 415 318 Q 420 328 430 325 Q 435 310 435 290 Q 435 270 432 258" fill="url(#lem_fur_bene73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="413" y="283" width="22" height="7" fill="#1a1a1a"/>
    <rect x="413" y="296" width="22" height="7" fill="#1a1a1a"/>
    <rect x="413" y="309" width="22" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble -->
  <rect x="335" y="35" width="230" height="125" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,158 450,178 460,158" fill="#fff"/>
  <path d="M 440,160 L 450,180 L 460,160" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Did you name</text>
  <text x="450" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">them before</text>
  <text x="450" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">or after you</text>
  <text x="450" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">killed them?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on counter, smoking with sunglasses -->
  <g filter="url(#shadow_bene73)">
    <!-- Counter/surface -->
    <rect x="620" y="280" width="260" height="5" fill="#8b6f47" stroke="#6b4f37" stroke-width="1"/>

    <!-- Body -->
    <ellipse cx="750" cy="255" rx="18" ry="20" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="233" rx="14" ry="13" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="743" cy="227" rx="6" ry="11" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 743 227)"/>
    <ellipse cx="757" cy="227" rx="6" ry="11" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 757 227)"/>
    <ellipse cx="743" cy="230" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 743 230)"/>
    <ellipse cx="757" cy="230" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 757 230)"/>

    <!-- Sunglasses (smoking) -->
    <rect x="737" y="231" width="10" height="7" rx="1" fill="#1a1a1a"/>
    <rect x="753" y="231" width="10" height="7" rx="1" fill="#1a1a1a"/>
    <line x1="747" y1="234" x2="753" y2="234" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Nose -->
    <ellipse cx="750" cy="240" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Simple mouth line -->
    <path d="M 746 243 L 754 243" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Cigarette -->
    <rect x="754" y="242" width="18" height="2.5" fill="#f5f0e0" stroke="#c8c0a0" stroke-width="0.5"/>
    <rect x="770" y="242" width="3" height="2.5" fill="#E63946"/>
    <!-- Smoke wisps -->
    <path d="M 773 241 Q 776 236 774 230" fill="none" stroke="#aaa" stroke-width="0.8" opacity="0.6"/>
    <path d="M 775 240 Q 779 233 776 226" fill="none" stroke="#aaa" stroke-width="0.6" opacity="0.4"/>

    <!-- Fluffy tail -->
    <path d="M 730 260 Q 715 265 710 280 Q 708 290 715 295 Q 725 298 730 288 Q 728 275 730 265" fill="url(#sq_fur_bene73)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble -->
  <rect x="635" y="35" width="240" height="150" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,183 750,203 760,183" fill="#fff"/>
  <path d="M 740,185 L 750,205 L 760,185" fill="none" stroke="#333" stroke-width="2"/>

  <text x="755" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Every name</text>
  <text x="755" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is a eulogy</text>
  <text x="755" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you write</text>
  <text x="755" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">before the</text>
  <text x="755" y="158" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">funeral.</text>
</svg>