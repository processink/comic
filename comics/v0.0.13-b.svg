    <circle cx="822" cy="249" r="6" fill="#1a1a1a"/>
    <circle cx="821" cy="247" r="1.5" fill="#fff"/>
    <ellipse cx="838" cy="248" rx="7" ry="8" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="838" cy="249" r="6" fill="#1a1a1a"/>
    <circle cx="837" cy="247" r="1.5" fill="#fff"/>
    <!-- Small ears -->
    <ellipse cx="813" cy="243" rx="8" ry="10" fill="url(#lem_fur_tc256)" stroke="#5a5a5a" stroke-width="0.8"/>
    <ellipse cx="813" cy="243" rx="5" ry="6" fill="#f5b5c5"/>
    <ellipse cx="847" cy="243" rx="8" ry="10" fill="url(#lem_fur_tc256)" stroke="#5a5a5a" stroke-width="0.8"/>
    <ellipse cx="847" cy="243" rx="5" ry="6" fill="#f5b5c5"/>
    <!-- Tiny tail -->
    <path d="M 817 275 Q 810 285 808 300 Q 806 310 810 318 Q 815 322 820 315 Q 818 300 817 285" fill="url(#lem_fur_tc256)" stroke="#5a5a5a" stroke-width="1"/>
    <rect x="808" y="297" width="12" height="4" fill="#1a1a1a"/>
    <rect x="808" y="307" width="12" height="4" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 3 - Cache -->
  <rect x="620" y="30" width="250" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="735,158 745,178 755,158" fill="#fff"/>
  <path d="M 735,160 L 745,180 L 755,160" fill="none" stroke="#333" stroke-width="2"/>

  <text x="745" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Yeah. And you</text>
  <text x="745" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">have infinite</text>
  <text x="745" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">feelings but</text>
  <text x="745" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">only 6 words.</text>

  <!-- Small Sifaka thought caption at bottom right -->
  <text x="830" y="335" font-family="DejaVu Sans" font-size="11" text-anchor="middle" fill="#888" font-style="italic">...fine. sad. okay.</text>
</svg>