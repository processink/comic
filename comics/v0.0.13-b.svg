  <polygon points="435,148 445,170 455,148" fill="#fff"/>
  <path d="M 435,150 L 445,172 L 455,150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="443" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">But... the</text>
  <text x="443" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">sunset has</text>
  <text x="443" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">infinite</text>
  <text x="443" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">colors.</text>

