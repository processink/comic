    <path d="M 110 235 Q 130 240 155 275" fill="none" stroke="url(#sq_fur_tc256)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="30" y="30" width="235" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="90,143 100,163 110,143" fill="#fff"/>
  <path d="M 90,145 L 100,165 L 110,145" fill="none" stroke="#333" stroke-width="2"/>

  <text x="148" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I told the</text>
  <text x="148" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">terminal to</text>
  <text x="148" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">show me every</text>
  <text x="148" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">color it knows.</text>

