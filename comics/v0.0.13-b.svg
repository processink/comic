    <rect x="430" y="208" width="2" height="2" fill="#00ffff" opacity="0.6"/>
    <circle cx="426" cy="206" r="1.5" fill="#fff"/>

    <ellipse cx="452" cy="208" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="452" cy="209" r="8" fill="#1a1a1a"/>
