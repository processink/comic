    <ellipse cx="465" cy="203" rx="14" ry="16" fill="url(#lem_fur_tc256)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="415" cy="203" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="465" cy="203" rx="8" ry="10" fill="#f5b5c5"/>

