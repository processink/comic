    <!-- Cigarette -->
    <rect x="745" y="219" width="18" height="1.8" fill="#f4f4f4" stroke="#8b7355" stroke-width="0.5"/>
    <rect x="761" y="218.5" width="3" height="2.8" fill="#E63946" stroke="#c43a1c" stroke-width="0.5"/>
