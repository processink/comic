    <rect x="403" y="270" width="28" height="6" fill="#1a1a1a"/>
    <rect x="403" y="282" width="28" height="6" fill="#1a1a1a"/>
    <rect x="403" y="294" width="28" height="6" fill="#1a1a1a"/>
    <rect x="403" y="306" width="28" height="6" fill="#1a1a1a"/>
