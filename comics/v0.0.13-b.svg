    <rect x="741" y="206" width="11" height="8" rx="2" fill="#1a1a1a" stroke="#111" stroke-width="0.8"/>
    <line x1="739" y1="210" x2="741" y2="210" stroke="#111" stroke-width="1"/>
    <line x1="728" y1="210" x2="724" y2="208" stroke="#111" stroke-width="1"/>
    <line x1="752" y1="210" x2="756" y2="208" stroke="#111" stroke-width="1"/>

    <!-- Nose -->
