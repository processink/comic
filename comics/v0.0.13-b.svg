    <rect x="448" y="205" width="2" height="2" fill="#ff0000" opacity="0.6"/>
    <rect x="451" y="205" width="2" height="2" fill="#00ff00" opacity="0.6"/>
    <rect x="454" y="205" width="2" height="2" fill="#0000ff" opacity="0.6"/>
    <rect x="448" y="208" width="2" height="2" fill="#ffff00" opacity="0.6"/>
    <rect x="451" y="208" width="2" height="2" fill="#ff00ff" opacity="0.6"/>
    <rect x="454" y="208" width="2" height="2" fill="#00ffff" opacity="0.6"/>
    <circle cx="450" cy="206" r="1.5" fill="#fff"/>

