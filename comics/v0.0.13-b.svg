    <path d="M 78 235 Q 62 240 55 255 Q 50 270 58 280 Q 68 288 78 278 Q 73 262 73 248 Q 73 240 78 235" fill="url(#sq_fur_tc256)" stroke="#5d4a2f" stroke-width="1.3"/>

