    <!-- Fluffy tail -->
    <path d="M 720 240 Q 705 245 698 260 Q 693 275 700 285 Q 710 293 720 283 Q 715 267 715 253 Q 715 245 720 240" fill="url(#sq_fur_tc256)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka small in corner, still mesmerized -->
  <g filter="url(#shadow_tc256)">
    <ellipse cx="830" cy="270" rx="16" ry="20" fill="url(#lem_fur_tc256)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="830" cy="248" rx="13" ry="12" fill="url(#lem_fur_tc256)" stroke="#5a5a5a" stroke-width="1"/>
    <!-- Big eyes still glowing -->
