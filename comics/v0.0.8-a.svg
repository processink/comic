<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_dt41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_dt41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_dt41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_dt41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e4dc"/>

  <!-- ======== PANEL 1 ======== -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe on phone -->
  <g filter="url(#shadow_dt41)">
    <!-- Body -->
    <ellipse cx="150" cy="250" rx="30" ry="38" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="195" rx="22" ry="25" fill="url(#hum_skin_dt41)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 128 180 Q 150 170 172 180 Q 170 185 166 187 Q 150 182 134 187 Q 130 185 128 180" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes looking at phone -->
    <ellipse cx="141" cy="195" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="143" cy="196" r="2.5" fill="#2a2a2a"/>
    <ellipse cx="159" cy="195" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="161" cy="196" r="2.5" fill="#2a2a2a"/>
    <!-- Nose -->
    <path d="M 150 200 L 150 204" stroke="#a8896d" stroke-width="1"/>
    <!-- Slight smile -->
    <path d="M 144 210 Q 150 213 156 210" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Phone in hand -->
    <rect x="160" y="228" width="22" height="36" rx="3" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="162" y="232" width="18" height="26" fill="#E63946"/>
    <!-- Heart icon on screen -->
    <path d="M 167 240 Q 167 237 170 237 Q 173 237 173 240 Q 173 244 170 247 Q 167 244 167 240" fill="#fff" stroke="none"/>
    <!-- Arm -->
    <path d="M 170 250 Q 178 240 171 230" fill="none" stroke="#e8b887" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble -->
  <rect x="35" y="30" width="220" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,148 150,168 160,148" fill="#fff"/>
  <path d="M 140 150 L 150 170 L 160 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="145" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Swiped right</text>
  <text x="145" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">on 200 people</text>
  <text x="145" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">today. Really</text>
  <text x="145" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">putting in work.</text>

  <!-- ======== PANEL 2 ======== -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka watching -->
  <g filter="url(#shadow_dt41)">
    <!-- Body -->
    <ellipse cx="450" cy="250" rx="22" ry="28" fill="url(#lem_fur_dt41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="215" rx="18" ry="16" fill="url(#lem_fur_dt41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- White face patch -->
    <ellipse cx="450" cy="217" rx="12" ry="11" fill="#efefef"/>

    <!-- Ears -->
    <ellipse cx="425" cy="210" rx="14" ry="16" fill="url(#lem_fur_dt41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="210" rx="14" ry="16" fill="url(#lem_fur_dt41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="210" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="440" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="440" cy="216" r="8" fill="#1a1a1a"/>
    <circle cx="438" cy="213" r="2.2" fill="#fff"/>

    <ellipse cx="460" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="460" cy="216" r="8" fill="#1a1a1a"/>
    <circle cx="458" cy="213" r="2.2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="224" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 444 228 Q 450 229 456 228" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 430 255 Q 420 265 415 280 Q 412 295 418 310 Q 425 320 435 315 Q 430 300 430 280 Q 430 268 432 258" fill="url(#lem_fur_dt41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="415" y="280" width="20" height="7" fill="#1a1a1a"/>
    <rect x="415" y="294" width="20" height="7" fill="#1a1a1a"/>
    <rect x="418" y="308" width="17" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble -->
  <rect x="335" y="30" width="230" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,173 450,193 460,173" fill="#fff"/>
  <path d="M 440 175 L 450 195 L 460 175" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Did you look</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">at any of</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">their profiles?</text>
  <text x="450" y="142" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">...Their faces?</text>

  <!-- ======== PANEL 3 ======== -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe staring at phone, half-lit by screen glow -->
  <g filter="url(#shadow_dt41)">
    <!-- Body -->
    <ellipse cx="750" cy="250" rx="30" ry="38" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="195" rx="22" ry="25" fill="url(#hum_skin_dt41)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 728 180 Q 750 170 772 180 Q 770 185 766 187 Q 750 182 734 187 Q 730 185 728 180" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes - blank, distant -->
    <ellipse cx="741" cy="195" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="741" cy="196" r="2.5" fill="#2a2a2a"/>
    <ellipse cx="759" cy="195" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="759" cy="196" r="2.5" fill="#2a2a2a"/>
    <!-- Nose -->
    <path d="M 750 200 L 750 204" stroke="#a8896d" stroke-width="1"/>
    <!-- Flat mouth -->
    <path d="M 744 210 L 756 210" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Phone still in hand -->
    <rect x="760" y="228" width="22" height="36" rx="3" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="762" y="232" width="18" height="26" fill="#E63946"/>
    <!-- Infinite scroll lines on screen -->
    <line x1="764" y1="237" x2="778" y2="237" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="764" y1="241" x2="778" y2="241" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="764" y1="245" x2="778" y2="245" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="764" y1="249" x2="778" y2="249" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="764" y1="253" x2="778" y2="253" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <!-- Arm -->
    <path d="M 770 250 Q 778 240 771 230" fill="none" stroke="#e8b887" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble -->
  <rect x="635" y="30" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,148 750,168 760,148" fill="#fff"/>
  <path d="M 740 150 L 750 170 L 760 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I'm not looking</text>
  <text x="750" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">for a person.</text>
  <text x="750" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I'm looking for</text>
  <text x="750" y="136" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">a notification.</text>

</svg>