  <polygon points="185,783 195,803 205,783" fill="#fff"/>
  <path d="M 185,785 L 195,805 L 205,785" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="676" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Yeah. And you</text>
  <text x="200" y="704" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">have infinite</text>
  <text x="200" y="732" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">feelings but</text>
  <text x="200" y="760" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">only 6 words.</text>

  <!-- Small Sifaka thought caption at bottom right -->
