    <ellipse cx="337" cy="858" rx="8" ry="10" fill="url(#lem_fur_tc256v)" stroke="#5a5a5a" stroke-width="0.8"/>
    <ellipse cx="337" cy="858" rx="5" ry="6" fill="#f5b5c5"/>
    <!-- Tiny tail -->
