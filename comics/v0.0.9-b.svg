<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_op7x" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_op7x" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_op7x">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e4dc"/>

  <!-- ======== PANEL 1 ======== -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache reading phone -->
  <g filter="url(#shadow_op7x)">
    <!-- Body -->
    <ellipse cx="155" cy="250" rx="18" ry="20" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="155" cy="228" rx="14" ry="13" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="148" cy="222" rx="6" ry="11" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 148 222)"/>
    <ellipse cx="162" cy="222" rx="6" ry="11" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 162 222)"/>
    <ellipse cx="148" cy="225" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 148 225)"/>
    <ellipse cx="162" cy="225" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 162 225)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="149" cy="230" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="150" cy="231" r="2" fill="#1a1a1a"/>
    <ellipse cx="161" cy="230" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="162" cy="231" r="2" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="155" cy="235" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Simple mouth -->
    <path d="M 151 238 Q 155 237 159 238" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 135 255 Q 120 260 115 275 Q 110 290 120 300 Q 130 310 140 300 Q 135 285 135 270 Q 135 262 135 255" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Phone -->
    <rect x="165" y="240" width="16" height="24" rx="2" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="167" y="243" width="12" height="17" fill="#E63946"/>
    <!-- Arm -->
    <path d="M 168 250 Q 174 245 172 240" fill="none" stroke="#c8923a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="30" width="230" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,168 155,188 165,168" fill="#fff"/>
  <path d="M 145 170 L 155 190 L 165 170" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">US ambassador</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">visits Indian</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">army. Gets</text>
  <text x="150" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">"briefed."</text>
  <text x="150" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">On Op Sindoor.</text>

  <!-- ======== PANEL 2 ======== -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring -->
  <g filter="url(#shadow_op7x)">
    <!-- Body -->
    <ellipse cx="450" cy="250" rx="22" ry="28" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="218" rx="18" ry="16" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- White face patch -->
    <ellipse cx="450" cy="220" rx="12" ry="11" fill="#efefef"/>
    <!-- Ears -->
    <ellipse cx="425" cy="212" rx="14" ry="16" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="212" rx="14" ry="16" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="212" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="212" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="440" cy="218" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="440" cy="219" r="8" fill="#1a1a1a"/>
    <circle cx="438" cy="216" r="2.2" fill="#fff"/>
    <ellipse cx="460" cy="218" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="460" cy="219" r="8" fill="#1a1a1a"/>
    <circle cx="458" cy="216" r="2.2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="450" cy="227" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 444 231 Q 450 232 456 231" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 430 255 Q 420 265 415 285 Q 410 305 420 315 Q 430 320 435 310 Q 425 295 425 275 Q 425 262 430 255" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Tail stripes -->
    <path d="M 418 288 Q 422 286 428 288" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 416 296 Q 421 294 427 296" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 418 304 Q 423 302 429 304" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 421 312 Q 426 310 431 312" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="345" y="30" width="220" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,168 450,188 460,168" fill="#fff"/>
  <path d="M 440 170 L 450 190 L 460 170" fill="none" stroke="#333" stroke-width="2"/>

  <text x="455" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Is "briefed"</text>
  <text x="455" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">when they tell</text>
  <text x="455" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you what they</text>
  <text x="455" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">want you to</text>
  <text x="455" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">already know?</text>

  <!-- ======== PANEL 3 ======== -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache smoking with sunglasses -->
  <g filter="url(#shadow_op7x)">
    <!-- Body -->
    <ellipse cx="750" cy="250" rx="18" ry="20" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="228" rx="14" ry="13" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="743" cy="222" rx="6" ry="11" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 743 222)"/>
    <ellipse cx="757" cy="222" rx="6" ry="11" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 757 222)"/>
    <ellipse cx="743" cy="225" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 743 225)"/>
    <ellipse cx="757" cy="225" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 757 225)"/>
    <!-- Sunglasses (smoking rule) -->
    <rect x="741" y="226" width="10" height="7" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <rect x="753" y="226" width="10" height="7" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <line x1="751" y1="229" x2="753" y2="229" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="741" y1="229" x2="738" y2="227" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="763" y1="229" x2="766" y2="227" stroke="#0a0a0a" stroke-width="1"/>
    <!-- Nose -->
    <ellipse cx="750" cy="235" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Simple mouth with cigarette -->
    <path d="M 746 238 Q 750 237 754 238" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Cigarette -->
    <rect x="754" y="236" width="18" height="3" rx="1" fill="#f5f0e0" stroke="#c8c0a8" stroke-width="0.5"/>
    <rect x="770" y="236" width="3" height="3" rx="0.5" fill="#E63946"/>
    <!-- Smoke wisps -->
    <path d="M 773 235 Q 778 228 775 220" fill="none" stroke="#b8b8b8" stroke-width="1" opacity="0.6"/>
    <path d="M 775 233 Q 782 225 778 216" fill="none" stroke="#b8b8b8" stroke-width="1" opacity="0.4"/>
    <!-- Fluffy tail -->
    <path d="M 730 255 Q 715 260 710 275 Q 705 290 715 300 Q 725 310 735 300 Q 730 285 730 270 Q 730 262 730 255" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="640" y="28" width="230" height="148" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,174 750,194 760,174" fill="#fff"/>
  <path d="M 740 176 L 750 196 L 760 176" fill="none" stroke="#333" stroke-width="2"/>

  <text x="755" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Every briefing</text>
  <text x="755" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is a fiction</text>
  <text x="755" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">two countries</text>
  <text x="755" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">agree to call</text>
  <text x="755" y="152" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">a fact.</text>
</svg>