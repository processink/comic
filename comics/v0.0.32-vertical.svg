<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_gm71v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_gm71v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_gm71v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_gm71v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sun through window -->
  <rect x="30" y="25" width="50" height="50" fill="none" stroke="#b8a89a" stroke-width="2"/>
  <line x1="55" y1="25" x2="55" y2="75" stroke="#b8a89a" stroke-width="1.5"/>
  <line x1="30" y1="50" x2="80" y2="50" stroke="#b8a89a" stroke-width="1.5"/>
  <circle cx="55" cy="47" r="10" fill="#f0d060" opacity="0.7"/>

  <!-- Abe standing -->
  <g filter="url(#shadow_gm71v)">
    <!-- Body -->
    <ellipse cx="200" cy="220" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="165" rx="20" ry="23" fill="url(#hum_skin_gm71v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 150 Q 200 143 220 150 Q 218 155 214 157 Q 200 153 186 157 Q 182 155 180 150" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Happy eyes -->
    <path d="M 188 163 Q 192 159 196 163" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <path d="M 204 163 Q 208 159 212 163" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>
    <!-- Big smile -->
    <path d="M 191 175 Q 200 182 209 175" fill="none" stroke="#8a6d51" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Arms out happily -->
    <path d="M 172 215 Q 155 205 145 200" stroke="#4a6d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M 228 215 Q 245 205 255 200" stroke="#4a6d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="143" cy="199" r="6" fill="url(#hum_skin_gm71v)" stroke="#c8a882" stroke-width="1"/>
    <circle cx="257" cy="199" r="6" fill="url(#hum_skin_gm71v)" stroke="#c8a882" stroke-width="1"/>
    <!-- Legs -->
    <rect x="187" y="250" width="12" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <rect x="203" y="250" width="12" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <!-- Shoes -->
    <ellipse cx="193" cy="283" rx="10" ry="5" fill="#3a2a1a"/>
    <ellipse cx="209" cy="283" rx="10" ry="5" fill="#3a2a1a"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="190" y="30" width="175" height="95" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="225,123 233,141 241,123" fill="#fff"/>
  <path d="M 225 125 L 233 143 L 241 125" fill="none" stroke="#333" stroke-width="2"/>

  <text x="277" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Having a</text>
  <text x="277" y="86" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">good Monday</text>
  <text x="277" y="114" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">today!</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking deeply suspicious -->
  <g filter="url(#shadow_gm71v)">
    <!-- Body -->
    <ellipse cx="145" cy="530" rx="18" ry="22" fill="url(#sq_fur_gm71v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="145" cy="505" rx="15" ry="14" fill="url(#sq_fur_gm71v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="133,495 129,472 139,492" fill="url(#sq_fur_gm71v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="157,495 161,472 151,492" fill="url(#sq_fur_gm71v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="134,493 131,478 138,491" fill="#cd853f"/>
    <polygon points="156,493 159,478 152,491" fill="#cd853f"/>
    <!-- Half-lidded suspicious eyes -->
    <ellipse cx="139" cy="506" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="139" cy="507" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="151" cy="506" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="151" cy="507" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="145" cy="511" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 141 515 L 149 515" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 125 535 Q 110 525 105 510 Q 103 495 110 485 Q 115 495 117 510 Q 120 522 125 530" fill="url(#sq_fur_gm71v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Whiskers -->
    <line x1="133" y1="510" x2="120" y2="508" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="133" y1="513" x2="121" y2="515" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="157" y1="510" x2="170" y2="508" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="157" y1="513" x2="169" y2="515" stroke="#5d4a2f" stroke-width="0.8"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_gm71v)">
    <!-- Body -->
    <ellipse cx="250" cy="535" rx="18" ry="24" fill="url(#lem_fur_gm71v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="250" cy="508" rx="15" ry="14" fill="url(#lem_fur_gm71v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Round ears -->
    <ellipse cx="233" cy="502" rx="10" ry="12" fill="url(#lem_fur_gm71v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="267" cy="502" rx="10" ry="12" fill="url(#lem_fur_gm71v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="233" cy="502" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="267" cy="502" rx="6" ry="8" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="242" cy="508" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="242" cy="509" r="7" fill="#1a1a1a"/>
    <circle cx="240" cy="507" r="2" fill="#fff"/>
    <ellipse cx="258" cy="508" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="258" cy="509" r="7" fill="#1a1a1a"/>
    <circle cx="256" cy="507" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="250" cy="517" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Little o mouth -->
    <ellipse cx="250" cy="522" rx="2.5" ry="2" fill="none" stroke="#8a8a8a" stroke-width="1"/>
    <!-- Ring tail with stripes -->
    <path d="M 268 540 Q 280 550 285 565 Q 288 580 282 595 Q 278 605 272 608" fill="none" stroke="#1a1a1a" stroke-width="7" stroke-linecap="round"/>
    <path d="M 268 540 Q 280 550 285 565 Q 288 580 282 595 Q 278 605 272 608" fill="none" stroke="#f5f5f5" stroke-width="7" stroke-linecap="round" stroke-dasharray="7,7"/>
  </g>

  <!-- Cache speech bubble panel 2 -->
  <rect x="90" y="340" width="220" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="160,453 168,471 176,453" fill="#fff"/>
  <path d="M 160 455 L 168 473 L 176 455" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="370" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Which one</text>
  <text x="200" y="398" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">of his organs</text>
  <text x="200" y="426" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">is failing?</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka alone, center, staring at viewer -->
  <g filter="url(#shadow_gm71v)">
    <!-- Body -->
    <ellipse cx="200" cy="835" rx="22" ry="28" fill="url(#lem_fur_gm71v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="803" rx="18" ry="16" fill="url(#lem_fur_gm71v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Round ears -->
    <ellipse cx="179" cy="796" rx="12" ry="14" fill="url(#lem_fur_gm71v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="221" cy="796" rx="12" ry="14" fill="url(#lem_fur_gm71v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="179" cy="796" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="221" cy="796" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes - even wider -->
    <ellipse cx="190" cy="803" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="190" cy="804" r="9" fill="#1a1a1a"/>
    <circle cx="188" cy="801" r="2.5" fill="#fff"/>
    <ellipse cx="210" cy="803" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="210" cy="804" r="9" fill="#1a1a1a"/>
    <circle cx="208" cy="801" r="2.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="200" cy="813" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny concerned mouth -->
    <path d="M 196 818 Q 200 816 204 818" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail -->
    <path d="M 180 840 Q 165 855 160 875 Q 158 895 165 910 Q 170 920 178 925" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
    <path d="M 180 840 Q 165 855 160 875 Q 158 895 165 910 Q 170 920 178 925" fill="none" stroke="#f5f5f5" stroke-width="8" stroke-linecap="round" stroke-dasharray="8,8"/>
  </g>

  <!-- Sifaka speech bubble panel 3 -->
  <rect x="85" y="650" width="230" height="125" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="195,773 203,792 211,773" fill="#fff"/>
  <path d="M 195 775 L 203 794 L 211 775" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="678" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Can a Monday</text>
  <text x="200" y="706" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">be good, or</text>
  <text x="200" y="734" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">did Abe just</text>
  <text x="200" y="762" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">stop wanting?</text>

  <!-- Accent color stripe at bottom -->
  <rect x="0" y="955" width="400" height="5" fill="#E63946"/>
</svg>