<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_op7x" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_op7x" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_op7x">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e4dc"/>

  <!-- ======== PANEL 1 ======== -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache reading phone -->
  <g filter="url(#shadow_op7x)">
    <!-- Body -->
    <ellipse cx="155" cy="248" rx="18" ry="20" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="155" cy="226" rx="14" ry="13" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="148" cy="220" rx="6" ry="11" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 148 220)"/>
    <ellipse cx="162" cy="220" rx="6" ry="11" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 162 220)"/>
    <ellipse cx="148" cy="223" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 148 223)"/>
    <ellipse cx="162" cy="223" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 162 223)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="149" cy="228" rx="4" ry="2.8" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="150" cy="229" r="2" fill="#1a1a1a"/>
    <ellipse cx="161" cy="228" rx="4" ry="2.8" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="162" cy="229" r="2" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="155" cy="233" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth - simple line -->
    <path d="M 151 236 Q 155 235 159 236" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 137 252 Q 122 258 117 273 Q 112 288 122 298 Q 132 306 140 296 Q 135 281 135 268 Q 135 260 137 252" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Phone -->
    <rect x="166" y="238" width="16" height="24" rx="2" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="168" y="241" width="12" height="17" fill="#E63946"/>
    <!-- Arm to phone -->
    <path d="M 168 248 Q 174 242 172 238" fill="none" stroke="#c8943a" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="30" width="230" height="148" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="148,176 158,196 168,176" fill="#fff"/>
  <path d="M 148,178 L 158,198 L 168,178" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">US ambassador</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">visited India's</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Western Command.</text>
  <text x="150" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Got briefed on</text>
  <text x="150" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Op Sindoor.</text>

  <!-- ======== PANEL 2 ======== -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes -->
  <g filter="url(#shadow_op7x)">
    <!-- Body -->
    <ellipse cx="450" cy="248" rx="22" ry="28" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="218" rx="18" ry="16" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- White face patch -->
    <ellipse cx="450" cy="220" rx="12" ry="11" fill="#efefef"/>
    <!-- Ears -->
    <ellipse cx="425" cy="213" rx="14" ry="16" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="213" rx="14" ry="16" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="213" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="213" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="440" cy="218" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="440" cy="219" r="8" fill="#1a1a1a"/>
    <circle cx="438" cy="216" r="2.2" fill="#fff"/>
    <ellipse cx="460" cy="218" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="460" cy="219" r="8" fill="#1a1a1a"/>
    <circle cx="458" cy="216" r="2.2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="450" cy="227" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 444 231 Q 450 232 456 231" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 430 252 Q 420 262 415 280 Q 412 298 418 312 Q 425 320 432 312 Q 428 295 425 280 Q 422 265 430 255" fill="url(#lem_fur_op7x)" stroke="#5a5a5a" stroke-width="1.3"/>
    <path d="M 417 285 Q 420 283 423 285" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 416 293 Q 419 291 422 293" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 418 301 Q 421 299 424 301" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 420 309 Q 423 307 426 309" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="340" y="30" width="220" height="148" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="445,176 455,196 465,176" fill="#fff"/>
  <path d="M 445,178 L 455,198 L 465,178" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So they show</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">him how the</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">operation went?</text>
  <text x="450" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Is that...a</text>
  <text x="450" y="158" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">warning?</text>

  <!-- ======== PANEL 3 ======== -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache, eyes even more half-lidded -->
  <g filter="url(#shadow_op7x)">
    <!-- Body -->
    <ellipse cx="755" cy="248" rx="18" ry="20" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="755" cy="226" rx="14" ry="13" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="748" cy="220" rx="6" ry="11" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 748 220)"/>
    <ellipse cx="762" cy="220" rx="6" ry="11" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 762 220)"/>
    <ellipse cx="748" cy="223" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 748 223)"/>
    <ellipse cx="762" cy="223" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 762 223)"/>
    <!-- Very half-lidded unimpressed eyes -->
    <ellipse cx="749" cy="228" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="750" cy="228.5" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="761" cy="228" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="762" cy="228.5" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="755" cy="233" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 751 236 L 759 236" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 737 252 Q 722 258 717 273 Q 712 288 722 298 Q 732 306 740 296 Q 735 281 735 268 Q 735 260 737 252" fill="url(#sq_fur_op7x)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="640" y="28" width="220" height="172" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="745,198 755,216 765,198" fill="#fff"/>
  <path d="M 745,200 L 755,218 L 765,200" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Diplomacy is</text>
  <text x="750" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">just showing</text>
  <text x="750" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">someone what</text>
  <text x="750" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you can do</text>
  <text x="750" y="152" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">while smiling</text>
  <text x="750" y="176" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">about it.</text>

</svg>