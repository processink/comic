<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_mind39" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_mind39" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_mind39" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_mind39">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe sitting cross-legged, eyes closed -->
  <g filter="url(#shadow_mind39)">
    <!-- Legs crossed -->
    <ellipse cx="150" cy="295" rx="35" ry="12" fill="#6b7b6b" stroke="#4a5a4a" stroke-width="1"/>

    <!-- Body -->
    <ellipse cx="150" cy="255" rx="26" ry="32" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="150" cy="205" rx="20" ry="23" fill="url(#hum_skin_mind39)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 130 192 Q 150 185 170 192 Q 168 197 164 199 Q 150 195 136 199 Q 132 197 130 192" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes closed peacefully -->
    <path d="M 139 207 Q 143 205 147 207" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 153 207 Q 157 205 161 207" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose and gentle smile -->
    <path d="M 150 212 L 150 215" stroke="#a8896d" stroke-width="1"/>
    <path d="M 144 220 Q 150 223 156 220" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Hands on knees -->
    <ellipse cx="128" cy="275" rx="8" ry="6" fill="url(#hum_skin_mind39)" stroke="#c8a882" stroke-width="1"/>
    <ellipse cx="172" cy="275" rx="8" ry="6" fill="url(#hum_skin_mind39)" stroke="#c8a882" stroke-width="1"/>
  </g>

  <!-- Thought bubble (dots leading up) -->
  <ellipse cx="180" cy="175" rx="4" ry="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="190" cy="158" rx="6" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- Speech/thought bubble -->
  <rect x="35" y="35" width="220" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>

  <text x="145" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I'm getting</text>
  <text x="145" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">really good</text>
  <text x="145" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">at this.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting nearby, half-lidded -->
  <g filter="url(#shadow_mind39)">
    <!-- Body -->
    <ellipse cx="450" cy="250" rx="18" ry="20" fill="url(#sq_fur_mind39)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="450" cy="228" rx="14" ry="13" fill="url(#sq_fur_mind39)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="222" rx="6" ry="11" fill="url(#sq_fur_mind39)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 443 222)"/>
    <ellipse cx="457" cy="222" rx="6" ry="11" fill="url(#sq_fur_mind39)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 457 222)"/>
    <ellipse cx="443" cy="225" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 443 225)"/>
    <ellipse cx="457" cy="225" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 457 225)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="444" cy="230" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="445" cy="230" r="1.8" fill="#1a1a1a"/>
    <path d="M 440 228 L 448 228" stroke="#5d4a2f" stroke-width="1.5"/>

    <ellipse cx="456" cy="230" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="457" cy="230" r="1.8" fill="#1a1a1a"/>
    <path d="M 452 228 L 460 228" stroke="#5d4a2f" stroke-width="1.5"/>

    <!-- Nose -->
    <ellipse cx="450" cy="235" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Flat mouth -->
    <path d="M 446 238 L 454 238" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 430 255 Q 415 260 410 275 Q 405 290 415 300 Q 425 308 435 298 Q 430 283 430 268 Q 430 262 430 255" fill="url(#sq_fur_mind39)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Whiskers -->
    <line x1="438" y1="233" x2="425" y2="232" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="438" y1="236" x2="427" y2="237" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="462" y1="233" x2="475" y2="232" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="462" y1="236" x2="473" y2="237" stroke="#1a1a1a" stroke-width="0.7"/>
  </g>

  <!-- Speech bubble -->
  <rect x="340" y="40" width="220" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,138 450,155 460,138" fill="#fff"/>
  <path d="M 440 140 L 450 158 L 460 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="67" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Good at</text>
  <text x="450" y="92" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">what? Judging</text>
  <text x="450" y="117" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">your progress?</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring directly at reader -->
  <g filter="url(#shadow_mind39)">
    <!-- Body -->
    <ellipse cx="750" cy="245" rx="22" ry="28" fill="url(#lem_fur_mind39)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="750" cy="215" rx="18" ry="16" fill="url(#lem_fur_mind39)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="210" rx="14" ry="16" fill="url(#lem_fur_mind39)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="210" rx="14" ry="16" fill="url(#lem_fur_mind39)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="210" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes staring forward -->
    <ellipse cx="738" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="213" r="2.5" fill="#fff"/>

    <ellipse cx="762" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="213" r="2.5" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="223" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Tiny neutral mouth -->
    <path d="M 746 227 Q 750 228 754 227" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 730 250 Q 720 260 715 280 Q 712 295 717 310 Q 722 320 732 318 Q 738 312 735 295 Q 733 275 731 258" fill="url(#lem_fur_mind39)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="715" y="278" width="20" height="7" fill="#1a1a1a"/>
    <rect x="714" y="292" width="20" height="7" fill="#1a1a1a"/>
    <rect x="716" y="306" width="18" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble -->
  <rect x="640" y="35" width="220" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,180 760,163" fill="#fff"/>
  <path d="M 740 165 L 750 183 L 760 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Can you be</text>
  <text x="750" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">present in a</text>
  <text x="750" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">moment you're</text>
  <text x="750" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">grading?</text>

  <!-- Accent color strip at bottom -->
  <rect x="0" y="345" width="900" height="5" fill="#E63946"/>
</svg>