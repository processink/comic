<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_ogod77" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ogod77" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="human_skin_ogod77" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_ogod77">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e8e0"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Speech bubble -->
  <rect x="40" y="30" width="260" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="155,148 165,168 175,148" fill="#fff"/>
  <path d="M 155 150 L 165 170 L 175 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="170" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I found this</text>
  <text x="170" y="86" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">letter on the</text>
  <text x="170" y="114" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">ground. An O.</text>
  <text x="170" y="142" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">It feels holy.</text>

  <!-- Sifaka staring at a letter O on the ground -->
  <g filter="url(#shadow_ogod77)">
    <!-- Body -->
    <ellipse cx="160" cy="230" rx="22" ry="28" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="160" cy="200" rx="18" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="135" cy="195" rx="14" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="185" cy="195" rx="14" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="135" cy="195" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="185" cy="195" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes looking down -->
    <ellipse cx="148" cy="200" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="148" cy="203" r="8" fill="#1a1a1a"/>
    <circle cx="146" cy="201" r="2" fill="#fff"/>

    <ellipse cx="172" cy="200" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="172" cy="203" r="8" fill="#1a1a1a"/>
    <circle cx="170" cy="201" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="160" cy="208" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 153 212 Q 160 213 167 212" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 140 235 Q 130 245 125 265 Q 120 285 125 300 Q 130 315 140 318 Q 150 320 160 313 Q 155 293 155 273 Q 155 253 150 238" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="125" y="265" width="30" height="8" fill="#1a1a1a"/>
    <rect x="125" y="281" width="30" height="8" fill="#1a1a1a"/>
    <rect x="125" y="297" width="30" height="8" fill="#1a1a1a"/>
  </g>

  <!-- The letter O on the ground -->
  <text x="260" y="290" font-family="DejaVu Sans" font-size="48" font-weight="bold" fill="#E63946" text-anchor="middle">O</text>
  <!-- Ground line -->
  <line x1="35" y1="298" x2="370" y2="298" stroke="#999" stroke-width="1.5"/>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache speech bubble -->
  <rect x="40" y="340" width="260" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,458 155,478 165,458" fill="#fff"/>
  <path d="M 145 460 L 155 480 L 165 460" fill="none" stroke="#333" stroke-width="2"/>

  <text x="170" y="368" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">It's a zero.</text>
  <text x="170" y="396" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Or a hole.</text>
  <text x="170" y="424" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Or someone's</text>
  <text x="170" y="452" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">lost bagel.</text>

  <!-- Cache looking skeptical -->
  <g filter="url(#shadow_ogod77)">
    <!-- Body -->
    <ellipse cx="155" cy="540" rx="18" ry="20" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="155" cy="518" rx="14" ry="13" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="148" cy="512" rx="6" ry="11" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 148 512)"/>
    <ellipse cx="162" cy="512" rx="6" ry="11" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 162 512)"/>
    <ellipse cx="148" cy="515" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 148 515)"/>
    <ellipse cx="162" cy="515" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 162 515)"/>

    <!-- Half-lidded skeptical eyes -->
    <ellipse cx="149" cy="520" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="149" cy="520" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="161" cy="520" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="161" cy="520" r="1.5" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <ellipse cx="155" cy="525" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 152 528 L 158 528" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 135 545 Q 120 550 115 565 Q 110 580 120 590 Q 130 600 140 590 Q 135 575 135 560 Q 135 552 135 545" fill="url(#sq_fur_ogod77)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Abe standing next to Cache -->
  <g filter="url(#shadow_ogod77)">
    <!-- Body -->
    <ellipse cx="250" cy="540" rx="25" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Neck -->
    <rect x="242" y="503" width="16" height="12" fill="url(#human_skin_ogod77)"/>
    <!-- Head -->
    <ellipse cx="250" cy="495" rx="18" ry="20" fill="url(#human_skin_ogod77)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 232 482 Q 250 476 268 482 Q 266 487 262 489 Q 250 485 238 489 Q 234 487 232 482" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes - confused -->
    <ellipse cx="242" cy="495" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="242" cy="496" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="258" cy="495" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="258" cy="496" r="2.5" fill="#1a1a1a"/>

    <!-- Raised eyebrow -->
    <path d="M 254 488 Q 258 485 262 487" fill="none" stroke="#4a3728" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Mouth -->
    <path d="M 245 505 Q 250 503 255 505" fill="none" stroke="#8a5d3a" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Ground line -->
  <line x1="35" y1="608" x2="370" y2="608" stroke="#999" stroke-width="1.5"/>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka speech bubble -->
  <rect x="40" y="648" width="270" height="150" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="160,796 170,816 180,796" fill="#fff"/>
  <path d="M 160 798 L 170 818 L 180 798" fill="none" stroke="#333" stroke-width="2"/>

  <text x="175" y="678" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Every god</text>
  <text x="175" y="706" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">starts as a</text>
  <text x="175" y="734" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">shape no one</text>
  <text x="175" y="762" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">can explain</text>
  <text x="175" y="790" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">away.</text>

  <!-- Sifaka now kneeling before the O, which is now glowing -->
  <g filter="url(#shadow_ogod77)">
    <!-- Body kneeling -->
    <ellipse cx="155" cy="880" rx="22" ry="25" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head tilted up -->
    <ellipse cx="155" cy="852" rx="18" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="130" cy="847" rx="14" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="180" cy="847" rx="14" ry="16" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="130" cy="847" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="180" cy="847" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes - looking reverently at O -->
    <ellipse cx="143" cy="852" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="145" cy="852" r="8" fill="#1a1a1a"/>
    <circle cx="143" cy="850" r="2" fill="#fff"/>

    <ellipse cx="167" cy="852" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="169" cy="852" r="8" fill="#1a1a1a"/>
    <circle cx="167" cy="850" r="2" fill="#fff"/>

    <ellipse cx="155" cy="860" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 150 864 Q 155 866 160 864" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms raised in worship -->
    <ellipse cx="130" cy="875" rx="8" ry="6" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1" transform="rotate(-45 130 875)"/>
    <ellipse cx="180" cy="875" rx="8" ry="6" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1" transform="rotate(45 180 875)"/>

    <!-- Ring tail -->
    <path d="M 135 885 Q 125 895 120 910 Q 115 925 120 932 Q 125 938 135 938 Q 145 938 153 932 Q 148 920 148 910 Q 148 898 143 888" fill="url(#lem_fur_ogod77)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="120" y="908" width="28" height="7" fill="#1a1a1a"/>
    <rect x="120" y="920" width="28" height="7" fill="#1a1a1a"/>
    <rect x="120" y="932" width="28" height="5" fill="#1a1a1a"/>
  </g>

  <!-- The O, now bigger and glowing -->
  <circle cx="300" cy="890" r="30" fill="none" stroke="#E63946" stroke-width="5" opacity="0.25"/>
  <circle cx="300" cy="890" r="22" fill="none" stroke="#E63946" stroke-width="4" opacity="0.4"/>
  <text x="300" y="906" font-family="DejaVu Sans" font-size="52" font-weight="bold" fill="#E63946" text-anchor="middle">O</text>

  <!-- Ground line -->
  <line x1="35" y1="938" x2="370" y2="938" stroke="#999" stroke-width="1.5"/>
</svg>