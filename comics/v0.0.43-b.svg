<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_ch47x" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ch47x" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_ch47x">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#d8d0c8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting on a stack of old photos -->
  <g filter="url(#shadow_ch47x)">
    <!-- Stack of photos -->
    <rect x="100" y="248" width="100" height="8" fill="#f0e8d0" stroke="#8a7a5a" stroke-width="1" transform="rotate(-3 150 252)"/>
    <rect x="98" y="256" width="104" height="8" fill="#e8dcc4" stroke="#8a7a5a" stroke-width="1" transform="rotate(2 150 260)"/>
    <rect x="96" y="264" width="108" height="8" fill="#f5ecd4" stroke="#8a7a5a" stroke-width="1" transform="rotate(-1 150 268)"/>

    <!-- Cache body -->
    <ellipse cx="150" cy="228" rx="18" ry="22" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="203" rx="14" ry="13" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="138,195 133,172 143,192" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="140,193 135,175 143,192" fill="#cd853f"/>
    <polygon points="162,195 167,172 157,192" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="160,193 165,175 157,192" fill="#cd853f"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="144" cy="204" rx="4" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="144" cy="205" r="2" fill="#1a1a1a"/>
    <ellipse cx="156" cy="204" rx="4" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="156" cy="205" r="2" fill="#1a1a1a"/>

    <!-- Droopy eyelids -->
    <path d="M 140 201 Q 144 200 148 201" fill="none" stroke="#5d4a2f" stroke-width="1.2"/>
    <path d="M 152 201 Q 156 200 160 201" fill="none" stroke="#5d4a2f" stroke-width="1.2"/>

    <!-- Nose and mouth -->
    <ellipse cx="150" cy="209" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 146 212 Q 150 211 154 212" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 168 225 Q 185 218 195 205 Q 200 195 196 188 Q 192 195 183 205 Q 172 218 166 223 Z" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Holding one sepia photo -->
    <rect x="118" y="218" width="28" height="22" fill="#f0e0c0" stroke="#8a7a5a" stroke-width="1" transform="rotate(-8 132 229)"/>
    <rect x="121" y="221" width="22" height="16" fill="#c8a878" transform="rotate(-8 132 229)"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="30" y="30" width="245" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,148 150,168 160,148" fill="#fff"/>
  <path d="M 140 150 L 150 170 L 160 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="152" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Chelsea Hotel</text>
  <text x="152" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">photos from</text>
  <text x="152" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">1973. A "lost"</text>
  <text x="152" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">New York.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka peering at photo with enormous eyes -->
  <g filter="url(#shadow_ch47x)">
    <!-- Body -->
    <ellipse cx="450" cy="235" rx="22" ry="28" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="200" rx="18" ry="16" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="425" cy="195" rx="14" ry="16" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="195" rx="14" ry="16" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="195" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="195" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="438" cy="200" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="438" cy="200" r="8" fill="#1a1a1a"/>
    <circle cx="436" cy="198" r="2" fill="#fff"/>

    <ellipse cx="462" cy="200" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="462" cy="200" r="8" fill="#1a1a1a"/>
    <circle cx="460" cy="198" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="210" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 443 214 Q 450 215 457 214" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 430 240 Q 420 250 415 270 Q 410 290 415 305 Q 420 315 430 318 Q 440 320 448 310 Q 442 290 442 270 Q 442 255 435 245" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="413" y="270" width="30" height="7" fill="#1a1a1a"/>
    <rect x="413" y="284" width="30" height="7" fill="#1a1a1a"/>
    <rect x="413" y="298" width="30" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="330" y="30" width="240" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,148 450,168 460,148" fill="#fff"/>
  <path d="M 440 150 L 450 170 L 460 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">If a city can</text>
  <text x="450" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">vanish while</text>
  <text x="450" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">people are</text>
  <text x="450" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">still in it...</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache holding a phone, taking a photo of a photo -->
  <g filter="url(#shadow_ch47x)">
    <!-- Cache body -->
    <ellipse cx="750" cy="228" rx="18" ry="22" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="203" rx="14" ry="13" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="738,195 733,172 743,192" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="740,193 735,175 743,192" fill="#cd853f"/>
    <polygon points="762,195 767,172 757,192" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="760,193 765,175 757,192" fill="#cd853f"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="744" cy="204" rx="4" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="744" cy="205" r="2" fill="#1a1a1a"/>
    <ellipse cx="756" cy="204" rx="4" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="756" cy="205" r="2" fill="#1a1a1a"/>

    <!-- Droopy eyelids -->
    <path d="M 740 201 Q 744 200 748 201" fill="none" stroke="#5d4a2f" stroke-width="1.2"/>
    <path d="M 752 201 Q 756 200 760 201" fill="none" stroke="#5d4a2f" stroke-width="1.2"/>

    <!-- Nose and mouth -->
    <ellipse cx="750" cy="209" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 746 212 Q 750 211 754 212" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 768 225 Q 785 218 795 205 Q 800 195 796 188 Q 792 195 783 205 Q 772 218 766 223 Z" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Arm holding phone -->
    <ellipse cx="730" cy="220" rx="7" ry="5" fill="url(#sq_fur_ch47x)" stroke="#5d4a2f" stroke-width="1" transform="rotate(-15 730 220)"/>

    <!-- Phone -->
    <rect x="710" y="210" width="18" height="30" rx="2" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="712" y="214" width="14" height="22" fill="#4a86c7"/>
  </g>

  <!-- Sifaka also in panel 3 watching -->
  <g filter="url(#shadow_ch47x)">
    <ellipse cx="660" cy="250" rx="18" ry="22" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1.1"/>
    <ellipse cx="660" cy="222" rx="14" ry="13" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1.1"/>

    <!-- Ears -->
    <ellipse cx="640" cy="218" rx="11" ry="13" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="680" cy="218" rx="11" ry="13" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="640" cy="218" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="680" cy="218" rx="6" ry="8" fill="#f5b5c5"/>

    <!-- Big eyes -->
    <ellipse cx="651" cy="222" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="651" cy="222" r="6" fill="#1a1a1a"/>
    <circle cx="649" cy="220" r="1.5" fill="#fff"/>
    <ellipse cx="669" cy="222" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="669" cy="222" r="6" fill="#1a1a1a"/>
    <circle cx="667" cy="220" r="1.5" fill="#fff"/>

    <ellipse cx="660" cy="230" rx="1.5" ry="1" fill="#1a1a1a"/>

    <!-- Small tail -->
    <path d="M 642 252 Q 630 265 628 280 Q 626 295 632 305 Q 638 310 645 305 Q 640 290 642 272 Q 643 260 644 254" fill="url(#lem_fur_ch47x)" stroke="#5a5a5a" stroke-width="1.1"/>
    <rect x="626" y="278" width="18" height="5" fill="#1a1a1a"/>
    <rect x="626" y="290" width="18" height="5" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 3 - Cache's punchline -->
  <rect x="630" y="30" width="240" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,173 750,193 760,173" fill="#fff"/>
  <path d="M 740 175 L 750 195 L 760 175" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Every photo</text>
  <text x="750" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is a photo of</text>
  <text x="750" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">a place that</text>
  <text x="750" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">no longer</text>
  <text x="750" y="153" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">exists.</text>

  <!-- Tiny signature -->
  <text x="880" y="345" font-family="DejaVu Sans" font-size="9" text-anchor="end" fill="#999">process.ink</text>
</svg>