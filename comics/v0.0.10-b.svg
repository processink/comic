<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_ent47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ent47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_ent47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe scrolling phone -->
  <g>
    <!-- Body -->
    <ellipse cx="150" cy="260" rx="30" ry="40" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="205" rx="22" ry="25" fill="url(#hum_skin_ent47)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 128 192 Q 150 180 172 192 Q 170 197 166 199 Q 150 194 134 199 Q 130 197 128 192" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes glazed -->
    <ellipse cx="141" cy="205" rx="4" ry="3.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="206" r="2" fill="#1a1a1a"/>
    <ellipse cx="159" cy="205" rx="4" ry="3.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="160" cy="206" r="2" fill="#1a1a1a"/>
    <!-- Nose mouth -->
    <path d="M 150 211 L 150 215" stroke="#a8896d" stroke-width="1"/>
    <path d="M 144 220 Q 150 222 156 220" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>
    <!-- Phone -->
    <rect x="163" cy="235" y="235" width="22" height="38" rx="3" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="165" y="238" width="18" height="32" fill="#4a86c7"/>
    <text x="174" y="252" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">TRENDING</text>
    <text x="174" y="260" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#E63946">▶ ▶ ▶</text>
    <!-- Arm to phone -->
    <path d="M 170 250 Q 175 242 168 238" fill="none" stroke="url(#hum_skin_ent47)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="30" y="35" width="245" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,153 150,170 160,153" fill="#fff"/>
  <line x1="140" y1="155" x2="150" y2="172" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="172" x2="160" y2="155" stroke="#333" stroke-width="2"/>

  <text x="152" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">This site has</text>
  <text x="152" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">every trend.</text>
  <text x="152" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Movies, music,</text>
  <text x="152" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">all of it.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a tiny stool -->
  <g>
    <!-- Stool -->
    <rect x="425" y="280" width="40" height="5" fill="#8b7355" stroke="#6b4f37" stroke-width="1"/>
    <line x1="430" y1="285" x2="430" y2="310" stroke="#6b4f37" stroke-width="2"/>
    <line x1="460" y1="285" x2="460" y2="310" stroke="#6b4f37" stroke-width="2"/>

    <!-- Cache body -->
    <ellipse cx="445" cy="260" rx="18" ry="20" fill="url(#sq_fur_ent47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="445" cy="238" rx="14" ry="13" fill="url(#sq_fur_ent47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="438" cy="230" rx="6" ry="12" fill="url(#sq_fur_ent47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 438 230)"/>
    <ellipse cx="452" cy="230" rx="6" ry="12" fill="url(#sq_fur_ent47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 452 230)"/>
    <ellipse cx="438" cy="233" rx="3" ry="7" fill="#cd853f" transform="rotate(-15 438 233)"/>
    <ellipse cx="452" cy="233" rx="3" ry="7" fill="#cd853f" transform="rotate(15 452 233)"/>
    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="440" cy="240" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="440" cy="240" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="450" cy="240" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="450" cy="240" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="445" cy="244" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 441 248 L 449 248" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 427 265 Q 412 270 407 285 Q 402 300 412 310 Q 422 318 430 308 Q 425 293 425 278 Q 425 272 427 265" fill="url(#sq_fur_ent47)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="320" y="35" width="255" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="435,178 445,198 455,178" fill="#fff"/>
  <line x1="435" y1="180" x2="445" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="445" y1="200" x2="455" y2="180" stroke="#333" stroke-width="2"/>

  <text x="448" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So you watch</text>
  <text x="448" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">what's trending</text>
  <text x="448" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">instead of what</text>
  <text x="448" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you actually</text>
  <text x="448" y="158" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">like?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka in center with enormous eyes -->
  <g>
    <!-- Body -->
    <ellipse cx="750" cy="245" rx="22" ry="28" fill="url(#lem_fur_ent47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="210" rx="18" ry="16" fill="url(#lem_fur_ent47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="726" cy="205" rx="13" ry="15" fill="url(#lem_fur_ent47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="774" cy="205" rx="13" ry="15" fill="url(#lem_fur_ent47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="726" cy="205" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="774" cy="205" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="740" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="740" cy="211" r="8" fill="#1a1a1a"/>
    <circle cx="738" cy="208" r="2.5" fill="#fff"/>
    <ellipse cx="760" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="760" cy="211" r="8" fill="#1a1a1a"/>
    <circle cx="758" cy="208" r="2.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="750" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny curious mouth -->
    <path d="M 746 224 Q 750 226 754 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes - VISIBLE -->
    <path d="M 730 250 Q 720 260 715 280 Q 712 295 718 310 Q 725 320 735 315 Q 730 295 730 275 Q 730 260 730 250" fill="url(#lem_fur_ent47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="714" y="275" width="18" height="6" fill="#1a1a1a"/>
    <rect x="714" y="287" width="18" height="6" fill="#1a1a1a"/>
    <rect x="714" y="299" width="18" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="625" y="30" width="255" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,158 750,178 760,158" fill="#fff"/>
  <line x1="740" y1="160" x2="750" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="180" x2="760" y2="160" stroke="#333" stroke-width="2"/>

  <text x="752" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">If everyone</text>
  <text x="752" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">follows the</text>
  <text x="752" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">trend... who</text>
  <text x="752" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">started walking?</text>

  <!-- Accent color detail — tiny trending arrow floating in panel 3 -->
  <path d="M 850 300 L 860 285 L 855 285 L 855 270 L 845 270 L 845 285 L 840 285 Z" fill="#E63946" opacity="0.4"/>

</svg>