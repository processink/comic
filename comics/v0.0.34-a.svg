<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_scroll71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_scroll71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_scroll71" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_scroll71">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe on couch scrolling phone -->
  <g filter="url(#shadow_scroll71)">
    <!-- Couch -->
    <rect x="50" y="255" width="200" height="60" rx="8" fill="#8b7355" stroke="#6b5535" stroke-width="1.5"/>
    <rect x="45" y="250" width="210" height="20" rx="6" fill="#9d8365" stroke="#6b5535" stroke-width="1.5"/>

    <!-- Body -->
    <ellipse cx="150" cy="230" rx="28" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="150" cy="185" rx="20" ry="23" fill="url(#hum_skin_scroll71)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 130 170 Q 150 163 170 170 Q 168 175 164 177 Q 150 173 136 177 Q 132 175 130 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes glazed, half-lidded -->
    <ellipse cx="142" cy="186" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="143" cy="187" r="1.8" fill="#2a2a2a"/>
    <ellipse cx="158" cy="186" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="159" cy="187" r="1.8" fill="#2a2a2a"/>

    <!-- Dark circles -->
    <ellipse cx="142" cy="191" rx="5" ry="2" fill="#d4b8a0" opacity="0.5"/>
    <ellipse cx="158" cy="191" rx="5" ry="2" fill="#d4b8a0" opacity="0.5"/>

    <!-- Nose and mouth -->
    <path d="M 150 192 L 150 195" stroke="#a8896d" stroke-width="1"/>
    <path d="M 145 200 L 155 200" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms holding phone -->
    <path d="M 130 220 Q 125 210 130 200 Q 132 195 138 197" fill="none" stroke="url(#hum_skin_scroll71)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 170 220 Q 175 210 170 200 Q 168 195 162 197" fill="none" stroke="url(#hum_skin_scroll71)" stroke-width="11" stroke-linecap="round"/>

    <!-- Phone -->
    <rect x="135" y="200" width="30" height="50" rx="3" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1.5"/>
    <rect x="137" y="205" width="26" height="40" fill="#3a6a9a"/>

    <!-- Infinite content lines on phone -->
    <rect x="140" y="208" width="20" height="3" rx="1" fill="#5a9aca"/>
    <rect x="140" y="213" width="16" height="3" rx="1" fill="#5a9aca"/>
    <rect x="140" y="218" width="20" height="3" rx="1" fill="#5a9aca"/>
    <rect x="140" y="223" width="14" height="3" rx="1" fill="#5a9aca"/>
    <rect x="140" y="228" width="20" height="3" rx="1" fill="#5a9aca"/>
    <rect x="140" y="233" width="18" height="3" rx="1" fill="#5a9aca"/>
    <rect x="140" y="238" width="20" height="3" rx="1" fill="#5a9aca"/>

    <!-- Thumb scrolling indicator -->
    <ellipse cx="150" cy="242" rx="5" ry="4" fill="url(#hum_skin_scroll71)" stroke="#c8a882" stroke-width="0.8"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="30" width="230" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,128 150,148 160,128" fill="#fff"/>
  <path d="M 140 130 L 150 150 L 160 130" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I've been</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">scrolling for</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">two hours.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting beside him, enormous eyes -->
  <g filter="url(#shadow_scroll71)">
    <!-- Body -->
    <ellipse cx="450" cy="250" rx="22" ry="28" fill="url(#lem_fur_scroll71)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="450" cy="215" rx="18" ry="16" fill="url(#lem_fur_scroll71)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="425" cy="210" rx="14" ry="16" fill="url(#lem_fur_scroll71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="210" rx="14" ry="16" fill="url(#lem_fur_scroll71)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="210" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="438" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="438" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="436" cy="213" r="2" fill="#fff"/>

    <ellipse cx="462" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="462" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="460" cy="213" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="223" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 443 227 Q 450 228 457 227" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes - visible and prominent -->
    <path d="M 430 255 Q 420 270 418 290 Q 416 305 425 315 Q 432 318 435 310" fill="none" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
    <path d="M 430 255 Q 420 270 418 290 Q 416 305 425 315 Q 432 318 435 310" fill="none" stroke="#f5f5f5" stroke-width="10" stroke-linecap="round" stroke-dasharray="10,10"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="340" y="30" width="220" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,148 450,168 460,148" fill="#fff"/>
  <path d="M 440 150 L 450 170 L 460 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">What were</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you looking</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">for when</text>
  <text x="450" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you started?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe still scrolling, same pose, same dead expression -->
  <g filter="url(#shadow_scroll71)">
    <!-- Couch -->
    <rect x="660" y="255" width="180" height="60" rx="8" fill="#8b7355" stroke="#6b5535" stroke-width="1.5"/>
    <rect x="655" y="250" width="190" height="20" rx="6" fill="#9d8365" stroke="#6b5535" stroke-width="1.5"/>

    <!-- Body -->
    <ellipse cx="750" cy="230" rx="28" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="750" cy="185" rx="20" ry="23" fill="url(#hum_skin_scroll71)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 730 170 Q 750 163 770 170 Q 768 175 764 177 Q 750 173 736 177 Q 732 175 730 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes even more glazed -->
    <ellipse cx="742" cy="186" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="743" cy="187" r="1.5" fill="#2a2a2a"/>
    <ellipse cx="758" cy="186" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="759" cy="187" r="1.5" fill="#2a2a2a"/>

    <!-- Heavier dark circles -->
    <ellipse cx="742" cy="191" rx="5" ry="2.5" fill="#c4a890" opacity="0.6"/>
    <ellipse cx="758" cy="191" rx="5" ry="2.5" fill="#c4a890" opacity="0.6"/>

    <!-- Nose and mouth -->
    <path d="M 750 192 L 750 195" stroke="#a8896d" stroke-width="1"/>
    <path d="M 745 200 L 755 200" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms holding phone -->
    <path d="M 730 220 Q 725 210 730 200 Q 732 195 738 197" fill="none" stroke="url(#hum_skin_scroll71)" stroke-width="11" stroke-linecap="round"/>
    <path d="M 770 220 Q 775 210 770 200 Q 768 195 762 197" fill="none" stroke="url(#hum_skin_scroll71)" stroke-width="11" stroke-linecap="round"/>

    <!-- Phone -->
    <rect x="735" y="200" width="30" height="50" rx="3" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1.5"/>
    <rect x="737" y="205" width="26" height="40" fill="#3a6a9a"/>

    <!-- Same infinite content lines -->
    <rect x="740" y="208" width="20" height="3" rx="1" fill="#5a9aca"/>
    <rect x="740" y="213" width="16" height="3" rx="1" fill="#5a9aca"/>
    <rect x="740" y="218" width="20" height="3" rx="1" fill="#5a9aca"/>
    <rect x="740" y="223" width="14" height="3" rx="1" fill="#5a9aca"/>
    <rect x="740" y="228" width="20" height="3" rx="1" fill="#5a9aca"/>
    <rect x="740" y="233" width="18" height="3" rx="1" fill="#5a9aca"/>
    <rect x="740" y="238" width="20" height="3" rx="1" fill="#5a9aca"/>

    <!-- Thumb -->
    <ellipse cx="750" cy="242" rx="5" ry="4" fill="url(#hum_skin_scroll71)" stroke="#c8a882" stroke-width="0.8"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="640" y="30" width="220" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,148 750,168 760,148" fill="#fff"/>
  <path d="M 740 150 L 750 170 L 760 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I don't think</text>
  <text x="750" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the feed has</text>
  <text x="750" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">a bottom.</text>
  <text x="750" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Neither do I.</text>

  <!-- Accent color signature -->
  <rect x="5" y="345" width="890" height="3" fill="#E63946" opacity="0.6"/>
</svg>