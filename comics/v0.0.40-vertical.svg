<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe surrounded by self-help books -->
  <g filter="url(#shadow_v)">
    <!-- Stack of books left -->
    <rect x="105" y="245" width="35" height="8" fill="#E63946" stroke="#333" stroke-width="0.8"/>
    <rect x="102" y="237" width="40" height="8" fill="#c4956a" stroke="#333" stroke-width="0.8"/>
    <rect x="107" y="229" width="32" height="8" fill="#7a9a6a" stroke="#333" stroke-width="0.8"/>
    <rect x="104" y="221" width="38" height="8" fill="#8a7a5a" stroke="#333" stroke-width="0.8"/>

    <!-- Stack of books right -->
    <rect x="275" y="249" width="38" height="8" fill="#5d8aa8" stroke="#333" stroke-width="0.8"/>
    <rect x="278" y="241" width="32" height="8" fill="#a87a5d" stroke="#333" stroke-width="0.8"/>
    <rect x="273" y="233" width="42" height="8" fill="#9a6a8a" stroke="#333" stroke-width="0.8"/>

    <!-- Abe body -->
    <rect x="190" y="200" width="40" height="15" fill="url(#hum_skin_v)"/>
    <rect x="180" y="215" width="60" height="40" rx="4" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.2"/>

    <!-- Abe head -->
    <circle cx="210" cy="175" r="24" fill="url(#hum_skin_v)" stroke="#c8a882" stroke-width="1.2"/>

    <!-- Hair -->
    <path d="M 186 162 Q 200 150 215 150 Q 230 150 234 162 Q 232 166 228 168 Q 215 160 200 160 Q 192 162 188 166 Z" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes -->
    <ellipse cx="200" cy="174" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="201" cy="175" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="220" cy="174" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="221" cy="175" r="2.5" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <path d="M 210 180 L 210 184" stroke="#a8896d" stroke-width="1"/>
    <path d="M 204 189 Q 210 191 216 189" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms holding book -->
    <rect x="195" y="210" width="30" height="40" rx="2" fill="#E63946" stroke="#b02030" stroke-width="1"/>
    <text x="210" y="228" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">OPTIMIZE</text>
    <text x="210" y="235" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">YOUR SELF</text>
    <text x="210" y="242" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">v4.0</text>

    <!-- Ground -->
    <line x1="95" y1="260" x2="325" y2="260" stroke="#999" stroke-width="1.5"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="60" y="30" width="280" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,128 200,143 210,128" fill="#fff"/>
  <path d="M 190,130 L 200,145 L 210,130" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I've read</text>
  <text x="200" y="86" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">forty books on</text>
  <text x="200" y="114" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">being present.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a branch -->
  <g filter="url(#shadow_v)">
    <!-- Branch -->
    <line x1="35" y1="540" x2="365" y2="540" stroke="#8b7355" stroke-width="5"/>

    <!-- Cache body -->
    <ellipse cx="200" cy="525" rx="18" ry="20" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Cache head -->
    <ellipse cx="200" cy="503" rx="14" ry="13" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="193" cy="497" rx="6" ry="11" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 193 497)"/>
    <ellipse cx="207" cy="497" rx="6" ry="11" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 207 497)"/>
    <ellipse cx="193" cy="500" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 193 500)"/>
    <ellipse cx="207" cy="500" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 207 500)"/>

    <!-- Ear tufts -->
    <path d="M 191 492 Q 188 486 190 484" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 209 492 Q 212 486 210 484" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="194" cy="505" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="505" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="206" cy="505" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="505" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="200" cy="510" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Simple mouth -->
    <path d="M 196 513 L 204 513" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="188" y1="507" x2="175" y2="506" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="188" y1="510" x2="177" y2="511" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="212" y1="507" x2="225" y2="506" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="212" y1="510" x2="223" y2="511" stroke="#5d4a2f" stroke-width="0.8"/>

    <!-- Fluffy tail -->
    <path d="M 216 520 Q 232 515 240 500 Q 246 485 240 475 Q 234 485 230 495 Q 224 510 216 518 Z" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="55" y="340" width="290" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,468 200,483 210,468" fill="#fff"/>
  <path d="M 190,470 L 200,485 L 210,470" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="370" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Were you</text>
  <text x="200" y="398" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">present while</text>
  <text x="200" y="426" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">you read</text>
  <text x="200" y="454" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">them?</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring into the distance -->
  <g filter="url(#shadow_v)">
    <!-- Ground -->
    <line x1="35" y1="890" x2="365" y2="890" stroke="#999" stroke-width="1.5"/>

    <!-- Sifaka body -->
    <ellipse cx="200" cy="865" rx="22" ry="28" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Sifaka head -->
    <ellipse cx="200" cy="830" rx="18" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="175" cy="825" rx="14" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="825" rx="14" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="825" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="825" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="188" cy="830" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="830" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="828" r="2" fill="#fff"/>

    <ellipse cx="212" cy="830" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="830" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="828" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="200" cy="838" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Tiny mouth -->
    <path d="M 194 842 Q 200 843 206 842" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 180 870 Q 170 880 165 895 Q 162 910 168 920 Q 174 928 182 925 Q 178 910 178 895 Q 178 885 180 875" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="165" y="895" width="17" height="6" fill="#1a1a1a"/>
    <rect x="165" y="907" width="17" height="6" fill="#1a1a1a"/>
    <rect x="166" y="919" width="16" height="5" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="45" y="650" width="310" height="155" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,803 200,818 210,803" fill="#fff"/>
  <path d="M 190,805 L 200,820 L 210,805" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="680" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">What if the</text>
  <text x="200" y="708" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">self you keep</text>
  <text x="200" y="736" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">improving is</text>
  <text x="200" y="764" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the one doing</text>
  <text x="200" y="792" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the damage?</text>

  <!-- Tiny watermark -->
  <text x="385" y="955" font-family="DejaVu Sans" font-size="9" text-anchor="end" fill="#aaa">process.ink</text>
</svg>