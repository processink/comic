<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_mind39v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_mind39v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_mind39v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_mind39v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe sitting cross-legged, eyes closed -->
  <g filter="url(#shadow_mind39v)">
    <!-- Legs crossed -->
    <ellipse cx="200" cy="275" rx="35" ry="12" fill="#6b7b6b" stroke="#4a5a4a" stroke-width="1"/>

    <!-- Body -->
    <ellipse cx="200" cy="235" rx="26" ry="32" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="185" rx="20" ry="23" fill="url(#hum_skin_mind39v)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 180 172 Q 200 165 220 172 Q 218 177 214 179 Q 200 175 186 179 Q 182 177 180 172" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes closed peacefully -->
    <path d="M 189 187 Q 193 185 197 187" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 203 187 Q 207 185 211 187" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Nose and gentle smile -->
    <path d="M 200 192 L 200 195" stroke="#a8896d" stroke-width="1"/>
    <path d="M 194 200 Q 200 203 206 200" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Hands on knees -->
    <ellipse cx="178" cy="255" rx="8" ry="6" fill="url(#hum_skin_mind39v)" stroke="#c8a882" stroke-width="1"/>
    <ellipse cx="222" cy="255" rx="8" ry="6" fill="url(#hum_skin_mind39v)" stroke="#c8a882" stroke-width="1"/>
  </g>

  <!-- Thought bubble (dots leading up) -->
  <ellipse cx="230" cy="155" rx="4" ry="4" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <ellipse cx="240" cy="138" rx="6" ry="5" fill="#fff" stroke="#333" stroke-width="1.5"/>

  <!-- Speech/thought bubble -->
  <rect x="40" y="30" width="230" height="95" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>

  <text x="155" y="57" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I'm getting</text>
  <text x="155" y="85" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">really good</text>
  <text x="155" y="113" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">at this.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting nearby, half-lidded -->
  <g filter="url(#shadow_mind39v)">
    <!-- Body -->
    <ellipse cx="200" cy="555" rx="18" ry="20" fill="url(#sq_fur_mind39v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="533" rx="14" ry="13" fill="url(#sq_fur_mind39v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="193" cy="527" rx="6" ry="11" fill="url(#sq_fur_mind39v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 193 527)"/>
    <ellipse cx="207" cy="527" rx="6" ry="11" fill="url(#sq_fur_mind39v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 207 527)"/>
    <ellipse cx="193" cy="530" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 193 530)"/>
    <ellipse cx="207" cy="530" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 207 530)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="194" cy="535" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="195" cy="535" r="1.8" fill="#1a1a1a"/>
    <path d="M 190 533 L 198 533" stroke="#5d4a2f" stroke-width="1.5"/>

    <ellipse cx="206" cy="535" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="207" cy="535" r="1.8" fill="#1a1a1a"/>
    <path d="M 202 533 L 210 533" stroke="#5d4a2f" stroke-width="1.5"/>

    <!-- Nose -->
    <ellipse cx="200" cy="540" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Flat mouth -->
    <path d="M 196 543 L 204 543" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 180 560 Q 165 565 160 580 Q 155 595 165 605 Q 175 613 185 603 Q 180 588 180 573 Q 180 567 180 560" fill="url(#sq_fur_mind39v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Whiskers -->
    <line x1="188" y1="538" x2="175" y2="537" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="188" y1="541" x2="177" y2="542" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="212" y1="538" x2="225" y2="537" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="212" y1="541" x2="223" y2="542" stroke="#1a1a1a" stroke-width="0.7"/>
  </g>

  <!-- Speech bubble -->
  <rect x="60" y="345" width="280" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,458 200,475 210,458" fill="#fff"/>
  <path d="M 190 460 L 200 478 L 210 460" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="375" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Good at what?</text>
  <text x="200" y="405" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Judging your</text>
  <text x="200" y="435" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">progress?</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring directly at reader -->
  <g filter="url(#shadow_mind39v)">
    <!-- Body -->
    <ellipse cx="200" cy="865" rx="22" ry="28" fill="url(#lem_fur_mind39v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="835" rx="18" ry="16" fill="url(#lem_fur_mind39v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="175" cy="830" rx="14" ry="16" fill="url(#lem_fur_mind39v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="830" rx="14" ry="16" fill="url(#lem_fur_mind39v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="830" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="830" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes staring forward -->
    <ellipse cx="188" cy="835" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="835" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="833" r="2.5" fill="#fff"/>

    <ellipse cx="212" cy="835" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="835" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="833" r="2.5" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="200" cy="843" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Tiny neutral mouth -->
    <path d="M 196 847 Q 200 848 204 847" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 180 870 Q 170 880 165 900 Q 162 915 167 925 Q 172 935 182 933 Q 188 927 185 910 Q 183 895 181 878" fill="url(#lem_fur_mind39v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="165" y="898" width="20" height="7" fill="#1a1a1a"/>
    <rect x="164" y="912" width="20" height="7" fill="#1a1a1a"/>
    <rect x="166" y="922" width="18" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble -->
  <rect x="50" y="650" width="300" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,793 200,810 210,793" fill="#fff"/>
  <path d="M 190 795 L 200 813 L 210 795" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="680" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Can you be</text>
  <text x="200" y="710" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">present in a</text>
  <text x="200" y="740" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">moment you're</text>
  <text x="200" y="770" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">grading?</text>

  <!-- Accent color strip at bottom -->
  <rect x="0" y="955" width="400" height="5" fill="#E63946"/>
</svg>