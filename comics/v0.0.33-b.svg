<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_art91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_art91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_art91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_art91">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka standing in gallery, looking at blank canvas on wall -->
  <g filter="url(#shadow_art91)">
    <!-- Gallery wall detail: blank canvas with fancy frame -->
    <rect x="155" y="100" width="100" height="80" fill="#8b7355" stroke="#5d4a2f" stroke-width="3"/>
    <rect x="162" y="107" width="86" height="66" fill="#f5f0e8"/>
    <!-- Price tag -->
    <rect x="215" y="175" width="50" height="18" fill="#fff" stroke="#999" stroke-width="1"/>
    <text x="240" y="188" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#E63946">$4.2M</text>

    <!-- Sifaka body -->
    <ellipse cx="100" cy="245" rx="22" ry="28" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="100" cy="210" rx="18" ry="16" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized round ears -->
    <ellipse cx="76" cy="205" rx="14" ry="16" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="124" cy="205" rx="14" ry="16" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="76" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="124" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes looking at canvas -->
    <ellipse cx="90" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="92" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="90" cy="208" r="2" fill="#fff"/>

    <ellipse cx="112" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="114" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="112" cy="208" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="101" cy="219" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 95 223 Q 101 225 107 223" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes - MUST BE VISIBLE -->
    <path d="M 78 250 Q 60 260 50 280 Q 45 300 55 315 Q 65 325 75 318 Q 70 300 72 280 Q 74 265 78 255" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="50" y="280" width="25" height="7" fill="#1a1a1a" rx="2"/>
    <rect x="48" y="294" width="25" height="7" fill="#1a1a1a" rx="2"/>
    <rect x="52" y="308" width="22" height="7" fill="#1a1a1a" rx="2"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="35" width="220" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="95,143 105,163 115,143" fill="#fff"/>
  <path d="M 95 145 L 105 165 L 115 145" fill="none" stroke="#333" stroke-width="2"/>

  <text x="145" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The art</text>
  <text x="145" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">market is</text>
  <text x="145" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">growing</text>
  <text x="145" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">again!</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting, half-lidded, skeptical -->
  <g filter="url(#shadow_art91)">
    <!-- Body -->
    <ellipse cx="450" cy="235" rx="18" ry="22" fill="url(#sq_fur_art91)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="208" rx="15" ry="14" fill="url(#sq_fur_art91)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="438,198 434,172 444,196" fill="url(#sq_fur_art91)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="462,198 466,172 456,196" fill="url(#sq_fur_art91)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="439,196 436,178 443,194" fill="#cd853f"/>
    <polygon points="461,196 464,178 457,194" fill="#cd853f"/>

    <!-- Half-lidded skeptical eyes -->
    <ellipse cx="444" cy="210" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="211" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="210" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="211" r="1.5" fill="#1a1a1a"/>

    <!-- Nose and flat mouth -->
    <ellipse cx="450" cy="215" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 445 218 L 455 218" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 430 240 Q 415 245 410 260 Q 405 278 415 290 Q 425 300 435 288 Q 430 272 430 258 Q 430 248 430 240" fill="url(#sq_fur_art91)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Arms crossed -->
    <path d="M 435 230 Q 440 238 460 232" stroke="#5d4a2f" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 465 230 Q 460 238 440 232" stroke="#5d4a2f" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Acorn on floor next to Cache -->
  <ellipse cx="490" cy="265" rx="6" ry="8" fill="#8b6842" stroke="#5d4a2f" stroke-width="1"/>
  <path d="M 484 260 Q 490 255 496 260" fill="#5d4a2f" stroke="#3a2a1a" stroke-width="0.8"/>

  <!-- Speech bubble Panel 2 -->
  <rect x="335" y="35" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="445,163 455,183 465,163" fill="#fff"/>
  <path d="M 445 165 L 455 185 L 465 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Yeah. Money</text>
  <text x="450" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">needs a place</text>
  <text x="450" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">to hide that</text>
  <text x="450" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">looks like</text>
  <text x="450" y="157" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">taste.</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring at viewer, existential dread, next to the blank canvas again -->
  <g filter="url(#shadow_art91)">
    <!-- Small blank canvas on easel -->
    <line x1="770" y1="170" x2="770" y2="310" stroke="#8b7355" stroke-width="3"/>
    <line x1="755" y1="170" x2="785" y2="310" stroke="#8b7355" stroke-width="2"/>
    <line x1="785" y1="170" x2="755" y2="310" stroke="#8b7355" stroke-width="2"/>
    <rect x="748" y="160" width="44" height="35" fill="#8b7355" stroke="#5d4a2f" stroke-width="2"/>
    <rect x="752" y="164" width="36" height="27" fill="#f5f0e8"/>
    <!-- Tiny red dot on canvas -->
    <circle cx="770" cy="178" r="3" fill="#E63946"/>
    <!-- New price tag -->
    <rect x="755" y="195" width="44" height="16" fill="#fff" stroke="#999" stroke-width="1"/>
    <text x="777" y="207" font-family="DejaVu Sans" font-size="9" text-anchor="middle" fill="#E63946">$11.7M</text>

    <!-- Sifaka body -->
    <ellipse cx="680" cy="245" rx="22" ry="28" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="680" cy="210" rx="18" ry="16" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="656" cy="205" rx="14" ry="16" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="704" cy="205" rx="14" ry="16" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="656" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="704" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes - wider, more haunted -->
    <ellipse cx="668" cy="210" rx="11" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="668" cy="211" r="9" fill="#1a1a1a"/>
    <circle cx="666" cy="208" r="2.5" fill="#fff"/>

    <ellipse cx="692" cy="210" rx="11" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="692" cy="211" r="9" fill="#1a1a1a"/>
    <circle cx="690" cy="208" r="2.5" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="680" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny open mouth - wonder/horror -->
    <ellipse cx="680" cy="226" rx="4" ry="3" fill="#4a4a4a" stroke="#3a3a3a" stroke-width="0.8"/>

    <!-- Ring tail with stripes -->
    <path d="M 658 250 Q 640 262 635 282 Q 630 302 640 318 Q 650 328 660 320 Q 655 300 656 282 Q 658 266 658 255" fill="url(#lem_fur_art91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="633" y="282" width="25" height="7" fill="#1a1a1a" rx="2"/>
    <rect x="632" y="296" width="25" height="7" fill="#1a1a1a" rx="2"/>
    <rect x="636" y="310" width="22" height="7" fill="#1a1a1a" rx="2"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="630" y="35" width="240" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="675,163 685,183 695,163" fill="#fff"/>
  <path d="M 675 165 L 685 185 L 695 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Does the dot</text>
  <text x="750" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">know it's</text>
  <text x="750" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">worth more</text>
  <text x="750" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">than me?</text>

</svg>