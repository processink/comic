<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_auth83v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_auth83v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_auth83v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_auth83v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding a sign that says "BE REAL" -->
  <g filter="url(#shadow_auth83v)">
    <!-- Body -->
    <ellipse cx="200" cy="222" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="172" rx="20" ry="23" fill="url(#hum_skin_auth83v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 157 Q 200 150 220 157 Q 218 162 214 164 Q 200 160 186 164 Q 182 162 180 157" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes earnest -->
    <ellipse cx="192" cy="172" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="192" cy="172" r="2" fill="#2a2a2a"/>
    <ellipse cx="208" cy="172" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="208" cy="172" r="2" fill="#2a2a2a"/>
    <!-- Nose and sincere smile -->
    <path d="M 200 177 L 200 180" stroke="#a8896d" stroke-width="1"/>
    <path d="M 194 185 Q 200 189 206 185" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Sign held up -->
    <rect x="150" y="240" width="100" height="50" fill="#f5f0e8" stroke="#8b7355" stroke-width="2"/>
    <text x="200" y="262" font-family="DejaVu Sans" font-size="16" font-weight="bold" text-anchor="middle" fill="#E63946">BE REAL</text>
    <text x="200" y="280" font-family="DejaVu Sans" font-size="10" text-anchor="middle" fill="#8b7355">™ authentic living</text>
    <!-- Stick -->
    <rect x="198" y="290" width="4" height="20" fill="#8b7355"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="40" y="25" width="320" height="108" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,131 200,151 210,131" fill="#fff"/>
  <line x1="190" y1="133" x2="200" y2="153" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="153" x2="210" y2="133" stroke="#333" stroke-width="2"/>

  <text x="200" y="52" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I've decided</text>
  <text x="200" y="78" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">to just be my</text>
  <text x="200" y="104" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">authentic self</text>
  <text x="200" y="126" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">now.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="310" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache -->
  <g filter="url(#shadow_auth83v)">
    <ellipse cx="130" cy="545" rx="18" ry="22" fill="url(#sq_fur_auth83v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="130" cy="513" rx="14" ry="13" fill="url(#sq_fur_auth83v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="118,500 122,475 126,502" fill="url(#sq_fur_auth83v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="134,502 138,475 142,500" fill="url(#sq_fur_auth83v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="120,500 122,481 124,501" fill="#cd853f"/>
    <polygon points="136,501 138,481 140,500" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="124" cy="515" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="125" cy="515" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="136" cy="515" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="137" cy="515" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="130" cy="520" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 126 523 Q 130 522 134 523" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 112 545 Q 98 550 93 565 Q 88 580 98 590 Q 108 597 116 587 Q 110 573 110 559 Q 110 551 112 545" fill="url(#sq_fur_auth83v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka -->
  <g filter="url(#shadow_auth83v)">
    <ellipse cx="270" cy="545" rx="22" ry="28" fill="url(#lem_fur_auth83v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="270" cy="515" rx="18" ry="16" fill="url(#lem_fur_auth83v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized ears -->
    <ellipse cx="247" cy="510" rx="13" ry="15" fill="url(#lem_fur_auth83v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="293" cy="510" rx="13" ry="15" fill="url(#lem_fur_auth83v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="247" cy="510" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="293" cy="510" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="259" cy="515" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="259" cy="516" r="8" fill="#1a1a1a"/>
    <circle cx="257" cy="514" r="2" fill="#fff"/>
    <ellipse cx="281" cy="515" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="281" cy="516" r="8" fill="#1a1a1a"/>
    <circle cx="279" cy="514" r="2" fill="#fff"/>
    <ellipse cx="270" cy="525" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 264 529 Q 270 530 276 529" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 290 550 Q 300 560 305 580 Q 308 595 303 610 Q 298 620 290 615 Q 285 605 288 590 Q 290 575 292 560 Q 292 553 290 550" fill="url(#lem_fur_auth83v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="295" y="575" width="14" height="6" fill="#1a1a1a"/>
    <rect x="295" y="587" width="14" height="6" fill="#1a1a1a"/>
    <rect x="293" y="599" width="12" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Sifaka speech bubble -->
  <rect x="190" y="340" width="175" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="260,473 270,493 280,473" fill="#fff"/>
  <line x1="260" y1="475" x2="270" y2="495" stroke="#333" stroke-width="2"/>
  <line x1="270" y1="495" x2="280" y2="475" stroke="#333" stroke-width="2"/>

  <text x="278" y="368" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Which</text>
  <text x="278" y="394" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">self is</text>
  <text x="278" y="420" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">that, the</text>
  <text x="278" y="446" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">third one?</text>

  <!-- Cache speech bubble -->
  <rect x="35" y="400" width="140" height="78" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="120,476 130,496 140,476" fill="#fff"/>
  <line x1="120" y1="478" x2="130" y2="498" stroke="#333" stroke-width="2"/>
  <line x1="130" y1="498" x2="140" y2="478" stroke="#333" stroke-width="2"/>

  <text x="105" y="432" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Fourth.</text>
  <text x="105" y="460" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">At least.</text>

  <!-- Panel 3 -->
  <rect x="10" y="640" width="380" height="310" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe now wearing a different outfit, holding a DIFFERENT sign, ring light -->
  <g filter="url(#shadow_auth83v)">
    <!-- Ring light circle -->
    <circle cx="200" cy="810" r="55" fill="none" stroke="#f0e6d6" stroke-width="8" opacity="0.5"/>
    <circle cx="200" cy="810" r="55" fill="none" stroke="#fff" stroke-width="3" opacity="0.8"/>

    <!-- Body - flannel pattern -->
    <ellipse cx="200" cy="860" rx="28" ry="35" fill="#8b4513" stroke="#6b3410" stroke-width="1.3"/>
    <!-- Flannel lines -->
    <line x1="178" y1="840" x2="178" y2="890" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>
    <line x1="190" y1="835" x2="190" y2="895" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>
    <line x1="202" y1="835" x2="202" y2="895" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>
    <line x1="214" y1="835" x2="214" y2="895" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>

    <!-- Head -->
    <ellipse cx="200" cy="805" rx="20" ry="23" fill="url(#hum_skin_auth83v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Beanie -->
    <path d="M 178 795 Q 180 780 200 775 Q 220 780 222 795 L 178 795 Z" fill="#5a5a5a" stroke="#3a3a3a" stroke-width="1.2"/>
    <rect x="178" y="793" width="44" height="6" fill="#4a4a4a" stroke="#3a3a3a" stroke-width="0.8"/>

    <!-- Eyes looking at phone -->
    <ellipse cx="192" cy="805" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="193" cy="805" r="2" fill="#2a2a2a"/>
    <ellipse cx="208" cy="805" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="209" cy="805" r="2" fill="#2a2a2a"/>
    <!-- Duck lips -->
    <ellipse cx="200" cy="816" rx="5" ry="3" fill="#d4a08a" stroke="#a8896d" stroke-width="0.8"/>

    <!-- Phone held up taking selfie -->
    <rect x="160" y="835" width="20" height="32" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="162" y="838" width="16" height="26" fill="#4a86c7"/>
    <!-- Tiny face on phone screen -->
    <circle cx="170" cy="848" r="4" fill="#f5d3b8"/>

    <!-- New sign leaning against him -->
    <rect x="215" y="878" width="80" height="40" fill="#f5f0e8" stroke="#8b7355" stroke-width="1.5" transform="rotate(12 255 898)"/>
    <text x="255" y="896" font-family="DejaVu Sans" font-size="11" font-weight="bold" text-anchor="middle" fill="#E63946" transform="rotate(12 255 896)">NO FILTER</text>
    <text x="255" y="908" font-family="DejaVu Sans" font-size="8" text-anchor="middle" fill="#8b7355" transform="rotate(12 255 908)">#vulnerable</text>
  </g>

  <!-- Abe speech bubble panel 3 -->
  <rect x="40" y="655" width="320" height="108" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,761 200,781 210,761" fill="#fff"/>
  <line x1="190" y1="763" x2="200" y2="783" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="783" x2="210" y2="763" stroke="#333" stroke-width="2"/>

  <text x="200" y="682" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Okay but</text>
  <text x="200" y="708" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">first let me</text>
  <text x="200" y="734" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">photograph my</text>
  <text x="200" y="756" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">authenticity.</text>
</svg>