<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_lzg41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe scrolling phone, looking excited -->
  <g filter="url(#shadow_lzg41)">
    <!-- Body -->
    <ellipse cx="150" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="150" cy="185" rx="20" ry="23" fill="url(#hum_skin_lzg41)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 130 168 Q 150 161 170 168 Q 168 173 164 175 Q 150 171 136 175 Q 132 173 130 168" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Excited eyes -->
    <ellipse cx="142" cy="185" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="185" r="2.2" fill="#2a2a2a"/>
    <circle cx="141" cy="184" r="0.7" fill="#fff"/>
    <ellipse cx="158" cy="185" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="185" r="2.2" fill="#2a2a2a"/>
    <circle cx="157" cy="184" r="0.7" fill="#fff"/>

    <!-- Raised eyebrows -->
    <path d="M 137 178 Q 142 175 147 177" fill="none" stroke="#3a2618" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 153 177 Q 158 175 163 178" fill="none" stroke="#3a2618" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Nose and smile -->
    <path d="M 150 190 L 150 193" stroke="#a8896d" stroke-width="1"/>
    <path d="M 144 198 Q 150 202 156 198" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Arm holding phone -->
    <path d="M 170 220 Q 185 210 188 195" fill="none" stroke="url(#hum_skin_lzg41)" stroke-width="11" stroke-linecap="round"/>

    <!-- Phone -->
    <rect x="180" y="185" width="32" height="52" rx="4" fill="#1a1a1a" stroke="#333" stroke-width="1.2"/>
    <rect x="183" y="190" width="26" height="40" fill="#4a86c7"/>
    <text x="196" y="205" font-family="DejaVu Sans" font-size="5.5" text-anchor="middle" fill="#fff">#lazygirl</text>
    <text x="196" y="213" font-family="DejaVu Sans" font-size="5.5" text-anchor="middle" fill="#fff">jobs 🔥</text>
    <text x="196" y="224" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#ffcc00">❤ 2.4M</text>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="30" y="30" width="230" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,138 150,155 160,138" fill="#fff"/>
  <path d="M 140,140 L 150,157 L 160,140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="145" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">This trend is</text>
  <text x="145" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">genius. Just</text>
  <text x="145" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">do less. Get</text>
  <text x="145" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">paid. Live.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache half-lidded, unimpressed, on a branch -->
  <g filter="url(#shadow_lzg41)">
    <!-- Branch -->
    <rect x="370" y="260" width="160" height="8" rx="3" fill="#8b6842" stroke="#6b4832" stroke-width="1"/>

    <!-- Body -->
    <ellipse cx="450" cy="230" rx="18" ry="22" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="450" cy="205" rx="14" ry="13" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="440,196 437,175 445,193" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="460,196 463,175 455,193" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="440,196 438,180 444,194" fill="#cd853f"/>
    <polygon points="460,196 462,180 456,194" fill="#cd853f"/>

    <!-- Half-lidded skeptical eyes -->
    <ellipse cx="444" cy="207" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="208" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="207" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="208" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="450" cy="212" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Flat mouth -->
    <path d="M 446 215 L 454 215" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail curving up -->
    <path d="M 430 235 Q 415 240 408 255 Q 403 270 412 278 Q 421 285 428 275 Q 423 260 425 248 Q 427 240 430 235" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="330" y="30" width="240" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,163 450,180 460,163" fill="#fff"/>
  <path d="M 440,165 L 450,182 L 460,165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So the viral</text>
  <text x="450" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">rebellion</text>
  <text x="450" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">against hustle</text>
  <text x="450" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">culture... is</text>
  <text x="450" y="153" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">content?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring into middle distance, enormous eyes -->
  <g filter="url(#shadow_lzg41)">
    <!-- Body -->
    <ellipse cx="750" cy="245" rx="22" ry="28" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="750" cy="212" rx="18" ry="16" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="207" rx="14" ry="16" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="207" rx="14" ry="16" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="207" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="207" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="738" cy="212" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="213" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="211" r="2.5" fill="#fff"/>

    <ellipse cx="762" cy="212" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="213" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="211" r="2.5" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="222" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Tiny neutral mouth -->
    <path d="M 746 226 L 754 226" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes - MUST BE VISIBLE -->
    <path d="M 730 250 Q 720 260 715 278 Q 710 296 715 310 Q 720 318 728 312 Q 724 296 722 280 Q 723 268 730 255" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <!-- Tail stripes -->
    <path d="M 716 280 Q 720 278 724 281" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 714 290 Q 718 288 722 291" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 715 300 Q 719 298 723 301" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 717 310 Q 721 308 725 311" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="630" y="28" width="248" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,166 750,183 760,166" fill="#fff"/>
  <path d="M 740,168 L 750,185 L 760,168" fill="none" stroke="#333" stroke-width="2"/>

  <text x="754" y="55" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The people</text>
  <text x="754" y="79" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">posting about</text>
  <text x="754" y="103" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">not working...</text>
  <text x="754" y="127" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is that their</text>
  <text x="754" y="151" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">job?</text>

</svg>