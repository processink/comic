<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_ap92" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_ap92" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_ap92" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_ap92">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe in gallery, looking at art on wall -->
  <g filter="url(#shadow_ap92)">
    <!-- Gallery wall art piece - red square -->
    <rect x="155" y="155" width="90" height="70" fill="#f0ece4" stroke="#999" stroke-width="1"/>
    <rect x="170" y="165" width="60" height="50" fill="#E63946"/>
    <!-- Tiny label -->
    <rect x="185" y="230" width="30" height="6" fill="#e8e0d0"/>
    <text x="200" y="235" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#666">COLLAPSE III</text>

    <!-- Abe body -->
    <rect x="65" y="225" width="40" height="15" fill="url(#hum_skin_ap92)"/>
    <rect x="55" y="240" width="60" height="50" rx="4" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.2"/>

    <!-- Abe head -->
    <circle cx="85" cy="200" r="24" fill="url(#hum_skin_ap92)" stroke="#c8a882" stroke-width="1.2"/>

    <!-- Hair -->
    <path d="M 61 187 Q 75 175 90 175 Q 105 175 109 187 Q 107 191 103 193 Q 90 185 75 185 Q 67 187 63 191 Z" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes looking at art -->
    <ellipse cx="77" cy="199" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="79" cy="200" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="95" cy="199" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="97" cy="200" r="2.5" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <path d="M 86 205 L 86 209" stroke="#a8896d" stroke-width="1"/>
    <path d="M 80 214 Q 86 216 92 214" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Ground line -->
    <line x1="30" y1="295" x2="275" y2="295" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="30" width="220" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="80,143 90,158 100,143" fill="#fff"/>
  <path d="M 80,145 L 90,160 L 100,145" fill="none" stroke="#333" stroke-width="2"/>

  <text x="145" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Art Paris says</text>
  <text x="145" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the big idea</text>
  <text x="145" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">this year is</text>
  <text x="145" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">"fragility."</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on gallery bench -->
  <g filter="url(#shadow_ap92)">
    <!-- Bench -->
    <rect x="365" y="265" width="90" height="10" fill="#c4a882" stroke="#8b7355" stroke-width="1"/>
    <rect x="375" y="275" width="8" height="20" fill="#8b7355"/>
    <rect x="437" y="275" width="8" height="20" fill="#8b7355"/>

    <!-- Cache body on bench -->
    <ellipse cx="410" cy="250" rx="18" ry="20" fill="url(#sq_fur_ap92)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Cache head -->
    <ellipse cx="410" cy="228" rx="14" ry="13" fill="url(#sq_fur_ap92)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="403" cy="222" rx="6" ry="11" fill="url(#sq_fur_ap92)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 403 222)"/>
    <ellipse cx="417" cy="222" rx="6" ry="11" fill="url(#sq_fur_ap92)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 417 222)"/>
    <ellipse cx="403" cy="225" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 403 225)"/>
    <ellipse cx="417" cy="225" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 417 225)"/>

    <!-- Ear tufts -->
    <path d="M 400 217 Q 397 211 399 209" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 420 217 Q 423 211 421 209" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="404" cy="230" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="404" cy="231" r="2" fill="#1a1a1a"/>
    <ellipse cx="416" cy="230" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="416" cy="231" r="2" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="410" cy="235" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Simple flat mouth -->
    <path d="M 405 238 L 415 238" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="398" y1="232" x2="385" y2="231" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="398" y1="235" x2="387" y2="236" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="422" y1="232" x2="435" y2="231" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="422" y1="235" x2="433" y2="236" stroke="#1a1a1a" stroke-width="0.7"/>

    <!-- Fluffy tail -->
    <path d="M 426 247 Q 448 238 462 225 Q 468 216 464 210 Q 459 216 451 225 Q 438 238 426 245 Z" fill="url(#sq_fur_ap92)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Ground line -->
    <line x1="330" y1="295" x2="575" y2="295" stroke="#ccc" stroke-width="1"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="335" y="30" width="230" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="400,168 410,183 420,168" fill="#fff"/>
  <path d="M 400,170 L 410,185 L 420,170" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Last year it</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">was "urgency."</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Before that,</text>
  <text x="450" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">"resilience."</text>
  <text x="450" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">See a pattern?</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring at blank white wall -->
  <g filter="url(#shadow_ap92)">
    <!-- Sifaka body -->
    <ellipse cx="720" cy="240" rx="22" ry="28" fill="url(#lem_fur_ap92)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Sifaka head -->
    <ellipse cx="720" cy="210" rx="18" ry="16" fill="url(#lem_fur_ap92)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="695" cy="205" rx="14" ry="16" fill="url(#lem_fur_ap92)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="745" cy="205" rx="14" ry="16" fill="url(#lem_fur_ap92)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="695" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="745" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="708" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="708" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="706" cy="208" r="2" fill="#fff"/>

    <ellipse cx="732" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="732" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="730" cy="208" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="720" cy="218" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Mouth -->
    <path d="M 713 222 Q 720 223 727 222" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 700 245 Q 690 255 685 275 Q 680 290 685 300 Q 690 310 700 312 Q 710 310 715 300 Q 710 280 710 260 Q 710 252 705 247" fill="url(#lem_fur_ap92)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="683" y="270" width="28" height="7" fill="#1a1a1a"/>
    <rect x="683" y="284" width="28" height="7" fill="#1a1a1a"/>
    <rect x="685" y="298" width="24" height="7" fill="#1a1a1a"/>

    <!-- Ground line -->
    <line x1="630" y1="295" x2="875" y2="295" stroke="#ccc" stroke-width="1"/>

    <!-- Empty wall spot where art should be - just two small nail holes -->
    <circle cx="820" cy="200" r="1.5" fill="#999"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="635" y="30" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="715,148 725,163 735,148" fill="#fff"/>
  <path d="M 715,150 L 725,165 L 735,150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The big idea</text>
  <text x="750" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is always a</text>
  <text x="750" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">synonym for</text>
  <text x="750" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">"expensive."</text>

</svg>