<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_lzg41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a tiny throne of acorns -->
  <g filter="url(#shadow_lzg41)">
    <!-- Acorn throne base -->
    <ellipse cx="150" cy="290" rx="50" ry="18" fill="#8b6842" stroke="#6b4832" stroke-width="1.5"/>
    <ellipse cx="130" cy="280" rx="8" ry="10" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <ellipse cx="150" cy="278" rx="8" ry="10" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <ellipse cx="170" cy="280" rx="8" ry="10" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <ellipse cx="140" cy="268" rx="7" ry="9" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <ellipse cx="160" cy="268" rx="7" ry="9" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <!-- Acorn caps -->
    <path d="M 126 274 Q 130 270 134 274" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>
    <path d="M 146 272 Q 150 268 154 272" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>
    <path d="M 166 274 Q 170 270 174 274" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>
    <path d="M 136 262 Q 140 258 144 262" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>
    <path d="M 156 262 Q 160 258 164 262" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>

    <!-- Cache body - lounging regally -->
    <ellipse cx="150" cy="235" rx="20" ry="25" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="150" cy="205" rx="16" ry="15" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="138,195 132,170 144,192" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="162,195 168,170 156,192" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="139,193 135,175 143,192" fill="#cd853f"/>
    <polygon points="161,193 165,175 157,192" fill="#cd853f"/>

    <!-- Half-lidded smug eyes -->
    <ellipse cx="143" cy="206" rx="4.5" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="144" cy="207" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="157" cy="206" rx="4.5" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="207" r="1.8" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <ellipse cx="150" cy="212" rx="1.8" ry="1.3" fill="#1a1a1a"/>
    <path d="M 146 215 Q 150 214 154 215" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail curled up like scepter -->
    <path d="M 170 240 Q 185 230 190 215 Q 195 200 188 190 Q 182 183 175 188 Q 180 198 178 212 Q 176 225 170 235" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tiny phone in paw -->
    <rect x="128" y="225" width="14" height="22" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="130" y="228" width="10" height="16" fill="#4a86c7"/>
    <text x="135" y="237" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#fff">TikTok</text>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="30" y="30" width="245" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,148 150,165 160,148" fill="#fff"/>
  <path d="M 140,150 L 150,167 L 160,150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="152" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I invented</text>
  <text x="152" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the lazy girl</text>
  <text x="152" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">job. I'm a</text>
  <text x="152" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">squirrel.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka standing, enormous eyes, tail visible -->
  <g filter="url(#shadow_lzg41)">
    <!-- Body -->
    <ellipse cx="450" cy="245" rx="22" ry="30" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="450" cy="210" rx="18" ry="17" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized round ears -->
    <ellipse cx="428" cy="203" rx="13" ry="15" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="472" cy="203" rx="13" ry="15" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="428" cy="203" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="472" cy="203" rx="7" ry="9" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="440" cy="210" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="440" cy="211" r="8" fill="#1a1a1a"/>
    <circle cx="438" cy="208" r="2.5" fill="#fff"/>
    <circle cx="442" cy="213" r="1" fill="#fff"/>

    <ellipse cx="460" cy="210" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="460" cy="211" r="8" fill="#1a1a1a"/>
    <circle cx="458" cy="208" r="2.5" fill="#fff"/>
    <circle cx="462" cy="213" r="1" fill="#fff"/>

    <!-- Dark eye patches -->
    <ellipse cx="440" cy="210" rx="12" ry="14" fill="none" stroke="#888" stroke-width="0.5"/>
    <ellipse cx="460" cy="210" rx="12" ry="14" fill="none" stroke="#888" stroke-width="0.5"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="222" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 445 226 Q 450 227 455 226" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes - MUST BE VISIBLE -->
    <path d="M 428 250 Q 418 260 413 278 Q 408 296 413 312 Q 418 322 425 318 Q 420 300 418 285 Q 416 270 420 260 Q 424 252 428 248" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Tail stripes -->
    <path d="M 417 268 Q 414 268 412 270" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 415 278 Q 412 279 410 281" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 414 288 Q 411 289 409 292" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 414 298 Q 411 300 410 303" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 416 308 Q 414 310 413 313" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="330" y="30" width="245" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,158 450,175 460,158" fill="#fff"/>
  <path d="M 440,160 L 450,177 L 460,160" fill="none" stroke="#333" stroke-width="2"/>

  <text x="452" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">But don't</text>
  <text x="452" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">squirrels work</text>
  <text x="452" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">all fall to</text>
  <text x="452" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">survive winter?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache - existential crisis face, phone dropped -->
  <g filter="url(#shadow_lzg41)">
    <!-- Dropped phone on ground -->
    <rect x="700" y="300" width="14" height="22" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1" transform="rotate(35 707 311)"/>

    <!-- Cache body - slumped -->
    <ellipse cx="730" cy="250" rx="20" ry="25" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="730" cy="218" rx="16" ry="15" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears - drooped slightly -->
    <polygon points="718,210 710,186 724,207" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="742,210 750,186 736,207" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="719,208 713,190 723,207" fill="#cd853f"/>
    <polygon points="741,208 747,190 737,207" fill="#cd853f"/>

    <!-- Wide open shocked eyes -->
    <ellipse cx="723" cy="219" rx="5" ry="5.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="723" cy="220" r="3" fill="#1a1a1a"/>
    <circle cx="722" cy="218" r="1" fill="#fff"/>
    <ellipse cx="737" cy="219" rx="5" ry="5.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="737" cy="220" r="3" fill="#1a1a1a"/>
    <circle cx="736" cy="218" r="1" fill="#fff"/>

    <!-- Nose and flat mouth -->
    <ellipse cx="730" cy="226" rx="1.8" ry="1.3" fill="#1a1a1a"/>
    <path d="M 725 230 L 735 230" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Fluffy tail drooped -->
    <path d="M 750 255 Q 765 265 770 280 Q 775 295 768 305 Q 760 312 752 305 Q 758 292 756 278 Q 754 265 750 258" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="625" y="25" width="255" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="720,168 730,188 740,168" fill="#fff"/>
  <path d="M 720,170 L 730,190 L 740,170" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="53" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Oh god.</text>
  <text x="752" y="78" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The hustle</text>
  <text x="752" y="103" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">was never a</text>
  <text x="752" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">trend. It was</text>
  <text x="752" y="153" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">biology.</text>

  <!-- Tiny "process.ink" signature -->
  <text x="880" y="345" font-family="DejaVu Sans" font-size="9" text-anchor="end" fill="#999">process.ink</text>
</svg>