    <circle cx="490" cy="217" r="7" fill="#1a1a1a"/>
    <circle cx="488" cy="215" r="1.8" fill="#fff"/>
    <ellipse cx="510" cy="216" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="510" cy="217" r="7" fill="#1a1a1a"/>
    <circle cx="508" cy="215" r="1.8" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="500" cy="224" rx="1.8" ry="1.3" fill="#1a1a1a"/>
    <!-- Tiny mouth -->
    <path d="M 496 228 Q 500 229 504 228" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 520 250 Q 532 260 538 278 Q 542 296 536 310 Q 530 318 522 315 Q 518 305 520 290 Q 522 275 520 260" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <path d="M 533 280 Q 537 282 536 288" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 530 290 Q 535 293 534 299" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
    <path d="M 527 301 Q 531 304 529 310" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble - Cache -->
  <rect x="335" y="35" width="230" height="85" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="390,118 400,136 410,118" fill="#fff"/>
  <path d="M 392,120 L 400,136 L 408,120" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Have you</text>
  <text x="450" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">sold it?</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe confused/defensive -->
  <g filter="url(#shadow_cr91)">
    <!-- Body -->
    <ellipse cx="700" cy="248" rx="26" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="700" cy="198" rx="20" ry="23" fill="url(#hum_skin_cr91)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 680 185 Q 700 178 720 185 Q 718 190 714 192 Q 700 188 686 192 Q 682 190 680 185" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Confused eyes -->
    <ellipse cx="692" cy="198" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="692" cy="199" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="708" cy="198" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="708" cy="199" r="2.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <path d="M 700 204 L 700 207" stroke="#a8896d" stroke-width="1"/>
    <!-- Confused frown -->
    <path d="M 694 214 Q 700 211 706 214" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Sifaka in panel 3, staring -->
  <g filter="url(#shadow_cr91)">
    <!-- Body -->
    <ellipse cx="790" cy="252" rx="18" ry="22" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="790" cy="228" rx="14" ry="13" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="772" cy="224" rx="10" ry="12" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="808" cy="224" rx="10" ry="12" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="772" cy="224" rx="6" ry="7" fill="#f5b5c5"/>
    <ellipse cx="808" cy="224" rx="6" ry="7" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="782" cy="228" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="782" cy="229" r="6" fill="#1a1a1a"/>
    <circle cx="780" cy="227" r="1.5" fill="#fff"/>
    <ellipse cx="798" cy="228" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="798" cy="229" r="6" fill="#1a1a1a"/>
    <circle cx="796" cy="227" r="1.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="790" cy="236" rx="1.5" ry="1" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 786 239 Q 790 240 794 239" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail -->
    <path d="M 808 258 Q 818 268 823 283 Q 826 298 820 310 Q 814 316 808 312 Q 806 300 808 285 Q 809 272 808 262" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <path d="M 820 286 Q 824 289 822 295" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 817 297 Q 821 300 819 306" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Abe speech bubble -->
  <rect x="638" y="35" width="210" height="60" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="690,93 700,110 710,93" fill="#fff"/>
  <path d="M 692,95 L 700,110 L 708,95" fill="none" stroke="#333" stroke-width="2"/>

  <text x="743" y="60" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Why would I</text>
  <text x="743" y="85" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">sell it?</text>

  <!-- Sifaka speech bubble -->
  <rect x="720" y="130" width="160" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="785,208 790,222 795,208" fill="#fff"/>
  <path d="M 787,210 L 790,222 L 793,210" fill="none" stroke="#333" stroke-width="2"/>

  <text x="800" y="157" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So you're</text>
  <text x="800" y="182" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">rich the way</text>
  <text x="800" y="204" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">a dream is.</text>

</svg>