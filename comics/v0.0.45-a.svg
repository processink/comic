    <!-- Tall triangle ears -->
    <ellipse cx="393" cy="220" rx="6" ry="11" fill="url(#sq_fur_cr91)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 393 220)"/>
    <ellipse cx="407" cy="220" rx="6" ry="11" fill="url(#sq_fur_cr91)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 407 220)"/>
    <ellipse cx="393" cy="223" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 393 223)"/>
    <ellipse cx="407" cy="223" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 407 223)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="394" cy="228" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="395" cy="228" r="1.8" fill="#1a1a1a"/>
    <path d="M 390 226 L 398 226" stroke="#5d4a2f" stroke-width="1.5"/>
    <ellipse cx="406" cy="228" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="407" cy="228" r="1.8" fill="#1a1a1a"/>
    <path d="M 402 226 L 410 226" stroke="#5d4a2f" stroke-width="1.5"/>
