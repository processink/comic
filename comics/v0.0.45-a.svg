<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_cr91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_cr91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_cr91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_cr91">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe excited, holding phone -->
  <g filter="url(#shadow_cr91)">
    <!-- Body -->
    <ellipse cx="150" cy="248" rx="26" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="198" rx="20" ry="23" fill="url(#hum_skin_cr91)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 185 Q 150 178 170 185 Q 168 190 164 192 Q 150 188 136 192 Q 132 190 130 185" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Excited eyes -->
    <ellipse cx="142" cy="198" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="198" r="2.5" fill="#1a1a1a"/>
    <circle cx="141" cy="197" r="0.7" fill="#fff"/>
    <ellipse cx="158" cy="198" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="198" r="2.5" fill="#1a1a1a"/>
    <circle cx="157" cy="197" r="0.7" fill="#fff"/>
    <!-- Nose -->
    <path d="M 150 204 L 150 207" stroke="#a8896d" stroke-width="1"/>
    <!-- Excited smile -->
    <path d="M 144 213 Q 150 218 156 213" fill="none" stroke="#8a6d51" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Arm holding phone -->
    <ellipse cx="172" cy="235" rx="7" ry="18" fill="url(#hum_skin_cr91)" stroke="#c8a882" stroke-width="1" transform="rotate(15 172 235)"/>
    <!-- Phone -->
    <rect x="168" y="242" width="18" height="28" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="170" y="244" width="14" height="22" fill="#2d8a4e"/>
    <!-- Green arrow up on phone -->
    <polygon points="177,260 173,254 175,254 175,250 179,250 179,254 181,254" fill="#7cfc00"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="35" width="230" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,143 155,160 165,143" fill="#fff"/>
  <path d="M 147,145 L 155,160 L 163,145" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I put my</text>
  <text x="150" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">savings into</text>
  <text x="150" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">crypto. It's</text>
  <text x="150" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">up 400%.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache half-lidded, unimpressed -->
