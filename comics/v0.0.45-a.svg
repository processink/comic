    <ellipse cx="400" cy="233" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 396 236 L 404 236" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 380 253 Q 366 258 361 273 Q 356 288 366 298 Q 376 308 386 298 Q 381 283 381 268 Q 381 260 380 253" fill="url(#sq_fur_cr91)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_cr91)">
    <!-- Body -->
    <ellipse cx="500" cy="245" rx="20" ry="26" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="500" cy="216" rx="16" ry="15" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized round ears -->
    <ellipse cx="478" cy="212" rx="12" ry="14" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="522" cy="212" rx="12" ry="14" fill="url(#lem_fur_cr91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="478" cy="212" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="522" cy="212" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
