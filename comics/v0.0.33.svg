<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_art41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_art41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_art41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_art41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- ==================== PANEL 1 ==================== -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding newspaper, looking pleased -->
  <g filter="url(#shadow_art41)">
    <!-- Body -->
    <ellipse cx="150" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="180" rx="20" ry="23" fill="url(#hum_skin_art41)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 165 Q 150 158 170 165 Q 168 170 164 172 Q 150 168 136 172 Q 132 170 130 165" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes looking at newspaper -->
    <ellipse cx="142" cy="178" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="143" cy="179" r="2.2" fill="#1a1a1a"/>
    <ellipse cx="158" cy="178" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="159" cy="179" r="2.2" fill="#1a1a1a"/>
    <!-- Pleased smile -->
    <path d="M 143 192 Q 150 197 157 192" fill="none" stroke="#8a6d51" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left arm holding newspaper -->
    <path d="M 122 230 Q 108 225 100 218" stroke="#4a6d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Right arm holding newspaper -->
    <path d="M 178 230 Q 192 225 200 218" stroke="#4a6d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="98" cy="217" r="6" fill="url(#hum_skin_art41)" stroke="#c8a882" stroke-width="1"/>
    <circle cx="202" cy="217" r="6" fill="url(#hum_skin_art41)" stroke="#c8a882" stroke-width="1"/>
    <!-- Newspaper -->
    <rect x="88" y="200" width="124" height="30" fill="#f5f0e0" stroke="#8a8a7a" stroke-width="1"/>
    <text x="150" y="214" font-family="DejaVu Sans" font-size="7" text-anchor="middle" fill="#333" font-weight="bold">ART MARKET TIMES</text>
    <text x="150" y="224" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#555">RECORD GROWTH Q4</text>
    <!-- Legs -->
    <rect x="137" y="265" width="12" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <rect x="153" y="265" width="12" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <!-- Shoes -->
    <ellipse cx="143" cy="298" rx="10" ry="5" fill="#3a2a1a"/>
    <ellipse cx="159" cy="298" rx="10" ry="5" fill="#3a2a1a"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="45" y="35" width="210" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="143,138 153,158 163,138" fill="#fff"/>
  <path d="M 143 140 L 153 160 L 163 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The art market</text>
  <text x="150" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is back!</text>
  <text x="150" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Culture wins.</text>

  <!-- ==================== PANEL 2 ==================== -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting, half-lidded, not smoking -->
  <g filter="url(#shadow_art41)">
    <!-- Body -->
    <ellipse cx="450" cy="240" rx="18" ry="22" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="215" rx="15" ry="14" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="438,205 434,180 444,202" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="462,205 466,180 456,202" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="439,203 436,185 443,201" fill="#cd853f"/>
    <polygon points="461,203 464,185 457,201" fill="#cd853f"/>
    <!-- Half-lidded skeptical eyes -->
    <ellipse cx="444" cy="216" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="217" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="216" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="217" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="450" cy="221" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat unimpressed mouth -->
    <path d="M 446 225 L 454 225" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 430 245 Q 415 250 410 265 Q 405 280 415 290 Q 425 300 435 290 Q 430 275 430 260 Q 430 252 430 245" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Arms crossed -->
    <path d="M 435 235 Q 440 240 455 238" stroke="#5d4a2f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 465 235 Q 460 240 445 238" stroke="#5d4a2f" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="340" y="35" width="225" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="443,163 453,183 463,163" fill="#fff"/>
  <path d="M 443 165 L 453 185 L 463 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="452" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Which part.</text>
  <text x="452" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The art or</text>
  <text x="452" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the market.</text>
  <text x="452" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Pick one.</text>

  <!-- ==================== PANEL 3 ==================== -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring at a framed blank canvas with a price tag -->
  <g filter="url(#shadow_art41)">
    <!-- Framed "artwork" on wall — completely blank -->
    <rect x="700" y="120" width="80" height="100" fill="#c8a060" stroke="#8b6f47" stroke-width="3"/>
    <rect x="710" y="130" width="60" height="80" fill="#fff" stroke="#a89070" stroke-width="1"/>
    <!-- Price tag -->
    <rect x="748" y="205" width="45" height="20" fill="#fff" stroke="#888" stroke-width="1" transform="rotate(12 770 215)"/>
    <text x="770" y="219" font-family="DejaVu Sans" font-size="8" text-anchor="middle" fill="#E63946" transform="rotate(12 770 215)">$4.2M</text>

    <!-- Sifaka staring at it -->
    <ellipse cx="670" cy="245" rx="22" ry="28" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="670" cy="215" rx="18" ry="16" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized round ears -->
    <ellipse cx="645" cy="210" rx="14" ry="16" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="695" cy="210" rx="14" ry="16" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="645" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="695" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes staring at blank canvas -->
    <ellipse cx="658" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="660" cy="216" r="8" fill="#1a1a1a"/>
    <circle cx="658" cy="214" r="2" fill="#fff"/>
    <ellipse cx="682" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="684" cy="216" r="8" fill="#1a1a1a"/>
    <circle cx="682" cy="214" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="670" cy="223" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Small neutral mouth -->
    <path d="M 665 227 Q 670 228 675 227" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 648 250 Q 638 260 633 280 Q 628 300 635 312 Q 642 320 655 315 Q 650 295 650 275 Q 650 260 648 250" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="630" y="280" width="22" height="7" fill="#1a1a1a"/>
    <rect x="630" y="293" width="22" height="7" fill="#1a1a1a"/>
    <rect x="630" y="306" width="22" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="630" y="35" width="245" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="663,163 673,183 683,163" fill="#fff"/>
  <path d="M 663 165 L 673 185 L 683 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Is the canvas</text>
  <text x="752" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">worth more</text>
  <text x="752" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">empty or is</text>
  <text x="752" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">everything?</text>
</svg>