<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_vc47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_vc47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_vc47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_vc47">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe at computer, excited -->
  <g filter="url(#shadow_vc47)">
    <!-- Computer/monitor -->
    <rect x="100" y="205" width="65" height="42" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1.2"/>
    <rect x="103" y="208" width="59" height="33" fill="#1a1a2e"/>
    <rect x="95" y="247" width="78" height="4" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Terminal text on screen -->
    <text x="106" y="220" font-family="DejaVu Sans" font-size="6" fill="#00ff88">$ claude code</text>
    <text x="106" y="229" font-family="DejaVu Sans" font-size="6" fill="#00ff88">Refactoring...</text>
    <text x="106" y="238" font-family="DejaVu Sans" font-size="6" fill="#00ff88">✓ Done (0.3s)</text>

    <!-- Abe body -->
    <rect x="185" y="200" width="45" height="55" rx="4" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.2"/>

    <!-- Abe head -->
    <ellipse cx="207" cy="175" rx="20" ry="22" fill="url(#hum_skin_vc47)" stroke="#c8a882" stroke-width="1.2"/>

    <!-- Hair -->
    <path d="M 187 163 Q 200 152 220 155 Q 227 158 227 165 Q 223 160 207 157 Q 193 158 187 163" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Happy eyes -->
    <path d="M 198 172 Q 201 169 204 172" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 210 172 Q 213 169 216 172" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 200 183 Q 207 189 214 183" fill="none" stroke="#8a6d51" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Arms on keyboard -->
    <path d="M 185 215 Q 170 220 155 230" fill="none" stroke="url(#hum_skin_vc47)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 230 215 Q 235 220 240 230" fill="none" stroke="url(#hum_skin_vc47)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="40" y="25" width="320" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="193,138 203,155 213,138" fill="#fff"/>
  <path d="M 193 140 L 203 157 L 213 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="54" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">I told Claude</text>
  <text x="200" y="80" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">to refactor my</text>
  <text x="200" y="106" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">whole codebase.</text>
  <text x="200" y="132" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">Three seconds.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking unimpressed -->
  <g filter="url(#shadow_vc47)">
    <!-- Body -->
    <ellipse cx="200" cy="545" rx="18" ry="20" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="523" rx="14" ry="13" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="193" cy="516" rx="6" ry="12" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-12 193 516)"/>
    <ellipse cx="207" cy="516" rx="6" ry="12" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(12 207 516)"/>
    <ellipse cx="193" cy="519" rx="3" ry="7" fill="#cd853f" transform="rotate(-12 193 519)"/>
    <ellipse cx="207" cy="519" rx="3" ry="7" fill="#cd853f" transform="rotate(12 207 519)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="194" cy="525" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="525" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="206" cy="525" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="525" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="200" cy="530" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 195 534 L 205 534" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 180 550 Q 165 555 160 570 Q 155 585 165 595 Q 175 605 185 595 Q 180 580 180 565 Q 180 557 180 550" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Accent color detail: small red error indicator on Cache's side -->
  <circle cx="305" cy="600" r="4" fill="#E63946"/>
  <text x="305" y="618" font-family="DejaVu Sans" font-size="8" text-anchor="middle" fill="#E63946">ERROR</text>

  <!-- Speech bubble panel 2 -->
  <rect x="40" y="335" width="320" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="192,478 202,495 212,478" fill="#fff"/>
  <path d="M 192 480 L 202 497 L 212 480" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="364" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">I told Codex</text>
  <text x="200" y="390" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">to fix a typo.</text>
  <text x="200" y="416" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">It said my repo</text>
  <text x="200" y="442" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">was "heavily</text>
  <text x="200" y="468" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">dirty."</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes, looking up -->
  <g filter="url(#shadow_vc47)">
    <!-- Body -->
    <ellipse cx="200" cy="870" rx="22" ry="28" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="840" rx="18" ry="16" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="175" cy="835" rx="14" ry="16" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="835" rx="14" ry="16" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="835" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="835" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes looking upward -->
    <ellipse cx="188" cy="840" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="838" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="836" r="2" fill="#fff"/>

    <ellipse cx="212" cy="840" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="838" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="836" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="200" cy="848" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Slight open mouth -->
    <path d="M 194 852 Q 200 855 206 852" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 180 875 Q 170 885 165 905 Q 160 925 165 940 Q 170 950 180 945 Q 175 925 175 905 Q 175 890 180 880" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="165" y="905" width="15" height="7" fill="#1a1a1a"/>
    <rect x="165" y="919" width="15" height="7" fill="#1a1a1a"/>
    <rect x="165" y="933" width="15" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="40" y="645" width="320" height="155" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="192,798 202,815 212,798" fill="#fff"/>
  <path d="M 192 800 L 202 817 L 212 800" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="674" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">Isn't that what</text>
  <text x="200" y="700" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">every roommate</text>
  <text x="200" y="726" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">says before</text>
  <text x="200" y="752" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">they refuse to</text>
  <text x="200" y="778" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">do the dishes?</text>
</svg>