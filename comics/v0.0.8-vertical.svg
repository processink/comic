<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_dt41v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_dt41v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_dt41v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_dt41v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e4dc"/>

  <!-- ======== PANEL 1 ======== -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe on phone -->
  <g filter="url(#shadow_dt41v)">
    <!-- Body -->
    <ellipse cx="200" cy="230" rx="30" ry="38" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="175" rx="22" ry="25" fill="url(#hum_skin_dt41v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 178 160 Q 200 150 222 160 Q 220 165 216 167 Q 200 162 184 167 Q 180 165 178 160" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes looking at phone -->
    <ellipse cx="191" cy="175" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="193" cy="176" r="2.5" fill="#2a2a2a"/>
    <ellipse cx="209" cy="175" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="211" cy="176" r="2.5" fill="#2a2a2a"/>
    <!-- Nose -->
    <path d="M 200 180 L 200 184" stroke="#a8896d" stroke-width="1"/>
    <!-- Slight smile -->
    <path d="M 194 190 Q 200 193 206 190" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Phone in hand -->
    <rect x="210" y="208" width="22" height="36" rx="3" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="212" y="212" width="18" height="26" fill="#E63946"/>
    <!-- Heart icon on screen -->
    <path d="M 217 220 Q 217 217 220 217 Q 223 217 223 220 Q 223 224 220 227 Q 217 224 217 220" fill="#fff" stroke="none"/>
    <!-- Arm -->
    <path d="M 220 230 Q 228 220 221 210" fill="none" stroke="#e8b887" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="30" y="25" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,143 150,163 160,143" fill="#fff"/>
  <path d="M 140 145 L 150 165 L 160 145" fill="none" stroke="#333" stroke-width="2"/>

  <text x="145" y="54" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Swiped right</text>
  <text x="145" y="80" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">on 200 people</text>
  <text x="145" y="106" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">today. Really</text>
  <text x="145" y="132" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">putting in work.</text>

  <!-- ======== PANEL 2 ======== -->
  <rect x="10" y="330" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka watching -->
  <g filter="url(#shadow_dt41v)">
    <!-- Body -->
    <ellipse cx="200" cy="560" rx="22" ry="28" fill="url(#lem_fur_dt41v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="525" rx="18" ry="16" fill="url(#lem_fur_dt41v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- White face patch -->
    <ellipse cx="200" cy="527" rx="12" ry="11" fill="#efefef"/>

    <!-- Ears -->
    <ellipse cx="175" cy="520" rx="14" ry="16" fill="url(#lem_fur_dt41v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="520" rx="14" ry="16" fill="url(#lem_fur_dt41v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="520" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="520" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="190" cy="525" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="190" cy="526" r="8" fill="#1a1a1a"/>
    <circle cx="188" cy="523" r="2.2" fill="#fff"/>

    <ellipse cx="210" cy="525" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="210" cy="526" r="8" fill="#1a1a1a"/>
    <circle cx="208" cy="523" r="2.2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="200" cy="534" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 194 538 Q 200 539 206 538" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 180 565 Q 170 575 165 590 Q 162 605 168 620 Q 175 630 185 625 Q 180 610 180 590 Q 180 578 182 568" fill="url(#lem_fur_dt41v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="165" y="590" width="20" height="7" fill="#1a1a1a"/>
    <rect x="165" y="604" width="20" height="7" fill="#1a1a1a"/>
    <rect x="168" y="618" width="17" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="55" y="345" width="290" height="150" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,493 200,513 210,493" fill="#fff"/>
  <path d="M 190 495 L 200 515 L 210 495" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="376" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Did you look</text>
  <text x="200" y="404" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">at any of</text>
  <text x="200" y="432" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">their profiles?</text>
  <text x="200" y="472" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">...Their faces?</text>

  <!-- ======== PANEL 3 ======== -->
  <rect x="10" y="650" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe staring at phone, blank -->
  <g filter="url(#shadow_dt41v)">
    <!-- Body -->
    <ellipse cx="200" cy="870" rx="30" ry="38" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="815" rx="22" ry="25" fill="url(#hum_skin_dt41v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 178 800 Q 200 790 222 800 Q 220 805 216 807 Q 200 802 184 807 Q 180 805 178 800" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes - blank, distant -->
    <ellipse cx="191" cy="815" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="191" cy="816" r="2.5" fill="#2a2a2a"/>
    <ellipse cx="209" cy="815" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="209" cy="816" r="2.5" fill="#2a2a2a"/>
    <!-- Nose -->
    <path d="M 200 820 L 200 824" stroke="#a8896d" stroke-width="1"/>
    <!-- Flat mouth -->
    <path d="M 194 830 L 206 830" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Phone still in hand -->
    <rect x="210" y="848" width="22" height="36" rx="3" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="212" y="852" width="18" height="26" fill="#E63946"/>
    <!-- Infinite scroll lines on screen -->
    <line x1="214" y1="857" x2="228" y2="857" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="214" y1="861" x2="228" y2="861" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="214" y1="865" x2="228" y2="865" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="214" y1="869" x2="228" y2="869" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="214" y1="873" x2="228" y2="873" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <!-- Arm -->
    <path d="M 220 870 Q 228 860 221 850" fill="none" stroke="#e8b887" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="55" y="665" width="290" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,783 200,803 210,783" fill="#fff"/>
  <path d="M 190 785 L 200 805 L 210 785" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="694" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I'm not looking</text>
  <text x="200" y="720" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">for a person.</text>
  <text x="200" y="752" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I'm looking for</text>
  <text x="200" y="778" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">a notification.</text>

</svg>