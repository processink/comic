<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_hc42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_hc42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_hc42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_hc42">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe at desk, exhausted, multiple screens -->
  <g filter="url(#shadow_hc42)">
    <!-- Body -->
    <ellipse cx="150" cy="230" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head slumped slightly -->
    <ellipse cx="150" cy="178" rx="20" ry="23" fill="url(#hum_skin_hc42)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 130 163 Q 150 156 170 163 Q 168 168 164 170 Q 150 166 136 170 Q 132 168 130 163" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Tired eyes with bags -->
    <ellipse cx="142" cy="178" rx="3" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="179" r="1.5" fill="#2a2a2a"/>
    <ellipse cx="158" cy="178" rx="3" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="179" r="1.5" fill="#2a2a2a"/>

    <!-- Eye bags -->
    <path d="M 139 182 Q 142 184 145 182" fill="none" stroke="#c8a882" stroke-width="0.8"/>
    <path d="M 155 182 Q 158 184 161 182" fill="none" stroke="#c8a882" stroke-width="0.8"/>

    <!-- Nose and mouth -->
    <path d="M 150 183 L 150 186" stroke="#a8896d" stroke-width="1"/>
    <path d="M 145 191 L 155 191" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Coffee cup -->
    <rect x="170" y="250" width="16" height="18" rx="2" fill="#8b6842" stroke="#5d4a2f" stroke-width="1"/>
    <path d="M 186 255 Q 192 258 186 264" fill="none" stroke="#5d4a2f" stroke-width="1"/>
    <path d="M 174 248 Q 176 243 178 248" fill="none" stroke="#aaa" stroke-width="1" opacity="0.6"/>
    <path d="M 179 246 Q 181 240 183 246" fill="none" stroke="#aaa" stroke-width="1" opacity="0.6"/>

    <!-- Laptop -->
    <rect x="105" y="255" width="60" height="38" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="108" y="258" width="54" height="28" fill="#1a3a5a"/>
    <rect x="100" y="293" width="70" height="4" fill="#5a5a5a" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Screen text -->
    <text x="135" y="270" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#4a90c2">4:47 AM</text>
    <text x="135" y="280" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#aaa">SIDE HUSTLE #3</text>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="30" y="35" width="240" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,133 150,148 160,133" fill="#fff"/>
  <path d="M 140,135 L 150,150 L 160,135" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I wake up at</text>
  <text x="150" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">4 AM every day.</text>
  <text x="150" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I'm optimized.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring -->
  <g filter="url(#shadow_hc42)">
    <!-- Body -->
    <ellipse cx="450" cy="230" rx="22" ry="28" fill="url(#lem_fur_hc42)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="450" cy="198" rx="18" ry="16" fill="url(#lem_fur_hc42)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="425" cy="193" rx="14" ry="16" fill="url(#lem_fur_hc42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="193" rx="14" ry="16" fill="url(#lem_fur_hc42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="193" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="193" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="438" cy="198" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="438" cy="199" r="8" fill="#1a1a1a"/>
    <circle cx="436" cy="197" r="2" fill="#fff"/>

    <ellipse cx="462" cy="198" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="462" cy="199" r="8" fill="#1a1a1a"/>
    <circle cx="460" cy="197" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="207" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 443 211 Q 450 212 457 211" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 430 235 Q 420 245 415 265 Q 410 285 415 300 Q 420 312 430 310 Q 435 295 433 275 Q 432 255 430 240" fill="url(#lem_fur_hc42)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Stripes on tail -->
    <path d="M 417 270 Q 425 268 432 272" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 416 280 Q 424 278 431 282" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 416 290 Q 423 288 429 292" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <path d="M 418 300 Q 424 298 428 302" fill="none" stroke="#1a1a1a" stroke-width="3"/>

    <!-- Little arms/hands -->
    <ellipse cx="432" cy="235" rx="7" ry="5" fill="url(#lem_fur_hc42)" stroke="#5a5a5a" stroke-width="1" transform="rotate(-15 432 235)"/>
    <ellipse cx="468" cy="235" rx="7" ry="5" fill="url(#lem_fur_hc42)" stroke="#5a5a5a" stroke-width="1" transform="rotate(15 468 235)"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="340" y="35" width="220" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,153 450,168 460,153" fill="#fff"/>
  <path d="M 440,155 L 450,170 L 460,155" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Optimized</text>
  <text x="450" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">for what?</text>
  <text x="450" y="118" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Who told you</text>
  <text x="450" y="142" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">you were slow?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting, smoking with sunglasses -->
  <g filter="url(#shadow_hc42)">
    <!-- Body -->
    <ellipse cx="750" cy="225" rx="18" ry="22" fill="url(#sq_fur_hc42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="750" cy="198" rx="14" ry="13" fill="url(#sq_fur_hc42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="739,190 735,168 745,185" fill="url(#sq_fur_hc42)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="761,190 765,168 755,185" fill="url(#sq_fur_hc42)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="740,189 737,173 744,186" fill="#cd853f"/>
    <polygon points="760,189 763,173 756,186" fill="#cd853f"/>

    <!-- Sunglasses (smoking!) -->
    <rect x="738" y="194" width="10" height="7" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <rect x="752" y="194" width="10" height="7" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <line x1="748" y1="197" x2="752" y2="197" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="738" y1="197" x2="733" y2="195" stroke="#0a0a0a" stroke-width="1"/>
    <line x1="762" y1="197" x2="767" y2="195" stroke="#0a0a0a" stroke-width="1"/>

    <!-- Nose and mouth -->
    <ellipse cx="750" cy="204" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 746 207 L 754 207" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Cigarette -->
    <rect x="754" y="205" width="18" height="3" fill="#f5f0e0" stroke="#ccc" stroke-width="0.5"/>
    <rect x="770" y="205" width="4" height="3" fill="#E63946"/>
    <!-- Smoke wisps -->
    <path d="M 774 205 Q 778 198 775 192" fill="none" stroke="#bbb" stroke-width="0.8" opacity="0.5"/>
    <path d="M 776 203 Q 781 195 778 188" fill="none" stroke="#bbb" stroke-width="0.8" opacity="0.4"/>

    <!-- Fluffy tail -->
    <path d="M 730 230 Q 718 238 714 255 Q 710 272 718 282 Q 726 290 735 280 Q 730 265 730 250 Q 730 238 730 230" fill="url(#sq_fur_hc42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Arms crossed -->
    <path d="M 735 220 Q 740 228 755 225 Q 760 222 765 220" fill="none" stroke="#5d4a2f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="635" y="35" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,153 750,168 760,153" fill="#fff"/>
  <path d="M 740,155 L 750,170 L 760,155" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">A hamster wheel</text>
  <text x="750" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">doesn't become</text>
  <text x="750" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">a career path</text>
  <text x="750" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">just because</text>

  <!-- Second part of Cache's line, small addendum below -->
  <text x="750" y="312" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#333">you run it faster.</text>

  <!-- Ground lines -->
  <line x1="15" y1="305" x2="285" y2="305" stroke="#ccc" stroke-width="1"/>
  <line x1="315" y1="305" x2="585" y2="305" stroke="#ccc" stroke-width="1"/>
  <line x1="615" y1="305" x2="885" y2="305" stroke="#ccc" stroke-width="1"/>
</svg>