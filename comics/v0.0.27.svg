<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_pp73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_pp73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_pp73" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_pp73">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding MacBook, excited -->
  <g filter="url(#shadow_pp73)">
    <!-- Body -->
    <ellipse cx="150" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="185" rx="20" ry="23" fill="url(#hum_skin_pp73)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 170 Q 150 163 170 170 Q 168 175 164 177 Q 150 173 136 177 Q 132 175 130 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Excited eyes -->
    <ellipse cx="142" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="184" r="3" fill="#2a2a2a"/>
    <circle cx="141" cy="183" r="1" fill="#fff"/>
    <ellipse cx="158" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="184" r="3" fill="#2a2a2a"/>
    <circle cx="157" cy="183" r="1" fill="#fff"/>
    <!-- Open mouth smile -->
    <path d="M 143 198 Q 150 204 157 198" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="145" y="205" width="10" height="10" fill="url(#hum_skin_pp73)"/>

    <!-- MacBook -->
    <rect x="110" y="255" width="80" height="50" fill="#c0c0c0" stroke="#8a8a8a" stroke-width="1.2"/>
    <rect x="113" y="258" width="74" height="40" fill="#1a1a1a"/>
    <!-- Screen content -->
    <rect x="116" y="261" width="68" height="34" fill="#2d2d2d"/>
    <!-- Swift code on screen -->
    <text x="120" y="273" font-family="DejaVu Sans" font-size="5" fill="#f77f00">import</text>
    <text x="140" y="273" font-family="DejaVu Sans" font-size="5" fill="#e8e8e8">PersonaPlex</text>
    <text x="120" y="281" font-family="DejaVu Sans" font-size="5" fill="#76b947">// full duplex</text>
    <text x="120" y="289" font-family="DejaVu Sans" font-size="5" fill="#e63946">pipeline.start()</text>
    <!-- Apple logo on MacBook -->
    <text x="148" y="310" font-family="DejaVu Sans" font-size="7" text-anchor="middle" fill="#8a8a8a">⌘</text>

    <!-- Sound waves from MacBook -->
    <path d="M 195 275 Q 200 270 205 275" fill="none" stroke="#E63946" stroke-width="1" opacity="0.6"/>
    <path d="M 198 275 Q 206 266 214 275" fill="none" stroke="#E63946" stroke-width="1" opacity="0.4"/>
    <path d="M 201 275 Q 212 262 223 275" fill="none" stroke="#E63946" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="30" width="230" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,138 155,158 165,138" fill="#fff"/>
  <path d="M 145 140 L 155 160 L 165 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">PersonaPlex</text>
  <text x="150" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">on my Mac!</text>
  <text x="150" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Full-duplex!</text>
  <text x="150" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">It talks BACK!</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka watching, enormous eyes -->
  <g filter="url(#shadow_pp73)">
    <!-- Body -->
    <ellipse cx="450" cy="245" rx="22" ry="28" fill="url(#lem_fur_pp73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="215" rx="18" ry="16" fill="url(#lem_fur_pp73)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="425" cy="210" rx="14" ry="16" fill="url(#lem_fur_pp73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="475" cy="210" rx="14" ry="16" fill="url(#lem_fur_pp73)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="425" cy="210" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="475" cy="210" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="438" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="438" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="436" cy="213" r="2" fill="#fff"/>

    <ellipse cx="462" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="462" cy="215" r="8" fill="#1a1a1a"/>
    <circle cx="460" cy="213" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="450" cy="223" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 443 227 Q 450 228 457 227" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes - MUST be visible -->
    <path d="M 430 250 Q 420 260 415 280 Q 410 300 415 315 Q 420 325 430 320 Q 425 305 425 285 Q 425 265 430 250" fill="url(#lem_fur_pp73)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="412" y="285" width="18" height="6" fill="#1a1a1a"/>
    <rect x="412" y="297" width="18" height="6" fill="#1a1a1a"/>
    <rect x="412" y="309" width="18" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Two MacBooks talking to each other on surface -->
  <rect x="340" y="290" width="40" height="28" fill="#c0c0c0" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="343" y="293" width="34" height="20" fill="#2d2d2d"/>
  <text x="360" y="306" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#76b947">hi</text>

  <rect x="500" y="290" width="40" height="28" fill="#c0c0c0" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="503" y="293" width="34" height="20" fill="#2d2d2d"/>
  <text x="520" y="306" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#E63946">hello</text>

  <!-- Sound waves between laptops -->
  <path d="M 383 304 Q 410 295 437 304" fill="none" stroke="#E63946" stroke-width="1.2" opacity="0.5"/>
  <path d="M 383 304 Q 410 313 437 304" fill="none" stroke="#E63946" stroke-width="1.2" opacity="0.5"/>
  <path d="M 460 304 Q 480 295 497 304" fill="none" stroke="#E63946" stroke-width="1.2" opacity="0.5"/>
  <path d="M 460 304 Q 480 313 497 304" fill="none" stroke="#E63946" stroke-width="1.2" opacity="0.5"/>

  <!-- Speech bubble Panel 2 -->
  <rect x="340" y="30" width="220" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="445,158 455,178 465,158" fill="#fff"/>
  <path d="M 445 160 L 455 180 L 465 160" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Wait. You</text>
  <text x="450" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">pointed two</text>
  <text x="450" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">of them at</text>
  <text x="450" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">each other?</text>
  <text x="450" y="152" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Why?</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache smoking with sunglasses, leaning on something -->
  <g filter="url(#shadow_pp73)">
    <!-- Body -->
    <ellipse cx="750" cy="245" rx="18" ry="20" fill="url(#sq_fur_pp73)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="223" rx="14" ry="13" fill="url(#sq_fur_pp73)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="738,215 742,197 746,215" fill="url(#sq_fur_pp73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="754,215 758,197 762,215" fill="url(#sq_fur_pp73)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="740,214 742,201 744,214" fill="#cd853f"/>
    <polygon points="756,214 758,201 760,214" fill="#cd853f"/>

    <!-- Sunglasses (smoking!) -->
    <rect x="738" y="220" width="10" height="6" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <rect x="752" y="220" width="10" height="6" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="0.8"/>
    <line x1="748" y1="223" x2="752" y2="223" stroke="#0a0a0a" stroke-width="0.8"/>
    <!-- Sunglasses arms -->
    <line x1="738" y1="222" x2="733" y2="220" stroke="#0a0a0a" stroke-width="0.8"/>
    <line x1="762" y1="222" x2="767" y2="220" stroke="#0a0a0a" stroke-width="0.8"/>

    <!-- Nose -->
    <ellipse cx="750" cy="229" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Simple mouth line -->
    <path d="M 746 232 L 758 232" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Cigarette -->
    <rect x="758" y="230" width="18" height="3" fill="#f5f5dc" stroke="#c8c8a0" stroke-width="0.5"/>
    <rect x="774" y="230" width="4" height="3" fill="#E63946"/>
    <!-- Smoke wisps -->
    <path d="M 778 229 Q 782 222 779 215" fill="none" stroke="#b8b8b8" stroke-width="0.8" opacity="0.5"/>
    <path d="M 780 228 Q 786 218 782 208" fill="none" stroke="#b8b8b8" stroke-width="0.6" opacity="0.3"/>

    <!-- Fluffy tail -->
    <path d="M 730 250 Q 715 255 710 270 Q 705 285 715 295 Q 725 305 735 295 Q 730 280 730 265 Q 730 257 730 250" fill="url(#sq_fur_pp73)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Two laptops on ground, still talking -->
  <rect x="640" y="295" width="35" height="24" fill="#c0c0c0" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="643" y="298" width="29" height="17" fill="#2d2d2d"/>

  <rect x="690" y="295" width="35" height="24" fill="#c0c0c0" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="693" y="298" width="29" height="17" fill="#2d2d2d"/>

  <!-- Sound waves still going, faster -->
  <path d="M 678 307 Q 684 300 690 307" fill="none" stroke="#E63946" stroke-width="1.2" opacity="0.7"/>
  <path d="M 678 307 Q 684 314 690 307" fill="none" stroke="#E63946" stroke-width="1.2" opacity="0.7"/>

  <!-- Speech bubble Panel 3 -->
  <rect x="635" y="30" width="230" height="150" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="745,178 755,198 765,178" fill="#fff"/>
  <path d="M 745 180 L 755 200 L 765 180" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">They've been</text>
  <text x="750" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">talking for</text>
  <text x="750" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">nine hours.</text>
  <text x="750" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">They don't</text>
  <text x="750" y="158" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">need us.</text>

</svg>