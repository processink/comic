<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka holding phone -->
  <g filter="url(#shadow_v)">
    <!-- Body -->
    <ellipse cx="200" cy="225" rx="22" ry="28" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="195" rx="18" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="175" cy="190" rx="14" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="190" rx="14" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="190" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="190" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- Eyes -->
    <ellipse cx="188" cy="195" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="197" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="195" r="2" fill="#fff"/>
    <ellipse cx="212" cy="195" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="197" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="195" r="2" fill="#fff"/>
    <ellipse cx="200" cy="203" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 193 207 Q 200 208 207 207" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Arm holding phone -->
    <ellipse cx="220" cy="220" rx="8" ry="6" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1" transform="rotate(20 220 220)"/>
    <!-- Phone -->
    <rect x="225" y="210" width="18" height="28" rx="3" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1"/>
    <rect x="227" y="214" width="14" height="20" fill="#4a86c7"/>
    <circle cx="234" cy="224" r="4" fill="none" stroke="#E63946" stroke-width="1.5"/>
    <path d="M 234 220 L 234 228" stroke="#fff" stroke-width="1"/>
    <!-- Ring tail -->
    <path d="M 180 230 Q 170 240 165 260 Q 160 280 165 295 Q 170 305 180 308 Q 190 310 198 302 Q 193 282 193 262 Q 193 242 188 230" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="165" y="260" width="28" height="7" fill="#1a1a1a"/>
    <rect x="165" y="274" width="28" height="7" fill="#1a1a1a"/>
    <rect x="165" y="288" width="28" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="55" y="25" width="290" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,153 200,173 210,153" fill="#fff"/>
  <line x1="190" y1="155" x2="200" y2="175" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="175" x2="210" y2="155" stroke="#333" stroke-width="2"/>

  <text x="200" y="55" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Police in</text>
  <text x="200" y="82" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Stoke-on-Trent</text>
  <text x="200" y="109" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">warned people</text>
  <text x="200" y="136" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">about a TikTok trend.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache, no cigarette, half-lidded -->
  <g filter="url(#shadow_v)">
    <!-- Body -->
    <ellipse cx="200" cy="540" rx="18" ry="20" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="518" rx="14" ry="13" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="193" cy="512" rx="6" ry="11" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 193 512)"/>
    <ellipse cx="207" cy="512" rx="6" ry="11" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 207 512)"/>
    <ellipse cx="193" cy="515" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 193 515)"/>
    <ellipse cx="207" cy="515" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 207 515)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="194" cy="520" rx="3.5" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="521" r="2" fill="#1a1a1a"/>
    <line x1="190" y1="518" x2="198" y2="519" stroke="#5d4a2f" stroke-width="1.5"/>
    <ellipse cx="206" cy="520" rx="3.5" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="521" r="2" fill="#1a1a1a"/>
    <line x1="202" y1="519" x2="210" y2="518" stroke="#5d4a2f" stroke-width="1.5"/>
    <ellipse cx="200" cy="525" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 196 529 L 204 529" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 215 535 Q 230 520 235 505 Q 240 490 233 480 Q 226 475 220 483 Q 218 495 220 510 Q 222 525 218 537" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="45" y="335" width="310" height="155" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,488 200,508 210,488" fill="#fff"/>
  <line x1="190" y1="490" x2="200" y2="510" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="510" x2="210" y2="490" stroke="#333" stroke-width="2"/>

  <text x="200" y="365" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">So the police</text>
  <text x="200" y="392" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">issued a warning</text>
  <text x="200" y="419" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">about people</text>
  <text x="200" y="446" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">copying behavior</text>
  <text x="200" y="473" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">they saw online.</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring -->
  <g filter="url(#shadow_v)">
    <ellipse cx="130" cy="875" rx="16" ry="20" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="130" cy="855" rx="13" ry="12" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1"/>
    <!-- Ears -->
    <ellipse cx="112" cy="851" rx="10" ry="12" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="148" cy="851" rx="10" ry="12" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1"/>
    <ellipse cx="112" cy="851" rx="6" ry="7" fill="#f5b5c5"/>
    <ellipse cx="148" cy="851" rx="6" ry="7" fill="#f5b5c5"/>
    <!-- Big eyes -->
    <ellipse cx="122" cy="855" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="122" cy="856" r="6" fill="#1a1a1a"/>
    <circle cx="120" cy="854" r="1.5" fill="#fff"/>
    <ellipse cx="138" cy="855" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="138" cy="856" r="6" fill="#1a1a1a"/>
    <circle cx="136" cy="854" r="1.5" fill="#fff"/>
    <ellipse cx="130" cy="862" rx="1.5" ry="1" fill="#1a1a1a"/>
    <!-- Tail -->
    <path d="M 115 878 Q 105 890 102 905 Q 100 918 105 925 Q 110 930 118 925 Q 115 910 115 895 Q 115 885 114 878" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1"/>
    <rect x="102" y="905" width="16" height="5" fill="#1a1a1a"/>
    <rect x="102" y="915" width="16" height="5" fill="#1a1a1a"/>
  </g>

  <!-- Cache in panel 3 -->
  <g filter="url(#shadow_v)">
    <ellipse cx="280" cy="875" rx="16" ry="18" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1"/>
    <ellipse cx="280" cy="858" rx="12" ry="11" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1"/>
    <!-- Ears -->
    <ellipse cx="274" cy="853" rx="5" ry="9" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1" transform="rotate(-15 274 853)"/>
    <ellipse cx="286" cy="853" rx="5" ry="9" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1" transform="rotate(15 286 853)"/>
    <ellipse cx="274" cy="855" rx="2.5" ry="5.5" fill="#cd853f" transform="rotate(-15 274 855)"/>
    <ellipse cx="286" cy="855" rx="2.5" ry="5.5" fill="#cd853f" transform="rotate(15 286 855)"/>
    <!-- Half-lidded -->
    <ellipse cx="275" cy="860" rx="3" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="275" cy="861" r="1.5" fill="#1a1a1a"/>
    <line x1="272" y1="858" x2="278" y2="859" stroke="#5d4a2f" stroke-width="1.2"/>
    <ellipse cx="285" cy="860" rx="3" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="285" cy="861" r="1.5" fill="#1a1a1a"/>
    <line x1="282" y1="859" x2="288" y2="858" stroke="#5d4a2f" stroke-width="1.2"/>
    <ellipse cx="280" cy="864" rx="1.2" ry="1" fill="#1a1a1a"/>
    <path d="M 277 867 L 283 867" fill="none" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>
    <!-- Tail -->
    <path d="M 293 870 Q 305 858 308 845 Q 310 835 305 830 Q 300 828 296 835 Q 295 848 297 860 Q 298 868 295 873" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="40" y="645" width="320" height="190" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="270,833 280,848 290,833" fill="#fff"/>
  <line x1="270" y1="835" x2="280" y2="850" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="850" x2="290" y2="835" stroke="#333" stroke-width="2"/>

  <text x="200" y="675" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">That's literally</text>
  <text x="200" y="702" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">all of</text>
  <text x="200" y="729" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">civilization.</text>
  <text x="200" y="762" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Someone does a</text>
  <text x="200" y="789" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">thing, others</text>
  <text x="200" y="816" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#E63946">copy it.</text>

</svg>