<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_itr81" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_itr81" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_itr81" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_itr81">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe looking at laptop -->
  <g filter="url(#shadow_itr81)">
    <!-- Body -->
    <ellipse cx="150" cy="260" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Neck -->
    <rect x="141" y="222" width="18" height="14" fill="url(#hum_skin_itr81)"/>
    <!-- Head -->
    <ellipse cx="150" cy="210" rx="20" ry="23" fill="url(#hum_skin_itr81)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 197 Q 150 187 170 197 Q 168 202 164 204 Q 150 199 136 204 Q 132 202 130 197" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes - reading -->
    <ellipse cx="142" cy="210" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="211" r="2" fill="#2a2a2a"/>
    <ellipse cx="158" cy="210" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="211" r="2" fill="#2a2a2a"/>
    <!-- Nose -->
    <path d="M 150 215 L 150 218" stroke="#a8896d" stroke-width="1"/>
    <!-- Mouth - neutral -->
    <path d="M 145 223 Q 150 222 155 223" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Laptop -->
    <rect x="110" y="270" width="60" height="35" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="113" y="273" width="54" height="28" fill="#1a1a1a"/>
    <!-- Screen content - policy doc -->
    <rect x="116" y="276" width="48" height="3" fill="#E63946"/>
    <rect x="116" y="281" width="40" height="2" fill="#666"/>
    <rect x="116" y="285" width="44" height="2" fill="#666"/>
    <rect x="116" y="289" width="36" height="2" fill="#666"/>
    <rect x="116" y="293" width="42" height="2" fill="#666"/>
    <!-- Laptop base -->
    <rect x="105" y="305" width="70" height="5" fill="#5a5a5a" stroke="#2a2a2a" stroke-width="1"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="30" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,158 150,178 160,158" fill="#fff"/>
  <line x1="140" y1="160" x2="150" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="180" x2="160" y2="160" stroke="#333" stroke-width="2"/>

  <text x="150" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">New IT policy:</text>
  <text x="150" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">"Do not share</text>
  <text x="150" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">company news</text>
  <text x="150" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">on social media."</text>
  <text x="150" y="153" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Fair enough.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking skeptical -->
  <g filter="url(#shadow_itr81)">
    <!-- Body -->
    <ellipse cx="450" cy="255" rx="18" ry="20" fill="url(#sq_fur_itr81)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="232" rx="14" ry="13" fill="url(#sq_fur_itr81)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="225" rx="6" ry="11" fill="url(#sq_fur_itr81)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 443 225)"/>
    <ellipse cx="457" cy="225" rx="6" ry="11" fill="url(#sq_fur_itr81)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 457 225)"/>
    <ellipse cx="443" cy="228" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 443 228)"/>
    <ellipse cx="457" cy="228" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 457 228)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="444" cy="234" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="235" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="456" cy="234" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="235" r="1.8" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="450" cy="238" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth - flat -->
    <path d="M 446 241 Q 450 240 454 241" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 430 260 Q 415 265 410 280 Q 405 295 415 305 Q 425 315 435 305 Q 430 290 430 275 Q 430 267 430 260" fill="url(#sq_fur_itr81)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="340" y="30" width="230" height="155" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,183 450,203 460,183" fill="#fff"/>
  <line x1="440" y1="185" x2="450" y2="205" stroke="#333" stroke-width="2"/>
  <line x1="450" y1="205" x2="460" y2="185" stroke="#333" stroke-width="2"/>

  <text x="455" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Page two says</text>
  <text x="455" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">"do not share</text>
  <text x="455" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">social media</text>
  <text x="455" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">news at the</text>
  <text x="455" y="153" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">company."</text>
  <text x="455" y="177" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Less fair.</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes staring -->
  <g filter="url(#shadow_itr81)">
    <!-- Body -->
    <ellipse cx="750" cy="250" rx="22" ry="28" fill="url(#lem_fur_itr81)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="220" rx="18" ry="16" fill="url(#lem_fur_itr81)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="215" rx="14" ry="16" fill="url(#lem_fur_itr81)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="215" rx="14" ry="16" fill="url(#lem_fur_itr81)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="215" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="215" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="738" cy="220" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="220" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="218" r="2" fill="#fff"/>
    <ellipse cx="762" cy="220" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="220" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="218" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="750" cy="228" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 743 232 Q 750 233 757 232" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 730 255 Q 720 265 715 285 Q 710 305 718 315 Q 726 325 736 318 Q 730 300 730 280 Q 730 267 730 255" fill="url(#lem_fur_itr81)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="715" y="280" width="20" height="6" fill="#1a1a1a"/>
    <rect x="715" y="292" width="20" height="6" fill="#1a1a1a"/>
    <rect x="715" y="304" width="20" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="635" y="30" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,158 750,178 760,158" fill="#fff"/>
  <line x1="740" y1="160" x2="750" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="750" y1="180" x2="760" y2="160" stroke="#333" stroke-width="2"/>

  <text x="750" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Page three</text>
  <text x="750" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">just says</text>
  <text x="750" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">"do not share</text>
  <text x="750" y="129" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">news."</text>
  <text x="750" y="153" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">Ah.</text>
</svg>