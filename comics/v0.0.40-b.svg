<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_si41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_si41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_si41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_si41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe surrounded by self-help books -->
  <g filter="url(#shadow_si41)">
    <!-- Body -->
    <ellipse cx="150" cy="235" rx="30" ry="38" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="185" rx="22" ry="25" fill="url(#hum_skin_si41)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 128 170 Q 150 160 172 170 Q 170 175 166 177 Q 150 172 134 177 Q 130 175 128 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Excited eyes -->
    <ellipse cx="140" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="141" cy="184" r="2.5" fill="#1a1a1a"/>
    <ellipse cx="160" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="161" cy="184" r="2.5" fill="#1a1a1a"/>
    <!-- Big smile -->
    <path d="M 141 197 Q 150 203 159 197" fill="none" stroke="#8a6d51" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M 150 190 L 150 194" stroke="#a8896d" stroke-width="1"/>
  </g>

  <!-- Stack of books around Abe -->
  <rect x="85" y="255" width="30" height="8" fill="#E63946" stroke="#333" stroke-width="0.8"/>
  <rect x="83" y="263" width="34" height="8" fill="#c9a84c" stroke="#333" stroke-width="0.8"/>
  <rect x="87" y="271" width="28" height="8" fill="#6b8e6b" stroke="#333" stroke-width="0.8"/>

  <rect x="185" y="250" width="28" height="8" fill="#7a6ea0" stroke="#333" stroke-width="0.8"/>
  <rect x="183" y="258" width="32" height="8" fill="#c9784c" stroke="#333" stroke-width="0.8"/>
  <rect x="186" y="266" width="26" height="8" fill="#4a7a8a" stroke="#333" stroke-width="0.8"/>
  <rect x="184" y="274" width="30" height="8" fill="#E63946" stroke="#333" stroke-width="0.8"/>

  <!-- Book in hand -->
  <rect x="115" y="218" width="22" height="28" rx="2" fill="#E63946" stroke="#333" stroke-width="1"/>
  <text x="126" y="232" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">OPTIMIZE</text>
  <text x="126" y="239" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">YOUR SELF</text>

  <!-- Speech bubble Panel 1 -->
  <rect x="35" y="35" width="210" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="130,143 140,160 150,143" fill="#fff"/>
  <path d="M 130,145 L 140,162 L 150,145" fill="none" stroke="#333" stroke-width="2"/>

  <text x="140" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I've read</text>
  <text x="140" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">47 books on</text>
  <text x="140" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">being present.</text>
  <text x="140" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I'm SO close.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a branch, half-lidded -->
  <g filter="url(#shadow_si41)">
    <!-- Branch -->
    <path d="M 320 270 Q 400 255 580 270" stroke="#8b7355" stroke-width="6" fill="none"/>

    <!-- Body -->
    <ellipse cx="450" cy="248" rx="18" ry="20" fill="url(#sq_fur_si41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="226" rx="14" ry="13" fill="url(#sq_fur_si41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="220" rx="6" ry="11" fill="url(#sq_fur_si41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 443 220)"/>
    <ellipse cx="457" cy="220" rx="6" ry="11" fill="url(#sq_fur_si41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 457 220)"/>
    <ellipse cx="443" cy="223" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 443 223)"/>
    <ellipse cx="457" cy="223" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 457 223)"/>

    <!-- Ear tufts -->
    <path d="M 441 215 Q 438 209 440 207" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 459 215 Q 462 209 460 207" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="444" cy="228" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="228" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="228" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="228" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="450" cy="233" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 445 236 L 455 236" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="438" y1="228" x2="425" y2="227" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="438" y1="231" x2="427" y2="232" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="462" y1="228" x2="475" y2="227" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="462" y1="231" x2="473" y2="232" stroke="#1a1a1a" stroke-width="0.7"/>

    <!-- Fluffy tail -->
    <path d="M 430 252 Q 415 258 410 275 Q 405 292 415 302 Q 425 312 435 302 Q 430 287 430 272 Q 430 260 430 252" fill="url(#sq_fur_si41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="340" y="35" width="220" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,163 450,183 460,163" fill="#fff"/>
  <path d="M 440,165 L 450,185 L 460,165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Close to what.</text>
  <text x="450" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">You were</text>
  <text x="450" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">already here</text>
  <text x="450" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">before book one.</text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka standing, staring with enormous eyes -->
  <g filter="url(#shadow_si41)">
    <!-- Body -->
    <ellipse cx="750" cy="240" rx="22" ry="28" fill="url(#lem_fur_si41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="208" rx="18" ry="16" fill="url(#lem_fur_si41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="203" rx="14" ry="16" fill="url(#lem_fur_si41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="203" rx="14" ry="16" fill="url(#lem_fur_si41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="203" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="203" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="738" cy="208" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="209" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="207" r="2" fill="#fff"/>

    <ellipse cx="762" cy="208" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="209" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="207" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="750" cy="218" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 743 222 Q 750 224 757 222" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes - MUST be visible -->
    <path d="M 730 245 Q 720 255 715 275 Q 710 295 718 310 Q 726 320 738 315 Q 733 295 733 275 Q 733 255 731 248" fill="url(#lem_fur_si41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="712" y="275" width="24" height="7" fill="#1a1a1a"/>
    <rect x="712" y="289" width="24" height="7" fill="#1a1a1a"/>
    <rect x="714" y="303" width="22" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Abe in panel 3, smaller, holding a new book, looking shaken -->
  <g filter="url(#shadow_si41)">
    <ellipse cx="830" cy="250" rx="20" ry="28" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.2"/>
    <circle cx="830" cy="212" r="16" fill="url(#hum_skin_si41)" stroke="#c8a882" stroke-width="1.2"/>
    <path d="M 814 203 Q 825 195 830 193 Q 840 195 846 203" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Worried eyes -->
    <ellipse cx="824" cy="212" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="824" cy="213" r="2" fill="#1a1a1a"/>
    <ellipse cx="836" cy="212" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="836" cy="213" r="2" fill="#1a1a1a"/>
    <!-- Worried mouth -->
    <path d="M 825 222 Q 830 219 835 222" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- New book in hand -->
    <rect x="810" y="238" width="16" height="22" rx="2" fill="#c9784c" stroke="#333" stroke-width="0.8"/>
    <text x="818" y="250" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#fff">BOOK</text>
    <text x="818" y="255" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#fff">48</text>
  </g>

  <!-- Sifaka speech bubble -->
  <rect x="640" y="35" width="225" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,183 760,163" fill="#fff"/>
  <path d="M 740,165 L 750,185 L 760,165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">If you finish</text>
  <text x="752" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">improving,</text>
  <text x="752" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">do you</text>
  <text x="752" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">disappear?</text>

</svg>