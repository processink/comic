<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_art41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_art41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_art41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_art41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- ==================== PANEL 1 ==================== -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding newspaper, looking pleased -->
  <g filter="url(#shadow_art41)">
    <!-- Body -->
    <ellipse cx="200" cy="220" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="165" rx="20" ry="23" fill="url(#hum_skin_art41)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 150 Q 200 143 220 150 Q 218 155 214 157 Q 200 153 186 157 Q 182 155 180 150" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes looking at newspaper -->
    <ellipse cx="192" cy="163" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="193" cy="164" r="2.2" fill="#1a1a1a"/>
    <ellipse cx="208" cy="163" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="209" cy="164" r="2.2" fill="#1a1a1a"/>
    <!-- Pleased smile -->
    <path d="M 193 177 Q 200 182 207 177" fill="none" stroke="#8a6d51" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left arm holding newspaper -->
    <path d="M 172 215 Q 158 210 150 203" stroke="#4a6d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Right arm holding newspaper -->
    <path d="M 228 215 Q 242 210 250 203" stroke="#4a6d8c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Hands -->
    <circle cx="148" cy="202" r="6" fill="url(#hum_skin_art41)" stroke="#c8a882" stroke-width="1"/>
    <circle cx="252" cy="202" r="6" fill="url(#hum_skin_art41)" stroke="#c8a882" stroke-width="1"/>
    <!-- Newspaper -->
    <rect x="138" y="185" width="124" height="30" fill="#f5f0e0" stroke="#8a8a7a" stroke-width="1"/>
    <text x="200" y="199" font-family="DejaVu Sans" font-size="7" text-anchor="middle" fill="#333" font-weight="bold">ART MARKET TIMES</text>
    <text x="200" y="209" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#555">RECORD GROWTH Q4</text>
    <!-- Legs -->
    <rect x="187" y="250" width="12" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <rect x="203" y="250" width="12" height="30" fill="#4a5568" stroke="#2a3548" stroke-width="1"/>
    <!-- Shoes -->
    <ellipse cx="193" cy="283" rx="10" ry="5" fill="#3a2a1a"/>
    <ellipse cx="209" cy="283" rx="10" ry="5" fill="#3a2a1a"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="80" y="25" width="240" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="193,128 203,148 213,128" fill="#fff"/>
  <path d="M 193 130 L 203 150 L 213 130" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="55" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">The art market</text>
  <text x="200" y="83" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">is back!</text>
  <text x="200" y="111" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Culture wins.</text>

  <!-- ==================== PANEL 2 ==================== -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting, half-lidded, not smoking -->
  <g filter="url(#shadow_art41)">
    <!-- Body -->
    <ellipse cx="200" cy="555" rx="18" ry="22" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="530" rx="15" ry="14" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="188,520 184,495 194,517" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="212,520 216,495 206,517" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="189,518 186,500 193,516" fill="#cd853f"/>
    <polygon points="211,518 214,500 207,516" fill="#cd853f"/>
    <!-- Half-lidded skeptical eyes -->
    <ellipse cx="194" cy="531" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="532" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="206" cy="531" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="532" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="200" cy="536" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat unimpressed mouth -->
    <path d="M 196 540 L 204 540" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 180 560 Q 165 565 160 580 Q 155 595 165 605 Q 175 615 185 605 Q 180 590 180 575 Q 180 567 180 560" fill="url(#sq_fur_art41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Arms crossed -->
    <path d="M 185 550 Q 190 555 205 553" stroke="#5d4a2f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 215 550 Q 210 555 195 553" stroke="#5d4a2f" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="75" y="335" width="250" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="193,478 203,498 213,478" fill="#fff"/>
  <path d="M 193 480 L 203 500 L 213 480" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="366" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Which part.</text>
  <text x="200" y="394" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">The art or</text>
  <text x="200" y="422" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the market.</text>
  <text x="200" y="450" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Pick one.</text>

  <!-- ==================== PANEL 3 ==================== -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring at a framed blank canvas with a price tag -->
  <g filter="url(#shadow_art41)">
    <!-- Framed "artwork" on wall — completely blank -->
    <rect x="260" y="760" width="80" height="100" fill="#c8a060" stroke="#8b6f47" stroke-width="3"/>
    <rect x="270" y="770" width="60" height="80" fill="#fff" stroke="#a89070" stroke-width="1"/>
    <!-- Price tag -->
    <rect x="308" y="845" width="45" height="20" fill="#fff" stroke="#888" stroke-width="1" transform="rotate(12 330 855)"/>
    <text x="330" y="859" font-family="DejaVu Sans" font-size="8" text-anchor="middle" fill="#E63946" transform="rotate(12 330 855)">$4.2M</text>

    <!-- Sifaka staring at it -->
    <ellipse cx="160" cy="865" rx="22" ry="28" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="160" cy="835" rx="18" ry="16" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Moderately-sized round ears -->
    <ellipse cx="135" cy="830" rx="14" ry="16" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="185" cy="830" rx="14" ry="16" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="135" cy="830" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="185" cy="830" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes staring at blank canvas -->
    <ellipse cx="148" cy="835" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="150" cy="836" r="8" fill="#1a1a1a"/>
    <circle cx="148" cy="834" r="2" fill="#fff"/>
    <ellipse cx="172" cy="835" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="174" cy="836" r="8" fill="#1a1a1a"/>
    <circle cx="172" cy="834" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="160" cy="843" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Small neutral mouth -->
    <path d="M 155 847 Q 160 848 165 847" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 138 870 Q 128 880 123 900 Q 118 920 125 932 Q 132 940 145 935 Q 140 915 140 895 Q 140 880 138 870" fill="url(#lem_fur_art41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="120" y="900" width="22" height="7" fill="#1a1a1a"/>
    <rect x="120" y="913" width="22" height="7" fill="#1a1a1a"/>
    <rect x="120" y="926" width="22" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="50" y="645" width="300" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="153,788 163,808 173,788" fill="#fff"/>
  <path d="M 153 790 L 163 810 L 173 790" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="676" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Is the canvas</text>
  <text x="200" y="704" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">worth more</text>
  <text x="200" y="732" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">empty or is</text>
  <text x="200" y="760" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">everything?</text>
</svg>