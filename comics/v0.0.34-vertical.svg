<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_scroll71v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_scroll71v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_scroll71v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_scroll71v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe scrolling, looking glazed -->
  <g filter="url(#shadow_scroll71v)">
    <!-- Body -->
    <ellipse cx="200" cy="215" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="165" rx="20" ry="23" fill="url(#hum_skin_scroll71v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 150 Q 200 143 220 150 Q 218 155 214 157 Q 200 153 186 157 Q 182 155 180 150" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Glazed eyes -->
    <ellipse cx="192" cy="165" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="192" cy="166" r="1.5" fill="#2a2a2a"/>
    <ellipse cx="208" cy="165" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="208" cy="166" r="1.5" fill="#2a2a2a"/>
    <!-- Dark circles -->
    <ellipse cx="192" cy="171" rx="4" ry="1.5" fill="#c8a882" opacity="0.5"/>
    <ellipse cx="208" cy="171" rx="4" ry="1.5" fill="#c8a882" opacity="0.5"/>
    <!-- Mouth slightly open -->
    <path d="M 196 178 Q 200 180 204 178" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>
    <!-- Phone in hands -->
    <rect x="185" y="220" width="30" height="50" rx="3" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1.5"/>
    <rect x="188" y="224" width="24" height="42" fill="#3a5a6a"/>
    <!-- Tiny content bars on phone -->
    <rect x="190" y="227" width="20" height="3" fill="#7a9aaa" opacity="0.7"/>
    <rect x="190" y="233" width="20" height="3" fill="#8aaa9a" opacity="0.7"/>
    <rect x="190" y="239" width="20" height="3" fill="#aa8a7a" opacity="0.7"/>
    <rect x="190" y="245" width="20" height="3" fill="#7a9aaa" opacity="0.7"/>
    <rect x="190" y="251" width="20" height="3" fill="#8aaa9a" opacity="0.7"/>
    <rect x="190" y="257" width="20" height="3" fill="#aa8a7a" opacity="0.7"/>
    <!-- Thumb scrolling -->
    <ellipse cx="205" cy="255" rx="8" ry="6" fill="url(#hum_skin_scroll71v)" stroke="#c8a882" stroke-width="1"/>
    <!-- Scroll arrows going down -->
    <path d="M 220 230 L 225 238 L 230 230" fill="none" stroke="#E63946" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 220 240 L 225 248 L 230 240" fill="none" stroke="#E63946" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 220 250 L 225 258 L 230 250" fill="none" stroke="#E63946" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="55" y="25" width="290" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="185,128 195,148 205,128" fill="#fff"/>
  <path d="M 185 130 L 195 150 L 205 130" fill="none" stroke="#333" stroke-width="2"/>
  <text x="200" y="55" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I've been</text>
  <text x="200" y="83" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">scrolling for</text>
  <text x="200" y="111" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">three hours.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring with enormous eyes -->
  <g filter="url(#shadow_scroll71v)">
    <!-- Body -->
    <ellipse cx="280" cy="530" rx="22" ry="28" fill="url(#lem_fur_scroll71v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="280" cy="500" rx="18" ry="16" fill="url(#lem_fur_scroll71v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="255" cy="495" rx="14" ry="16" fill="url(#lem_fur_scroll71v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="305" cy="495" rx="14" ry="16" fill="url(#lem_fur_scroll71v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="255" cy="495" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="305" cy="495" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="268" cy="500" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="268" cy="500" r="8" fill="#1a1a1a"/>
    <circle cx="266" cy="498" r="2" fill="#fff"/>
    <ellipse cx="292" cy="500" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="292" cy="500" r="8" fill="#1a1a1a"/>
    <circle cx="290" cy="498" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="280" cy="508" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 275 512 Q 280 513 285 512" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 260 538 Q 245 550 240 570 Q 238 590 245 600 Q 252 608 260 600 Q 256 585 255 570 Q 255 555 260 538" fill="url(#lem_fur_scroll71v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <path d="M 245 572 Q 250 570 255 572" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
    <path d="M 243 580 Q 248 578 253 580" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
    <path d="M 242 588 Q 247 586 252 588" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
    <path d="M 244 596 Q 249 594 254 596" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Cache leaning skeptical -->
  <g filter="url(#shadow_scroll71v)">
    <!-- Body -->
    <ellipse cx="140" cy="535" rx="18" ry="20" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="140" cy="513" rx="14" ry="13" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="128,508 125,488 135,502" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="152,508 155,488 145,502" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="129,505 127,492 134,503" fill="#cd853f"/>
    <polygon points="151,505 153,492 146,503" fill="#cd853f"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="134" cy="515" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="134" cy="516" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="146" cy="515" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="146" cy="516" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="140" cy="520" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Unimpressed mouth -->
    <path d="M 136 524 L 144 524" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 120 540 Q 105 545 100 560 Q 95 575 105 585 Q 115 595 125 585 Q 120 570 120 555 Q 120 547 120 540" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 2 - Cache -->
  <rect x="35" y="338" width="250" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="135,416 145,436 155,416" fill="#fff"/>
  <path d="M 135 418 L 145 438 L 155 418" fill="none" stroke="#333" stroke-width="2"/>
  <text x="160" y="370" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">What are you</text>
  <text x="160" y="398" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">looking for?</text>

  <!-- Sifaka thought bubble -->
  <rect x="215" y="440" width="160" height="55" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="275,493 282,510 289,493" fill="#fff"/>
  <path d="M 275 495 L 282 512 L 289 495" fill="none" stroke="#333" stroke-width="2"/>
  <text x="295" y="474" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">The bottom.</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe still scrolling, now tiny, phone enormous -->
  <g filter="url(#shadow_scroll71v)">
    <!-- Giant phone filling panel -->
    <rect x="180" y="700" width="130" height="230" rx="8" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="2"/>
    <rect x="186" y="710" width="118" height="205" fill="#2a3a3a"/>
    <!-- Infinite content bars -->
    <rect x="192" y="715" width="106" height="6" fill="#5a7a6a" opacity="0.5"/>
    <rect x="192" y="726" width="106" height="6" fill="#7a6a5a" opacity="0.5"/>
    <rect x="192" y="737" width="106" height="6" fill="#5a6a7a" opacity="0.5"/>
    <rect x="192" y="748" width="106" height="6" fill="#6a7a5a" opacity="0.5"/>
    <rect x="192" y="759" width="106" height="6" fill="#7a5a6a" opacity="0.5"/>
    <rect x="192" y="770" width="106" height="6" fill="#5a7a6a" opacity="0.5"/>
    <rect x="192" y="781" width="106" height="6" fill="#7a6a5a" opacity="0.5"/>
    <rect x="192" y="792" width="106" height="6" fill="#5a6a7a" opacity="0.5"/>
    <rect x="192" y="803" width="106" height="6" fill="#6a7a5a" opacity="0.5"/>
    <rect x="192" y="814" width="106" height="6" fill="#7a5a6a" opacity="0.5"/>
    <rect x="192" y="825" width="106" height="6" fill="#5a7a6a" opacity="0.5"/>
    <rect x="192" y="836" width="106" height="6" fill="#7a6a5a" opacity="0.5"/>
    <rect x="192" y="847" width="106" height="6" fill="#5a6a7a" opacity="0.5"/>
    <rect x="192" y="858" width="106" height="6" fill="#6a7a5a" opacity="0.5"/>
    <rect x="192" y="869" width="106" height="6" fill="#7a5a6a" opacity="0.5"/>
    <rect x="192" y="880" width="106" height="6" fill="#5a7a6a" opacity="0.5"/>
    <rect x="192" y="891" width="106" height="6" fill="#7a6a5a" opacity="0.5"/>
    <rect x="192" y="902" width="106" height="6" fill="#5a6a7a" opacity="0.5"/>

    <!-- Tiny Abe absorbed INTO the phone, just eyes visible in the screen -->
    <ellipse cx="235" cy="810" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="235" cy="811" r="2" fill="#2a2a2a"/>
    <ellipse cx="250" cy="810" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="250" cy="811" r="2" fill="#2a2a2a"/>
  </g>

  <!-- Cache off to the side, small -->
  <g filter="url(#shadow_scroll71v)">
    <ellipse cx="95" cy="885" rx="14" ry="16" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <ellipse cx="95" cy="868" rx="11" ry="10" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="86,864 84,849 92,860" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1"/>
    <polygon points="104,864 106,849 98,860" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="90" cy="870" rx="3" ry="1.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.7"/>
    <circle cx="90" cy="871" r="1" fill="#1a1a1a"/>
    <ellipse cx="100" cy="870" rx="3" ry="1.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.7"/>
    <circle cx="100" cy="871" r="1" fill="#1a1a1a"/>
    <!-- Tail -->
    <path d="M 82 888 Q 72 892 70 902 Q 68 912 75 916 Q 82 920 86 912 Q 83 902 83 894 Z" fill="url(#sq_fur_scroll71v)" stroke="#5d4a2f" stroke-width="1"/>
  </g>

  <!-- Speech bubble panel 3 - Cache -->
  <rect x="30" y="648" width="340" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="90,756 98,776 106,756" fill="#fff"/>
  <path d="M 90 758 L 98 778 L 106 758" fill="none" stroke="#333" stroke-width="2"/>
  <text x="200" y="680" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">There is no</text>
  <text x="200" y="710" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">bottom. That's</text>
  <text x="200" y="740" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the product.</text>

  <!-- Accent color tiny detail: red dot notification on giant phone -->
  <circle cx="308" cy="708" r="5" fill="#E63946"/>
  <text x="308" y="712" font-family="DejaVu Sans" font-size="8" text-anchor="middle" fill="#fff">∞</text>

</svg>