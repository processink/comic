<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_rema47v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_rema47v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_rema47v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e8e0"/>

  <!-- ==================== PANEL 1 ==================== -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on branch -->
  <g filter="url(#shadow_rema47v)">
    <!-- Body -->
    <ellipse cx="200" cy="220" rx="18" ry="20" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="198" rx="14" ry="13" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="193" cy="192" rx="6" ry="11" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 193 192)"/>
    <ellipse cx="207" cy="192" rx="6" ry="11" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 207 192)"/>
    <ellipse cx="193" cy="195" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 193 195)"/>
    <ellipse cx="207" cy="195" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 207 195)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="194" cy="200" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="201" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="206" cy="200" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="201" r="1.8" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <ellipse cx="200" cy="205" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 196 208 Q 200 207 204 208" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 180 225 Q 165 230 160 245 Q 155 260 165 270 Q 175 280 185 270 Q 180 255 180 240 Q 180 232 180 225" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Phone in paws -->
    <rect x="193" y="228" width="14" height="22" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="194" y="230" width="12" height="17" fill="#3a5a6a"/>
    <!-- Lock icon on screen -->
    <circle cx="200" cy="236" r="3" fill="none" stroke="#fff" stroke-width="1"/>
    <rect x="197" y="238" width="6" height="5" fill="#fff"/>
  </g>

  <!-- Ground line -->
  <line x1="20" y1="280" x2="380" y2="280" stroke="#8b7355" stroke-width="2"/>

  <!-- Speech bubble Panel 1 -->
  <rect x="40" y="28" width="250" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="155,156 165,176 175,156" fill="#fff"/>
  <path d="M 155 158 L 165 178 L 175 158" fill="none" stroke="#333" stroke-width="2"/>

  <text x="165" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Rema says</text>
  <text x="165" y="86" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">he only dates</text>
  <text x="165" y="114" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">people with</text>
  <text x="165" y="142" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">private pages.</text>

  <!-- ==================== PANEL 2 ==================== -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes -->
  <g filter="url(#shadow_rema47v)">
    <!-- Body -->
    <ellipse cx="200" cy="540" rx="22" ry="28" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="510" rx="18" ry="16" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="175" cy="505" rx="14" ry="16" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="505" rx="14" ry="16" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="505" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="505" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="188" cy="510" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="510" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="508" r="2" fill="#fff"/>

    <ellipse cx="212" cy="510" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="510" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="508" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="200" cy="518" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 193 522 Q 200 523 207 522" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 180 545 Q 170 560 165 580 Q 162 595 168 605 Q 175 615 182 605 Q 178 590 175 575 Q 173 560 180 545" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Tail stripes -->
    <path d="M 169 580 Q 172 578 176 580" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
    <path d="M 167 588 Q 170 586 174 588" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
    <path d="M 168 596 Q 171 594 175 596" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
    <path d="M 170 604 Q 173 602 177 604" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Ground line -->
  <line x1="20" y1="590" x2="380" y2="590" stroke="#8b7355" stroke-width="2"/>

  <!-- Speech bubble Panel 2 -->
  <rect x="40" y="338" width="260" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="175,476 185,496 195,476" fill="#fff"/>
  <path d="M 175 478 L 185 498 L 195 478" fill="none" stroke="#333" stroke-width="2"/>

  <text x="170" y="370" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">So he wants</text>
  <text x="170" y="398" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">to be loved</text>
  <text x="170" y="426" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">by someone</text>
  <text x="170" y="454" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">who doesn't</text>

  <!-- ==================== PANEL 3 ==================== -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache and Sifaka together -->
  <g filter="url(#shadow_rema47v)">
    <!-- Cache smaller, sitting -->
    <ellipse cx="150" cy="860" rx="16" ry="18" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="150" cy="840" rx="12" ry="11" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="144" cy="834" rx="5" ry="9" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 144 834)"/>
    <ellipse cx="156" cy="834" rx="5" ry="9" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 156 834)"/>
    <ellipse cx="144" cy="836" rx="2.5" ry="5.5" fill="#cd853f" transform="rotate(-15 144 836)"/>
    <ellipse cx="156" cy="836" rx="2.5" ry="5.5" fill="#cd853f" transform="rotate(15 156 836)"/>

    <!-- Eyes - half lidded, tired -->
    <ellipse cx="145" cy="842" rx="3.5" ry="1.8" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="145" cy="843" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="155" cy="842" rx="3.5" ry="1.8" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="155" cy="843" r="1.5" fill="#1a1a1a"/>

    <ellipse cx="150" cy="846" rx="1.3" ry="1" fill="#1a1a1a"/>
    <path d="M 146 849 Q 150 848 154 849" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Cache tail -->
    <path d="M 133 865 Q 118 870 113 885 Q 110 898 118 905 Q 126 912 134 905 Q 130 890 130 878 Q 130 870 133 865" fill="url(#sq_fur_rema47v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Sifaka next to Cache -->
    <ellipse cx="250" cy="858" rx="18" ry="22" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="250" cy="830" rx="15" ry="14" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Sifaka ears -->
    <ellipse cx="230" cy="825" rx="11" ry="13" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="270" cy="825" rx="11" ry="13" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="230" cy="825" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="270" cy="825" rx="6" ry="8" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="240" cy="830" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="240" cy="830" r="6.5" fill="#1a1a1a"/>
    <circle cx="238" cy="828" r="1.8" fill="#fff"/>
    <ellipse cx="260" cy="830" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="260" cy="830" r="6.5" fill="#1a1a1a"/>
    <circle cx="258" cy="828" r="1.8" fill="#fff"/>

    <ellipse cx="250" cy="838" rx="1.8" ry="1.3" fill="#1a1a1a"/>

    <!-- Sifaka tail -->
    <path d="M 268 860 Q 280 875 285 890 Q 288 902 282 910 Q 275 915 270 908 Q 276 895 274 880 Q 272 868 268 860" fill="url(#lem_fur_rema47v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <path d="M 283 888 Q 280 886 276 888" stroke="#1a1a1a" stroke-width="2" fill="none"/>
    <path d="M 282 896 Q 279 894 275 896" stroke="#1a1a1a" stroke-width="2" fill="none"/>
    <path d="M 279 904 Q 276 902 273 904" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  </g>

  <!-- Ground line -->
  <line x1="20" y1="900" x2="380" y2="900" stroke="#8b7355" stroke-width="2"/>

  <!-- Sifaka's speech finishing from panel 2 -->
  <rect x="150" y="648" width="220" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="245,756 255,776 265,756" fill="#fff"/>
  <path d="M 245 758 L 255 778 L 265 758" fill="none" stroke="#333" stroke-width="2"/>

  <text x="260" y="680" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">need to be</text>
  <text x="260" y="710" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">seen loving</text>
  <text x="260" y="740" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">him?</text>

  <!-- Cache's quiet response -->
  <rect x="35" y="770" width="160" height="52" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="130,820 140,838 150,820" fill="#fff"/>
  <path d="M 130 822 L 140 840 L 150 822" fill="none" stroke="#333" stroke-width="2"/>

  <text x="115" y="803" font-family="DejaVu Sans" font-size="25" text-anchor="middle" fill="#222">...damn.</text>

  <!-- Small accent: red heart with lock -->
  <g opacity="0.15">
    <path d="M 198 625 Q 198 615 205 615 Q 212 615 212 625 L 212 633 L 205 640 L 198 633 Z" fill="#E63946"/>
    <rect x="202" y="629" width="6" height="5" fill="#333"/>
    <circle cx="205" cy="627" r="3" fill="none" stroke="#333" stroke-width="1"/>
  </g>
</svg>