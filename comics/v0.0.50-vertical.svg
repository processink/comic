<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v61" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v61" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_v61" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_v61">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding phone, looking disturbed -->
  <g filter="url(#shadow_v61)">
    <!-- Body -->
    <ellipse cx="200" cy="245" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Neck -->
    <rect x="191" y="208" width="18" height="14" fill="url(#hum_skin_v61)"/>
    <!-- Head -->
    <ellipse cx="200" cy="195" rx="20" ry="23" fill="url(#hum_skin_v61)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 182 Q 200 172 220 182 Q 218 187 214 189 Q 200 184 186 189 Q 182 187 180 182" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes - wide, alarmed -->
    <ellipse cx="192" cy="195" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="193" cy="195" r="2.5" fill="#2a2a2a"/>
    <ellipse cx="208" cy="195" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="209" cy="195" r="2.5" fill="#2a2a2a"/>
    <!-- Nose -->
    <path d="M 200 200 L 200 204" stroke="#a8896d" stroke-width="1"/>
    <!-- Mouth - open, disturbed -->
    <ellipse cx="200" cy="210" rx="4" ry="3" fill="#4a2a2a" stroke="#8a6d51" stroke-width="1"/>
    <!-- Phone in hand -->
    <rect x="215" y="230" width="18" height="30" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="217" y="233" width="14" height="24" fill="#E63946"/>
    <text x="224" y="243" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#fff">YOU</text>
    <text x="224" y="250" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#fff">NEED</text>
    <text x="224" y="257" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">KNEE BRACES</text>
    <!-- Arm holding phone -->
    <path d="M 218 240 Q 228 235 225 230" fill="url(#hum_skin_v61)" stroke="#c8a882" stroke-width="2"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="45" y="30" width="310" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="185,158 200,178 215,158" fill="#fff"/>
  <line x1="185" y1="160" x2="200" y2="180" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="180" x2="215" y2="160" stroke="#333" stroke-width="2"/>

  <text x="200" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I THOUGHT</text>
  <text x="200" y="86" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">about knee</text>
  <text x="200" y="114" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">pain ONCE.</text>
  <text x="200" y="142" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Silently.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking skeptical -->
  <g filter="url(#shadow_v61)">
    <!-- Body -->
    <ellipse cx="150" cy="560" rx="18" ry="20" fill="url(#sq_fur_v61)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="535" rx="14" ry="13" fill="url(#sq_fur_v61)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="143" cy="528" rx="6" ry="11" fill="url(#sq_fur_v61)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 143 528)"/>
    <ellipse cx="157" cy="528" rx="6" ry="11" fill="url(#sq_fur_v61)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 157 528)"/>
    <ellipse cx="143" cy="531" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 143 531)"/>
    <ellipse cx="157" cy="531" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 157 531)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="144" cy="537" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="144" cy="538" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="156" cy="537" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="156" cy="538" r="1.8" fill="#1a1a1a"/>
    <!-- Eyelids (half-lidded) -->
    <path d="M 140 535 Q 144 536 148 535" fill="url(#sq_fur_v61)" stroke="#5d4a2f" stroke-width="0.8"/>
    <path d="M 152 535 Q 156 536 160 535" fill="url(#sq_fur_v61)" stroke="#5d4a2f" stroke-width="0.8"/>
    <!-- Nose -->
    <ellipse cx="150" cy="542" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Simple mouth -->
    <path d="M 146 545 Q 150 544 154 545" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 130 565 Q 115 570 110 585 Q 105 600 115 610 Q 125 620 135 610 Q 130 595 130 580 Q 130 572 130 565" fill="url(#sq_fur_v61)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_v61)">
    <!-- Body -->
    <ellipse cx="250" cy="558" rx="20" ry="25" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="250" cy="530" rx="16" ry="14" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="228" cy="526" rx="12" ry="14" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="272" cy="526" rx="12" ry="14" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="228" cy="526" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="272" cy="526" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="240" cy="530" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="240" cy="530" r="7" fill="#1a1a1a"/>
    <circle cx="238" cy="528" r="2" fill="#fff"/>
    <ellipse cx="260" cy="530" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="260" cy="530" r="7" fill="#1a1a1a"/>
    <circle cx="258" cy="528" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="250" cy="538" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 245 542 Q 250 543 255 542" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 270 560 Q 280 570 285 588 Q 288 606 283 620 Q 278 628 270 625 Q 265 618 268 606 Q 270 588 265 570" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="270" y="585" width="15" height="6" fill="#1a1a1a"/>
    <rect x="270" y="597" width="15" height="6" fill="#1a1a1a"/>
    <rect x="270" y="609" width="12" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 2 - Cache -->
  <rect x="55" y="340" width="290" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,448 155,468 165,448" fill="#fff"/>
  <line x1="145" y1="450" x2="155" y2="470" stroke="#333" stroke-width="2"/>
  <line x1="155" y1="470" x2="165" y2="450" stroke="#333" stroke-width="2"/>

  <text x="200" y="372" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Did you think</text>
  <text x="200" y="400" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">it near your</text>
  <text x="200" y="428" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">phone?</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka alone, staring at viewer -->
  <g filter="url(#shadow_v61)">
    <!-- Body -->
    <ellipse cx="200" cy="858" rx="22" ry="28" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="825" rx="18" ry="16" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="175" cy="820" rx="14" ry="16" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="820" rx="14" ry="16" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="820" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="820" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes - staring directly at reader -->
    <ellipse cx="188" cy="825" rx="11" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="825" r="9" fill="#1a1a1a"/>
    <circle cx="186" cy="823" r="2.5" fill="#fff"/>
    <ellipse cx="212" cy="825" rx="11" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="825" r="9" fill="#1a1a1a"/>
    <circle cx="210" cy="823" r="2.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="200" cy="835" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny concerned mouth -->
    <path d="M 195 840 Q 200 838 205 840" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail -->
    <path d="M 178 862 Q 168 872 163 892 Q 158 912 163 927 Q 168 938 178 935 Q 185 930 182 915 Q 178 895 180 875" fill="url(#lem_fur_v61)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="163" y="890" width="18" height="7" fill="#1a1a1a"/>
    <rect x="163" y="904" width="18" height="7" fill="#1a1a1a"/>
    <rect x="163" y="918" width="15" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="45" y="650" width="310" height="140" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="185,788 200,808 215,788" fill="#fff"/>
  <line x1="185" y1="790" x2="200" y2="810" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="810" x2="215" y2="790" stroke="#333" stroke-width="2"/>

  <text x="200" y="680" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">What if the</text>
  <text x="200" y="710" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">algorithm knows</text>
  <text x="200" y="740" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">your knees hurt</text>
  <text x="200" y="770" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">before you do?</text>

  <!-- Accent color strip at bottom -->
  <rect x="0" y="955" width="400" height="5" fill="#E63946"/>
</svg>