<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_v42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_v42">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Speech bubble Panel 1 -->
  <rect x="30" y="25" width="250" height="115" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="150,138 160,155 170,138" fill="#fff"/>
  <line x1="150" y1="140" x2="160" y2="157" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="157" x2="170" y2="140" stroke="#333" stroke-width="2"/>

  <text x="155" y="52" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">They trained</text>
  <text x="155" y="80" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">an AI to draw</text>
  <text x="155" y="108" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">comic strips.</text>
  <text x="155" y="134" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Like Dilbert.</text>

  <!-- Abe at desk reading newspaper -->
  <g filter="url(#shadow_v42)">
    <!-- Desk -->
    <rect x="80" y="255" width="220" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
    <rect x="90" y="263" width="8" height="40" fill="#8b7355"/>
    <rect x="282" y="263" width="8" height="40" fill="#8b7355"/>

    <!-- Abe body -->
    <rect x="162" y="200" width="56" height="55" rx="3" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.3"/>

    <!-- Neck -->
    <rect x="181" y="190" width="18" height="14" fill="url(#hum_skin_v42)"/>

    <!-- Head -->
    <circle cx="190" cy="170" r="22" fill="url(#hum_skin_v42)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 168 160 Q 180 148 190 146 Q 200 148 212 160 Q 210 155 205 152 Q 190 145 175 152 Q 170 155 168 160" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes - skeptical -->
    <ellipse cx="181" cy="170" rx="3.5" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="182" cy="171" r="2" fill="#2a2a2a"/>
    <ellipse cx="199" cy="170" rx="3.5" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="200" cy="171" r="2" fill="#2a2a2a"/>

    <!-- Raised eyebrow -->
    <path d="M 195 163 Q 199 160 203 163" fill="none" stroke="#4a3728" stroke-width="1.5"/>
    <path d="M 177 165 Q 181 163 185 165" fill="none" stroke="#4a3728" stroke-width="1.3"/>

    <!-- Nose -->
    <path d="M 190 174 L 190 178" stroke="#a8896d" stroke-width="1"/>

    <!-- Mouth - flat -->
    <path d="M 184 183 L 196 183" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Newspaper -->
    <rect x="148" y="225" width="84" height="30" fill="#f5f0e0" stroke="#999" stroke-width="1"/>
    <text x="190" y="237" font-family="DejaVu Sans" font-size="6" text-anchor="middle" fill="#333" font-weight="bold">DAILY HERALD</text>
    <text x="190" y="245" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#555">AI NOW DRAWS</text>
    <text x="190" y="251" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#555">COMIC STRIPS</text>
  </g>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Speech bubble Panel 2 - Cache -->
  <rect x="30" y="335" width="250" height="145" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,478 150,495 160,478" fill="#fff"/>
  <line x1="140" y1="480" x2="150" y2="497" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="497" x2="160" y2="480" stroke="#333" stroke-width="2"/>

  <text x="155" y="363" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">So they</text>
  <text x="155" y="391" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">replaced the</text>
  <text x="155" y="419" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">guy who got</text>
  <text x="155" y="447" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">replaced by</text>
  <text x="155" y="475" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">his opinions.</text>

  <!-- Cache on desk -->
  <g filter="url(#shadow_v42)">
    <!-- Cache body -->
    <ellipse cx="180" cy="535" rx="18" ry="20" fill="url(#sq_fur_v42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Cache head -->
    <ellipse cx="180" cy="513" rx="14" ry="13" fill="url(#sq_fur_v42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="173" cy="507" rx="6" ry="11" fill="url(#sq_fur_v42)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 173 507)"/>
    <ellipse cx="187" cy="507" rx="6" ry="11" fill="url(#sq_fur_v42)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 187 507)"/>
    <ellipse cx="173" cy="510" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 173 510)"/>
    <ellipse cx="187" cy="510" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 187 510)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="174" cy="515" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="174" cy="515" r="2" fill="#1a1a1a"/>
    <ellipse cx="186" cy="515" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="186" cy="515" r="2" fill="#1a1a1a"/>

    <!-- Eyelid lines -->
    <line x1="170" y1="513" x2="178" y2="513" stroke="#5d4a2f" stroke-width="1"/>
    <line x1="182" y1="513" x2="190" y2="513" stroke="#5d4a2f" stroke-width="1"/>

    <!-- Nose -->
    <ellipse cx="180" cy="520" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Mouth - deadpan -->
    <path d="M 176 523 L 184 523" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 160 540 Q 145 545 140 560 Q 135 575 145 585 Q 155 595 165 585 Q 160 570 160 555 Q 160 547 160 540" fill="url(#sq_fur_v42)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Desk surface -->
    <rect x="80" y="555" width="220" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>
  </g>

  <!-- Sifaka peeking from bottom right -->
  <g filter="url(#shadow_v42)">
    <ellipse cx="320" cy="580" rx="18" ry="16" fill="url(#lem_fur_v42)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="305" cy="570" rx="10" ry="12" fill="url(#lem_fur_v42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="335" cy="570" rx="10" ry="12" fill="url(#lem_fur_v42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="305" cy="570" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="335" cy="570" rx="6" ry="8" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="312" cy="578" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="312" cy="579" r="7" fill="#1a1a1a"/>
    <circle cx="310" cy="577" r="2" fill="#fff"/>

    <ellipse cx="328" cy="578" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="328" cy="579" r="7" fill="#1a1a1a"/>
    <circle cx="326" cy="577" r="2" fill="#fff"/>

    <ellipse cx="320" cy="586" rx="2" ry="1.5" fill="#1a1a1a"/>

    <!-- Ring tail visible -->
    <path d="M 338 582 Q 348 590 355 605 Q 358 615 362 620" fill="none" stroke="url(#lem_fur_v42)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 338 582 Q 348 590 355 605 Q 358 615 362 620" fill="none" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" stroke-dasharray="8,8"/>
  </g>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Speech bubble Panel 3 -->
  <rect x="30" y="645" width="260" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="230,773 240,790 250,773" fill="#fff"/>
  <line x1="230" y1="775" x2="240" y2="792" stroke="#333" stroke-width="2"/>
  <line x1="240" y1="792" x2="250" y2="775" stroke="#333" stroke-width="2"/>

  <text x="160" y="675" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">The AI draws</text>
  <text x="160" y="703" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">better but it</text>
  <text x="160" y="731" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">doesn't know</text>
  <text x="160" y="759" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">it's in a cubicle.</text>

  <!-- Abe staring at reader, coffee mug -->
  <g filter="url(#shadow_v42)">
    <!-- Coffee mug on desk -->
    <rect x="170" y="878" width="20" height="18" rx="2" fill="#fff" stroke="#999" stroke-width="1.2"/>
    <rect x="190" y="882" width="8" height="10" rx="4" fill="none" stroke="#999" stroke-width="1.2"/>
    <ellipse cx="180" cy="882" rx="8" ry="3" fill="#6b3a1f"/>

    <!-- Desk -->
    <rect x="100" y="895" width="260" height="8" fill="#8b7355" stroke="#6b5335" stroke-width="1"/>

    <!-- Abe body -->
    <rect x="222" y="840" width="56" height="55" rx="3" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.3"/>

    <!-- Neck -->
    <rect x="241" y="830" width="18" height="14" fill="url(#hum_skin_v42)"/>

    <!-- Head -->
    <circle cx="250" cy="810" r="22" fill="url(#hum_skin_v42)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 228 800 Q 240 788 250 786 Q 260 788 272 800 Q 270 795 265 792 Q 250 785 235 792 Q 230 795 228 800" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Eyes - thousand yard stare -->
    <ellipse cx="241" cy="810" rx="4" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="241" cy="810" r="2" fill="#2a2a2a"/>
    <ellipse cx="259" cy="810" rx="4" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="259" cy="810" r="2" fill="#2a2a2a"/>

    <!-- Eyebrows flat -->
    <line x1="237" y1="803" x2="245" y2="804" stroke="#4a3728" stroke-width="1.5"/>
    <line x1="255" y1="804" x2="263" y2="803" stroke="#4a3728" stroke-width="1.5"/>

    <!-- Nose -->
    <path d="M 250 814 L 250 818" stroke="#a8896d" stroke-width="1"/>

    <!-- Mouth - slight frown -->
    <path d="M 244 824 Q 250 822 256 824" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Tiny watermark -->
  <text x="380" y="948" font-family="DejaVu Sans" font-size="8" text-anchor="end" fill="#bbb">process.ink</text>
</svg>