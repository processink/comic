<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="human_skin_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding a single acorn-sized tree seedling in a tiny pot -->
  <g filter="url(#shadow_v)">
    <!-- Body -->
    <ellipse cx="200" cy="230" rx="28" ry="35" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="180" rx="20" ry="23" fill="url(#human_skin_v)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 165 Q 200 157 220 165 Q 218 169 214 171 Q 200 167 186 171 Q 182 169 180 165" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Earnest eyes -->
    <ellipse cx="192" cy="180" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="192" cy="181" r="2.5" fill="#1a1a1a"/>
    <circle cx="191" cy="179" r="0.8" fill="#fff"/>
    <ellipse cx="208" cy="180" rx="3.5" ry="4.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="208" cy="181" r="2.5" fill="#1a1a1a"/>
    <circle cx="207" cy="179" r="0.8" fill="#fff"/>
    <!-- Hopeful smile -->
    <path d="M 194 191 Q 200 195 206 191" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Neck -->
    <rect x="194" y="200" width="12" height="10" fill="url(#human_skin_v)"/>
    <!-- Arms holding tiny pot -->
    <path d="M 178 235 Q 170 230 168 220 Q 166 213 175 210" fill="none" stroke="url(#human_skin_v)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 222 235 Q 230 230 232 220 Q 234 213 225 210" fill="none" stroke="url(#human_skin_v)" stroke-width="10" stroke-linecap="round"/>
    <!-- Tiny pot -->
    <rect x="188" y="207" width="24" height="18" rx="2" fill="#8b5e3c" stroke="#5d3a1a" stroke-width="1.2"/>
    <rect x="185" y="205" width="30" height="5" rx="1" fill="#6b4226" stroke="#5d3a1a" stroke-width="0.8"/>
    <!-- Tiny seedling -->
    <line x1="200" y1="205" x2="200" y2="193" stroke="#4a7a3a" stroke-width="2"/>
    <ellipse cx="195" cy="195" rx="5" ry="4" fill="#5a9a4a" stroke="#3a6a2a" stroke-width="0.8"/>
    <ellipse cx="205" cy="193" rx="5" ry="4" fill="#5a9a4a" stroke="#3a6a2a" stroke-width="0.8"/>
  </g>

  <!-- Accent heart near Abe's head -->
  <text x="230" y="173" font-family="DejaVu Sans" font-size="17" fill="#E63946" font-weight="bold">♥</text>

  <!-- Speech bubble panel 1 -->
  <rect x="40" y="30" width="320" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,128 200,145 210,128" fill="#fff"/>
  <polygon points="192,130 200,143 208,130" fill="#fff"/>
  <path d="M 190 130 L 200 147 L 210 130" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="58" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I planted a tree</text>
  <text x="200" y="88" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">to offset my anxiety.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache half-lidded, sitting on branch stub -->
  <g filter="url(#shadow_v)">
    <!-- Branch stub / stump -->
    <rect x="170" y="555" width="60" height="14" rx="3" fill="#7a5a3a" stroke="#5d3a1a" stroke-width="1.2"/>
    <rect x="180" y="569" width="40" height="40" rx="2" fill="#6a4a2a" stroke="#5d3a1a" stroke-width="1"/>

    <!-- Body -->
    <ellipse cx="200" cy="540" rx="18" ry="20" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="518" rx="14" ry="13" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="188,510 192,490 196,510" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="190,508 192,494 194,508" fill="#cd853f"/>
    <polygon points="204,510 208,490 212,510" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="206,508 208,494 210,508" fill="#cd853f"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="194" cy="520" rx="4" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="520.5" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="206" cy="520" rx="4" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="520.5" r="1.8" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="200" cy="525" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 195 529 L 205 529" fill="none" stroke="#5d4a2f" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 218 538 Q 235 530 242 515 Q 246 500 240 495 Q 234 500 230 515 Q 225 530 218 536 Z" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="40" y="340" width="320" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,468 200,485 210,468" fill="#fff"/>
  <polygon points="192,470 200,483 208,470" fill="#fff"/>
  <path d="M 190 470 L 200 487 L 210 470" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="370" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Now you're</text>
  <text x="200" y="398" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">anxious about</text>
  <text x="200" y="426" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the tree</text>
  <text x="200" y="454" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">dying too.</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring at the seedling -->
  <g filter="url(#shadow_v)">
    <!-- Tiny pot on ground -->
    <rect x="140" y="890" width="20" height="15" rx="2" fill="#8b5e3c" stroke="#5d3a1a" stroke-width="1"/>
    <rect x="137" y="888" width="26" height="4" rx="1" fill="#6b4226" stroke="#5d3a1a" stroke-width="0.8"/>
    <!-- Seedling -->
    <line x1="150" y1="888" x2="150" y2="876" stroke="#4a7a3a" stroke-width="2"/>
    <ellipse cx="145" cy="878" rx="4.5" ry="3.5" fill="#5a9a4a" stroke="#3a6a2a" stroke-width="0.8"/>
    <ellipse cx="155" cy="876" rx="4.5" ry="3.5" fill="#5a9a4a" stroke="#3a6a2a" stroke-width="0.8"/>

    <!-- Sifaka crouched, face level with seedling -->
    <ellipse cx="200" cy="890" rx="20" ry="22" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="200" cy="868" rx="16" ry="14" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="178" cy="863" rx="12" ry="14" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="222" cy="863" rx="12" ry="14" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="178" cy="863" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="222" cy="863" rx="7" ry="9" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes staring at seedling -->
    <ellipse cx="190" cy="868" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="868" r="7" fill="#1a1a1a"/>
    <circle cx="186" cy="866" r="2" fill="#fff"/>

    <ellipse cx="210" cy="868" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="208" cy="868" r="7" fill="#1a1a1a"/>
    <circle cx="206" cy="866" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="200" cy="876" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny open mouth -->
    <ellipse cx="200" cy="881" rx="3" ry="2" fill="#4a3030" stroke="#3a2020" stroke-width="0.6"/>

    <!-- Ring tail with stripes -->
    <path d="M 218 888 Q 230 880 238 865 Q 245 850 250 835 Q 253 825 248 822 Q 243 828 240 842 Q 235 858 228 872 Q 222 882 218 886 Z" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="239" y="838" width="12" height="6" rx="1" fill="#1a1a1a" transform="rotate(-70 245 841)"/>
    <rect x="236" y="852" width="12" height="6" rx="1" fill="#1a1a1a" transform="rotate(-60 242 855)"/>
    <rect x="231" y="865" width="12" height="6" rx="1" fill="#1a1a1a" transform="rotate(-45 237 868)"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="30" y="650" width="340" height="170" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="195,818 205,835 215,818" fill="#fff"/>
  <polygon points="197,820 205,833 213,820" fill="#fff"/>
  <path d="M 195 820 L 205 837 L 215 820" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="680" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Does the tree</text>
  <text x="200" y="710" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">know it's</text>
  <text x="200" y="740" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">supposed to</text>
  <text x="200" y="770" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">save us, or is</text>
  <text x="200" y="800" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">it just a tree</text>

</svg>