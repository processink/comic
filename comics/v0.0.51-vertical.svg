<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v88" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v88" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_v88" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_v88">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe holding a printed policy document -->
  <g filter="url(#shadow_v88)">
    <!-- Body -->
    <ellipse cx="200" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Neck -->
    <rect x="191" y="198" width="18" height="14" fill="url(#hum_skin_v88)"/>
    <!-- Head -->
    <ellipse cx="200" cy="185" rx="20" ry="23" fill="url(#hum_skin_v88)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 180 172 Q 200 162 220 172 Q 218 177 214 179 Q 200 174 186 179 Q 182 177 180 172" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes -->
    <ellipse cx="192" cy="185" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="193" cy="186" r="2" fill="#2a2a2a"/>
    <ellipse cx="208" cy="185" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="209" cy="186" r="2" fill="#2a2a2a"/>
    <!-- Nose -->
    <path d="M 200 190 L 200 194" stroke="#a8896d" stroke-width="1"/>
    <!-- Mouth -->
    <path d="M 195 199 Q 200 197 205 199" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Paper in hands -->
    <rect x="160" y="220" width="50" height="65" fill="#f5f5f0" stroke="#999" stroke-width="1"/>
    <rect x="165" y="225" width="40" height="2" fill="#333"/>
    <text x="185" y="225" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#333">IT POLICY v47.3</text>
    <rect x="165" y="233" width="40" height="1" fill="#aaa"/>
    <rect x="165" y="237" width="40" height="1" fill="#aaa"/>
    <rect x="165" y="241" width="40" height="1" fill="#aaa"/>
    <rect x="165" y="245" width="35" height="1" fill="#aaa"/>
    <rect x="165" y="249" width="40" height="1" fill="#aaa"/>
    <rect x="165" y="253" width="30" height="1" fill="#aaa"/>
    <rect x="165" y="261" width="40" height="2" fill="#E63946"/>
    <text x="185" y="261" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#E63946">§12: NO POSTING NEWS</text>
    <rect x="165" y="267" width="40" height="1" fill="#aaa"/>
    <rect x="165" y="271" width="38" height="1" fill="#aaa"/>
    <rect x="165" y="275" width="40" height="1" fill="#aaa"/>

    <!-- Arms holding paper -->
    <path d="M 178 225 Q 170 220 165 225" fill="url(#hum_skin_v88)" stroke="#c8a882" stroke-width="2"/>
    <path d="M 212 225 Q 220 220 215 225" fill="url(#hum_skin_v88)" stroke="#c8a882" stroke-width="2"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="40" y="25" width="320" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,143 200,163 210,143" fill="#fff"/>
  <line x1="190" y1="145" x2="200" y2="165" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="165" x2="210" y2="145" stroke="#333" stroke-width="2"/>

  <text x="200" y="52" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">New IT policy</text>
  <text x="200" y="78" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">says we can't</text>
  <text x="200" y="104" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">share news on</text>
  <text x="200" y="130" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">social media.</text>

  <!-- Panel 2 -->
  <rect x="10" y="330" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking skeptical -->
  <g filter="url(#shadow_v88)">
    <!-- Body -->
    <ellipse cx="150" cy="565" rx="18" ry="20" fill="url(#sq_fur_v88)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="542" rx="14" ry="13" fill="url(#sq_fur_v88)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <ellipse cx="143" cy="535" rx="6" ry="11" fill="url(#sq_fur_v88)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 143 535)"/>
    <ellipse cx="157" cy="535" rx="6" ry="11" fill="url(#sq_fur_v88)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 157 535)"/>
    <ellipse cx="143" cy="538" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 143 538)"/>
    <ellipse cx="157" cy="538" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 157 538)"/>
    <!-- Half-lidded eyes -->
    <ellipse cx="144" cy="544" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="144" cy="545" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="156" cy="544" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="156" cy="545" r="1.8" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="150" cy="548" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 146 551 Q 150 550 154 551" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 130 568 Q 115 573 110 588 Q 105 603 115 613 Q 125 623 135 613 Q 130 598 130 583 Q 130 575 130 568" fill="url(#sq_fur_v88)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Arms crossed -->
    <ellipse cx="138" cy="562" rx="9" ry="5" fill="url(#sq_fur_v88)" stroke="#5d4a2f" stroke-width="1" transform="rotate(20 138 562)"/>
    <ellipse cx="162" cy="562" rx="9" ry="5" fill="url(#sq_fur_v88)" stroke="#5d4a2f" stroke-width="1" transform="rotate(-20 162 562)"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_v88)">
    <!-- Body -->
    <ellipse cx="260" cy="560" rx="18" ry="24" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="260" cy="532" rx="15" ry="14" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="240" cy="528" rx="11" ry="13" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="280" cy="528" rx="11" ry="13" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="240" cy="528" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="280" cy="528" rx="6" ry="8" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="252" cy="532" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="252" cy="532" r="6.5" fill="#1a1a1a"/>
    <circle cx="250" cy="530" r="1.8" fill="#fff"/>
    <ellipse cx="268" cy="532" rx="8" ry="9" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="268" cy="532" r="6.5" fill="#1a1a1a"/>
    <circle cx="266" cy="530" r="1.8" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="260" cy="539" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 255 542 Q 260 544 265 542" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail -->
    <path d="M 242 565 Q 232 575 227 595 Q 222 615 230 628 Q 238 635 248 628 Q 243 608 243 588 Q 243 575 242 565" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="225" y="590" width="22" height="6" fill="#1a1a1a"/>
    <rect x="225" y="602" width="22" height="6" fill="#1a1a1a"/>
    <rect x="225" y="614" width="22" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 2 - Cache -->
  <rect x="40" y="345" width="320" height="100" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,443 155,463 165,443" fill="#fff"/>
  <line x1="145" y1="445" x2="155" y2="465" stroke="#333" stroke-width="2"/>
  <line x1="155" y1="465" x2="165" y2="445" stroke="#333" stroke-width="2"/>

  <text x="200" y="375" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">So reality is</text>
  <text x="200" y="401" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">now classified</text>
  <text x="200" y="427" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">information?</text>

  <!-- Panel 3 -->
  <rect x="10" y="650" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka alone, staring at the reader -->
  <g filter="url(#shadow_v88)">
    <!-- Body -->
    <ellipse cx="200" cy="885" rx="22" ry="28" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="853" rx="18" ry="16" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Ears -->
    <ellipse cx="175" cy="848" rx="14" ry="16" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="848" rx="14" ry="16" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="848" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="848" rx="8" ry="10" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes - extra wide, staring -->
    <ellipse cx="188" cy="853" rx="11" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="853" r="9" fill="#1a1a1a"/>
    <circle cx="186" cy="851" r="2.5" fill="#fff"/>
    <ellipse cx="212" cy="853" rx="11" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="853" r="9" fill="#1a1a1a"/>
    <circle cx="210" cy="851" r="2.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="200" cy="862" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 196 866 Q 200 865 204 866" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail -->
    <path d="M 178 890 Q 168 900 163 920 Q 158 940 163 955 Q 168 968 178 962 Q 173 942 173 922 Q 173 905 178 890" fill="url(#lem_fur_v88)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="160" y="915" width="18" height="6" fill="#1a1a1a"/>
    <rect x="160" y="927" width="18" height="6" fill="#1a1a1a"/>
    <rect x="160" y="939" width="18" height="6" fill="#1a1a1a"/>
    <rect x="160" y="951" width="18" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="40" y="665" width="320" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,793 200,813 210,793" fill="#fff"/>
  <line x1="190" y1="795" x2="200" y2="815" stroke="#333" stroke-width="2"/>
  <line x1="200" y1="815" x2="210" y2="795" stroke="#333" stroke-width="2"/>

  <text x="200" y="695" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">It always was.</text>
  <text x="200" y="723" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">They just didn't</text>
  <text x="200" y="751" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">have a policy</text>
  <text x="200" y="779" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">number for it.</text>
</svg>