<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_st47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_st47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_st47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_st47">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe at computer showing Smalltalk browser -->
  <g filter="url(#shadow_st47)">
    <!-- Body -->
    <ellipse cx="150" cy="230" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="180" rx="20" ry="23" fill="url(#hum_skin_st47)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 165 Q 150 158 170 165 Q 168 170 164 172 Q 150 168 136 172 Q 132 170 130 165" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes wide with wonder -->
    <ellipse cx="142" cy="180" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="180" r="3" fill="#2a2a2a"/>
    <circle cx="141" cy="179" r="1" fill="#fff"/>
    <ellipse cx="158" cy="180" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="180" r="3" fill="#2a2a2a"/>
    <circle cx="157" cy="179" r="1" fill="#fff"/>
    <!-- Nose and mouth -->
    <path d="M 150 185 L 150 188" stroke="#a8896d" stroke-width="1"/>
    <path d="M 145 193 Q 150 196 155 193" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Computer monitor -->
    <rect x="100" y="250" width="100" height="65" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="103" y="253" width="94" height="55" fill="#f0ece4"/>
    <!-- Smalltalk browser panes -->
    <rect x="105" y="255" width="22" height="20" fill="#d9d3c7" stroke="#8a8a7a" stroke-width="0.5"/>
    <rect x="129" y="255" width="22" height="20" fill="#d9d3c7" stroke="#8a8a7a" stroke-width="0.5"/>
    <rect x="153" y="255" width="22" height="20" fill="#d9d3c7" stroke="#8a8a7a" stroke-width="0.5"/>
    <rect x="177" y="255" width="18" height="20" fill="#d9d3c7" stroke="#8a8a7a" stroke-width="0.5"/>
    <!-- Code area -->
    <rect x="105" y="277" width="90" height="28" fill="#fffef8" stroke="#8a8a7a" stroke-width="0.5"/>
    <text x="110" y="288" font-family="DejaVu Sans" font-size="5" fill="#333">yourself</text>
    <text x="110" y="296" font-family="DejaVu Sans" font-size="5" fill="#333">  ^ self</text>
    <!-- Monitor stand -->
    <rect x="140" y="315" width="20" height="8" fill="#5a5a5a" stroke="#2a2a2a" stroke-width="1"/>
  </g>

  <!-- Speech bubble -->
  <rect x="30" y="30" width="240" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,133 150,153 160,133" fill="#fff"/>
  <path d="M 140 135 L 150 155 L 160 135" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Smalltalk's</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">class browser</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is from 1980.</text>
  <text x="150" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Still unmatched.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on desk, half-lidded -->
  <g filter="url(#shadow_st47)">
    <!-- Body -->
    <ellipse cx="450" cy="240" rx="18" ry="20" fill="url(#sq_fur_st47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="218" rx="14" ry="13" fill="url(#sq_fur_st47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="438,210 442,192 446,210" fill="url(#sq_fur_st47)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="454,210 458,192 462,210" fill="url(#sq_fur_st47)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="440,209 442,196 444,209" fill="#cd853f"/>
    <polygon points="456,209 458,196 460,209" fill="#cd853f"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="444" cy="220" rx="3" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="221" r="2" fill="#1a1a1a"/>
    <line x1="440" y1="218" x2="448" y2="218" stroke="#5d4a2f" stroke-width="1.5"/>
    <ellipse cx="456" cy="220" rx="3" ry="3" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="221" r="2" fill="#1a1a1a"/>
    <line x1="452" y1="218" x2="460" y2="218" stroke="#5d4a2f" stroke-width="1.5"/>

    <!-- Nose -->
    <ellipse cx="450" cy="225" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <line x1="446" y1="229" x2="454" y2="229" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 430 245 Q 415 250 410 265 Q 405 280 415 290 Q 425 300 435 290 Q 430 275 430 260 Q 430 252 430 245" fill="url(#sq_fur_st47)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble -->
  <rect x="330" y="30" width="240" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,158 450,178 460,158" fill="#fff"/>
  <path d="M 440 160 L 450 180 L 460 160" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">So the best</text>
  <text x="450" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">dev tool ever</text>
  <text x="450" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">made couldn't</text>
  <text x="450" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">save Smalltalk.</text>
  <text x="450" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Interesting.</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka staring directly at viewer -->
  <g filter="url(#shadow_st47)">
    <!-- Body -->
    <ellipse cx="750" cy="240" rx="22" ry="28" fill="url(#lem_fur_st47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="210" rx="18" ry="16" fill="url(#lem_fur_st47)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized round ears -->
    <ellipse cx="728" cy="205" rx="14" ry="16" fill="url(#lem_fur_st47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="772" cy="205" rx="14" ry="16" fill="url(#lem_fur_st47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="728" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="772" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="738" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="208" r="2" fill="#fff"/>
    <ellipse cx="762" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="208" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny mouth -->
    <path d="M 746 224 Q 750 225 754 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 730 250 Q 718 260 712 280 Q 708 300 718 312 Q 728 320 732 310 Q 726 295 726 275 Q 726 260 730 250" fill="url(#lem_fur_st47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Tail stripes -->
    <path d="M 718 280 Q 722 278 726 280" stroke="#1a1a1a" stroke-width="3" fill="none"/>
    <path d="M 716 288 Q 720 286 724 288" stroke="#1a1a1a" stroke-width="3" fill="none"/>
    <path d="M 716 296 Q 720 294 724 296" stroke="#1a1a1a" stroke-width="3" fill="none"/>
    <path d="M 718 304 Q 722 302 726 304" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  </g>

  <!-- Speech bubble -->
  <rect x="630" y="30" width="250" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,158 750,178 760,158" fill="#fff"/>
  <path d="M 740 160 L 750 180 L 760 160" fill="none" stroke="#333" stroke-width="2"/>

  <text x="755" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Being right</text>
  <text x="755" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">and being</text>
  <text x="755" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">chosen are</text>
  <text x="755" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">different</text>
  <text x="755" y="154" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#E63946">industries.</text>
</svg>