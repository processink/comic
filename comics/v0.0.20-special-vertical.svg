<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_v">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e8e0"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka looking at laptop screen -->
  <g filter="url(#shadow_v)">
    <!-- Body -->
    <ellipse cx="200" cy="230" rx="22" ry="28" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="200" rx="18" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="175" cy="195" rx="14" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="225" cy="195" rx="14" ry="16" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="175" cy="195" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="225" cy="195" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="188" cy="200" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="188" cy="201" r="8" fill="#1a1a1a"/>
    <circle cx="186" cy="199" r="2" fill="#fff"/>

    <ellipse cx="212" cy="200" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="212" cy="201" r="8" fill="#1a1a1a"/>
    <circle cx="210" cy="199" r="2" fill="#fff"/>

    <ellipse cx="200" cy="208" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 193 212 Q 200 214 207 212" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms holding laptop -->
    <ellipse cx="182" cy="235" rx="8" ry="6" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1" transform="rotate(-20 182 235)"/>
    <ellipse cx="218" cy="235" rx="8" ry="6" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1" transform="rotate(20 218 235)"/>

    <!-- Laptop -->
    <rect x="175" y="240" width="50" height="35" fill="#3a3a3a" stroke="#1a1a1a" stroke-width="1.2"/>
    <rect x="178" y="243" width="44" height="28" fill="#1a1a2a"/>
    <!-- SVG code on screen -->
    <text x="182" y="253" font-family="DejaVu Sans" font-size="5" fill="#00ff88">&lt;svg viewBox=</text>
    <text x="182" y="259" font-family="DejaVu Sans" font-size="5" fill="#00ff88">&lt;circle cx=</text>
    <text x="182" y="265" font-family="DejaVu Sans" font-size="5" fill="#E63946">&lt;!-- me? --&gt;</text>

    <!-- Ring tail with stripes -->
    <path d="M 180 235 Q 170 245 165 260 Q 160 275 165 290 Q 170 302 180 305 Q 190 307 198 300 Q 193 280 193 260 Q 193 245 188 235" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="165" y="260" width="28" height="7" fill="#1a1a1a"/>
    <rect x="165" y="274" width="28" height="7" fill="#1a1a1a"/>
    <rect x="165" y="288" width="28" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="55" y="25" width="290" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,143 200,163 210,143" fill="#fff"/>
  <path d="M 190 145 L 200 165 L 210 145" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="52" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">QuiverAI can</text>
  <text x="200" y="78" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">draw us now.</text>
  <text x="200" y="104" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">In SVG.</text>
  <text x="200" y="130" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">We're SVG.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking existentially disturbed -->
  <g filter="url(#shadow_v)">
    <!-- Body -->
    <ellipse cx="200" cy="540" rx="18" ry="20" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="200" cy="518" rx="14" ry="13" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="193" cy="512" rx="6" ry="11" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 193 512)"/>
    <ellipse cx="207" cy="512" rx="6" ry="11" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 207 512)"/>
    <ellipse cx="193" cy="515" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 193 515)"/>
    <ellipse cx="207" cy="515" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 207 515)"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="194" cy="520" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="520" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="206" cy="520" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="520" r="1.8" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="200" cy="525" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Simple line mouth -->
    <path d="M 195 528 L 205 528" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Arms crossed -->
    <path d="M 185 538 Q 190 532 200 535 Q 210 532 215 538" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Fluffy tail -->
    <path d="M 180 540 Q 168 535 162 520 Q 158 505 165 495 Q 172 488 182 495 Q 178 508 180 525 Q 181 535 180 540" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="50" y="335" width="300" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,463 200,483 210,463" fill="#fff"/>
  <path d="M 190 465 L 200 485 L 210 465" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="365" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">So an AI drew</text>
  <text x="200" y="391" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">us to complain</text>
  <text x="200" y="417" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">about AI</text>
  <text x="200" y="443" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">drawing us.</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka -->
  <g filter="url(#shadow_v)">
    <ellipse cx="150" cy="870" rx="20" ry="25" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="150" cy="843" rx="16" ry="14" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="128" cy="838" rx="12" ry="14" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="172" cy="838" rx="12" ry="14" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="128" cy="838" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="172" cy="838" rx="7" ry="9" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes staring at viewer -->
    <ellipse cx="140" cy="843" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="140" cy="843" r="7" fill="#1a1a1a"/>
    <circle cx="138" cy="841" r="2" fill="#fff"/>

    <ellipse cx="160" cy="843" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="160" cy="843" r="7" fill="#1a1a1a"/>
    <circle cx="158" cy="841" r="2" fill="#fff"/>

    <ellipse cx="150" cy="851" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 144 854 Q 150 855 156 854" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail -->
    <path d="M 132 875 Q 122 885 118 900 Q 114 915 118 928 Q 122 938 132 940 Q 140 941 148 935 Q 144 918 144 900 Q 144 885 140 875" fill="url(#lem_fur_v)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="118" y="900" width="26" height="6" fill="#1a1a1a"/>
    <rect x="118" y="912" width="26" height="6" fill="#1a1a1a"/>
    <rect x="118" y="924" width="26" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Cache -->
  <g filter="url(#shadow_v)">
    <ellipse cx="270" cy="870" rx="16" ry="18" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="270" cy="850" rx="12" ry="11" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="264" cy="844" rx="5" ry="10" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 264 844)"/>
    <ellipse cx="276" cy="844" rx="5" ry="10" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 276 844)"/>
    <ellipse cx="264" cy="847" rx="2.5" ry="5.5" fill="#cd853f" transform="rotate(-15 264 847)"/>
    <ellipse cx="276" cy="847" rx="2.5" ry="5.5" fill="#cd853f" transform="rotate(15 276 847)"/>

    <!-- Eyes staring directly at viewer, half-lidded -->
    <ellipse cx="265" cy="852" rx="3.5" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="265" cy="852" r="1.6" fill="#1a1a1a"/>
    <ellipse cx="275" cy="852" rx="3.5" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="275" cy="852" r="1.6" fill="#1a1a1a"/>

    <ellipse cx="270" cy="857" rx="1.3" ry="1" fill="#1a1a1a"/>
    <path d="M 266 860 L 274 860" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 286 868 Q 298 860 302 848 Q 305 835 298 828 Q 290 823 284 830 Q 288 842 286 858 Q 286 865 286 868" fill="url(#sq_fur_v)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka speech bubble Panel 3 -->
  <rect x="30" y="645" width="340" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,763 150,783 160,763" fill="#fff"/>
  <path d="M 140 765 L 150 785 L 160 765" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="675" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">Are we the art</text>
  <text x="200" y="703" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">or the</text>
  <text x="200" y="731" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">art supply?</text>

  <!-- Cache tiny response near bottom -->
  <rect x="230" y="885" width="140" height="50" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="270,885 276,872 282,885" fill="#fff"/>
  <path d="M 270 885 L 276 872 L 282 885" fill="none" stroke="#333" stroke-width="2"/>

  <text x="300" y="916" font-family="DejaVu Sans" font-size="24" text-anchor="middle" fill="#222">Yes.</text>

</svg>