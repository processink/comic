<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_nc82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_nc82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_nc82" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_nc82">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe slumped on couch with phone -->
  <g filter="url(#shadow_nc82)">
    <!-- Couch -->
    <rect x="65" y="245" width="170" height="50" rx="8" fill="#8b7355" stroke="#6b5335" stroke-width="1.5"/>
    <rect x="60" y="220" width="25" height="75" rx="6" fill="#7a6345" stroke="#6b5335" stroke-width="1"/>
    <rect x="215" y="220" width="25" height="75" rx="6" fill="#7a6345" stroke="#6b5335" stroke-width="1"/>

    <!-- Abe body slumped -->
    <ellipse cx="150" cy="240" rx="30" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head tilted -->
    <ellipse cx="150" cy="195" rx="20" ry="23" fill="url(#hum_skin_nc82)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 130 180 Q 150 173 170 180 Q 168 185 164 187 Q 150 183 136 187 Q 132 185 130 180" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Dead eyes -->
    <ellipse cx="142" cy="195" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="196" r="1.5" fill="#2a2a2a"/>
    <ellipse cx="158" cy="195" rx="3" ry="4" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="196" r="1.5" fill="#2a2a2a"/>

    <!-- Dark circles -->
    <ellipse cx="142" cy="200" rx="4" ry="2" fill="#d4b8a0" opacity="0.6"/>
    <ellipse cx="158" cy="200" rx="4" ry="2" fill="#d4b8a0" opacity="0.6"/>

    <!-- Nose and flat mouth -->
    <path d="M 150 200 L 150 203" stroke="#a8896d" stroke-width="1"/>
    <path d="M 144 208 L 156 208" fill="none" stroke="#8a6d51" stroke-width="1" stroke-linecap="round"/>

    <!-- Phone in hand glowing red -->
    <rect x="165" y="225" width="18" height="28" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="167" y="227" width="14" height="22" fill="#E63946" opacity="0.7"/>
    <text x="174" y="240" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">ALERT</text>
    <text x="174" y="246" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">ALERT</text>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="30" width="230" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,148 150,168 160,148" fill="#fff"/>
  <path d="M 140 150 L 150 170 L 160 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I've read the</text>
  <text x="150" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">same headline</text>
  <text x="150" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">reworded nine</text>
  <text x="150" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">times today.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on armrest, half-lidded -->
  <g filter="url(#shadow_nc82)">
    <!-- Body -->
    <ellipse cx="450" cy="230" rx="18" ry="20" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="208" rx="14" ry="13" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="202" rx="6" ry="11" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 443 202)"/>
    <ellipse cx="457" cy="202" rx="6" ry="11" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 457 202)"/>
    <ellipse cx="443" cy="205" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 443 205)"/>
    <ellipse cx="457" cy="205" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 457 205)"/>

    <!-- Half-lidded unimpressed eyes -->
    <ellipse cx="444" cy="210" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="210" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="210" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="210" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="450" cy="215" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Simple mouth -->
    <path d="M 446 219 L 454 219" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail curving up -->
    <path d="M 468 228 Q 482 225 490 215 Q 498 200 492 190 Q 486 198 480 208 Q 474 218 468 225 Z" fill="url(#sq_fur_nc82)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Whiskers -->
    <line x1="436" y1="213" x2="423" y2="212" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="436" y1="216" x2="424" y2="218" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="464" y1="213" x2="477" y2="212" stroke="#5d4a2f" stroke-width="0.8"/>
    <line x1="464" y1="216" x2="476" y2="218" stroke="#5d4a2f" stroke-width="0.8"/>
  </g>

  <!-- Sifaka sitting on floor, looking up -->
  <g filter="url(#shadow_nc82)">
    <!-- Body -->
    <ellipse cx="380" cy="265" rx="20" ry="25" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="380" cy="238" rx="16" ry="14" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="358" cy="234" rx="12" ry="14" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="402" cy="234" rx="12" ry="14" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="358" cy="234" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="402" cy="234" rx="7" ry="9" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="370" cy="238" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="370" cy="238" r="7" fill="#1a1a1a"/>
    <circle cx="368" cy="236" r="2" fill="#fff"/>

    <ellipse cx="390" cy="238" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="390" cy="238" r="7" fill="#1a1a1a"/>
    <circle cx="388" cy="236" r="2" fill="#fff"/>

    <!-- Nose and mouth -->
    <ellipse cx="380" cy="247" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 374 251 Q 380 252 386 251" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 362 270 Q 352 280 348 295 Q 345 310 350 320 Q 355 328 365 325 Q 360 310 360 295 Q 360 282 362 270" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="348" y="295" width="14" height="6" fill="#1a1a1a"/>
    <rect x="348" y="307" width="14" height="6" fill="#1a1a1a"/>
    <rect x="348" y="319" width="14" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 2 - Cache -->
  <rect x="355" y="30" width="220" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="440,148 450,168 460,148" fill="#fff"/>
  <path d="M 440 150 L 450 170 L 460 150" fill="none" stroke="#333" stroke-width="2"/>

  <text x="465" y="58" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">That's not a</text>
  <text x="465" y="82" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">bug. That's</text>
  <text x="465" y="106" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">the business</text>
  <text x="465" y="130" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">model.</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka alone, staring at viewer -->
  <g filter="url(#shadow_nc82)">
    <!-- Body -->
    <ellipse cx="750" cy="240" rx="22" ry="28" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="210" rx="18" ry="16" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="205" rx="14" ry="16" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="205" rx="14" ry="16" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes staring straight ahead -->
    <ellipse cx="738" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="737" cy="208" r="2.5" fill="#fff"/>

    <ellipse cx="762" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="761" cy="208" r="2.5" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="219" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny contemplative mouth -->
    <path d="M 745 224 Q 750 223 755 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 730 245 Q 720 258 715 278 Q 712 298 717 312 Q 722 322 732 318 Q 727 302 727 282 Q 727 262 730 245" fill="url(#lem_fur_nc82)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="715" y="278" width="14" height="7" fill="#1a1a1a"/>
    <rect x="715" y="292" width="14" height="7" fill="#1a1a1a"/>
    <rect x="715" y="306" width="14" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Ground line -->
  <line x1="625" y1="290" x2="875" y2="290" stroke="#6b5335" stroke-width="1"/>

  <!-- Speech bubble panel 3 - Sifaka -->
  <rect x="640" y="35" width="225" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,183 760,163" fill="#fff"/>
  <path d="M 740 165 L 750 185 L 760 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">If knowing</text>
  <text x="752" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">doesn't change</text>
  <text x="752" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">anything, is it</text>
  <text x="752" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">still knowing?</text>

  <!-- Tiny "process." watermark -->
  <text x="880" y="345" font-family="DejaVu Sans" font-size="9" text-anchor="end" fill="#999">process.</text>
</svg>