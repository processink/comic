<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_v41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_v41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <filter id="shadow_v41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e8e0"/>

  <!-- ==================== PANEL 1 ==================== -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Turnstile in panel 1 -->
  <rect x="235" y="180" width="8" height="100" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="239" y1="200" x2="210" y2="180" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <line x1="239" y1="200" x2="268" y2="180" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <line x1="239" y1="200" x2="239" y2="170" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="239" cy="175" r="4" fill="#E63946"/>

  <!-- Ground -->
  <line x1="20" y1="280" x2="380" y2="280" stroke="#8b7355" stroke-width="2"/>

  <!-- Cache standing next to turnstile -->
  <g filter="url(#shadow_v41)">
    <ellipse cx="155" cy="240" rx="18" ry="20" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="155" cy="218" rx="14" ry="13" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="148" cy="212" rx="6" ry="11" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 148 212)"/>
    <ellipse cx="162" cy="212" rx="6" ry="11" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 162 212)"/>
    <ellipse cx="148" cy="215" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 148 215)"/>
    <ellipse cx="162" cy="215" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 162 215)"/>
    <ellipse cx="149" cy="220" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="150" cy="221" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="161" cy="220" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="162" cy="221" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="155" cy="225" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <path d="M 151 228 Q 155 227 159 228" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <path d="M 135 245 Q 120 250 115 265 Q 110 280 120 288 Q 130 296 140 288 Q 135 273 135 258 Q 135 252 135 245" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="30" y="22" width="340" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="150,140 160,160 170,140" fill="#fff"/>
  <line x1="150" y1="142" x2="160" y2="162" stroke="#333" stroke-width="2"/>
  <line x1="160" y1="162" x2="170" y2="142" stroke="#333" stroke-width="2"/>

  <text x="200" y="52" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">They installed</text>
  <text x="200" y="82" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">a turnstile at</text>
  <text x="200" y="112" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the entrance.</text>
  <text x="200" y="136" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">No fence.</text>

  <!-- ==================== PANEL 2 ==================== -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Ground -->
  <line x1="20" y1="590" x2="380" y2="590" stroke="#8b7355" stroke-width="2"/>

  <!-- Turnstile in panel 2 -->
  <rect x="255" y="490" width="8" height="100" fill="#7a7a7a" stroke="#4a4a4a" stroke-width="1.5"/>
  <line x1="259" y1="510" x2="230" y2="490" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <line x1="259" y1="510" x2="288" y2="490" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <line x1="259" y1="510" x2="259" y2="480" stroke="#5a5a5a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="259" cy="485" r="4" fill="#E63946"/>

  <!-- Sifaka walking around the turnstile -->
  <g filter="url(#shadow_v41)">
    <ellipse cx="175" cy="545" rx="22" ry="28" fill="url(#lem_fur_v41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="175" cy="515" rx="18" ry="16" fill="url(#lem_fur_v41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <ellipse cx="150" cy="510" rx="14" ry="16" fill="url(#lem_fur_v41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="200" cy="510" rx="14" ry="16" fill="url(#lem_fur_v41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="150" cy="510" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="200" cy="510" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="163" cy="515" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="163" cy="515" r="8" fill="#1a1a1a"/>
    <circle cx="161" cy="513" r="2" fill="#fff"/>
    <ellipse cx="187" cy="515" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="187" cy="515" r="8" fill="#1a1a1a"/>
    <circle cx="185" cy="513" r="2" fill="#fff"/>
    <ellipse cx="175" cy="523" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 168 527 Q 175 529 182 527" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <path d="M 155 550 Q 145 560 140 580 Q 135 595 143 603 Q 151 610 160 603 Q 155 590 155 570 Q 155 560 155 550" fill="url(#lem_fur_v41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="138" y="580" width="20" height="6" fill="#1a1a1a"/>
    <rect x="138" y="592" width="20" height="6" fill="#1a1a1a"/>
  </g>

  <!-- Dotted path showing Sifaka walked around -->
  <path d="M 310 570 Q 315 550 310 530 Q 300 515 280 520 Q 270 535 270 550" fill="none" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Speech bubble Panel 2 -->
  <rect x="30" y="332" width="340" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="170,440 180,460 190,440" fill="#fff"/>
  <line x1="170" y1="442" x2="180" y2="462" stroke="#333" stroke-width="2"/>
  <line x1="180" y1="462" x2="190" y2="442" stroke="#333" stroke-width="2"/>

  <text x="200" y="365" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Why did no one</text>
  <text x="200" y="395" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">just walk</text>
  <text x="200" y="425" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">around it?</text>

  <!-- ==================== PANEL 3 ==================== -->
  <rect x="10" y="630" width="380" height="320" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Ground -->
  <line x1="20" y1="910" x2="380" y2="910" stroke="#8b7355" stroke-width="2"/>

  <!-- Cache in panel 3, looking straight at reader -->
  <g filter="url(#shadow_v41)">
    <ellipse cx="200" cy="870" rx="18" ry="20" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="200" cy="848" rx="14" ry="13" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <ellipse cx="193" cy="842" rx="6" ry="11" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-15 193 842)"/>
    <ellipse cx="207" cy="842" rx="6" ry="11" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(15 207 842)"/>
    <ellipse cx="193" cy="845" rx="3" ry="6.5" fill="#cd853f" transform="rotate(-15 193 845)"/>
    <ellipse cx="207" cy="845" rx="3" ry="6.5" fill="#cd853f" transform="rotate(15 207 845)"/>
    <ellipse cx="194" cy="850" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="850" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="206" cy="850" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="206" cy="850" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="200" cy="855" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <line x1="196" y1="859" x2="204" y2="859" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <path d="M 180 875 Q 165 880 160 895 Q 155 910 165 918 Q 175 926 185 918 Q 180 903 180 888 Q 180 882 180 875" fill="url(#sq_fur_v41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="30" y="642" width="340" height="160" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="195,800 205,820 215,800" fill="#fff"/>
  <line x1="195" y1="802" x2="205" y2="822" stroke="#333" stroke-width="2"/>
  <line x1="205" y1="822" x2="215" y2="802" stroke="#333" stroke-width="2"/>

  <text x="200" y="675" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">They don't</text>
  <text x="200" y="705" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">need a fence.</text>
  <text x="200" y="735" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Most people</text>
  <text x="200" y="765" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">obey the idea</text>
  <text x="200" y="795" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">of a barrier.</text>
</svg>