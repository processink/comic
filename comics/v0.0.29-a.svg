<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_nc41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_nc41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_nc41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_nc41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe on couch with phone, looking drained -->
  <g filter="url(#shadow_nc41)">
    <!-- Couch -->
    <rect x="60" y="250" width="180" height="50" rx="8" fill="#8a7060" stroke="#5d4a3a" stroke-width="1.5"/>
    <rect x="55" y="240" width="190" height="20" rx="5" fill="#9a8070" stroke="#5d4a3a" stroke-width="1.2"/>

    <!-- Body -->
    <ellipse cx="150" cy="228" rx="28" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="150" cy="185" rx="20" ry="23" fill="url(#hum_skin_nc41)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 130 170 Q 150 163 170 170 Q 168 175 164 177 Q 150 173 136 177 Q 132 175 130 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Exhausted eyes — half closed -->
    <ellipse cx="142" cy="186" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="187" r="1.5" fill="#2a2a2a"/>
    <ellipse cx="158" cy="186" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="187" r="1.5" fill="#2a2a2a"/>

    <!-- Dark circles -->
    <ellipse cx="142" cy="190" rx="4" ry="2" fill="#d4b8a0" opacity="0.7"/>
    <ellipse cx="158" cy="190" rx="4" ry="2" fill="#d4b8a0" opacity="0.7"/>

    <!-- Flat mouth -->
    <line x1="144" y1="198" x2="156" y2="198" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="144" y="205" width="12" height="10" fill="url(#hum_skin_nc41)"/>

    <!-- Arm holding phone -->
    <path d="M 172 225 Q 182 218 185 208" fill="none" stroke="url(#hum_skin_nc41)" stroke-width="10" stroke-linecap="round"/>

    <!-- Phone -->
    <rect x="178" y="198" width="18" height="28" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="180" y="200" width="14" height="22" fill="#3a3a4a"/>

    <!-- Breaking news on phone -->
    <rect x="180" y="200" width="14" height="5" fill="#E63946"/>
    <text x="187" y="205" font-family="DejaVu Sans" font-size="3.5" text-anchor="middle" fill="#fff">BREAKING</text>
    <rect x="180" y="207" width="14" height="4" fill="#E63946" opacity="0.6"/>
    <rect x="180" y="213" width="14" height="4" fill="#E63946" opacity="0.4"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="30" y="30" width="230" height="112" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="145,140 155,158 165,140" fill="#fff"/>
  <polygon points="147,142 155,156 163,142" fill="#fff"/>
  <path d="M 145 142 L 155 160 L 165 142" fill="none" stroke="#333" stroke-width="2"/>

  <text x="145" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I stopped</text>
  <text x="145" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">reading the</text>
  <text x="145" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">news for a</text>
  <text x="145" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">whole week.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache sitting, half-lidded -->
  <g filter="url(#shadow_nc41)">
    <!-- Body -->
    <ellipse cx="420" cy="240" rx="18" ry="20" fill="url(#sq_fur_nc41)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="420" cy="218" rx="14" ry="13" fill="url(#sq_fur_nc41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="408,210 412,190 416,210" fill="url(#sq_fur_nc41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="410,208 412,194 414,208" fill="#cd853f"/>
    <polygon points="424,210 428,190 432,210" fill="url(#sq_fur_nc41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="426,208 428,194 430,208" fill="#cd853f"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="414" cy="219" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="414" cy="219" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="426" cy="219" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="426" cy="219" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="420" cy="224" rx="1.5" ry="1.2" fill="#1a1a1a"/>

    <!-- Simple flat mouth -->
    <line x1="415" y1="228" x2="425" y2="228" stroke="#5d4a2f" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 400 245 Q 385 250 380 265 Q 375 280 385 290 Q 395 300 405 290 Q 400 275 400 260 Q 400 252 400 245" fill="url(#sq_fur_nc41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_nc41)">
    <!-- Body -->
    <ellipse cx="510" cy="240" rx="22" ry="28" fill="url(#lem_fur_nc41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="510" cy="210" rx="18" ry="16" fill="url(#lem_fur_nc41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="485" cy="205" rx="14" ry="16" fill="url(#lem_fur_nc41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="535" cy="205" rx="14" ry="16" fill="url(#lem_fur_nc41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="485" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="535" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="500" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="500" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="498" cy="208" r="2" fill="#fff"/>

    <ellipse cx="520" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="520" cy="210" r="8" fill="#1a1a1a"/>
    <circle cx="518" cy="208" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="510" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth -->
    <path d="M 505 224 Q 510 226 515 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 530 250 Q 545 260 550 275 Q 555 290 548 300 Q 540 308 532 298 Q 538 280 536 265 Q 534 255 530 250" fill="url(#lem_fur_nc41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="542" y="272" width="14" height="6" fill="#1a1a1a" rx="2"/>
    <rect x="540" y="284" width="12" height="6" fill="#1a1a1a" rx="2"/>
    <rect x="536" y="295" width="10" height="5" fill="#1a1a1a" rx="2"/>
  </g>

  <!-- Sifaka speech bubble -->
  <rect x="440" y="30" width="140" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="500,138 510,158 520,138" fill="#fff"/>
  <polygon points="502,140 510,155 518,140" fill="#fff"/>
  <path d="M 500 140 L 510 158 L 520 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="510" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Did you</text>
  <text x="510" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">miss</text>
  <text x="510" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">anything?</text>

  <!-- Cache speech bubble -->
  <rect x="330" y="110" width="100" height="68" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="410,176 420,196 430,176" fill="#fff"/>
  <polygon points="412,178 420,193 428,178" fill="#fff"/>
  <path d="M 410 178 L 420 198 L 430 178" fill="none" stroke="#333" stroke-width="2"/>

  <text x="380" y="138" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Nah.</text>
  <text x="380" y="162" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Same fire.</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe staring at phone again, same position as panel 1 -->
  <g filter="url(#shadow_nc41)">
    <!-- Couch -->
    <rect x="660" y="250" width="180" height="50" rx="8" fill="#8a7060" stroke="#5d4a3a" stroke-width="1.5"/>
    <rect x="655" y="240" width="190" height="20" rx="5" fill="#9a8070" stroke="#5d4a3a" stroke-width="1.2"/>

    <!-- Body -->
    <ellipse cx="750" cy="228" rx="28" ry="30" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="750" cy="185" rx="20" ry="23" fill="url(#hum_skin_nc41)" stroke="#c8a882" stroke-width="1.3"/>

    <!-- Hair -->
    <path d="M 730 170 Q 750 163 770 170 Q 768 175 764 177 Q 750 173 736 177 Q 732 175 730 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Same exhausted eyes -->
    <ellipse cx="742" cy="186" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="742" cy="187" r="1.5" fill="#2a2a2a"/>
    <ellipse cx="758" cy="186" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="758" cy="187" r="1.5" fill="#2a2a2a"/>

    <!-- Dark circles -->
    <ellipse cx="742" cy="190" rx="4" ry="2" fill="#d4b8a0" opacity="0.7"/>
    <ellipse cx="758" cy="190" rx="4" ry="2" fill="#d4b8a0" opacity="0.7"/>

    <!-- Same flat mouth -->
    <line x1="744" y1="198" x2="756" y2="198" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Neck -->
    <rect x="744" y="205" width="12" height="10" fill="url(#hum_skin_nc41)"/>

    <!-- Arm holding phone -->
    <path d="M 772 225 Q 782 218 785 208" fill="none" stroke="url(#hum_skin_nc41)" stroke-width="10" stroke-linecap="round"/>

    <!-- Phone -->
    <rect x="778" y="198" width="18" height="28" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="780" y="200" width="14" height="22" fill="#3a3a4a"/>

    <!-- Same breaking news -->
    <rect x="780" y="200" width="14" height="5" fill="#E63946"/>
    <text x="787" y="205" font-family="DejaVu Sans" font-size="3.5" text-anchor="middle" fill="#fff">BREAKING</text>
    <rect x="780" y="207" width="14" height="4" fill="#E63946" opacity="0.6"/>
    <rect x="780" y="213" width="14" height="4" fill="#E63946" opacity="0.4"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="630" y="30" width="245" height="136" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,164 750,182 760,164" fill="#fff"/>
  <polygon points="742,166 750,179 758,166" fill="#fff"/>
  <path d="M 740 166 L 750 184 L 760 166" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="56" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">The relief</text>
  <text x="752" y="80" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">lasted until</text>
  <text x="752" y="104" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">I realized I</text>
  <text x="752" y="128" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">already knew.</text>
  <text x="752" y="152" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">All of it.</text>
</svg>