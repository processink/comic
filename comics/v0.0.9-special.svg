<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_vc47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_vc47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_vc47" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_vc47">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe at computer, excited -->
  <g filter="url(#shadow_vc47)">
    <!-- Computer/monitor -->
    <rect x="60" y="215" width="65" height="42" fill="#3a3a3a" stroke="#2a2a2a" stroke-width="1.2"/>
    <rect x="63" y="218" width="59" height="33" fill="#1a1a2e"/>
    <rect x="55" y="257" width="78" height="4" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1"/>

    <!-- Terminal text on screen -->
    <text x="66" y="230" font-family="DejaVu Sans" font-size="6" fill="#00ff88">$ claude code</text>
    <text x="66" y="239" font-family="DejaVu Sans" font-size="6" fill="#00ff88">Refactoring...</text>
    <text x="66" y="248" font-family="DejaVu Sans" font-size="6" fill="#00ff88">✓ Done (0.3s)</text>

    <!-- Abe body -->
    <rect x="130" y="210" width="45" height="55" rx="4" fill="#5d8aa8" stroke="#3a5a6a" stroke-width="1.2"/>

    <!-- Abe head -->
    <ellipse cx="152" cy="185" rx="20" ry="22" fill="url(#hum_skin_vc47)" stroke="#c8a882" stroke-width="1.2"/>

    <!-- Hair -->
    <path d="M 132 173 Q 145 162 165 165 Q 172 168 172 175 Q 168 170 152 167 Q 138 168 132 173" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>

    <!-- Happy eyes -->
    <path d="M 143 182 Q 146 179 149 182" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 155 182 Q 158 179 161 182" fill="none" stroke="#2a2a2a" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 145 193 Q 152 199 159 193" fill="none" stroke="#8a6d51" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Arms on keyboard -->
    <path d="M 130 225 Q 115 230 100 240" fill="none" stroke="url(#hum_skin_vc47)" stroke-width="10" stroke-linecap="round"/>
    <path d="M 175 225 Q 180 230 185 240" fill="none" stroke="url(#hum_skin_vc47)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="30" y="30" width="245" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="148,138 158,155 168,138" fill="#fff"/>
  <path d="M 148 140 L 158 157 L 168 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="152" y="57" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">I told Claude</text>
  <text x="152" y="80" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">to refactor my</text>
  <text x="152" y="103" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">whole codebase.</text>
  <text x="152" y="126" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">Three seconds.</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache looking unimpressed -->
  <g filter="url(#shadow_vc47)">
    <!-- Body -->
    <ellipse cx="450" cy="235" rx="18" ry="20" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="450" cy="213" rx="14" ry="13" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <ellipse cx="443" cy="206" rx="6" ry="12" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(-12 443 206)"/>
    <ellipse cx="457" cy="206" rx="6" ry="12" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.2" transform="rotate(12 457 206)"/>
    <ellipse cx="443" cy="209" rx="3" ry="7" fill="#cd853f" transform="rotate(-12 443 209)"/>
    <ellipse cx="457" cy="209" rx="3" ry="7" fill="#cd853f" transform="rotate(12 457 209)"/>

    <!-- Half-lidded eyes -->
    <ellipse cx="444" cy="215" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="444" cy="215" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="456" cy="215" rx="4" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="456" cy="215" r="1.5" fill="#1a1a1a"/>

    <!-- Nose -->
    <ellipse cx="450" cy="220" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 445 224 L 455 224" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 430 240 Q 415 245 410 260 Q 405 275 415 285 Q 425 295 435 285 Q 430 270 430 255 Q 430 247 430 240" fill="url(#sq_fur_vc47)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="330" y="30" width="245" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="442,163 452,180 462,163" fill="#fff"/>
  <path d="M 442 165 L 452 182 L 462 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="452" y="57" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">I told Codex</text>
  <text x="452" y="80" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">to fix a typo.</text>
  <text x="452" y="103" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">It said my repo</text>
  <text x="452" y="126" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">was "heavily</text>
  <text x="452" y="149" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">dirty."</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka with enormous eyes, looking up -->
  <g filter="url(#shadow_vc47)">
    <!-- Body -->
    <ellipse cx="750" cy="240" rx="22" ry="28" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="210" rx="18" ry="16" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Moderately-sized ears -->
    <ellipse cx="725" cy="205" rx="14" ry="16" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="205" rx="14" ry="16" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="205" rx="8" ry="10" fill="#f5b5c5"/>
    <ellipse cx="775" cy="205" rx="8" ry="10" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes looking upward -->
    <ellipse cx="738" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="738" cy="208" r="8" fill="#1a1a1a"/>
    <circle cx="736" cy="206" r="2" fill="#fff"/>

    <ellipse cx="762" cy="210" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="762" cy="208" r="8" fill="#1a1a1a"/>
    <circle cx="760" cy="206" r="2" fill="#fff"/>

    <!-- Nose -->
    <ellipse cx="750" cy="218" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Slight open mouth -->
    <path d="M 744 222 Q 750 225 756 222" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 730 245 Q 720 255 715 275 Q 710 295 715 310 Q 720 320 730 315 Q 725 295 725 275 Q 725 260 730 250" fill="url(#lem_fur_vc47)" stroke="#5a5a5a" stroke-width="1.3"/>
    <rect x="715" y="275" width="15" height="7" fill="#1a1a1a"/>
    <rect x="715" y="289" width="15" height="7" fill="#1a1a1a"/>
    <rect x="715" y="303" width="15" height="7" fill="#1a1a1a"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="630" y="30" width="245" height="135" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="742,163 752,180 762,163" fill="#fff"/>
  <path d="M 742 165 L 752 182 L 762 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="57" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">Isn't that what</text>
  <text x="752" y="80" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">every roommate</text>
  <text x="752" y="103" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">says before</text>
  <text x="752" y="126" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">they refuse to</text>
  <text x="752" y="149" font-family="DejaVu Sans" font-size="20" text-anchor="middle" fill="#222">do the dishes?</text>

  <!-- Accent color detail: small red error indicator on Cache's side -->
  <circle cx="555" cy="300" r="4" fill="#E63946"/>
  <text x="555" y="318" font-family="DejaVu Sans" font-size="8" text-anchor="middle" fill="#E63946">ERROR</text>
</svg>