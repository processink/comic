<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_gm91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_gm91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_gm91" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_gm91">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="350" fill="#e8e8e0"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe with coffee, looking oddly cheerful -->
  <g filter="url(#shadow_gm91)">
    <!-- Body -->
    <ellipse cx="150" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="185" rx="20" ry="23" fill="url(#hum_skin_gm91)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 170 Q 150 163 170 170 Q 168 175 164 177 Q 150 173 136 177 Q 132 175 130 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Eyes - bright, open -->
    <ellipse cx="142" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="142" cy="185" r="2.5" fill="#2a2a2a"/>
    <circle cx="141" cy="184" r="0.8" fill="#fff"/>
    <ellipse cx="158" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="158" cy="185" r="2.5" fill="#2a2a2a"/>
    <circle cx="157" cy="184" r="0.8" fill="#fff"/>
    <!-- Smile -->
    <path d="M 144 197 Q 150 202 156 197" fill="none" stroke="#8a6d51" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M 150 190 L 150 194" stroke="#a8896d" stroke-width="1"/>
    <!-- Coffee mug in hand -->
    <rect x="168" y="225" width="16" height="20" rx="2" fill="#E63946" stroke="#b02a37" stroke-width="1.2"/>
    <path d="M 184 230 Q 190 230 190 235 Q 190 240 184 240" fill="none" stroke="#b02a37" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Steam -->
    <path d="M 172 220 Q 174 215 172 210" fill="none" stroke="#aaa" stroke-width="1" opacity="0.6"/>
    <path d="M 178 222 Q 180 216 178 211" fill="none" stroke="#aaa" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="35" width="230" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,138 150,158 160,138" fill="#fff"/>
  <path d="M 140 140 L 150 160 L 160 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Had a good</text>
  <text x="150" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Monday.</text>
  <text x="150" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Productive.</text>
  <text x="150" y="132" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Calm, even.</text>

  <!-- Panel 2 -->
  <rect x="310" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache, half-lidded, unimpressed -->
  <g filter="url(#shadow_gm91)">
    <!-- Body -->
    <ellipse cx="400" cy="235" rx="18" ry="22" fill="url(#sq_fur_gm91)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="400" cy="208" rx="15" ry="14" fill="url(#sq_fur_gm91)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="388,198 392,170 396,198" fill="url(#sq_fur_gm91)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="404,198 408,170 412,198" fill="url(#sq_fur_gm91)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="390,196 392,176 394,196" fill="#cd853f"/>
    <polygon points="406,196 408,176 410,196" fill="#cd853f"/>
    <!-- Half-lidded skeptical eyes -->
    <ellipse cx="394" cy="210" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="394" cy="211" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="406" cy="210" rx="4" ry="2.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="406" cy="211" r="1.8" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="400" cy="215" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Flat mouth -->
    <path d="M 396 219 L 404 219" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Fluffy tail -->
    <path d="M 380 240 Q 365 235 358 250 Q 352 265 360 278 Q 370 288 380 275 Q 375 260 378 245 Z" fill="url(#sq_fur_gm91)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Whiskers -->
    <line x1="388" y1="214" x2="375" y2="212" stroke="#5d4a2f" stroke-width="0.7"/>
    <line x1="388" y1="217" x2="376" y2="218" stroke="#5d4a2f" stroke-width="0.7"/>
    <line x1="412" y1="214" x2="425" y2="212" stroke="#5d4a2f" stroke-width="0.7"/>
    <line x1="412" y1="217" x2="424" y2="218" stroke="#5d4a2f" stroke-width="0.7"/>
  </g>

  <!-- Sifaka next to Cache -->
  <g filter="url(#shadow_gm91)">
    <!-- Body -->
    <ellipse cx="500" cy="238" rx="18" ry="24" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="500" cy="210" rx="16" ry="14" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Round ears -->
    <ellipse cx="480" cy="206" rx="10" ry="12" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="520" cy="206" rx="10" ry="12" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="480" cy="206" rx="6" ry="8" fill="#f5b5c5"/>
    <ellipse cx="520" cy="206" rx="6" ry="8" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="492" cy="212" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="492" cy="213" r="7" fill="#1a1a1a"/>
    <circle cx="490" cy="211" r="2" fill="#fff"/>
    <ellipse cx="508" cy="212" rx="9" ry="10" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="508" cy="213" r="7" fill="#1a1a1a"/>
    <circle cx="506" cy="211" r="2" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="500" cy="220" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny mouth -->
    <path d="M 497 224 Q 500 225 503 224" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>
    <!-- Ring tail with stripes -->
    <path d="M 518 245 Q 535 250 540 265 Q 545 280 540 295 Q 535 305 530 300 Q 533 285 530 270 Q 527 258 518 250 Z" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <line x1="535" y1="262" x2="540" y2="260" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="537" y1="270" x2="542" y2="268" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="538" y1="278" x2="543" y2="277" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="537" y1="286" x2="541" y2="286" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="534" y1="294" x2="537" y2="295" stroke="#1a1a1a" stroke-width="2.5"/>
  </g>

  <!-- Speech bubble panel 2 - Cache -->
  <rect x="335" y="35" width="230" height="80" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="390,113 400,133 410,113" fill="#fff"/>
  <path d="M 390 115 L 400 135 L 410 115" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="65" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">What went</text>
  <text x="450" y="90" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">wrong?</text>
  <text x="450" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222"></text>

  <!-- Panel 3 -->
  <rect x="610" y="10" width="280" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka alone, enormous eyes staring at viewer -->
  <g filter="url(#shadow_gm91)">
    <!-- Body -->
    <ellipse cx="750" cy="238" rx="20" ry="26" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="206" rx="18" ry="16" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Round ears -->
    <ellipse cx="728" cy="200" rx="12" ry="14" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="772" cy="200" rx="12" ry="14" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="728" cy="200" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="772" cy="200" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes - extra wide -->
    <ellipse cx="740" cy="208" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="740" cy="209" r="8" fill="#1a1a1a"/>
    <circle cx="738" cy="207" r="2.5" fill="#fff"/>
    <ellipse cx="760" cy="208" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="760" cy="209" r="8" fill="#1a1a1a"/>
    <circle cx="758" cy="207" r="2.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="750" cy="218" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Tiny open mouth -->
    <ellipse cx="750" cy="223" rx="3" ry="2" fill="#333" stroke="#5a5a5a" stroke-width="0.5"/>
    <!-- Ring tail -->
    <path d="M 770 245 Q 788 250 793 268 Q 798 285 793 302 Q 788 312 783 307 Q 786 292 783 275 Q 780 260 770 252 Z" fill="url(#lem_fur_gm91)" stroke="#5a5a5a" stroke-width="1.2"/>
    <line x1="789" y1="265" x2="795" y2="263" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="791" y1="274" x2="797" y2="273" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="792" y1="283" x2="797" y2="283" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="790" y1="292" x2="794" y2="293" stroke="#1a1a1a" stroke-width="2.5"/>
    <line x1="787" y1="300" x2="790" y2="302" stroke="#1a1a1a" stroke-width="2.5"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="635" y="35" width="230" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,183 760,163" fill="#fff"/>
  <path d="M 740 165 L 750 185 L 760 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="750" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">If a Monday</text>
  <text x="750" y="87" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">is good, does</text>
  <text x="750" y="112" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">that mean the</text>
  <text x="750" y="137" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">rest were real?</text>
  <text x="750" y="157" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222"></text>

  <!-- Ground lines -->
  <line x1="30" y1="290" x2="270" y2="290" stroke="#ccc" stroke-width="1"/>
  <line x1="330" y1="290" x2="570" y2="290" stroke="#ccc" stroke-width="1"/>
  <line x1="630" y1="290" x2="870" y2="290" stroke="#ccc" stroke-width="1"/>
</svg>