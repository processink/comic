<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960">
  <defs>
    <radialGradient id="sq_fur_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_lzg41" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_lzg41">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="960" fill="#e8e0d8"/>

  <!-- Panel 1 -->
  <rect x="10" y="10" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a tiny throne of acorns -->
  <g filter="url(#shadow_lzg41)">
    <!-- Acorn throne base -->
    <ellipse cx="200" cy="265" rx="50" ry="18" fill="#8b6842" stroke="#6b4832" stroke-width="1.5"/>
    <ellipse cx="180" cy="255" rx="8" ry="10" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <ellipse cx="200" cy="253" rx="8" ry="10" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <ellipse cx="220" cy="255" rx="8" ry="10" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <ellipse cx="190" cy="243" rx="7" ry="9" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <ellipse cx="210" cy="243" rx="7" ry="9" fill="#a67c52" stroke="#8b6842" stroke-width="1"/>
    <!-- Acorn caps -->
    <path d="M 176 249 Q 180 245 184 249" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>
    <path d="M 196 247 Q 200 243 204 247" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>
    <path d="M 216 249 Q 220 245 224 249" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>
    <path d="M 186 237 Q 190 233 194 237" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>
    <path d="M 206 237 Q 210 233 214 237" fill="#6b4832" stroke="#5a3822" stroke-width="0.8"/>

    <!-- Cache body -->
    <ellipse cx="200" cy="210" rx="20" ry="25" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="180" rx="16" ry="15" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears -->
    <polygon points="188,170 182,145 194,167" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="212,170 218,145 206,167" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="189,168 185,150 193,167" fill="#cd853f"/>
    <polygon points="211,168 215,150 207,167" fill="#cd853f"/>

    <!-- Half-lidded smug eyes -->
    <ellipse cx="193" cy="181" rx="4.5" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="194" cy="182" r="1.8" fill="#1a1a1a"/>
    <ellipse cx="207" cy="181" rx="4.5" ry="2.2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="208" cy="182" r="1.8" fill="#1a1a1a"/>

    <!-- Nose and mouth -->
    <ellipse cx="200" cy="187" rx="1.8" ry="1.3" fill="#1a1a1a"/>
    <path d="M 196 190 Q 200 189 204 190" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>

    <!-- Fluffy tail -->
    <path d="M 220 215 Q 235 205 240 190 Q 245 175 238 165 Q 232 158 225 163 Q 230 173 228 187 Q 226 200 220 210" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tiny phone in paw -->
    <rect x="178" y="200" width="14" height="22" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="180" y="203" width="10" height="16" fill="#4a86c7"/>
    <text x="185" y="212" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#fff">TikTok</text>
  </g>

  <!-- Speech bubble Panel 1 -->
  <rect x="40" y="30" width="320" height="110" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,138 200,155 210,138" fill="#fff"/>
  <path d="M 190,140 L 200,157 L 210,140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="56" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">I invented</text>
  <text x="200" y="82" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">the lazy girl</text>
  <text x="200" y="108" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">job. I'm a squirrel.</text>

  <!-- Panel 2 -->
  <rect x="10" y="320" width="380" height="300" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka -->
  <g filter="url(#shadow_lzg41)">
    <!-- Body -->
    <ellipse cx="200" cy="555" rx="22" ry="30" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="520" rx="18" ry="17" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.3"/>

    <!-- Ears -->
    <ellipse cx="178" cy="513" rx="13" ry="15" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="222" cy="513" rx="13" ry="15" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="178" cy="513" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="222" cy="513" rx="7" ry="9" fill="#f5b5c5"/>

    <!-- ENORMOUS eyes -->
    <ellipse cx="190" cy="520" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="190" cy="521" r="8" fill="#1a1a1a"/>
    <circle cx="188" cy="518" r="2.5" fill="#fff"/>
    <circle cx="192" cy="523" r="1" fill="#fff"/>

    <ellipse cx="210" cy="520" rx="10" ry="12" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="210" cy="521" r="8" fill="#1a1a1a"/>
    <circle cx="208" cy="518" r="2.5" fill="#fff"/>
    <circle cx="212" cy="523" r="1" fill="#fff"/>

    <!-- Dark eye patches -->
    <ellipse cx="190" cy="520" rx="12" ry="14" fill="none" stroke="#888" stroke-width="0.5"/>
    <ellipse cx="210" cy="520" rx="12" ry="14" fill="none" stroke="#888" stroke-width="0.5"/>

    <!-- Nose and mouth -->
    <ellipse cx="200" cy="532" rx="2" ry="1.5" fill="#1a1a1a"/>
    <path d="M 195 536 Q 200 537 205 536" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-linecap="round"/>

    <!-- Ring tail with stripes -->
    <path d="M 178 560 Q 168 570 163 588 Q 158 606 163 622 Q 168 632 175 628 Q 170 610 168 595 Q 166 580 170 570 Q 174 562 178 558" fill="url(#lem_fur_lzg41)" stroke="#5a5a5a" stroke-width="1.3"/>
    <path d="M 167 578 Q 164 578 162 580" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 165 588 Q 162 589 160 591" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 164 598 Q 161 599 159 602" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 164 608 Q 161 610 160 613" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 166 618 Q 164 620 163 623" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble Panel 2 -->
  <rect x="40" y="340" width="320" height="120" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,458 200,475 210,458" fill="#fff"/>
  <path d="M 190,460 L 200,477 L 210,460" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="368" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">But don't</text>
  <text x="200" y="394" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">squirrels work</text>
  <text x="200" y="420" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">all fall to</text>
  <text x="200" y="446" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">survive winter?</text>

  <!-- Panel 3 -->
  <rect x="10" y="630" width="380" height="310" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache - existential crisis -->
  <g filter="url(#shadow_lzg41)">
    <!-- Dropped phone on ground -->
    <rect x="260" y="890" width="14" height="22" rx="2" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1" transform="rotate(35 267 901)"/>

    <!-- Cache body - slumped -->
    <ellipse cx="200" cy="860" rx="20" ry="25" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Head -->
    <ellipse cx="200" cy="828" rx="16" ry="15" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>

    <!-- Tall triangle ears - drooped -->
    <polygon points="188,820 180,796 194,817" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="212,820 220,796 206,817" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="189,818 183,800 193,817" fill="#cd853f"/>
    <polygon points="211,818 217,800 207,817" fill="#cd853f"/>

    <!-- Wide open shocked eyes -->
    <ellipse cx="193" cy="829" rx="5" ry="5.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="193" cy="830" r="3" fill="#1a1a1a"/>
    <circle cx="192" cy="828" r="1" fill="#fff"/>
    <ellipse cx="207" cy="829" rx="5" ry="5.5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="207" cy="830" r="3" fill="#1a1a1a"/>
    <circle cx="206" cy="828" r="1" fill="#fff"/>

    <!-- Nose and flat mouth -->
    <ellipse cx="200" cy="836" rx="1.8" ry="1.3" fill="#1a1a1a"/>
    <path d="M 195 840 L 205 840" fill="none" stroke="#8b6842" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Fluffy tail drooped -->
    <path d="M 220 865 Q 235 875 240 890 Q 245 905 238 915 Q 230 922 222 915 Q 228 902 226 888 Q 224 875 220 868" fill="url(#sq_fur_lzg41)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble Panel 3 -->
  <rect x="35" y="650" width="330" height="150" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="190,798 200,818 210,798" fill="#fff"/>
  <path d="M 190,800 L 200,820 L 210,800" fill="none" stroke="#333" stroke-width="2"/>

  <text x="200" y="678" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">Oh god.</text>
  <text x="200" y="704" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">The hustle</text>
  <text x="200" y="730" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">was never a</text>
  <text x="200" y="756" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#222">trend. It was</text>
  <text x="200" y="782" font-family="DejaVu Sans" font-size="26" text-anchor="middle" fill="#E63946">biology.</text>

  <!-- Signature -->
  <text x="385" y="952" font-family="DejaVu Sans" font-size="10" text-anchor="end" fill="#999">process.ink</text>
</svg>