<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <defs>
    <radialGradient id="sq_fur_cern42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d9a066"/>
      <stop offset="100%" style="stop-color:#9d6b3a"/>
    </radialGradient>
    <radialGradient id="lem_fur_cern42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#b8b8b8"/>
    </radialGradient>
    <radialGradient id="hum_skin_cern42" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#f5d3b8"/>
      <stop offset="100%" style="stop-color:#e8b887"/>
    </radialGradient>
    <filter id="shadow_cern42">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5"/>
      <feOffset dx="0.5" dy="1.5" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel 1 -->
  <rect x="5" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Abe excited reading phone -->
  <g filter="url(#shadow_cern42)">
    <!-- Body -->
    <ellipse cx="150" cy="235" rx="28" ry="35" fill="#5d8aa8" stroke="#4a6d8c" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="150" cy="185" rx="20" ry="23" fill="url(#hum_skin_cern42)" stroke="#c8a882" stroke-width="1.3"/>
    <!-- Hair -->
    <path d="M 130 170 Q 150 163 170 170 Q 168 175 164 177 Q 150 173 136 177 Q 132 175 130 170" fill="#4a3728" stroke="#3a2618" stroke-width="1"/>
    <!-- Excited eyes -->
    <ellipse cx="142" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="143" cy="184" r="2.5" fill="#2a2a2a"/>
    <circle cx="144" cy="183" r="1" fill="#fff"/>
    <ellipse cx="158" cy="185" rx="4" ry="5" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="159" cy="184" r="2.5" fill="#2a2a2a"/>
    <circle cx="160" cy="183" r="1" fill="#fff"/>
    <!-- Raised brows -->
    <path d="M 136 178 Q 142 174 148 176" fill="none" stroke="#3a2618" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M 152 176 Q 158 174 164 178" fill="none" stroke="#3a2618" stroke-width="1.3" stroke-linecap="round"/>
    <!-- Nose -->
    <path d="M 150 190 L 150 193" stroke="#a8896d" stroke-width="1"/>
    <!-- Open mouth smile -->
    <path d="M 143 199 Q 150 204 157 199" fill="none" stroke="#8a6d51" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Phone -->
    <rect x="170" cy="220" y="210" width="20" height="35" rx="3" fill="#1a1a1a" stroke="#0a0a0a" stroke-width="1"/>
    <rect x="172" y="214" width="16" height="27" fill="#4a86c7"/>
    <text x="180" y="228" font-family="DejaVu Sans" font-size="5" text-anchor="middle" fill="#fff">CERN</text>
    <text x="180" y="234" font-family="DejaVu Sans" font-size="4" text-anchor="middle" fill="#E63946">MARIO KART</text>
  </g>

  <!-- Speech bubble panel 1 -->
  <rect x="35" y="35" width="230" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="140,138 150,158 160,138" fill="#fff"/>
  <path d="M 140 140 L 150 160 L 160 140" fill="none" stroke="#333" stroke-width="2"/>

  <text x="150" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">CERN built</text>
  <text x="150" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">superconducting</text>
  <text x="150" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">go-karts!!</text>
  <text x="150" y="132" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">REAL Mario Kart!</text>

  <!-- Panel 2 -->
  <rect x="305" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Cache on a superconducting kart -->
  <g filter="url(#shadow_cern42)">
    <!-- Kart body -->
    <rect x="370" y="250" width="120" height="35" rx="8" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="1.5"/>
    <!-- Superconducting coils glowing -->
    <ellipse cx="400" cy="260" rx="12" ry="8" fill="none" stroke="#E63946" stroke-width="2" opacity="0.8"/>
    <ellipse cx="460" cy="260" rx="12" ry="8" fill="none" stroke="#E63946" stroke-width="2" opacity="0.8"/>
    <!-- Glow effect -->
    <ellipse cx="400" cy="260" rx="15" ry="10" fill="none" stroke="#E63946" stroke-width="1" opacity="0.3"/>
    <ellipse cx="460" cy="260" rx="15" ry="10" fill="none" stroke="#E63946" stroke-width="1" opacity="0.3"/>
    <!-- Wheels -->
    <circle cx="385" cy="288" r="10" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="385" cy="288" r="4" fill="#5a5a5a"/>
    <circle cx="475" cy="288" r="10" fill="#2a2a2a" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="475" cy="288" r="4" fill="#5a5a5a"/>
    <!-- Speed lines -->
    <line x1="355" y1="255" x2="335" y2="255" stroke="#E63946" stroke-width="2" opacity="0.6"/>
    <line x1="355" y1="265" x2="325" y2="265" stroke="#E63946" stroke-width="2" opacity="0.4"/>
    <line x1="355" y1="275" x2="340" y2="275" stroke="#E63946" stroke-width="1.5" opacity="0.5"/>

    <!-- Cache driving - body -->
    <ellipse cx="430" cy="232" rx="18" ry="20" fill="url(#sq_fur_cern42)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="430" cy="210" rx="14" ry="13" fill="url(#sq_fur_cern42)" stroke="#5d4a2f" stroke-width="1.3"/>
    <!-- Tall triangle ears -->
    <polygon points="420,200 417,180 426,195" fill="url(#sq_fur_cern42)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="440,200 443,180 434,195" fill="url(#sq_fur_cern42)" stroke="#5d4a2f" stroke-width="1.2"/>
    <polygon points="420,198 418,184 424,195" fill="#cd853f"/>
    <polygon points="440,198 442,184 436,195" fill="#cd853f"/>
    <!-- Half-lidded eyes (unimpressed at near-light speed) -->
    <ellipse cx="424" cy="211" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="424" cy="211" r="1.5" fill="#1a1a1a"/>
    <ellipse cx="436" cy="211" rx="3.5" ry="2" fill="#fff" stroke="#2a2a2a" stroke-width="0.8"/>
    <circle cx="436" cy="211" r="1.5" fill="#1a1a1a"/>
    <!-- Nose -->
    <ellipse cx="430" cy="216" rx="1.5" ry="1.2" fill="#1a1a1a"/>
    <!-- Mouth - flat line -->
    <path d="M 425 220 L 435 220" fill="none" stroke="#8b6842" stroke-width="1" stroke-linecap="round"/>
    <!-- Arms on steering wheel -->
    <ellipse cx="415" cy="240" rx="6" ry="4" fill="url(#sq_fur_cern42)" stroke="#5d4a2f" stroke-width="1"/>
    <ellipse cx="445" cy="240" rx="6" ry="4" fill="url(#sq_fur_cern42)" stroke="#5d4a2f" stroke-width="1"/>
    <!-- Steering wheel -->
    <circle cx="430" cy="242" r="8" fill="none" stroke="#2a2a2a" stroke-width="2"/>
    <!-- Fluffy tail flying behind -->
    <path d="M 410 230 Q 380 220 370 205 Q 365 195 370 188 Q 378 195 385 205 Q 395 220 410 228" fill="url(#sq_fur_cern42)" stroke="#5d4a2f" stroke-width="1.3"/>
  </g>

  <!-- Speech bubble panel 2 -->
  <rect x="335" y="30" width="230" height="105" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="420,133 430,153 440,133" fill="#fff"/>
  <path d="M 420 135 L 430 155 L 440 135" fill="none" stroke="#333" stroke-width="2"/>

  <text x="450" y="57" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Zero friction.</text>
  <text x="450" y="81" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Zero resistance.</text>
  <text x="450" y="105" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Still going</text>
  <text x="450" y="127" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">in circles.</text>

  <!-- Panel 3 -->
  <rect x="605" y="10" width="290" height="330" fill="#fff" stroke="#333" stroke-width="3"/>

  <!-- Sifaka sitting still, watching -->
  <g filter="url(#shadow_cern42)">
    <!-- Body -->
    <ellipse cx="750" cy="245" rx="22" ry="28" fill="url(#lem_fur_cern42)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Head -->
    <ellipse cx="750" cy="215" rx="18" ry="16" fill="url(#lem_fur_cern42)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Face mask -->
    <ellipse cx="750" cy="217" rx="13" ry="11" fill="#f0f0f0"/>
    <!-- Moderately-sized round ears -->
    <ellipse cx="725" cy="210" rx="12" ry="14" fill="url(#lem_fur_cern42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="775" cy="210" rx="12" ry="14" fill="url(#lem_fur_cern42)" stroke="#5a5a5a" stroke-width="1.2"/>
    <ellipse cx="725" cy="210" rx="7" ry="9" fill="#f5b5c5"/>
    <ellipse cx="775" cy="210" rx="7" ry="9" fill="#f5b5c5"/>
    <!-- ENORMOUS eyes -->
    <ellipse cx="740" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="740" cy="216" r="8" fill="#1a1a1a"/>
    <circle cx="738" cy="213" r="2.5" fill="#fff"/>
    <ellipse cx="760" cy="215" rx="10" ry="11" fill="#fff" stroke="#2a2a2a" stroke-width="1"/>
    <circle cx="760" cy="216" r="8" fill="#1a1a1a"/>
    <circle cx="758" cy="213" r="2.5" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="750" cy="223" rx="2" ry="1.5" fill="#1a1a1a"/>
    <!-- Mouth - slight open wonder -->
    <ellipse cx="750" cy="228" rx="3" ry="2" fill="#8a6a6a" stroke="#6a4a4a" stroke-width="0.5"/>

    <!-- Ring tail with stripes - curving up -->
    <path d="M 730 250 Q 715 260 710 275 Q 708 290 715 300 Q 720 308 728 305 Q 722 295 720 280 Q 718 268 725 255" fill="url(#lem_fur_cern42)" stroke="#5a5a5a" stroke-width="1.3"/>
    <!-- Tail stripes -->
    <path d="M 712 278 Q 714 275 718 273" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 710 288 Q 713 285 717 283" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 714 298 Q 717 295 721 293" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Speech bubble panel 3 -->
  <rect x="640" y="35" width="225" height="130" rx="12" fill="#fff" stroke="#333" stroke-width="2"/>
  <polygon points="740,163 750,183 760,163" fill="#fff"/>
  <path d="M 740 165 L 750 185 L 760 165" fill="none" stroke="#333" stroke-width="2"/>

  <text x="752" y="62" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">Is the point</text>
  <text x="752" y="86" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">of going faster</text>
  <text x="752" y="110" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">to get back</text>
  <text x="752" y="134" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">where you</text>
  <text x="752" y="158" font-family="DejaVu Sans" font-size="22" text-anchor="middle" fill="#222">started?</text>

  <!-- Ground line -->
  <line x1="605" y1="310" x2="895" y2="310" stroke="#c8c0b0" stroke-width="1"/>
</svg>